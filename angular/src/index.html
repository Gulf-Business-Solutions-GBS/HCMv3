        <!-- INLINE ON PURPOSE. This styles the loader that shows before the application has started, so
             it has to be in the document itself: styles.css is a separate request, and if the animation
             waited for it the first thing a user saw on a slow connection would be a motionless logo.
             Duplicated in styles.css for the same loader used inside the app. -->
        <style>
            .root-initial-loader {
                position: fixed;
                inset: 0;
                display: flex;
                align-items: center;
                justify-content: center;
            }

            .gbs-loader {
                width: 96px;
                height: 96px;
            }

            /* The whole mark turns, which is what the legacy animation does. Rotating about the artwork's
               own centre rather than the viewBox's, or it wobbles. */
            .gbs-loader-spin {
                transform-origin: 586.52px 379.99px;
                animation: gbs-loader-spin 1.6s linear infinite;
            }

            @keyframes gbs-loader-spin {
                to {
                    transform: rotate(360deg);
                }
            }

            /* Somebody who has asked their system not to animate things gets a still logo rather than a
               spinning one. The page still loads; they simply are not made to watch it turn. */
            @media (prefers-reduced-motion: reduce) {
                .gbs-loader-spin {
                    animation: none;
                }
            }
        </style>
    </head>

    <body id="kt_body">
        <app-root>
            <!-- The GBS mark rather than a generic spinner. This is the very first thing anybody sees,
                 before a single script has run, and it was a Font Awesome circle that said nothing about
                 whose system this is.

                 INLINE, NOT AN <img>. The markup below is served with the page, so it draws immediately;
                 an image reference would be a second request that races the app and can leave the screen
                 blank on a slow connection -- exactly when a loading indicator matters. -->
            <div class="root-initial-loader">
                <svg class="gbs-loader" viewBox="360.647 157 451.746 445.98" role="img" aria-label="Loading">
                    <g class="gbs-loader-spin">
                        <path fill="#203864" d="M453.483,554.322c-74.94-23.912-112.04-117.372-82.89-208.742c29.16-91.38,113.55-146.07,188.48-122.15c-84.56,6.26-156.69,91.81-161.11,191.08C395.433,471.44,416.033,523.3,453.483,554.322z"/>

                    </g>

            </div>
