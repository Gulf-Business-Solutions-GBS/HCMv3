<p-datepicker
    dateFormat="dd/mm/yy"
    #datePicker
    selectionMode="range"
    [placeholder]="placeholder()"
    [disabled]="disabled()"
    [(ngModel)]="lastDates"
    (onSelect)="onSelect($event)"
    (onClear)="onClear()"
    [showIcon]="true"
    [iconDisplay]="'input'"
    appendTo="body"
    [baseZIndex]="baseZIndex()"
    [readonlyInput]="true"
    styleClass="w-100" />
