<div
    appBsModal
    #modal="bs-modal"
    class="modal fade"
    tabindex="-1"
    role="dialog"
    aria-labelledby="modal"
    aria-hidden="true"
    [config]="{ backdrop: 'static' }">
    <div class="modal-dialog modal-lg">
        <div class="modal-content">
            @if (notification()) {
                <div class="modal-header border-0 pb-0">
                    <div class="d-flex align-items-center">
                        <span class="svg-icon svg-icon-2 text-{{ getSeverityClass(notification().severity) }} me-3">
                            <i
                                class="bi {{ getSeverityIcon(notification().severity) }} fs-2 text-{{
                                    getSeverityClass(notification().severity)
                                }}"></i>
                        </span>
                        <h5 class="modal-title fw-semibold">
                            {{ notification().title }}
                        </h5>
                    </div>

                    <button type="button" class="btn btn-icon btn-sm btn-light ms-2" (click)="close()">
                        <i class="bi bi-x fs-2"></i>
                    </button>
                </div>

                <div class="modal-body pt-4">
                    <div class="d-flex align-items-center mb-4 text-muted fs-7">
                        <i class="bi bi-clock me-2"></i>
                        <span>{{ notification().creationTime | luxonFormat: 'DDDD t' }}</span>
                    </div>

                    <div class="card bg-light-{{ getSeverityClass(notification().severity) }} border-0">
                        <div class="card-body p-4">
                            <div class="notification-content fs-6 text-gray-800">
                                {{ notification().message }}
                            </div>
                        </div>
                    </div>
                </div>

                <div class="modal-footer border-0 pt-0">
                    <button type="button" class="btn btn-light" (click)="close()">
                        {{ 'Close' | localize }}
                    </button>
                </div>
            }
        </div>
    </div>
</div>
