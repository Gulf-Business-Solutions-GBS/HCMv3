<!-- The current language as two letters (EN), not a flag; clicking it drops down the list. -->
@if (switchableLanguages.length > 1) {
    <div
        class="d-flex align-items-center ms-1 ms-lg-3 dropdown-language"
        data-kt-menu-trigger="click"
        data-kt-menu-placement="bottom-end">
        <div [class]="customStyle()" [title]="currentLanguage.displayName">
            <span class="fw-bold fs-6">{{ shortCode(currentLanguage) }}</span>
        </div>
    </div>
}
<div
    class="menu menu-sub menu-sub-dropdown menu-column menu-rounded menu-gray-700 menu-state-bg-light-primary fw-semibold fs-7 w-175px py-3"
    data-kt-menu="true">
    @for (language of switchableLanguages; track language.name) {
        <div class="menu-item px-3">
            <a
                href="javascript:;"
                (click)="changeLanguage(language.name)"
                class="menu-link px-3 py-2"
                [class.active]="language.name === currentLanguage.name">
                <span class="fw-bold w-30px">{{ shortCode(language) }}</span>
                <span class="menu-title">{{ language.displayName }}</span>
            </a>
        </div>
    }
</div>
