<div
    appBsModal
    #createOrEditModal="bs-modal"
    (onShown)="onShown()"
    class="modal fade"
    tabindex="-1"
    role="dialog"
    aria-labelledby="createOrEditModal"
    aria-hidden="true"
    [config]="{ backdrop: 'static', keyboard: !saving() }">
    <div class="modal-dialog modal-lg">
        <div class="modal-content">
            @if (active()) {
                <form #recordForm="ngForm" novalidate (ngSubmit)="save()" autocomplete="off">
                    <div class="modal-header">
                        <h4 class="modal-title">
                            @if (record().id) {
                                <span>{{ 'Edit' | localize }}</span>
                            } @else {
                                <span>{{ 'CreateNew' | localize }}</span>
                            }
                        </h4>
                        <button type="button" class="btn-close" (click)="close()" [disabled]="saving()"></button>
                    </div>
                    <div class="modal-body">
                        <div class="row">
                            <div class="col-md-12 mb-5">
                                <label class="form-label required" for="CompanyInsuranceDetail_EmployeeInsuranceId">{{ 'EmployeeInsuranceId' | localize }}</label>
                                <select
                                    id="CompanyInsuranceDetail_EmployeeInsuranceId"
                                    #employeeInsuranceIdInput="ngModel"
                                    class="form-select"
                                    name="EmployeeInsuranceId"
                                    [ngModel]="record().employeeInsuranceId"
                                    (ngModelChange)="updateField('employeeInsuranceId', $event)"
                                    required>
                                    <option [ngValue]="undefined"></option>
                                    @for (item of employeeInsurances(); track item.id) {
                                        <option [ngValue]="item.id">{{ item.employeeCode }} - {{ item.insurancePlanNameEn }}</option>
                                    }
                                </select>
                                <validation-messages [formCtrl]="employeeInsuranceIdInput" />
                            </div>
                        </div>
                        <div class="row">
                            <div class="col-md-4 mb-5">
                                <label class="form-label required" for="CompanyInsuranceDetail_InstallmentDate">{{ 'InstallmentDate' | localize }}</label>
                                <input
                                    id="CompanyInsuranceDetail_InstallmentDate"
                                    #installmentDateInput="ngModel"
                                    type="date"
                                    class="form-control"
                                    name="InstallmentDate"
                                    [ngModel]="record().installmentDate?.toISODate()"
                                    (ngModelChange)="updateDateField('installmentDate', $event)"
                                    required />
                                <validation-messages [formCtrl]="installmentDateInput" />
                            </div>
                            <div class="col-md-4 mb-5">
                                <label class="form-label" for="CompanyInsuranceDetail_InstallmentAmount">{{ 'InstallmentAmount' | localize }}</label>
                                <input
                                    id="CompanyInsuranceDetail_InstallmentAmount"
                                    class="form-control"
                                    type="number"
                                    step="0.01"
                                    name="InstallmentAmount"
                                    [ngModel]="record().installmentAmount"
                                    (ngModelChange)="updateNumberField('installmentAmount', $event)" />
                            </div>
                            <div class="col-md-4 mb-5">
                                <label class="form-label" for="CompanyInsuranceDetail_InstallmentType">{{ 'InstallmentType' | localize }}</label>
                                <select
                                    id="CompanyInsuranceDetail_InstallmentType"
                                    class="form-select"
                                    name="InstallmentType"
                                    [ngModel]="record().installmentType"
                                    (ngModelChange)="updateField('installmentType', $event)">
                                    @for (item of installmentTypes; track item.value) {
                                        <option [ngValue]="item.value">{{ item.name | localize }}</option>
                                    }
                                </select>
                            </div>
                        </div>
                    </div>
                    <div class="modal-footer">
                        <button [disabled]="saving()" type="button" class="btn btn-light-primary fw-bold" (click)="close()">
                            {{ 'Cancel' | localize }}
                        </button>
                        <button
                            type="submit"
                            class="btn btn-primary fw-bold"
                            [disabled]="!recordForm.form.valid"
                            [buttonBusy]="saving()"
                            [busyText]="l('SavingWithThreeDot')">
                            <i class="fa fa-save"></i>
                            <span>{{ 'Save' | localize }}</span>
                        </button>
                    </div>
                </form>
            }
        </div>
    </div>
</div>
