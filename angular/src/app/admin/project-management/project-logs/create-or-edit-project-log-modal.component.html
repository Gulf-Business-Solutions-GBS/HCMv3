<div
    appBsModal
    #createOrEditModal="bs-modal"
    (onShown)="onShown()"
    class="modal fade"
    tabindex="-1"
    role="dialog"
    aria-hidden="true"
    [config]="{ backdrop: 'static', keyboard: !saving() }">
    <div class="modal-dialog modal-lg">
        <div class="modal-content">
            @if (active()) {
                <form #recordForm="ngForm" novalidate (ngSubmit)="save()" autocomplete="off">
                    <div class="modal-header">
                        <h4 class="modal-title">
                            @if (record().id) {
                                <span>{{ 'EditItem' | localize }}: {{ 'ProjectLogs' | localize }}</span>
                            } @else {
                                <span>{{ 'CreateNewItem' | localize }}: {{ 'ProjectLogs' | localize }}</span>
                            }
                        </h4>
                        <button type="button" class="btn-close" (click)="close()" [disabled]="saving()"></button>
                    </div>
                    <div class="modal-body">
                        <div class="row">
                            <div class="col-md-6 mb-5">
                                <label class="form-label required" for="ProjectLog_EmployeeId">{{ 'Employee' | localize }}</label>
                                <select
                                    id="ProjectLog_EmployeeId"
                                    #employeeIdInput="ngModel"
                                    class="form-select"
                                    name="EmployeeId"
                                    [ngModel]="record().employeeId"
                                    (ngModelChange)="updateField('employeeId', $event)"
                                    required>
                                    <option [ngValue]="undefined"></option>
                                    @for (employee of employees(); track employee.id) {
                                        <option [ngValue]="employee.id">{{ employeeLabel(employee) }}</option>
                                    }
                                </select>
                                <validation-messages [formCtrl]="employeeIdInput" />
                            </div>
                            <div class="col-md-6 mb-5">
                                <label class="form-label" for="ProjectLog_RunTimeStamp">{{ 'RunTimeStamp' | localize }}</label>
                                <input
                                    id="ProjectLog_RunTimeStamp"
                                    type="datetime-local"
                                    class="form-control"
                                    name="RunTimeStamp"
                                    [ngModel]="toDateTimeLocal(record().runTimeStamp)"
                                    (ngModelChange)="updateDateTimeField('runTimeStamp', $event)" />
                            </div>
                        </div>
                        <div class="row">
                            <div class="col-md-12 mb-5">
                                <label class="form-label" for="ProjectLog_Message">{{ 'Message' | localize }}</label>
                                <textarea
                                    id="ProjectLog_Message"
                                    class="form-control"
                                    name="Message"
                                    rows="3"
                                    [ngModel]="record().message"
                                    (ngModelChange)="updateField('message', $event)"
                                    maxlength="1000"></textarea>
                            </div>
                        </div>
                        <div class="row">
                            <div class="col-md-3 mb-5">
                                <label class="form-label required" for="ProjectLog_Status">{{ 'Status' | localize }}</label>
                                <input
                                    id="ProjectLog_Status"
                                    #statusInput="ngModel"
                                    class="form-control"
                                    type="number"
                                    name="Status"
                                    [ngModel]="record().status"
                                    (ngModelChange)="updateField('status', $event)"
                                    required />
                                <validation-messages [formCtrl]="statusInput" />
                            </div>
                            <div class="col-md-3 mb-5">
                                <label class="form-label" for="ProjectLog_InPeriod">{{ 'InPeriod' | localize }}</label>
                                <input
                                    id="ProjectLog_InPeriod"
                                    type="date"
                                    class="form-control"
                                    name="InPeriod"
                                    [ngModel]="record().inPeriod?.toISODate()"
                                    (ngModelChange)="updateDateField('inPeriod', $event)" />
                            </div>
                            <div class="col-md-3 mb-5">
                                <label class="form-label required" for="ProjectLog_NoOfEmployee">{{ 'NoOfEmployee' | localize }}</label>
                                <input
                                    id="ProjectLog_NoOfEmployee"
                                    #noOfEmployeeInput="ngModel"
                                    class="form-control"
                                    type="number"
                                    name="NoOfEmployee"
                                    [ngModel]="record().noOfEmployee"
                                    (ngModelChange)="updateField('noOfEmployee', $event)"
                                    required />
                                <validation-messages [formCtrl]="noOfEmployeeInput" />
                            </div>
                            <div class="col-md-3 mb-5 d-flex align-items-end">
                                <div class="form-check">
                                    <input
                                        id="ProjectLog_StopFlag"
                                        class="form-check-input"
                                        type="checkbox"
                                        name="StopFlag"
                                        [ngModel]="record().stopFlag"
                                        (ngModelChange)="updateField('stopFlag', $event)" />
                                    <label class="form-check-label" for="ProjectLog_StopFlag">{{ 'StopFlag' | localize }}</label>
                                </div>
                            </div>
                        </div>
                    </div>
                    <div class="modal-footer">
                        <button [disabled]="saving()" type="button" class="btn btn-light-primary fw-bold" (click)="close()">
                            {{ 'Cancel' | localize }}
                        </button>
                        <button
                            type="submit"
                            class="btn btn-primary fw-bold"
                            [disabled]="!recordForm.form.valid"
                            [buttonBusy]="saving()"
                            [busyText]="l('SavingWithThreeDot')">
                            <i class="fa fa-save"></i>
                            <span>{{ 'Save' | localize }}</span>
                        </button>
                    </div>
                </form>
            }
        </div>
    </div>
</div>
