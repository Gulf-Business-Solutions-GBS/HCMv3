<div
    appBsModal
    #createOrEditModal="bs-modal"
    class="modal fade"
    tabindex="-1"
    role="dialog"
    aria-labelledby="createOrEditModal"
    aria-hidden="true"
    [config]="{ backdrop: 'static', keyboard: !saving() }">
    <div class="modal-dialog modal-lg">
        <div class="modal-content">
            @if (active()) {
                <form #editForm="ngForm" novalidate (ngSubmit)="save()">
                    <div class="modal-header">
                        <h4 class="modal-title">
                            @if (languageId()) {
                                <span>{{ 'EditLanguage' | localize }}: {{ languageName() }}</span>
                            }
                            @if (!languageId()) {
                                <span>{{ 'CreateNewLanguage' | localize }}</span>
                            }
                        </h4>
                        <button
                            type="button"
                            class="btn-close"
                            (click)="close()"
                            [attr.aria-label]="l('Close')"
                            [disabled]="saving()"></button>
                    </div>
                    <div class="modal-body">
                        <div class="mb-5">
                            <p-select
                                #languageCombobox
                                [options]="languageNamesSelectItems()"
                                [filter]="true"
                                [virtualScroll]="true"
                                [virtualScrollItemSize]="30"
                                name="languageName"
                                [ngModel]="language.name"
                                (ngModelChange)="updateLanguageName($event)"
                                [appendTo]="null"
                                [style]="{ width: '100%' }" />
                            <validation-messages [formCtrl]="languageCombobox" />
                        </div>
                        <div class="mb-5">
                            <p-select
                                #iconCombobox
                                name="languageIcon"
                                [options]="flagsSelectItems()"
                                [ngModel]="language.icon"
                                (ngModelChange)="updateLanguageIcon($event)"
                                [filter]="true"
                                [virtualScroll]="true"
                                [virtualScrollItemSize]="30"
                                [appendTo]="null"
                                [style]="{ width: '100%' }">
                                <ng-template let-item #selectedItem>
                                    <i class="margin-right-5 d-inline-block" [ngClass]="item.value"></i>
                                    <span style="vertical-align: middle">{{ item.label }}</span>
                                </ng-template>
                                <ng-template let-flag #item>
                                    <i class="margin-right-5 d-inline-block" [ngClass]="flag.value"></i>
                                    <span style="vertical-align: middle">{{ flag.label }}</span>
                                </ng-template>
                            </p-select>
                        </div>
                        <label class="form-check form-check-custom form-check-solid py-1">
                            <input
                                id="EditLanguage_IsEnabled"
                                type="checkbox"
                                name="languageIsEnabled"
                                [ngModel]="language.isEnabled"
                                (ngModelChange)="updateLanguageIsEnabled($event)"
                                class="form-check-input" />
                            <span class="form-check-label">
                                {{ 'IsEnabled' | localize }}
                            </span>
                        </label>
                    </div>
                    <div class="modal-footer">
                        <button
                            [disabled]="saving()"
                            type="button"
                            class="btn btn-light-primary fw-bold"
                            (click)="close()">
                            {{ 'Cancel' | localize }}
                        </button>
                        <button
                            type="submit"
                            class="btn btn-primary fw-bold"
                            [disabled]="!editForm.form.valid"
                            [buttonBusy]="saving()"
                            [busyText]="l('SavingWithThreeDot')">
                            <i class="fa fa-save"></i>
                            <span>{{ 'Save' | localize }}</span>
                        </button>
                    </div>
                </form>
            }
        </div>
    </div>
</div>
