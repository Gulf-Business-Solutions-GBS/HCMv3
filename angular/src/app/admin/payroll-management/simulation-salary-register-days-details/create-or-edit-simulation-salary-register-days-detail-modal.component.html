<div
    appBsModal
    #createOrEditModal="bs-modal"
    (onShown)="onShown()"
    class="modal fade"
    tabindex="-1"
    role="dialog"
    aria-labelledby="createOrEditModal"
    aria-hidden="true"
    [config]="{ backdrop: 'static', keyboard: !saving() }">
    <div class="modal-dialog modal-lg">
        <div class="modal-content">
            @if (active()) {
                <form #simulationSalaryRegisterDaysDetailForm="ngForm" novalidate (ngSubmit)="save()" autocomplete="off">
                    <div class="modal-header">
                        <h4 class="modal-title">
                            @if (simulationSalaryRegisterDaysDetail().id) {
                                <span>{{ 'EditItem' | localize }}: {{ 'SimulationSalaryRegisterDaysDetails' | localize }}</span>
                            } @else {
                                <span>{{ 'CreateNewItem' | localize }}: {{ 'SimulationSalaryRegisterDaysDetails' | localize }}</span>
                            }
                        </h4>
                        <button
                            type="button"
                            class="btn-close"
                            (click)="close()"
                            [attr.aria-label]="l('Close')"
                            [disabled]="saving()"></button>
                    </div>
                    <div class="modal-body">
                        <div class="row">
                            <div class="col-md-6 mb-5">
                                <label class="form-label required" for="SimulationSalaryRegisterDaysDetail_SimulationSalaryRegisterDetailId">{{
                                    'SimulationSalaryRegisterDetailId' | localize
                                }}</label>
                                <input
                                    id="SimulationSalaryRegisterDaysDetail_SimulationSalaryRegisterDetailId"
                                    #simulationSalaryRegisterDetailIdInput="ngModel"
                                    class="form-control"
                                    type="number"
                                    name="SimulationSalaryRegisterDetailId"
                                    [ngModel]="simulationSalaryRegisterDaysDetail().simulationSalaryRegisterDetailId"
                                    (ngModelChange)="updateField('simulationSalaryRegisterDetailId', $event)"
                                    required />
                                <validation-messages [formCtrl]="simulationSalaryRegisterDetailIdInput" />
                            </div>
                            <div class="col-md-6 mb-5">
                                <label class="form-label required" for="SimulationSalaryRegisterDaysDetail_Period">{{ 'Period' | localize }}</label>
                                <input
                                    id="SimulationSalaryRegisterDaysDetail_Period"
                                    #periodInput="ngModel"
                                    class="form-control"
                                    type="date"
                                    name="Period"
                                    [ngModel]="simulationSalaryRegisterDaysDetail().period?.toISODate()"
                                    (ngModelChange)="updatePeriod($event)"
                                    required />
                                <validation-messages [formCtrl]="periodInput" />
                            </div>
                        </div>
                        <div class="row">
                            <div class="col-md-4 mb-5">
                                <label class="form-label required" for="SimulationSalaryRegisterDaysDetail_Rate">{{ 'Rate' | localize }}</label>
                                <input
                                    id="SimulationSalaryRegisterDaysDetail_Rate"
                                    #rateInput="ngModel"
                                    class="form-control"
                                    type="number"
                                    name="Rate"
                                    [ngModel]="simulationSalaryRegisterDaysDetail().rate"
                                    (ngModelChange)="updateField('rate', $event)"
                                    required />
                                <validation-messages [formCtrl]="rateInput" />
                            </div>
                            <div class="col-md-4 mb-5">
                                <label class="form-label required" for="SimulationSalaryRegisterDaysDetail_Number">{{ 'Number' | localize }}</label>
                                <input
                                    id="SimulationSalaryRegisterDaysDetail_Number"
                                    #numberInput="ngModel"
                                    class="form-control"
                                    type="number"
                                    name="Number"
                                    [ngModel]="simulationSalaryRegisterDaysDetail().number"
                                    (ngModelChange)="updateField('number', $event)"
                                    required />
                                <validation-messages [formCtrl]="numberInput" />
                            </div>
                            <div class="col-md-4 mb-5">
                                <label class="form-label required" for="SimulationSalaryRegisterDaysDetail_Amount">{{ 'Amount' | localize }}</label>
                                <input
                                    id="SimulationSalaryRegisterDaysDetail_Amount"
                                    #amountInput="ngModel"
                                    class="form-control"
                                    type="number"
                                    name="Amount"
                                    [ngModel]="simulationSalaryRegisterDaysDetail().amount"
                                    (ngModelChange)="updateField('amount', $event)"
                                    required />
                                <validation-messages [formCtrl]="amountInput" />
                            </div>
                        </div>
                    </div>
                    <div class="modal-footer">
                        <button [disabled]="saving()" type="button" class="btn btn-light-primary fw-bold" (click)="close()">
                            {{ 'Cancel' | localize }}
                        </button>
                        <button
                            type="submit"
                            class="btn btn-primary fw-bold"
                            [disabled]="!simulationSalaryRegisterDaysDetailForm.form.valid"
                            [buttonBusy]="saving()"
                            [busyText]="l('SavingWithThreeDot')">
                            <i class="fa fa-save"></i>
                            <span>{{ 'Save' | localize }}</span>
                        </button>
                    </div>
                </form>
            }
        </div>
    </div>
</div>
