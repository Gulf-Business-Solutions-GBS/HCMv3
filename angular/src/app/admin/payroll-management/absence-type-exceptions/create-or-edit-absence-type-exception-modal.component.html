<div
    appBsModal
    #createOrEditModal="bs-modal"
    (onShown)="onShown()"
    class="modal fade"
    tabindex="-1"
    role="dialog"
    aria-labelledby="createOrEditModal"
    aria-hidden="true"
    [config]="{ backdrop: 'static', keyboard: !saving() }">
    <div class="modal-dialog modal-lg">
        <div class="modal-content">
            @if (active()) {
                <form #absenceTypeExceptionForm="ngForm" novalidate (ngSubmit)="save()" autocomplete="off">
                    <div class="modal-header">
                        <h4 class="modal-title">
                            @if (absenceTypeException().id) {
                                <span>{{ 'EditItem' | localize }}: {{ 'AbsenceTypeExceptions' | localize }}</span>
                            } @else {
                                <span>{{ 'CreateNewItem' | localize }}: {{ 'AbsenceTypeExceptions' | localize }}</span>
                            }
                        </h4>
                        <button
                            type="button"
                            class="btn-close"
                            (click)="close()"
                            [attr.aria-label]="l('Close')"
                            [disabled]="saving()"></button>
                    </div>
                    <div class="modal-body">
                        <div class="row">
                            <div class="col-md-6 mb-5">
                                <label class="form-label required" for="AbsenceTypeException_AbsenceTypeId">{{ 'AbsenceTypes' | localize }}</label>
                                <select
                                    id="AbsenceTypeException_AbsenceTypeId"
                                    #absenceTypeIdInput="ngModel"
                                    class="form-select"
                                    name="AbsenceTypeId"
                                    [ngModel]="absenceTypeException().absenceTypeId"
                                    (ngModelChange)="updateField('absenceTypeId', $event)"
                                    [disabled]="!!presetAbsenceTypeId()"
                                    required>
                                    <option [ngValue]="undefined"></option>
                                    @for (absenceType of absenceTypes(); track absenceType.id) {
                                        <option [ngValue]="absenceType.id">{{ absenceType.nameEn }}</option>
                                    }
                                </select>
                                <validation-messages [formCtrl]="absenceTypeIdInput" />
                            </div>
                            <div class="col-md-6 mb-5">
                                <label class="form-label required" for="AbsenceTypeException_ExceptAbsenceTypeId">{{ 'ExceptAbsenceType' | localize }}</label>
                                <select
                                    id="AbsenceTypeException_ExceptAbsenceTypeId"
                                    #exceptAbsenceTypeIdInput="ngModel"
                                    class="form-select"
                                    name="ExceptAbsenceTypeId"
                                    [ngModel]="absenceTypeException().exceptAbsenceTypeId"
                                    (ngModelChange)="updateField('exceptAbsenceTypeId', $event)"
                                    required>
                                    <option [ngValue]="undefined"></option>
                                    @for (absenceType of absenceTypes(); track absenceType.id) {
                                        <option [ngValue]="absenceType.id">{{ absenceType.nameEn }}</option>
                                    }
                                </select>
                                <validation-messages [formCtrl]="exceptAbsenceTypeIdInput" />
                            </div>
                        </div>
                    </div>
                    <div class="modal-footer">
                        <button
                            [disabled]="saving()"
                            type="button"
                            class="btn btn-light-primary fw-bold"
                            (click)="close()">
                            {{ 'Cancel' | localize }}
                        </button>
                        <button
                            type="submit"
                            class="btn btn-primary fw-bold"
                            [disabled]="!absenceTypeExceptionForm.form.valid"
                            [buttonBusy]="saving()"
                            [busyText]="l('SavingWithThreeDot')">
                            <i class="fa fa-save"></i>
                            <span>{{ 'Save' | localize }}</span>
                        </button>
                    </div>
                </form>
            }
        </div>
    </div>
</div>
