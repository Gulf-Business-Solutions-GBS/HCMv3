<div [@routerTransition]>
    <sub-header [title]="title()" [description]="'AbsenceTypes' | localize">
        <div role="actions">
            <!-- View first: the page opens read-only, and editing is a deliberate step. -->
            @if (canEdit && loaded() && !editing()) {
                <button type="button" class="btn btn-primary float-end ms-2" (click)="startEditing()">
                    <i class="fa fa-edit btn-md-icon"></i>
                    <span class="d-none d-md-inline-block">
                        {{ 'Edit' | localize }}
                    </span>
                </button>
            }
            <button type="button" class="btn btn-light-primary float-end" (click)="goBack()">
                <i class="fa fa-arrow-left btn-md-icon"></i>
                <span class="d-none d-md-inline-block">
                    {{ 'Back' | localize }}
                </span>
            </button>
        </div>
    </sub-header>

    <div [class]="containerClass">
        <div class="card card-custom mb-5" [busyIf]="loading()">
            <div class="card-body">
                @if (loaded()) {
                    <form #absenceTypeForm="ngForm" novalidate (ngSubmit)="save()" autocomplete="off">
                        <absenceTypeForm [(absenceType)]="absenceType" [readOnly]="!editing()" />
                        @if (editing()) {
                            <div class="d-flex justify-content-end gap-2">
                                <button type="button" class="btn btn-light fw-bold" [disabled]="saving()" (click)="cancelEditing()">
                                    {{ 'Cancel' | localize }}
                                </button>
                                <button
                                    type="submit"
                                    class="btn btn-primary fw-bold"
                                    [disabled]="!absenceTypeForm.form.valid || saving()"
                                    [buttonBusy]="saving()"
                                    [busyText]="l('SavingWithThreeDot')">
                                    <i class="fa fa-save"></i>
                                    <span>{{ 'Save' | localize }}</span>
                                </button>
                            </div>
                        }
                    </form>
                }
            </div>
        </div>

        @if (absenceTypeId(); as id) {
            @if (tabs.length > 0) {
                <div class="card card-custom">
                    <div class="card-body">
                        <ul class="nav at-detail-tabs mb-5" role="tablist">
                            @for (tab of tabs; track tab.id) {
                                <li class="nav-item" role="presentation">
                                    <button
                                        type="button"
                                        role="tab"
                                        class="at-detail-tab"
                                        [class.at-detail-tab-active]="activeTabId() === tab.id"
                                        [attr.aria-selected]="activeTabId() === tab.id"
                                        (click)="selectTab(tab)">
                                        {{ tab.labelKey | localize }}
                                    </button>
                                </li>
                            }
                        </ul>

                        <div role="tabpanel">
                            @switch (activeTabId()) {
                                @case ('wage-types') {
                                    <absenceTypeWageTypesTab [absenceTypeId]="id" />
                                }
                                @case ('exceptions') {
                                    <absenceTypeExceptionsTab [absenceTypeId]="id" />
                                }
                                @case ('payments') {
                                    <absenceTypePaymentsTab [absenceTypeId]="id" />
                                }
                            }
                        </div>
                    </div>
                </div>
            }
        }
    </div>
</div>
