<div class="row align-items-center mb-4">
    <div class="col-md-4">
        <input
            type="text"
            class="form-control"
            [placeholder]="'SearchWithThreeDot' | localize"
            [ngModel]="filterText()"
            (ngModelChange)="onFilterChange($event)" />
    </div>
    <div class="col-md-8 text-end">
        @if ('Pages.PayrollManagement.AbsenceTypeExceptions.Create' | permission) {
            <button type="button" class="btn btn-primary" (click)="createRecord()">
                <i class="fa fa-plus"></i>
                {{ 'CreateNew' | localize }}
            </button>
        }
    </div>
</div>
<div class="row align-items-center">
    <!--<Primeng-TurboTable-Start>-->
    <p-tieredMenu #actionsMenu [model]="activeMenuItems()" [popup]="true" appendTo="body" />
    <div class="primeng-datatable-container" [busyIf]="primengTableHelper.isLoading()">
        <p-table
            #dataTable
            sortMode="multiple"
            (onLazyLoad)="getRecords($event)"
            [value]="primengTableHelper.records()"
            rows="{{ primengTableHelper.defaultRecordsCountPerPage }}"
            [paginator]="false"
            [lazy]="true"
            [scrollable]="true"
            scrollDirection="horizontal"
            [resizableColumns]="primengTableHelper.resizableColumns">
            <ng-template #header>
                <tr>
                    <th
                        style="width: 130px"
                        [hidden]="
                            !(['Pages.PayrollManagement.AbsenceTypeExceptions.Edit', 'Pages.PayrollManagement.AbsenceTypeExceptions.Delete'] | permissionAny)
                        ">
                        {{ 'Actions' | localize }}
                    </th>
                    <th style="min-width: 220px">{{ 'ExceptAbsenceType' | localize }}</th>
                </tr>
            </ng-template>
            <ng-template #body let-record="$implicit">
                <tr>
                    <td
                        style="width: 130px"
                        [hidden]="
                            !(['Pages.PayrollManagement.AbsenceTypeExceptions.Edit', 'Pages.PayrollManagement.AbsenceTypeExceptions.Delete'] | permissionAny)
                        ">
                        <button type="button" class="btn btn-primary btn-sm dropdown-toggle" (click)="showMenu($event, record, actionsMenu)">
                            <i class="fa fa-cog"></i>
                            {{ 'Actions' | localize }}
                        </button>
                    </td>
                    <td style="min-width: 220px">{{ record.exceptAbsenceTypeName }}</td>
                </tr>
            </ng-template>
        </p-table>
        @if (primengTableHelper.totalRecordsCount() == 0) {
            <div class="primeng-no-data">
                {{ 'NoData' | localize }}
            </div>
        }
        <div class="primeng-paging-container">
            <p-paginator
                [rows]="primengTableHelper.defaultRecordsCountPerPage"
                #paginator
                (onPageChange)="getRecords($event)"
                [totalRecords]="primengTableHelper.totalRecordsCount()"
                [rowsPerPageOptions]="primengTableHelper.predefinedRecordsCountPerPage"
                [showCurrentPageReport]="true"
                [currentPageReportTemplate]="'TotalRecordsCount' | localize: primengTableHelper.totalRecordsCount()" />
        </div>
    </div>
    <!--<Primeng-TurboTable-End>-->
</div>

<createOrEditAbsenceTypeExceptionModal #createOrEditModal (modalSave)="reloadPage()" />
