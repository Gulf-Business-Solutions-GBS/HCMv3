<div
    appBsModal
    #createOrEditModal="bs-modal"
    (onShown)="onShown()"
    class="modal fade"
    tabindex="-1"
    role="dialog"
    aria-labelledby="createOrEditModal"
    aria-hidden="true"
    [config]="{ backdrop: 'static', keyboard: !saving() }">
    <div class="modal-dialog modal-lg">
        <div class="modal-content">
            @if (active()) {
                <form #ticketPaxTypeForm="ngForm" novalidate (ngSubmit)="save()" autocomplete="off">
                    <div class="modal-header">
                        <h4 class="modal-title">
                            @if (ticketPaxType().id) {
                                <span>{{ 'EditItem' | localize }}: {{ 'TicketPaxTypes' | localize }}</span>
                            } @else {
                                <span>{{ 'CreateNewItem' | localize }}: {{ 'TicketPaxTypes' | localize }}</span>
                            }
                        </h4>
                        <button
                            type="button"
                            class="btn-close"
                            (click)="close()"
                            [attr.aria-label]="l('Close')"
                            [disabled]="saving()"></button>
                    </div>
                    <div class="modal-body">
                        <div class="row">
                            <div class="col-md-4 mb-5">
                                <label class="form-label" for="TicketPaxType_Code">{{ 'Code' | localize }}</label>
                                <input
                                    id="TicketPaxType_Code"
                                    class="form-control"
                                    type="text"
                                    name="Code"
                                    [ngModel]="ticketPaxType().code"
                                    (ngModelChange)="updateField('code', $event)"
                                    maxlength="50"
                                    [placeholder]="l('AutoGeneratedIfEmpty')" />
                            </div>
                            <div class="col-md-4 mb-5">
                                <label class="form-label required" for="TicketPaxType_NameEn">{{ 'NameEn' | localize }}</label>
                                <input
                                    id="TicketPaxType_NameEn"
                                    #nameEnInput="ngModel"
                                    class="form-control"
                                    type="text"
                                    name="NameEn"
                                    [ngModel]="ticketPaxType().nameEn"
                                    (ngModelChange)="updateField('nameEn', $event)"
                                    required
                                    maxlength="200" />
                                <validation-messages [formCtrl]="nameEnInput" />
                            </div>
                            <div class="col-md-4 mb-5">
                                <label class="form-label" for="TicketPaxType_NameAr">{{ 'NameAr' | localize }}</label>
                                <input
                                    id="TicketPaxType_NameAr"
                                    class="form-control"
                                    type="text"
                                    name="NameAr"
                                    dir="rtl"
                                    [ngModel]="ticketPaxType().nameAr"
                                    (ngModelChange)="updateField('nameAr', $event)"
                                    maxlength="200" />
                            </div>
                        </div>
                        <div class="row">
                            <div class="col-md-6 mb-5">
                                <label class="form-label" for="TicketPaxType_AgeFrom">{{ 'AgeFrom' | localize }}</label>
                                <input
                                    id="TicketPaxType_AgeFrom"
                                    class="form-control"
                                    type="number"
                                    name="AgeFrom"
                                    [ngModel]="ticketPaxType().ageFrom"
                                    (ngModelChange)="updateField('ageFrom', $event)" />
                            </div>
                            <div class="col-md-6 mb-5">
                                <label class="form-label" for="TicketPaxType_AgeTo">{{ 'AgeTo' | localize }}</label>
                                <input
                                    id="TicketPaxType_AgeTo"
                                    class="form-control"
                                    type="number"
                                    name="AgeTo"
                                    [ngModel]="ticketPaxType().ageTo"
                                    (ngModelChange)="updateField('ageTo', $event)" />
                            </div>
                        </div>
                    </div>
                    <div class="modal-footer">
                        <button
                            [disabled]="saving()"
                            type="button"
                            class="btn btn-light-primary fw-bold"
                            (click)="close()">
                            {{ 'Cancel' | localize }}
                        </button>
                        <button
                            type="submit"
                            class="btn btn-primary fw-bold"
                            [disabled]="!ticketPaxTypeForm.form.valid"
                            [buttonBusy]="saving()"
                            [busyText]="l('SavingWithThreeDot')">
                            <i class="fa fa-save"></i>
                            <span>{{ 'Save' | localize }}</span>
                        </button>
                    </div>
                </form>
            }
        </div>
    </div>
</div>
