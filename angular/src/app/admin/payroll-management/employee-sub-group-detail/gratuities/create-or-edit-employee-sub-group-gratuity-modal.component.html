<div
    appBsModal
    #createOrEditModal="bs-modal"
    (onShown)="onShown()"
    class="modal fade"
    tabindex="-1"
    [config]="{ backdrop: 'static', keyboard: !saving() }">
    <div class="modal-dialog">
        <div class="modal-content">
            @if (active()) {
                <form #recordForm="ngForm" (ngSubmit)="save()">
                    <div class="modal-header">
                        <h4 class="modal-title">
                            {{ (record().id ? 'EditItem' : 'CreateNewItem') | localize }}: {{ 'EmployeeSubGroupGratuities' | localize }}
                        </h4>
                        <button type="button" class="btn-close" (click)="close()" [disabled]="saving()"></button>
                    </div>

                    <div class="modal-body">
                        <div class="mb-3">
                            <label for="EmployeeSubGroupGratuity_StartDate">{{ 'StartDate' | localize }}</label>
                            <input
                                id="EmployeeSubGroupGratuity_StartDate"
                                type="date"
                                class="form-control"
                                name="StartDate"
                                required
                                [ngModel]="record().startDate?.toISODate()"
                                (ngModelChange)="updateStartDate($event)" />
                        </div>
                        <div class="mb-3">
                            <label for="EmployeeSubGroupGratuity_EndDate">{{ 'EndDate' | localize }}</label>
                            <input
                                id="EmployeeSubGroupGratuity_EndDate"
                                type="date"
                                class="form-control"
                                name="EndDate"
                                [ngModel]="record().endDate?.toISODate()"
                                (ngModelChange)="updateEndDate($event)" />
                        </div>
                        <div class="mb-3">
                            <label for="EmployeeSubGroupGratuity_ChangeYear">{{ 'ChangeYear' | localize }}</label>
                            <input
                                id="EmployeeSubGroupGratuity_ChangeYear"
                                class="form-control"
                                type="number"
                                name="ChangeYear"
                                [ngModel]="record().changeYear"
                                (ngModelChange)="updateField('changeYear', $event)" />
                        </div>
                        <div class="mb-3">
                            <label for="EmployeeSubGroupGratuity_GratuityDays">{{ 'GratuityDays' | localize }}</label>
                            <input
                                id="EmployeeSubGroupGratuity_GratuityDays"
                                class="form-control"
                                type="number"
                                name="GratuityDays"
                                [ngModel]="record().gratuityDays"
                                (ngModelChange)="updateField('gratuityDays', $event)" />
                        </div>
                        <div class="mb-3">
                            <label for="EmployeeSubGroupGratuity_BasisDays">{{ 'BasisDays' | localize }}</label>
                            <input
                                id="EmployeeSubGroupGratuity_BasisDays"
                                class="form-control"
                                type="number"
                                name="BasisDays"
                                [ngModel]="record().basisDays"
                                (ngModelChange)="updateField('basisDays', $event)" />
                        </div>
                        <div class="mb-3 form-check">
                            <input
                                type="checkbox"
                                class="form-check-input"
                                id="EmployeeSubGroupGratuity_ImpactFromDateOfJoining"
                                name="ImpactFromDateOfJoining"
                                [ngModel]="record().impactFromDateOfJoining"
                                (ngModelChange)="updateField('impactFromDateOfJoining', $event)" />
                            <label class="form-check-label" for="EmployeeSubGroupGratuity_ImpactFromDateOfJoining">{{ 'ImpactFromDateOfJoining' | localize }}</label>
                        </div>
                    </div>

                    <div class="modal-footer">
                        <button type="button" class="btn btn-secondary" (click)="close()" [disabled]="saving()">
                            {{ 'Cancel' | localize }}
                        </button>
                        <button type="submit" class="btn btn-primary" [buttonBusy]="saving()" [disabled]="!recordForm.form.valid || saving()">
                            <i class="fa fa-save"></i>
                            {{ 'Save' | localize }}
                        </button>
                    </div>
                </form>
            }
        </div>
    </div>
</div>
