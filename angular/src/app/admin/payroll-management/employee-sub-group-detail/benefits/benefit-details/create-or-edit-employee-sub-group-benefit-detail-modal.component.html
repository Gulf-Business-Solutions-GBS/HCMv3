<div
    appBsModal
    #createOrEditModal="bs-modal"
    (onShown)="onShown()"
    class="modal fade"
    tabindex="-1"
    [config]="{ backdrop: 'static', keyboard: !saving() }">
    <div class="modal-dialog">
        <div class="modal-content">
            @if (active()) {
                <form #recordForm="ngForm" (ngSubmit)="save()">
                    <div class="modal-header">
                        <h4 class="modal-title">
                            {{ (record().id ? 'EditItem' : 'CreateNewItem') | localize }}: {{ 'EmployeeSubGroupBenefitDetails' | localize }}
                        </h4>
                        <button type="button" class="btn-close" (click)="close()" [disabled]="saving()"></button>
                    </div>

                    <div class="modal-body">
                        <div class="mb-3">
                            <label for="EmployeeSubGroupBenefitDetail_StartDate">{{ 'StartDate' | localize }}</label>
                            <input
                                id="EmployeeSubGroupBenefitDetail_StartDate"
                                type="date"
                                class="form-control"
                                name="StartDate"
                                required
                                [ngModel]="record().startDate?.toISODate()"
                                (ngModelChange)="updateStartDate($event)" />
                        </div>
                        <div class="mb-3">
                            <label for="EmployeeSubGroupBenefitDetail_EndDate">{{ 'EndDate' | localize }}</label>
                            <input
                                id="EmployeeSubGroupBenefitDetail_EndDate"
                                type="date"
                                class="form-control"
                                name="EndDate"
                                [ngModel]="record().endDate?.toISODate()"
                                (ngModelChange)="updateEndDate($event)" />
                        </div>
                        <div class="mb-3">
                            <label for="EmployeeSubGroupBenefitDetail_DependantTypeId">{{ 'DependantType' | localize }}</label>
                            <select
                                id="EmployeeSubGroupBenefitDetail_DependantTypeId"
                                class="form-select"
                                name="DependantTypeId"
                                required
                                [ngModel]="record().dependantTypeId"
                                (ngModelChange)="updateField('dependantTypeId', $event)">
                                <option [ngValue]="undefined"></option>
                                @for (dependantType of dependantTypes(); track dependantType.id) {
                                    <option [ngValue]="dependantType.id">{{ dependantType.nameEn }}</option>
                                }
                            </select>
                        </div>
                        <div class="mb-3">
                            <label for="EmployeeSubGroupBenefitDetail_Amount">{{ 'Amount' | localize }}</label>
                            <input
                                id="EmployeeSubGroupBenefitDetail_Amount"
                                class="form-control"
                                type="number"
                                name="Amount"
                                [ngModel]="record().amount"
                                (ngModelChange)="updateField('amount', $event)" />
                        </div>
                        <div class="mb-3">
                            <label for="EmployeeSubGroupBenefitDetail_AgeLimit">{{ 'AgeLimit' | localize }}</label>
                            <input
                                id="EmployeeSubGroupBenefitDetail_AgeLimit"
                                class="form-control"
                                type="number"
                                name="AgeLimit"
                                [ngModel]="record().ageLimit"
                                (ngModelChange)="updateField('ageLimit', $event)" />
                        </div>
                    </div>

                    <div class="modal-footer">
                        <button type="button" class="btn btn-secondary" (click)="close()" [disabled]="saving()">
                            {{ 'Cancel' | localize }}
                        </button>
                        <button type="submit" class="btn btn-primary" [buttonBusy]="saving()" [disabled]="!recordForm.form.valid || saving()">
                            <i class="fa fa-save"></i>
                            {{ 'Save' | localize }}
                        </button>
                    </div>
                </form>
            }
        </div>
    </div>
</div>
