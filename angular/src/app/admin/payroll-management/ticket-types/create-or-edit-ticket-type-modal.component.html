<div
    appBsModal
    #createOrEditModal="bs-modal"
    (onShown)="onShown()"
    class="modal fade"
    tabindex="-1"
    role="dialog"
    aria-labelledby="createOrEditModal"
    aria-hidden="true"
    [config]="{ backdrop: 'static', keyboard: !saving() }">
    <div class="modal-dialog modal-lg">
        <div class="modal-content">
            @if (active()) {
                <form #ticketTypeForm="ngForm" novalidate (ngSubmit)="save()" autocomplete="off">
                    <div class="modal-header">
                        <h4 class="modal-title">
                            @if (ticketType().id) {
                                <span>{{ 'EditItem' | localize }}: {{ 'TicketTypes' | localize }}</span>
                            } @else {
                                <span>{{ 'CreateNewItem' | localize }}: {{ 'TicketTypes' | localize }}</span>
                            }
                        </h4>
                        <button
                            type="button"
                            class="btn-close"
                            (click)="close()"
                            [attr.aria-label]="l('Close')"
                            [disabled]="saving()"></button>
                    </div>
                    <div class="modal-body">
                        <div class="row">
                            <div class="col-md-4 mb-5">
                                <label class="form-label" for="TicketType_Code">{{ 'Code' | localize }}</label>
                                <input
                                    id="TicketType_Code"
                                    class="form-control"
                                    type="text"
                                    name="Code"
                                    [ngModel]="ticketType().code"
                                    (ngModelChange)="updateField('code', $event)"
                                    maxlength="50"
                                    [placeholder]="l('AutoGeneratedIfEmpty')" />
                            </div>
                            <div class="col-md-4 mb-5">
                                <label class="form-label required" for="TicketType_NameEn">{{ 'NameEn' | localize }}</label>
                                <input
                                    id="TicketType_NameEn"
                                    #nameEnInput="ngModel"
                                    class="form-control"
                                    type="text"
                                    name="NameEn"
                                    [ngModel]="ticketType().nameEn"
                                    (ngModelChange)="updateField('nameEn', $event)"
                                    required
                                    maxlength="200" />
                                <validation-messages [formCtrl]="nameEnInput" />
                            </div>
                            <div class="col-md-4 mb-5">
                                <label class="form-label" for="TicketType_NameAr">{{ 'NameAr' | localize }}</label>
                                <input
                                    id="TicketType_NameAr"
                                    class="form-control"
                                    type="text"
                                    name="NameAr"
                                    dir="rtl"
                                    [ngModel]="ticketType().nameAr"
                                    (ngModelChange)="updateField('nameAr', $event)"
                                    maxlength="200" />
                            </div>
                        </div>
                        <div class="row">
                            <div class="col-md-6 mb-5">
                                <label class="form-label" for="TicketType_TicketBasisPeriod">{{ 'TicketBasisPeriod' | localize }}</label>
                                <select
                                    id="TicketType_TicketBasisPeriod"
                                    class="form-select"
                                    name="TicketBasisPeriod"
                                    [ngModel]="ticketType().ticketBasisPeriod"
                                    (ngModelChange)="updateField('ticketBasisPeriod', $event)">
                                    @for (item of ticketBasisPeriods; track item.value) {
                                        <option [ngValue]="item.value">{{ item.name | localize }}</option>
                                    }
                                </select>
                            </div>
                            <div class="col-md-6 mb-5">
                                <label class="form-label" for="TicketType_TicketBasisFixedDays">{{ 'TicketBasisFixedDays' | localize }}</label>
                                <input
                                    id="TicketType_TicketBasisFixedDays"
                                    class="form-control"
                                    type="number"
                                    name="TicketBasisFixedDays"
                                    [ngModel]="ticketType().ticketBasisFixedDays"
                                    (ngModelChange)="updateField('ticketBasisFixedDays', $event)" />
                            </div>
                        </div>
                        <div class="row">
                            <div class="col-md-4 mb-5 d-flex align-items-end">
                                <div class="form-check">
                                    <input
                                        id="TicketType_Lapse"
                                        class="form-check-input"
                                        type="checkbox"
                                        name="Lapse"
                                        [ngModel]="ticketType().lapse"
                                        (ngModelChange)="updateField('lapse', $event)" />
                                    <label class="form-check-label" for="TicketType_Lapse">{{ 'Lapse' | localize }}</label>
                                </div>
                            </div>
                            <div class="col-md-4 mb-5">
                                <label class="form-label" for="TicketType_LapseAfter">{{ 'LapseAfter' | localize }}</label>
                                <input
                                    id="TicketType_LapseAfter"
                                    class="form-control"
                                    type="number"
                                    name="LapseAfter"
                                    [ngModel]="ticketType().lapseAfter"
                                    (ngModelChange)="updateField('lapseAfter', $event)" />
                            </div>
                            <div class="col-md-4 mb-5">
                                <label class="form-label" for="TicketType_StopDependantAccrualAfter">{{ 'StopDependantAccrualAfter' | localize }}</label>
                                <input
                                    id="TicketType_StopDependantAccrualAfter"
                                    class="form-control"
                                    type="number"
                                    name="StopDependantAccrualAfter"
                                    [ngModel]="ticketType().stopDependantAccrualAfter"
                                    (ngModelChange)="updateField('stopDependantAccrualAfter', $event)" />
                            </div>
                        </div>
                        <div class="row">
                            <div class="col-md-4 mb-5">
                                <label class="form-label" for="TicketType_MinCompensation">{{ 'MinCompensation' | localize }}</label>
                                <input
                                    id="TicketType_MinCompensation"
                                    class="form-control"
                                    type="number"
                                    name="MinCompensation"
                                    [ngModel]="ticketType().minCompensation"
                                    (ngModelChange)="updateField('minCompensation', $event)" />
                            </div>
                            <div class="col-md-4 mb-5">
                                <label class="form-label" for="TicketType_DeductionPeriod">{{ 'DeductionPeriod' | localize }}</label>
                                <select
                                    id="TicketType_DeductionPeriod"
                                    class="form-select"
                                    name="DeductionPeriod"
                                    [ngModel]="ticketType().deductionPeriod"
                                    (ngModelChange)="updateField('deductionPeriod', $event)">
                                    @for (item of deductionPeriods; track item.value) {
                                        <option [ngValue]="item.value">{{ item.name | localize }}</option>
                                    }
                                </select>
                            </div>
                            <div class="col-md-4 mb-5">
                                <label class="form-label" for="TicketType_QuotaEntitlement">{{ 'QuotaEntitlement' | localize }}</label>
                                <select
                                    id="TicketType_QuotaEntitlement"
                                    class="form-select"
                                    name="QuotaEntitlement"
                                    [ngModel]="ticketType().quotaEntitlement"
                                    (ngModelChange)="updateField('quotaEntitlement', $event)">
                                    @for (item of quotaEntitlements; track item.value) {
                                        <option [ngValue]="item.value">{{ item.name | localize }}</option>
                                    }
                                </select>
                            </div>
                        </div>
                        <div class="row">
                            <div class="col-md-6 mb-5">
                                <label class="form-label" for="TicketType_WageTypeId">{{ 'WageTypeId' | localize }}</label>
                                <select
                                    id="TicketType_WageTypeId"
                                    class="form-select"
                                    name="WageTypeId"
                                    [ngModel]="ticketType().wageTypeId"
                                    (ngModelChange)="updateField('wageTypeId', $event)">
                                    <option [ngValue]="undefined"></option>
                                    @for (wageType of wageTypes(); track wageType.id) {
                                        <option [ngValue]="wageType.id">{{ wageType.nameEn }}</option>
                                    }
                                </select>
                            </div>
                        </div>
                    </div>
                    <div class="modal-footer">
                        <button
                            [disabled]="saving()"
                            type="button"
                            class="btn btn-light-primary fw-bold"
                            (click)="close()">
                            {{ 'Cancel' | localize }}
                        </button>
                        <button
                            type="submit"
                            class="btn btn-primary fw-bold"
                            [disabled]="!ticketTypeForm.form.valid"
                            [buttonBusy]="saving()"
                            [busyText]="l('SavingWithThreeDot')">
                            <i class="fa fa-save"></i>
                            <span>{{ 'Save' | localize }}</span>
                        </button>
                    </div>
                </form>
            }
        </div>
    </div>
</div>
