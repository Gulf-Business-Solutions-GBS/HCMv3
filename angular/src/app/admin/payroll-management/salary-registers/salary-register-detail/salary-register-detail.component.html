<div [@routerTransition]>
    <sub-header [title]="title()" [description]="'PayrollManagement' | localize">
        <div role="actions">
            @if (canEdit && register()) {
                <button type="button" class="btn btn-primary float-end ms-2" (click)="edit()">
                    <i class="fa fa-edit btn-md-icon"></i>
                    <span class="d-none d-md-inline-block">
                        {{ 'Edit' | localize }}
                    </span>
                </button>
            }
            <button type="button" class="btn btn-light-primary float-end" (click)="goBack()">
                <i class="fa fa-arrow-left btn-md-icon"></i>
                <span class="d-none d-md-inline-block">
                    {{ 'Back' | localize }}
                </span>
            </button>
        </div>
    </sub-header>

    <div [class]="containerClass">
        <!-- Legacy SalaryRegister_DetailView layout: four columns of two fields each. -->
        <div class="card card-custom mb-5" [busyIf]="loading()">
            <div class="card-header min-h-50px">
                <h3 class="card-title fs-6">{{ 'SalaryRegister' | localize }}</h3>
            </div>
            <div class="card-body py-4">
                @if (register(); as register) {
                    <div class="row g-4 sr-header">
                        <div class="col-md-3">
                            <label class="form-label">{{ 'Employee' | localize }}:</label>
                            <input class="form-control form-control-sm" readonly [value]="employeeText(register)" />
                        </div>
                        <div class="col-md-3">
                            <label class="form-label">{{ 'ForPeriod' | localize }}:</label>
                            <input class="form-control form-control-sm" readonly [value]="register.forPeriod | luxonFormat: 'dd/MM/yyyy'" />
                        </div>
                        <div class="col-md-3">
                            <label class="form-label">{{ 'PayrollRunType' | localize }}:</label>
                            <input
                                class="form-control form-control-sm"
                                readonly
                                [value]="(register.payrollRunType === 0 ? 'Regular' : 'OffCycle') | localize" />
                        </div>
                        <div class="col-md-3">
                            <label class="form-label">{{ 'PayrollReasonTypeId' | localize }}:</label>
                            <input class="form-control form-control-sm" readonly [value]="register.payrollReasonTypeName ?? ''" />
                        </div>
                        <div class="col-md-3">
                            <label class="form-label">{{ 'PayrollArea' | localize }}:</label>
                            <input class="form-control form-control-sm" readonly [value]="register.payrollAreaName ?? ''" />
                        </div>
                        <div class="col-md-3">
                            <label class="form-label">{{ 'InPeriod' | localize }}:</label>
                            <input class="form-control form-control-sm" readonly [value]="register.inPeriod | luxonFormat: 'dd/MM/yyyy'" />
                        </div>
                        <div class="col-md-3">
                            <label class="form-label">{{ 'PayrollResultType' | localize }}:</label>
                            <input
                                class="form-control form-control-sm"
                                readonly
                                [value]="payrollResultTypeKey(register.payrollResultType) | localize" />
                        </div>
                        <div class="col-md-3">
                            <label class="form-label">{{ 'OffCyclePaymentDate' | localize }}:</label>
                            <input
                                class="form-control form-control-sm"
                                readonly
                                [value]="isSet(register.offCyclePaymentDate) ? (register.offCyclePaymentDate | luxonFormat: 'dd/MM/yyyy') : ''" />
                        </div>
                    </div>
                }
            </div>
        </div>

        @if (registerId(); as id) {
            @if (canSeeLines) {
                <div class="card card-custom">
                    <div class="card-header min-h-50px">
                        <h3 class="card-title fs-6">{{ 'SalaryRegisterDetail' | localize }}</h3>
                    </div>
                    <div class="card-body py-4">
                        <salaryRegisterLines [salaryRegisterId]="id" />
                    </div>
                </div>
            }
        }
    </div>

    <createOrEditSalaryRegisterModal #editModal (modalSave)="reload()" />
</div>
