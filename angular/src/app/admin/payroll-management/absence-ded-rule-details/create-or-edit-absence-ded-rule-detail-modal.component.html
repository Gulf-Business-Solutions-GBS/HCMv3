<div
    appBsModal
    #createOrEditModal="bs-modal"
    (onShown)="onShown()"
    class="modal fade"
    tabindex="-1"
    role="dialog"
    aria-labelledby="createOrEditModal"
    aria-hidden="true"
    [config]="{ backdrop: 'static', keyboard: !saving() }">
    <div class="modal-dialog modal-lg">
        <div class="modal-content">
            @if (active()) {
                <form #absenceDedRuleDetailForm="ngForm" novalidate (ngSubmit)="save()" autocomplete="off">
                    <div class="modal-header">
                        <h4 class="modal-title">
                            @if (absenceDedRuleDetail().id) {
                                <span>{{ 'EditItem' | localize }}: {{ 'AbsenceDedRuleDetails' | localize }}</span>
                            } @else {
                                <span>{{ 'CreateNewItem' | localize }}: {{ 'AbsenceDedRuleDetails' | localize }}</span>
                            }
                        </h4>
                        <button
                            type="button"
                            class="btn-close"
                            (click)="close()"
                            [attr.aria-label]="l('Close')"
                            [disabled]="saving()"></button>
                    </div>
                    <div class="modal-body">
                        <div class="row">
                            <div class="col-md-12 mb-5">
                                <label class="form-label required" for="AbsenceDedRuleDetail_AbsenceDeductionRuleId">{{ 'AbsenceDeductionRules' | localize }}</label>
                                <select
                                    id="AbsenceDedRuleDetail_AbsenceDeductionRuleId"
                                    #absenceDeductionRuleIdInput="ngModel"
                                    class="form-select"
                                    name="AbsenceDeductionRuleId"
                                    [ngModel]="absenceDedRuleDetail().absenceDeductionRuleId"
                                    (ngModelChange)="updateField('absenceDeductionRuleId', $event)"
                                    required>
                                    <option [ngValue]="undefined"></option>
                                    @for (rule of absenceDeductionRules(); track rule.id) {
                                        <option [ngValue]="rule.id">{{ rule.ruleName }}</option>
                                    }
                                </select>
                                <validation-messages [formCtrl]="absenceDeductionRuleIdInput" />
                            </div>
                        </div>
                        <div class="row">
                            <div class="col-md-6 mb-5">
                                <label class="form-label required" for="AbsenceDedRuleDetail_StartDate">{{ 'StartDate' | localize }}</label>
                                <input
                                    id="AbsenceDedRuleDetail_StartDate"
                                    #startDateInput="ngModel"
                                    type="date"
                                    class="form-control"
                                    name="StartDate"
                                    [ngModel]="absenceDedRuleDetail().startDate?.toISODate()"
                                    (ngModelChange)="updateDateField('startDate', $event)"
                                    required />
                                <validation-messages [formCtrl]="startDateInput" />
                            </div>
                            <div class="col-md-6 mb-5">
                                <label class="form-label required" for="AbsenceDedRuleDetail_EndDate">{{ 'EndDate' | localize }}</label>
                                <input
                                    id="AbsenceDedRuleDetail_EndDate"
                                    #endDateInput="ngModel"
                                    type="date"
                                    class="form-control"
                                    name="EndDate"
                                    [ngModel]="absenceDedRuleDetail().endDate?.toISODate()"
                                    (ngModelChange)="updateDateField('endDate', $event)"
                                    required />
                                <validation-messages [formCtrl]="endDateInput" />
                            </div>
                        </div>
                        <div class="row">
                            <div class="col-md-4 mb-5">
                                <label class="form-label" for="AbsenceDedRuleDetail_DaysCount">{{ 'DaysCount' | localize }}</label>
                                <input
                                    id="AbsenceDedRuleDetail_DaysCount"
                                    class="form-control"
                                    type="number"
                                    name="DaysCount"
                                    [ngModel]="absenceDedRuleDetail().daysCount"
                                    (ngModelChange)="updateField('daysCount', $event)" />
                            </div>
                            <div class="col-md-4 mb-5">
                                <label class="form-label" for="AbsenceDedRuleDetail_DeductionUnit">{{ 'DeductionUnit' | localize }}</label>
                                <select
                                    id="AbsenceDedRuleDetail_DeductionUnit"
                                    class="form-select"
                                    name="DeductionUnit"
                                    [ngModel]="absenceDedRuleDetail().deductionUnit"
                                    (ngModelChange)="updateField('deductionUnit', $event)">
                                    @for (unit of deductionUnits; track unit.value) {
                                        <option [ngValue]="unit.value">{{ unit.name | localize }}</option>
                                    }
                                </select>
                            </div>
                            <div class="col-md-4 mb-5">
                                <label class="form-label" for="AbsenceDedRuleDetail_DeductionNumber">{{ 'DeductionNumber' | localize }}</label>
                                <input
                                    id="AbsenceDedRuleDetail_DeductionNumber"
                                    class="form-control"
                                    type="number"
                                    name="DeductionNumber"
                                    [ngModel]="absenceDedRuleDetail().deductionNumber"
                                    (ngModelChange)="updateField('deductionNumber', $event)" />
                            </div>
                        </div>
                    </div>
                    <div class="modal-footer">
                        <button
                            [disabled]="saving()"
                            type="button"
                            class="btn btn-light-primary fw-bold"
                            (click)="close()">
                            {{ 'Cancel' | localize }}
                        </button>
                        <button
                            type="submit"
                            class="btn btn-primary fw-bold"
                            [disabled]="!absenceDedRuleDetailForm.form.valid"
                            [buttonBusy]="saving()"
                            [busyText]="l('SavingWithThreeDot')">
                            <i class="fa fa-save"></i>
                            <span>{{ 'Save' | localize }}</span>
                        </button>
                    </div>
                </form>
            }
        </div>
    </div>
</div>
