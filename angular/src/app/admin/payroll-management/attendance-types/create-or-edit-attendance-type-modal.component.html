<div
    appBsModal
    #createOrEditModal="bs-modal"
    (onShown)="onShown()"
    class="modal fade"
    tabindex="-1"
    role="dialog"
    aria-labelledby="createOrEditModal"
    aria-hidden="true"
    [config]="{ backdrop: 'static', keyboard: !saving() }">
    <div class="modal-dialog modal-lg">
        <div class="modal-content">
            @if (active()) {
                <form #attendanceTypeForm="ngForm" novalidate (ngSubmit)="save()" autocomplete="off">
                    <div class="modal-header">
                        <h4 class="modal-title">
                            @if (attendanceType().id) {
                                <span>{{ 'EditItem' | localize }}: {{ 'AttendanceTypes' | localize }}</span>
                            } @else {
                                <span>{{ 'CreateNewItem' | localize }}: {{ 'AttendanceTypes' | localize }}</span>
                            }
                        </h4>
                        <button
                            type="button"
                            class="btn-close"
                            (click)="close()"
                            [attr.aria-label]="l('Close')"
                            [disabled]="saving()"></button>
                    </div>
                    <div class="modal-body" style="max-height: 70vh; overflow-y: auto">
                        <div class="row">
                            <div class="col-md-4 mb-5">
                                <label class="form-label" for="AttendanceType_Code">{{ 'Code' | localize }}</label>
                                <input
                                    id="AttendanceType_Code"
                                    class="form-control"
                                    type="text"
                                    name="Code"
                                    [ngModel]="attendanceType().code"
                                    (ngModelChange)="updateField('code', $event)"
                                    maxlength="50"
                                    [placeholder]="l('AutoGeneratedIfEmpty')" />
                            </div>
                            <div class="col-md-4 mb-5">
                                <label class="form-label required" for="AttendanceType_NameEn">{{ 'NameEn' | localize }}</label>
                                <input
                                    id="AttendanceType_NameEn"
                                    #nameEnInput="ngModel"
                                    class="form-control"
                                    type="text"
                                    name="NameEn"
                                    [ngModel]="attendanceType().nameEn"
                                    (ngModelChange)="updateField('nameEn', $event)"
                                    required
                                    maxlength="200" />
                                <validation-messages [formCtrl]="nameEnInput" />
                            </div>
                            <div class="col-md-4 mb-5">
                                <label class="form-label required" for="AttendanceType_NameAr">{{ 'NameAr' | localize }}</label>
                                <input
                                    id="AttendanceType_NameAr"
                                    #nameArInput="ngModel"
                                    class="form-control"
                                    type="text"
                                    name="NameAr"
                                    dir="rtl"
                                    [ngModel]="attendanceType().nameAr"
                                    (ngModelChange)="updateField('nameAr', $event)"
                                    required
                                    maxlength="200" />
                                <validation-messages [formCtrl]="nameArInput" />
                            </div>
                        </div>

                        <div class="row">
                            <div class="col-md-3 mb-5">
                                <label class="form-label" for="AttendanceType_WageTypeId">{{ 'WageType' | localize }}</label>
                                <select
                                    id="AttendanceType_WageTypeId"
                                    class="form-select"
                                    name="WageTypeId"
                                    [ngModel]="attendanceType().wageTypeId"
                                    (ngModelChange)="updateField('wageTypeId', $event)">
                                    <option [ngValue]="undefined"></option>
                                    @for (wageType of wageTypes(); track wageType.id) {
                                        <option [ngValue]="wageType.id">{{ wageType.nameEn }}</option>
                                    }
                                </select>
                            </div>
                            <div class="col-md-3 mb-5">
                                <label class="form-label" for="AttendanceType_AccrualPeriod">{{ 'AccrualPeriod' | localize }}</label>
                                <select
                                    id="AttendanceType_AccrualPeriod"
                                    class="form-select"
                                    name="AccrualPeriod"
                                    [ngModel]="attendanceType().accrualPeriod"
                                    (ngModelChange)="updateField('accrualPeriod', $event)">
                                    @for (period of accrualPeriods; track period.value) {
                                        <option [ngValue]="period.value">{{ period.name | localize }}</option>
                                    }
                                </select>
                            </div>
                            <div class="col-md-6 mb-5">
                                <label class="form-label" for="AttendanceType_LinkLeaveQuotaId">{{ 'LinkLeaveQuota' | localize }}</label>
                                <select
                                    id="AttendanceType_LinkLeaveQuotaId"
                                    class="form-select"
                                    name="LinkLeaveQuotaId"
                                    [ngModel]="attendanceType().linkLeaveQuotaId"
                                    (ngModelChange)="updateField('linkLeaveQuotaId', $event)">
                                    <option [ngValue]="undefined"></option>
                                    @for (absenceType of absenceTypes(); track absenceType.id) {
                                        <option [ngValue]="absenceType.id">{{ absenceType.nameEn }}</option>
                                    }
                                </select>
                            </div>
                        </div>

                        <hr />
                        <!--
                            Legacy AttendanceType_DetailView shows only Code, Name (En/Ar), Link Leave Quota,
                            Include Public Holiday and Have Quota Accrual. IsPaid, IncludeWeekend, IncludeRestDay,
                            CalcOnCalendarDays and IsFullDay stay on the DTO (and keep their saved values on edit)
                            but are not rendered.
                        -->
                        <div class="row">
                            <div class="col-md-3 mb-3 form-check">
                                <input
                                    type="checkbox"
                                    class="form-check-input"
                                    id="AttendanceType_IncludePublicHoliday"
                                    name="IncludePublicHoliday"
                                    [ngModel]="attendanceType().includePublicHoliday"
                                    (ngModelChange)="updateField('includePublicHoliday', $event)" />
                                <label class="form-check-label" for="AttendanceType_IncludePublicHoliday">{{ 'IncludePublicHoliday' | localize }}</label>
                            </div>
                            <div class="col-md-3 mb-3 form-check">
                                <input
                                    type="checkbox"
                                    class="form-check-input"
                                    id="AttendanceType_HaveQuotaAccrual"
                                    name="HaveQuotaAccrual"
                                    [ngModel]="attendanceType().haveQuotaAccrual"
                                    (ngModelChange)="updateField('haveQuotaAccrual', $event)" />
                                <label class="form-check-label" for="AttendanceType_HaveQuotaAccrual">{{ 'HaveQuotaAccrual' | localize }}</label>
                            </div>
                        </div>
                    </div>
                    <div class="modal-footer">
                        <button
                            [disabled]="saving()"
                            type="button"
                            class="btn btn-light-primary fw-bold"
                            (click)="close()">
                            {{ 'Cancel' | localize }}
                        </button>
                        <button
                            type="submit"
                            class="btn btn-primary fw-bold"
                            [disabled]="!attendanceTypeForm.form.valid"
                            [buttonBusy]="saving()"
                            [busyText]="l('SavingWithThreeDot')">
                            <i class="fa fa-save"></i>
                            <span>{{ 'Save' | localize }}</span>
                        </button>
                    </div>
                </form>
            }
        </div>
    </div>
</div>
