<div
    appBsModal
    #createOrEditModal="bs-modal"
    (onShown)="onShown()"
    class="modal fade"
    tabindex="-1"
    role="dialog"
    aria-labelledby="createOrEditModal"
    aria-hidden="true"
    [config]="{ backdrop: 'static', keyboard: !saving() }">
    <div class="modal-dialog modal-lg">
        <div class="modal-content">
            @if (active()) {
                <form #absenceViolationActionRecordForm="ngForm" novalidate (ngSubmit)="save()" autocomplete="off">
                    <div class="modal-header">
                        <h4 class="modal-title">
                            @if (absenceViolationActionRecord().id) {
                                <span>{{ 'EditItem' | localize }}: {{ 'AbsenceViolationActionRecords' | localize }}</span>
                            } @else {
                                <span>{{ 'CreateNewItem' | localize }}: {{ 'AbsenceViolationActionRecords' | localize }}</span>
                            }
                        </h4>
                        <button
                            type="button"
                            class="btn-close"
                            (click)="close()"
                            [attr.aria-label]="l('Close')"
                            [disabled]="saving()"></button>
                    </div>
                    <div class="modal-body">
                        <div class="row">
                            <div class="col-md-4 mb-5">
                                <label class="form-label" for="AbsenceViolationActionRecord_ActionLogType">{{ 'ActionLogType' | localize }}</label>
                                <select
                                    id="AbsenceViolationActionRecord_ActionLogType"
                                    class="form-select"
                                    name="ActionLogType"
                                    [ngModel]="absenceViolationActionRecord().actionLogType"
                                    (ngModelChange)="updateField('actionLogType', $event)">
                                    @for (type of actionLogTypes; track type.value) {
                                        <option [ngValue]="type.value">{{ type.name | localize }}</option>
                                    }
                                </select>
                            </div>
                            <div class="col-md-4 mb-5">
                                <label class="form-label" for="AbsenceViolationActionRecord_LogStatus">{{ 'LogStatus' | localize }}</label>
                                <select
                                    id="AbsenceViolationActionRecord_LogStatus"
                                    class="form-select"
                                    name="LogStatus"
                                    [ngModel]="absenceViolationActionRecord().logStatus"
                                    (ngModelChange)="updateField('logStatus', $event)">
                                    @for (status of logStatuses; track status.value) {
                                        <option [ngValue]="status.value">{{ status.name | localize }}</option>
                                    }
                                </select>
                            </div>
                            <div class="col-md-4 mb-5">
                                <label class="form-label" for="AbsenceViolationActionRecord_EntityObjectId">{{ 'EntityObjectId' | localize }}</label>
                                <input
                                    id="AbsenceViolationActionRecord_EntityObjectId"
                                    class="form-control"
                                    type="number"
                                    name="EntityObjectId"
                                    [ngModel]="absenceViolationActionRecord().entityObjectId"
                                    (ngModelChange)="updateField('entityObjectId', $event)" />
                            </div>
                        </div>
                    </div>
                    <div class="modal-footer">
                        <button
                            [disabled]="saving()"
                            type="button"
                            class="btn btn-light-primary fw-bold"
                            (click)="close()">
                            {{ 'Cancel' | localize }}
                        </button>
                        <button
                            type="submit"
                            class="btn btn-primary fw-bold"
                            [disabled]="!absenceViolationActionRecordForm.form.valid"
                            [buttonBusy]="saving()"
                            [busyText]="l('SavingWithThreeDot')">
                            <i class="fa fa-save"></i>
                            <span>{{ 'Save' | localize }}</span>
                        </button>
                    </div>
                </form>
            }
        </div>
    </div>
</div>
