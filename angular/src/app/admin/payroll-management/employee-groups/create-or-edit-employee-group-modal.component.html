<div
    appBsModal
    #createOrEditModal="bs-modal"
    (onShown)="onShown()"
    class="modal fade"
    tabindex="-1"
    role="dialog"
    aria-labelledby="createOrEditModal"
    aria-hidden="true"
    [config]="{ backdrop: 'static', keyboard: !saving() }">
    <div class="modal-dialog modal-lg">
        <div class="modal-content">
            @if (active()) {
                <form #employeeGroupForm="ngForm" novalidate (ngSubmit)="save()" autocomplete="off">
                    <div class="modal-header">
                        <h4 class="modal-title">
                            @if (record().id) {
                                <span>{{ 'EditItem' | localize }}: {{ 'EmployeeGroups' | localize }}</span>
                            } @else {
                                <span>{{ 'CreateNewItem' | localize }}: {{ 'EmployeeGroups' | localize }}</span>
                            }
                        </h4>
                        <button
                            type="button"
                            class="btn-close"
                            (click)="close()"
                            [attr.aria-label]="l('Close')"
                            [disabled]="saving()"></button>
                    </div>
                    <div class="modal-body">
                        <div class="row">
                            <div class="col-md-4 mb-5">
                                <label class="form-label" for="EmployeeGroup_Code">{{ 'Code' | localize }}</label>
                                <input
                                    id="EmployeeGroup_Code"
                                    class="form-control"
                                    type="text"
                                    name="Code"
                                    [ngModel]="record().code"
                                    (ngModelChange)="updateField('code', $event)"
                                    maxlength="50"
                                    [placeholder]="l('AutoGeneratedIfEmpty')" />
                            </div>
                            <div class="col-md-4 mb-5">
                                <label class="form-label required" for="EmployeeGroup_NameEn">{{ 'NameEn' | localize }}</label>
                                <input
                                    id="EmployeeGroup_NameEn"
                                    #nameEnInput="ngModel"
                                    class="form-control"
                                    type="text"
                                    name="NameEn"
                                    [ngModel]="record().nameEn"
                                    (ngModelChange)="updateField('nameEn', $event)"
                                    required
                                    maxlength="200" />
                                <validation-messages [formCtrl]="nameEnInput" />
                            </div>
                            <div class="col-md-4 mb-5">
                                <label class="form-label required" for="EmployeeGroup_NameAr">{{ 'NameAr' | localize }}</label>
                                <input
                                    id="EmployeeGroup_NameAr"
                                    #nameArInput="ngModel"
                                    class="form-control"
                                    type="text"
                                    name="NameAr"
                                    dir="rtl"
                                    [ngModel]="record().nameAr"
                                    (ngModelChange)="updateField('nameAr', $event)"
                                    required
                                    maxlength="200" />
                                <validation-messages [formCtrl]="nameArInput" />
                            </div>
                        </div>
                        <div class="row">
                            <div class="col-md-4 mb-5">
                                <label class="form-label" for="EmployeeGroup_IndemnityMaxNumber">{{ 'IndemnityMaxNumber' | localize }}</label>
                                <input
                                    id="EmployeeGroup_IndemnityMaxNumber"
                                    class="form-control"
                                    type="number"
                                    name="IndemnityMaxNumber"
                                    [ngModel]="record().indemnityMaxNumber"
                                    (ngModelChange)="updateField('indemnityMaxNumber', $event)" />
                            </div>
                            <div class="col-md-4 mb-5">
                                <label class="form-label" for="EmployeeGroup_IndemnityMaxUnit">{{ 'IndemnityMaxUnit' | localize }}</label>
                                <select
                                    id="EmployeeGroup_IndemnityMaxUnit"
                                    class="form-select"
                                    name="IndemnityMaxUnit"
                                    [ngModel]="record().indemnityMaxUnit"
                                    (ngModelChange)="updateField('indemnityMaxUnit', $event)">
                                    @for (unit of units; track unit.value) {
                                        <option [ngValue]="unit.value">{{ unit.name | localize }}</option>
                                    }
                                </select>
                            </div>
                            <div class="col-md-4 mb-5">
                                <label class="form-label" for="EmployeeGroup_IndemnityMaxAccruePercentage">{{ 'IndemnityMaxAccruePercentage' | localize }}</label>
                                <input
                                    id="EmployeeGroup_IndemnityMaxAccruePercentage"
                                    class="form-control"
                                    type="number"
                                    name="IndemnityMaxAccruePercentage"
                                    [ngModel]="record().indemnityMaxAccruePercentage"
                                    (ngModelChange)="updateField('indemnityMaxAccruePercentage', $event)" />
                            </div>
                        </div>
                    </div>
                    <div class="modal-footer">
                        <button
                            [disabled]="saving()"
                            type="button"
                            class="btn btn-light-primary fw-bold"
                            (click)="close()">
                            {{ 'Cancel' | localize }}
                        </button>
                        <button
                            type="submit"
                            class="btn btn-primary fw-bold"
                            [disabled]="!employeeGroupForm.form.valid"
                            [buttonBusy]="saving()"
                            [busyText]="l('SavingWithThreeDot')">
                            <i class="fa fa-save"></i>
                            <span>{{ 'Save' | localize }}</span>
                        </button>
                    </div>
                </form>
            }
        </div>
    </div>
</div>
