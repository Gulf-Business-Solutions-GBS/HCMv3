<div
    appBsModal
    #createOrEditModal="bs-modal"
    (onShown)="onShown()"
    class="modal fade"
    tabindex="-1"
    role="dialog"
    aria-labelledby="createOrEditModal"
    aria-hidden="true"
    [config]="{ backdrop: 'static', keyboard: !saving() }">
    <div class="modal-dialog modal-lg">
        <div class="modal-content">
            @if (active()) {
                <form #leaveAccrualSummaryForm="ngForm" novalidate (ngSubmit)="save()" autocomplete="off">
                    <div class="modal-header">
                        <h4 class="modal-title">
                            @if (leaveAccrualSummary().id) {
                                <span>{{ 'EditItem' | localize }}: {{ 'LeaveAccrualSummaries' | localize }}</span>
                            } @else {
                                <span>{{ 'CreateNewItem' | localize }}: {{ 'LeaveAccrualSummaries' | localize }}</span>
                            }
                        </h4>
                        <button
                            type="button"
                            class="btn-close"
                            (click)="close()"
                            [attr.aria-label]="l('Close')"
                            [disabled]="saving()"></button>
                    </div>
                    <div class="modal-body">
                        <div class="row">
                            <div class="col-md-6 mb-5">
                                <label class="form-label required" for="LeaveAccrualSummary_EmployeeId">{{ 'EmployeeId' | localize }}</label>
                                <input
                                    id="LeaveAccrualSummary_EmployeeId"
                                    #employeeIdInput="ngModel"
                                    class="form-control"
                                    type="number"
                                    name="EmployeeId"
                                    [ngModel]="leaveAccrualSummary().employeeId"
                                    (ngModelChange)="updateField('employeeId', $event)"
                                    required />
                                <validation-messages [formCtrl]="employeeIdInput" />
                            </div>
                            <div class="col-md-6 mb-5">
                                <label class="form-label required" for="LeaveAccrualSummary_AbsenceTypeId">{{ 'AbsenceTypeId' | localize }}</label>
                                <select
                                    id="LeaveAccrualSummary_AbsenceTypeId"
                                    #absenceTypeIdInput="ngModel"
                                    class="form-select"
                                    name="AbsenceTypeId"
                                    [ngModel]="leaveAccrualSummary().absenceTypeId"
                                    (ngModelChange)="updateField('absenceTypeId', $event)"
                                    required>
                                    <option [ngValue]="undefined"></option>
                                    @for (absenceType of absenceTypes(); track absenceType.id) {
                                        <option [ngValue]="absenceType.id">{{ absenceType.nameEn }}</option>
                                    }
                                </select>
                                <validation-messages [formCtrl]="absenceTypeIdInput" />
                            </div>
                        </div>
                        <div class="row">
                            <div class="col-md-6 mb-5">
                                <label class="form-label required" for="LeaveAccrualSummary_Year">{{ 'Year' | localize }}</label>
                                <input
                                    id="LeaveAccrualSummary_Year"
                                    #yearInput="ngModel"
                                    class="form-control"
                                    type="number"
                                    name="Year"
                                    [ngModel]="leaveAccrualSummary().year"
                                    (ngModelChange)="updateField('year', $event)"
                                    required />
                                <validation-messages [formCtrl]="yearInput" />
                            </div>
                            <div class="col-md-6 mb-5">
                                <label class="form-label required" for="LeaveAccrualSummary_Month">{{ 'Month' | localize }}</label>
                                <input
                                    id="LeaveAccrualSummary_Month"
                                    #monthInput="ngModel"
                                    class="form-control"
                                    type="number"
                                    name="Month"
                                    min="1"
                                    max="12"
                                    [ngModel]="leaveAccrualSummary().month"
                                    (ngModelChange)="updateField('month', $event)"
                                    required />
                                <validation-messages [formCtrl]="monthInput" />
                            </div>
                        </div>
                        <div class="row">
                            <div class="col-md-4 mb-5">
                                <label class="form-label required" for="LeaveAccrualSummary_AccrualDays">{{ 'AccrualDays' | localize }}</label>
                                <input
                                    id="LeaveAccrualSummary_AccrualDays"
                                    #accrualDaysInput="ngModel"
                                    class="form-control"
                                    type="number"
                                    name="AccrualDays"
                                    [ngModel]="leaveAccrualSummary().accrualDays"
                                    (ngModelChange)="updateField('accrualDays', $event)"
                                    required />
                                <validation-messages [formCtrl]="accrualDaysInput" />
                            </div>
                            <div class="col-md-4 mb-5">
                                <label class="form-label required" for="LeaveAccrualSummary_UsedDays">{{ 'UsedDays' | localize }}</label>
                                <input
                                    id="LeaveAccrualSummary_UsedDays"
                                    #usedDaysInput="ngModel"
                                    class="form-control"
                                    type="number"
                                    name="UsedDays"
                                    [ngModel]="leaveAccrualSummary().usedDays"
                                    (ngModelChange)="updateField('usedDays', $event)"
                                    required />
                                <validation-messages [formCtrl]="usedDaysInput" />
                            </div>
                            <div class="col-md-4 mb-5">
                                <label class="form-label required" for="LeaveAccrualSummary_CumulativeAccruedDays">{{
                                    'CumulativeAccruedDays' | localize
                                }}</label>
                                <input
                                    id="LeaveAccrualSummary_CumulativeAccruedDays"
                                    #cumulativeAccruedDaysInput="ngModel"
                                    class="form-control"
                                    type="number"
                                    name="CumulativeAccruedDays"
                                    [ngModel]="leaveAccrualSummary().cumulativeAccruedDays"
                                    (ngModelChange)="updateField('cumulativeAccruedDays', $event)"
                                    required />
                                <validation-messages [formCtrl]="cumulativeAccruedDaysInput" />
                            </div>
                        </div>
                    </div>
                    <div class="modal-footer">
                        <button [disabled]="saving()" type="button" class="btn btn-light-primary fw-bold" (click)="close()">
                            {{ 'Cancel' | localize }}
                        </button>
                        <button
                            type="submit"
                            class="btn btn-primary fw-bold"
                            [disabled]="!leaveAccrualSummaryForm.form.valid"
                            [buttonBusy]="saving()"
                            [busyText]="l('SavingWithThreeDot')">
                            <i class="fa fa-save"></i>
                            <span>{{ 'Save' | localize }}</span>
                        </button>
                    </div>
                </form>
            }
        </div>
    </div>
</div>
