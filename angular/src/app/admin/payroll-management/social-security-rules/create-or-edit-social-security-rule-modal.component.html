<div
    appBsModal
    #createOrEditModal="bs-modal"
    (onShown)="onShown()"
    class="modal fade"
    tabindex="-1"
    role="dialog"
    aria-labelledby="createOrEditModal"
    aria-hidden="true"
    [config]="{ backdrop: 'static', keyboard: !saving() }">
    <div class="modal-dialog modal-lg">
        <div class="modal-content">
            @if (active()) {
                <form #socialSecurityRuleForm="ngForm" novalidate (ngSubmit)="save()" autocomplete="off">
                    <div class="modal-header">
                        <h4 class="modal-title">
                            @if (socialSecurityRule().id) {
                                <span>{{ 'EditItem' | localize }}: {{ 'SocialSecurityRules' | localize }}</span>
                            } @else {
                                <span>{{ 'CreateNewItem' | localize }}: {{ 'SocialSecurityRules' | localize }}</span>
                            }
                        </h4>
                        <button
                            type="button"
                            class="btn-close"
                            (click)="close()"
                            [attr.aria-label]="l('Close')"
                            [disabled]="saving()"></button>
                    </div>
                    <div class="modal-body">
                        <div class="row">
                            <div class="col-md-12 mb-5">
                                <label class="form-label required" for="SocialSecurityRule_SocialSecurityId">{{ 'SocialSecurityId' | localize }}</label>
                                <select
                                    id="SocialSecurityRule_SocialSecurityId"
                                    #socialSecurityIdInput="ngModel"
                                    class="form-select"
                                    name="SocialSecurityId"
                                    [ngModel]="socialSecurityRule().socialSecurityId"
                                    (ngModelChange)="updateField('socialSecurityId', $event)"
                                    required>
                                    <option [ngValue]="undefined"></option>
                                    @for (ss of socialSecurities(); track ss.id) {
                                        <option [ngValue]="ss.id">{{ ss.nationalityName }} ({{ ss.startDate?.toISODate() }})</option>
                                    }
                                </select>
                                <validation-messages [formCtrl]="socialSecurityIdInput" />
                            </div>
                        </div>
                        <div class="row">
                            <div class="col-md-6 mb-5">
                                <label class="form-label required" for="SocialSecurityRule_StartDate">{{ 'StartDate' | localize }}</label>
                                <input
                                    id="SocialSecurityRule_StartDate"
                                    #startDateInput="ngModel"
                                    type="date"
                                    class="form-control"
                                    name="StartDate"
                                    [ngModel]="socialSecurityRule().startDate?.toISODate()"
                                    (ngModelChange)="updateDateField('startDate', $event)"
                                    required />
                                <validation-messages [formCtrl]="startDateInput" />
                            </div>
                            <div class="col-md-6 mb-5">
                                <label class="form-label required" for="SocialSecurityRule_EndDate">{{ 'EndDate' | localize }}</label>
                                <input
                                    id="SocialSecurityRule_EndDate"
                                    #endDateInput="ngModel"
                                    type="date"
                                    class="form-control"
                                    name="EndDate"
                                    [ngModel]="socialSecurityRule().endDate?.toISODate()"
                                    (ngModelChange)="updateDateField('endDate', $event)"
                                    required />
                                <validation-messages [formCtrl]="endDateInput" />
                            </div>
                        </div>
                        <div class="row">
                            <div class="col-md-4 mb-5">
                                <label class="form-label required" for="SocialSecurityRule_QualificationId">{{ 'QualificationId' | localize }}</label>
                                <select
                                    id="SocialSecurityRule_QualificationId"
                                    #qualificationIdInput="ngModel"
                                    class="form-select"
                                    name="QualificationId"
                                    [ngModel]="socialSecurityRule().qualificationId"
                                    (ngModelChange)="updateField('qualificationId', $event)"
                                    required>
                                    <option [ngValue]="undefined"></option>
                                    @for (qualification of qualifications(); track qualification.id) {
                                        <option [ngValue]="qualification.id">{{ qualification.nameEn }}</option>
                                    }
                                </select>
                                <validation-messages [formCtrl]="qualificationIdInput" />
                            </div>
                            <div class="col-md-4 mb-5">
                                <label class="form-label" for="SocialSecurityRule_Gender">{{ 'Gender' | localize }}</label>
                                <select
                                    id="SocialSecurityRule_Gender"
                                    class="form-select"
                                    name="Gender"
                                    [ngModel]="socialSecurityRule().gender"
                                    (ngModelChange)="updateField('gender', $event)">
                                    @for (item of genders; track item.value) {
                                        <option [ngValue]="item.value">{{ item.name | localize }}</option>
                                    }
                                </select>
                            </div>
                            <div class="col-md-4 mb-5">
                                <label class="form-label" for="SocialSecurityRule_MaritalStatusId">{{ 'MaritalStatusId' | localize }}</label>
                                <select
                                    id="SocialSecurityRule_MaritalStatusId"
                                    class="form-select"
                                    name="MaritalStatusId"
                                    [ngModel]="socialSecurityRule().maritalStatusId"
                                    (ngModelChange)="updateField('maritalStatusId', $event)">
                                    <option [ngValue]="undefined"></option>
                                    @for (status of maritalStatuses(); track status.id) {
                                        <option [ngValue]="status.id">{{ status.nameEn }}</option>
                                    }
                                </select>
                            </div>
                        </div>
                        <div class="row">
                            <div class="col-md-4 mb-5">
                                <label class="form-label" for="SocialSecurityRule_Dependant">{{ 'Dependant' | localize }}</label>
                                <input
                                    id="SocialSecurityRule_Dependant"
                                    class="form-control"
                                    type="number"
                                    name="Dependant"
                                    [ngModel]="socialSecurityRule().dependant"
                                    (ngModelChange)="updateField('dependant', $event)" />
                            </div>
                            <div class="col-md-4 mb-5">
                                <label class="form-label" for="SocialSecurityRule_Amount">{{ 'Amount' | localize }}</label>
                                <input
                                    id="SocialSecurityRule_Amount"
                                    class="form-control"
                                    type="number"
                                    name="Amount"
                                    [ngModel]="socialSecurityRule().amount"
                                    (ngModelChange)="updateField('amount', $event)" />
                            </div>
                            <div class="col-md-4 mb-5 d-flex align-items-end">
                                <div class="form-check">
                                    <input
                                        id="SocialSecurityRule_Disability"
                                        class="form-check-input"
                                        type="checkbox"
                                        name="Disability"
                                        [ngModel]="socialSecurityRule().disability"
                                        (ngModelChange)="updateField('disability', $event)" />
                                    <label class="form-check-label" for="SocialSecurityRule_Disability">{{ 'Disability' | localize }}</label>
                                </div>
                            </div>
                        </div>
                    </div>
                    <div class="modal-footer">
                        <button [disabled]="saving()" type="button" class="btn btn-light-primary fw-bold" (click)="close()">
                            {{ 'Cancel' | localize }}
                        </button>
                        <button
                            type="submit"
                            class="btn btn-primary fw-bold"
                            [disabled]="!socialSecurityRuleForm.form.valid"
                            [buttonBusy]="saving()"
                            [busyText]="l('SavingWithThreeDot')">
                            <i class="fa fa-save"></i>
                            <span>{{ 'Save' | localize }}</span>
                        </button>
                    </div>
                </form>
            }
        </div>
    </div>
</div>
