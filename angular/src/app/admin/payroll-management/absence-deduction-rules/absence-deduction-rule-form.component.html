<fieldset class="absence-deduction-rule-form" [disabled]="readOnly()">
    <div class="row">
        <div class="col-md-4 mb-5">
            <label class="form-label" for="AbsenceDeductionRule_Code">{{ 'Code' | localize }}</label>
            <input
                id="AbsenceDeductionRule_Code"
                class="form-control"
                type="text"
                name="Code"
                [ngModel]="absenceDeductionRule().code"
                (ngModelChange)="updateField('code', $event)"
                maxlength="50"
                [placeholder]="l('AutoGeneratedIfEmpty')" />
        </div>
        <div class="col-md-8 mb-5">
            <label class="form-label required" for="AbsenceDeductionRule_RuleName">{{ 'RuleName' | localize }}</label>
            <input
                id="AbsenceDeductionRule_RuleName"
                #ruleNameInput="ngModel"
                class="form-control"
                type="text"
                name="RuleName"
                [ngModel]="absenceDeductionRule().ruleName"
                (ngModelChange)="updateField('ruleName', $event)"
                required
                maxlength="200" />
            <validation-messages [formCtrl]="ruleNameInput" />
        </div>
    </div>
</fieldset>
