<div
    appBsModal
    #createOrEditModal="bs-modal"
    (onShown)="onShown()"
    class="modal fade"
    tabindex="-1"
    role="dialog"
    aria-labelledby="createOrEditModal"
    aria-hidden="true"
    [config]="{ backdrop: 'static', keyboard: !saving() }">
    <div class="modal-dialog modal-xl">
        <div class="modal-content">
            @if (active()) {
                <form #employeeSubGroupForm="ngForm" novalidate (ngSubmit)="save()" autocomplete="off">
                    <div class="modal-header">
                        <h4 class="modal-title">
                            @if (record().id) {
                                <span>{{ 'EditItem' | localize }}: {{ 'EmployeeSubGroups' | localize }}</span>
                            } @else {
                                <span>{{ 'CreateNewItem' | localize }}: {{ 'EmployeeSubGroups' | localize }}</span>
                            }
                        </h4>
                        <button
                            type="button"
                            class="btn-close"
                            (click)="close()"
                            [attr.aria-label]="l('Close')"
                            [disabled]="saving()"></button>
                    </div>
                    <div class="modal-body" style="max-height: 75vh; overflow-y: auto">
                        <div class="row">
                            <div class="col-md-4 mb-5">
                                <label class="form-label required" for="EmployeeSubGroup_EmployeeGroupId">{{ 'EmployeeGroup' | localize }}</label>
                                <select
                                    id="EmployeeSubGroup_EmployeeGroupId"
                                    class="form-select"
                                    name="EmployeeGroupId"
                                    required
                                    [ngModel]="record().employeeGroupId"
                                    (ngModelChange)="updateField('employeeGroupId', $event)">
                                    <option [ngValue]="undefined"></option>
                                    @for (group of employeeGroups(); track group.id) {
                                        <option [ngValue]="group.id">{{ group.nameEn }}</option>
                                    }
                                </select>
                            </div>
                            <div class="col-md-4 mb-5">
                                <label class="form-label" for="EmployeeSubGroup_Code">{{ 'Code' | localize }}</label>
                                <input
                                    id="EmployeeSubGroup_Code"
                                    class="form-control"
                                    type="text"
                                    name="Code"
                                    [ngModel]="record().code"
                                    (ngModelChange)="updateField('code', $event)"
                                    maxlength="50"
                                    [placeholder]="l('AutoGeneratedIfEmpty')" />
                            </div>
                            <div class="col-md-4 mb-5">
                                <label class="form-label" for="EmployeeSubGroup_TicketClassId">{{ 'TicketClass' | localize }}</label>
                                <select
                                    id="EmployeeSubGroup_TicketClassId"
                                    class="form-select"
                                    name="TicketClassId"
                                    [ngModel]="record().ticketClassId"
                                    (ngModelChange)="updateField('ticketClassId', $event)">
                                    <option [ngValue]="undefined"></option>
                                    @for (ticketClass of ticketClasses(); track ticketClass.id) {
                                        <option [ngValue]="ticketClass.id">{{ ticketClass.nameEn }}</option>
                                    }
                                </select>
                            </div>
                        </div>
                        <div class="row">
                            <div class="col-md-6 mb-5">
                                <label class="form-label required" for="EmployeeSubGroup_NameEn">{{ 'NameEn' | localize }}</label>
                                <input
                                    id="EmployeeSubGroup_NameEn"
                                    #nameEnInput="ngModel"
                                    class="form-control"
                                    type="text"
                                    name="NameEn"
                                    [ngModel]="record().nameEn"
                                    (ngModelChange)="updateField('nameEn', $event)"
                                    required
                                    maxlength="200" />
                                <validation-messages [formCtrl]="nameEnInput" />
                            </div>
                            <div class="col-md-6 mb-5">
                                <label class="form-label required" for="EmployeeSubGroup_NameAr">{{ 'NameAr' | localize }}</label>
                                <input
                                    id="EmployeeSubGroup_NameAr"
                                    #nameArInput="ngModel"
                                    class="form-control"
                                    type="text"
                                    name="NameAr"
                                    dir="rtl"
                                    [ngModel]="record().nameAr"
                                    (ngModelChange)="updateField('nameAr', $event)"
                                    required
                                    maxlength="200" />
                                <validation-messages [formCtrl]="nameArInput" />
                            </div>
                        </div>

                        <hr />
                        <div class="row">
                            <div class="col-md-3 mb-3 form-check mt-8">
                                <input
                                    type="checkbox"
                                    class="form-check-input"
                                    id="EmployeeSubGroup_PayOvertime"
                                    name="PayOvertime"
                                    [ngModel]="record().payOvertime"
                                    (ngModelChange)="updateField('payOvertime', $event)" />
                                <label class="form-check-label" for="EmployeeSubGroup_PayOvertime">{{ 'PayOvertime' | localize }}</label>
                            </div>
                            <div class="col-md-3 mb-5">
                                <label class="form-label" for="EmployeeSubGroup_AirTicketPayType">{{ 'AirTicketPayType' | localize }}</label>
                                <select
                                    id="EmployeeSubGroup_AirTicketPayType"
                                    class="form-select"
                                    name="AirTicketPayType"
                                    [ngModel]="record().airTicketPayType"
                                    (ngModelChange)="updateField('airTicketPayType', $event)">
                                    @for (type of airTicketPayTypes; track type.value) {
                                        <option [ngValue]="type.value">{{ type.name | localize }}</option>
                                    }
                                </select>
                            </div>
                            <div class="col-md-3 mb-3 form-check mt-8">
                                <input
                                    type="checkbox"
                                    class="form-check-input"
                                    id="EmployeeSubGroup_AutoPayAirTicket"
                                    name="AutoPayAirTicket"
                                    [ngModel]="record().autoPayAirTicket"
                                    (ngModelChange)="updateField('autoPayAirTicket', $event)" />
                                <label class="form-check-label" for="EmployeeSubGroup_AutoPayAirTicket">{{ 'AutoPayAirTicket' | localize }}</label>
                            </div>
                            <div class="col-md-3 mb-5">
                                <label class="form-label" for="EmployeeSubGroup_MaxDependantAirTicketCount">{{ 'MaxDependantAirTicketCount' | localize }}</label>
                                <input
                                    id="EmployeeSubGroup_MaxDependantAirTicketCount"
                                    class="form-control"
                                    type="number"
                                    name="MaxDependantAirTicketCount"
                                    [ngModel]="record().maxDependantAirTicketCount"
                                    (ngModelChange)="updateField('maxDependantAirTicketCount', $event)" />
                            </div>
                        </div>
                        <div class="row">
                            <div class="col-md-3 mb-5">
                                <label class="form-label" for="EmployeeSubGroup_MaxHealthReimburseAmount">{{ 'MaxHealthReimburseAmount' | localize }}</label>
                                <input
                                    id="EmployeeSubGroup_MaxHealthReimburseAmount"
                                    class="form-control"
                                    type="number"
                                    name="MaxHealthReimburseAmount"
                                    [ngModel]="record().maxHealthReimburseAmount"
                                    (ngModelChange)="updateField('maxHealthReimburseAmount', $event)" />
                            </div>
                            <div class="col-md-3 mb-5">
                                <label class="form-label" for="EmployeeSubGroup_HealthInsurancePeriod">{{ 'HealthInsurancePeriod' | localize }}</label>
                                <select
                                    id="EmployeeSubGroup_HealthInsurancePeriod"
                                    class="form-select"
                                    name="HealthInsurancePeriod"
                                    [ngModel]="record().healthInsurancePeriod"
                                    (ngModelChange)="updateField('healthInsurancePeriod', $event)">
                                    @for (month of customStartMonths; track month.value) {
                                        <option [ngValue]="month.value">{{ month.name | localize }}</option>
                                    }
                                </select>
                            </div>
                            <div class="col-md-3 mb-5">
                                <label class="form-label" for="EmployeeSubGroup_MaxDependantHealthReimburseCount">{{ 'MaxDependantHealthReimburseCount' | localize }}</label>
                                <input
                                    id="EmployeeSubGroup_MaxDependantHealthReimburseCount"
                                    class="form-control"
                                    type="number"
                                    name="MaxDependantHealthReimburseCount"
                                    [ngModel]="record().maxDependantHealthReimburseCount"
                                    (ngModelChange)="updateField('maxDependantHealthReimburseCount', $event)" />
                            </div>
                        </div>
                    </div>
                    <div class="modal-footer">
                        <button
                            [disabled]="saving()"
                            type="button"
                            class="btn btn-light-primary fw-bold"
                            (click)="close()">
                            {{ 'Cancel' | localize }}
                        </button>
                        <button
                            type="submit"
                            class="btn btn-primary fw-bold"
                            [disabled]="!employeeSubGroupForm.form.valid"
                            [buttonBusy]="saving()"
                            [busyText]="l('SavingWithThreeDot')">
                            <i class="fa fa-save"></i>
                            <span>{{ 'Save' | localize }}</span>
                        </button>
                    </div>
                </form>
            }
        </div>
    </div>
</div>
