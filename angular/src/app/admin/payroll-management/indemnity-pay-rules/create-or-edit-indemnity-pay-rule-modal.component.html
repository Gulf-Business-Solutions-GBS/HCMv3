<div
    appBsModal
    #createOrEditModal="bs-modal"
    (onShown)="onShown()"
    class="modal fade"
    tabindex="-1"
    role="dialog"
    aria-labelledby="createOrEditModal"
    aria-hidden="true"
    [config]="{ backdrop: 'static', keyboard: !saving() }">
    <div class="modal-dialog modal-lg">
        <div class="modal-content">
            @if (active()) {
                <form #indemnityPayRuleForm="ngForm" novalidate (ngSubmit)="save()" autocomplete="off">
                    <div class="modal-header">
                        <h4 class="modal-title">
                            @if (indemnityPayRule().id) {
                                <span>{{ 'EditItem' | localize }}: {{ 'IndemnityPayRules' | localize }}</span>
                            } @else {
                                <span>{{ 'CreateNewItem' | localize }}: {{ 'IndemnityPayRules' | localize }}</span>
                            }
                        </h4>
                        <button
                            type="button"
                            class="btn-close"
                            (click)="close()"
                            [attr.aria-label]="l('Close')"
                            [disabled]="saving()"></button>
                    </div>
                    <div class="modal-body">
                        <div class="row">
                            <div class="col-md-6 mb-5">
                                <label class="form-label" for="IndemnityPayRule_SeparationType">{{ 'SeparationType' | localize }}</label>
                                <select
                                    id="IndemnityPayRule_SeparationType"
                                    class="form-select"
                                    name="SeparationType"
                                    [ngModel]="indemnityPayRule().separationType"
                                    (ngModelChange)="updateField('separationType', $event)">
                                    @for (item of separationTypes; track item.value) {
                                        <option [ngValue]="item.value">{{ item.name | localize }}</option>
                                    }
                                </select>
                            </div>
                            <div class="col-md-6 mb-5">
                                <label class="form-label" for="IndemnityPayRule_CountryId">{{ 'CountryId' | localize }}</label>
                                <select
                                    id="IndemnityPayRule_CountryId"
                                    class="form-select"
                                    name="CountryId"
                                    [ngModel]="indemnityPayRule().countryId"
                                    (ngModelChange)="updateField('countryId', $event)">
                                    <option [ngValue]="undefined"></option>
                                    @for (country of countries(); track country.id) {
                                        <option [ngValue]="country.id">{{ country.nameEn }}</option>
                                    }
                                </select>
                            </div>
                        </div>
                        <div class="row">
                            <div class="col-md-6 mb-5">
                                <label class="form-label required" for="IndemnityPayRule_StartDate">{{ 'StartDate' | localize }}</label>
                                <input
                                    id="IndemnityPayRule_StartDate"
                                    #startDateInput="ngModel"
                                    type="date"
                                    class="form-control"
                                    name="StartDate"
                                    [ngModel]="indemnityPayRule().startDate?.toISODate()"
                                    (ngModelChange)="updateDateField('startDate', $event)"
                                    required />
                                <validation-messages [formCtrl]="startDateInput" />
                            </div>
                            <div class="col-md-6 mb-5">
                                <label class="form-label required" for="IndemnityPayRule_EndDate">{{ 'EndDate' | localize }}</label>
                                <input
                                    id="IndemnityPayRule_EndDate"
                                    #endDateInput="ngModel"
                                    type="date"
                                    class="form-control"
                                    name="EndDate"
                                    [ngModel]="indemnityPayRule().endDate?.toISODate()"
                                    (ngModelChange)="updateDateField('endDate', $event)"
                                    required />
                                <validation-messages [formCtrl]="endDateInput" />
                            </div>
                        </div>
                        <div class="row">
                            <div class="col-md-4 mb-5">
                                <label class="form-label" for="IndemnityPayRule_MaxNumber">{{ 'MaxNumber' | localize }}</label>
                                <input
                                    id="IndemnityPayRule_MaxNumber"
                                    class="form-control"
                                    type="number"
                                    name="MaxNumber"
                                    [ngModel]="indemnityPayRule().maxNumber"
                                    (ngModelChange)="updateField('maxNumber', $event)" />
                            </div>
                            <div class="col-md-4 mb-5">
                                <label class="form-label" for="IndemnityPayRule_MaxUnit">{{ 'MaxUnit' | localize }}</label>
                                <select
                                    id="IndemnityPayRule_MaxUnit"
                                    class="form-select"
                                    name="MaxUnit"
                                    [ngModel]="indemnityPayRule().maxUnit"
                                    (ngModelChange)="updateField('maxUnit', $event)">
                                    @for (item of units; track item.value) {
                                        <option [ngValue]="item.value">{{ item.name | localize }}</option>
                                    }
                                </select>
                            </div>
                            <div class="col-md-4 mb-5">
                                <label class="form-label" for="IndemnityPayRule_MaxPayPercentage">{{ 'MaxPayPercentage' | localize }}</label>
                                <input
                                    id="IndemnityPayRule_MaxPayPercentage"
                                    class="form-control"
                                    type="number"
                                    name="MaxPayPercentage"
                                    [ngModel]="indemnityPayRule().maxPayPercentage"
                                    (ngModelChange)="updateField('maxPayPercentage', $event)" />
                            </div>
                        </div>
                    </div>
                    <div class="modal-footer">
                        <button [disabled]="saving()" type="button" class="btn btn-light-primary fw-bold" (click)="close()">
                            {{ 'Cancel' | localize }}
                        </button>
                        <button
                            type="submit"
                            class="btn btn-primary fw-bold"
                            [disabled]="!indemnityPayRuleForm.form.valid"
                            [buttonBusy]="saving()"
                            [busyText]="l('SavingWithThreeDot')">
                            <i class="fa fa-save"></i>
                            <span>{{ 'Save' | localize }}</span>
                        </button>
                    </div>
                </form>
            }
        </div>
    </div>
</div>
