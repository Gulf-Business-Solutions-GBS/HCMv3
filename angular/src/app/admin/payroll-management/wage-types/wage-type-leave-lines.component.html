<div class="ps-10 py-2" [busyIf]="loading()">
    <div class="d-flex align-items-center justify-content-between mb-2">
        <span class="fw-bold">{{ 'WageTypeLeaves' | localize }}</span>
        @if ('Pages.PayrollManagement.WageTypeLeaves.Create' | permission) {
            <button type="button" class="btn btn-sm btn-light-primary" (click)="createLine()">
                <i class="fa fa-plus"></i>
                {{ 'Add' | localize }}
            </button>
        }
    </div>
    <p-tieredMenu #lineActionsMenu [model]="activeMenuItems()" [popup]="true" appendTo="body" />
    <table class="table table-sm table-row-bordered align-middle mb-0">
        <thead>
            <tr class="fw-bold text-muted">
                <th
                    style="width: 130px"
                    [hidden]="!(['Pages.PayrollManagement.WageTypeLeaves.Edit', 'Pages.PayrollManagement.WageTypeLeaves.Delete'] | permissionAny)">
                    {{ 'Actions' | localize }}
                </th>
                <th>{{ 'AbsenceTypeId' | localize }}</th>
            </tr>
        </thead>
        <tbody>
            @for (line of lines(); track line.id) {
                <tr>
                    <td
                        style="width: 130px"
                        [hidden]="!(['Pages.PayrollManagement.WageTypeLeaves.Edit', 'Pages.PayrollManagement.WageTypeLeaves.Delete'] | permissionAny)">
                        <button
                            type="button"
                            class="btn btn-primary btn-sm dropdown-toggle"
                            (click)="showMenu($event, line, lineActionsMenu)">
                            <i class="fa fa-cog"></i>
                            {{ 'Actions' | localize }}
                        </button>
                    </td>
                    <td>{{ line.absenceTypeName }}</td>
                </tr>
            } @empty {
                @if (!loading()) {
                    <tr>
                        <td colspan="2" class="text-muted">{{ 'NoData' | localize }}</td>
                    </tr>
                }
            }
        </tbody>
    </table>

    <createOrEditWageTypeLeaveModal #createOrEditLeaveModal (modalSave)="getLines()" />
</div>
