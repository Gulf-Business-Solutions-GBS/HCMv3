<div [@routerTransition]>
    <sub-header [title]="title()" [description]="'WageTypes' | localize">
        <div role="actions">
            <button type="button" class="btn btn-light-primary float-end" (click)="goBack()">
                <i class="fa fa-arrow-left btn-md-icon"></i>
                <span class="d-none d-md-inline-block">
                    {{ 'Back' | localize }}
                </span>
            </button>
        </div>
    </sub-header>

    <div [class]="containerClass">
        <div class="card card-custom mb-5" [busyIf]="loading()">
            <div class="card-body">
                @if (loaded()) {
                    <form #wageTypeForm="ngForm" novalidate (ngSubmit)="save()" autocomplete="off">
                        <wageTypeForm [(wageType)]="wageType" [readOnly]="!canEdit" />
                        @if (canEdit) {
                            <div class="d-flex justify-content-end">
                                <button
                                    type="submit"
                                    class="btn btn-primary fw-bold"
                                    [disabled]="!wageTypeForm.form.valid || saving()"
                                    [buttonBusy]="saving()"
                                    [busyText]="l('SavingWithThreeDot')">
                                    <i class="fa fa-save"></i>
                                    <span>{{ 'Save' | localize }}</span>
                                </button>
                            </div>
                        }
                    </form>
                }
            </div>
        </div>

        @if (wageTypeId(); as id) {
            @if (tabs.length > 0) {
                <div class="card card-custom">
                    <div class="card-body">
                        <ul class="nav wt-detail-tabs mb-5" role="tablist">
                            @for (tab of tabs; track tab.id) {
                                <li class="nav-item" role="presentation">
                                    <button
                                        type="button"
                                        role="tab"
                                        class="wt-detail-tab"
                                        [class.wt-detail-tab-active]="activeTabId() === tab.id"
                                        [attr.aria-selected]="activeTabId() === tab.id"
                                        (click)="selectTab(tab)">
                                        {{ tab.labelKey | localize }}
                                    </button>
                                </li>
                            }
                        </ul>

                        <div role="tabpanel">
                            @switch (activeTabId()) {
                                @case ('leave-types') {
                                    <wageTypeLeavesTab [wageTypeId]="id" />
                                }
                                @case ('security-roles') {
                                    <wageTypeSecurityRolesTab [wageTypeId]="id" />
                                }
                                @case ('exceptions') {
                                    <wageTypeExceptionsTab [wageTypeId]="id" />
                                }
                            }
                        </div>
                    </div>
                </div>
            }
        }
    </div>
</div>
