<div
    appBsModal
    #createOrEditModal="bs-modal"
    (onShown)="onShown()"
    class="modal fade"
    tabindex="-1"
    role="dialog"
    aria-labelledby="createOrEditModal"
    aria-hidden="true"
    [config]="{ backdrop: 'static', keyboard: !saving() }">
    <div class="modal-dialog modal-lg">
        <div class="modal-content">
            @if (active()) {
                <form #wageTypeRegisterForm="ngForm" novalidate (ngSubmit)="save()" autocomplete="off">
                    <div class="modal-header">
                        <h4 class="modal-title">
                            @if (wageTypeRegister().id) {
                                <span>{{ 'EditItem' | localize }}: {{ 'WageTypeRegisters' | localize }}</span>
                            } @else {
                                <span>{{ 'CreateNewItem' | localize }}: {{ 'WageTypeRegisters' | localize }}</span>
                            }
                        </h4>
                        <button
                            type="button"
                            class="btn-close"
                            (click)="close()"
                            [attr.aria-label]="l('Close')"
                            [disabled]="saving()"></button>
                    </div>
                    <div class="modal-body">
                        <div class="row">
                            <div class="col-md-4 mb-5">
                                <label class="form-label" for="WageTypeRegister_EmployeeId">{{ 'EmployeeId' | localize }}</label>
                                <input
                                    id="WageTypeRegister_EmployeeId"
                                    class="form-control"
                                    type="number"
                                    name="EmployeeId"
                                    [ngModel]="wageTypeRegister().employeeId"
                                    (ngModelChange)="updateField('employeeId', $event)" />
                            </div>
                            <div class="col-md-4 mb-5">
                                <label class="form-label required" for="WageTypeRegister_ForPeriod">{{ 'ForPeriod' | localize }}</label>
                                <input
                                    id="WageTypeRegister_ForPeriod"
                                    #forPeriodInput="ngModel"
                                    class="form-control"
                                    type="number"
                                    name="ForPeriod"
                                    required
                                    [ngModel]="wageTypeRegister().forPeriod"
                                    (ngModelChange)="updateField('forPeriod', $event)" />
                                <validation-messages [formCtrl]="forPeriodInput" />
                            </div>
                            <div class="col-md-4 mb-5">
                                <label class="form-label required" for="WageTypeRegister_InPeriod">{{ 'InPeriod' | localize }}</label>
                                <input
                                    id="WageTypeRegister_InPeriod"
                                    #inPeriodInput="ngModel"
                                    class="form-control"
                                    type="number"
                                    name="InPeriod"
                                    required
                                    [ngModel]="wageTypeRegister().inPeriod"
                                    (ngModelChange)="updateField('inPeriod', $event)" />
                                <validation-messages [formCtrl]="inPeriodInput" />
                            </div>
                        </div>
                    </div>
                    <div class="modal-footer">
                        <button [disabled]="saving()" type="button" class="btn btn-light-primary fw-bold" (click)="close()">
                            {{ 'Cancel' | localize }}
                        </button>
                        <button
                            type="submit"
                            class="btn btn-primary fw-bold"
                            [disabled]="!wageTypeRegisterForm.form.valid"
                            [buttonBusy]="saving()"
                            [busyText]="l('SavingWithThreeDot')">
                            <i class="fa fa-save"></i>
                            <span>{{ 'Save' | localize }}</span>
                        </button>
                    </div>
                </form>
            }
        </div>
    </div>
</div>
