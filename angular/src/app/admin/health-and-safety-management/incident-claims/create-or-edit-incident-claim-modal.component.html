<div
    appBsModal
    #createOrEditModal="bs-modal"
    (onShown)="onShown()"
    class="modal fade"
    tabindex="-1"
    role="dialog"
    aria-hidden="true"
    [config]="{ backdrop: 'static', keyboard: !saving() }">
    <div class="modal-dialog modal-lg">
        <div class="modal-content">
            @if (active()) {
                <form #recordForm="ngForm" novalidate (ngSubmit)="save()" autocomplete="off">
                    <div class="modal-header">
                        <h4 class="modal-title">
                            {{ (record().id ? 'EditItem' : 'CreateNewItem') | localize }}: {{ 'IncidentClaims' | localize }}
                        </h4>
                        <button type="button" class="btn-close" (click)="close()" [disabled]="saving()"></button>
                    </div>
                    <div class="modal-body">
                        <div class="row">
                            <div class="col-md-6 mb-5">
                                <label class="form-label required" for="IncidentClaim_ClaimDate">{{ 'ClaimDate' | localize }}</label>
                                <input
                                    id="IncidentClaim_ClaimDate"
                                    #claimDateInput="ngModel"
                                    class="form-control"
                                    type="date"
                                    name="ClaimDate"
                                    [ngModel]="record().claimDate?.toISODate()"
                                    (ngModelChange)="updateDateField('claimDate', $event)"
                                    required />
                                <validation-messages [formCtrl]="claimDateInput" />
                            </div>
                            <div class="col-md-6 mb-5">
                                <label class="form-label required" for="IncidentClaim_IncidentId">{{ 'Incident' | localize }}</label>
                                <select
                                    id="IncidentClaim_IncidentId"
                                    #incidentInput="ngModel"
                                    class="form-select"
                                    name="IncidentId"
                                    [ngModel]="record().incidentId"
                                    (ngModelChange)="updateField('incidentId', $event)"
                                    required>
                                    <option [ngValue]="undefined"></option>
                                    @for (item of incidentRegisters(); track item.id) {
                                        <option [ngValue]="item.id">#{{ item.id }} - {{ item.description }}</option>
                                    }
                                </select>
                                <validation-messages [formCtrl]="incidentInput" />
                            </div>
                        </div>
                        <div class="row">
                            <div class="col-md-4 mb-5">
                                <label class="form-label required" for="IncidentClaim_Amount">{{ 'Amount' | localize }}</label>
                                <input
                                    id="IncidentClaim_Amount"
                                    #amountInput="ngModel"
                                    class="form-control"
                                    type="number"
                                    step="0.01"
                                    name="Amount"
                                    [ngModel]="record().amount"
                                    (ngModelChange)="updateField('amount', $event)"
                                    required />
                                <validation-messages [formCtrl]="amountInput" />
                            </div>
                            <div class="col-md-4 mb-5">
                                <label class="form-label required" for="IncidentClaim_CurrencyId">{{ 'Currency' | localize }}</label>
                                <select
                                    id="IncidentClaim_CurrencyId"
                                    #currencyInput="ngModel"
                                    class="form-select"
                                    name="CurrencyId"
                                    [ngModel]="record().currencyId"
                                    (ngModelChange)="updateField('currencyId', $event)"
                                    required>
                                    <option [ngValue]="undefined"></option>
                                    @for (item of currencies(); track item.id) {
                                        <option [ngValue]="item.id">{{ item.code }} - {{ item.nameEn }}</option>
                                    }
                                </select>
                                <validation-messages [formCtrl]="currencyInput" />
                            </div>
                            <div class="col-md-4 mb-5">
                                <label class="form-label required" for="IncidentClaim_PaymentDate">{{ 'PaymentDate' | localize }}</label>
                                <input
                                    id="IncidentClaim_PaymentDate"
                                    #paymentDateInput="ngModel"
                                    class="form-control"
                                    type="date"
                                    name="PaymentDate"
                                    [ngModel]="record().paymentDate?.toISODate()"
                                    (ngModelChange)="updateDateField('paymentDate', $event)"
                                    required />
                                <validation-messages [formCtrl]="paymentDateInput" />
                            </div>
                        </div>
                        <div class="row">
                            <div class="col-md-6 mb-5">
                                <label class="form-label" for="IncidentClaim_ClaimStatusId">{{ 'ClaimStatus' | localize }}</label>
                                <select
                                    id="IncidentClaim_ClaimStatusId"
                                    class="form-select"
                                    name="ClaimStatusId"
                                    [ngModel]="record().claimStatusId"
                                    (ngModelChange)="updateField('claimStatusId', $event)">
                                    <option [ngValue]="undefined"></option>
                                    @for (item of claimStatuses(); track item.id) {
                                        <option [ngValue]="item.id">{{ item.nameEn }}</option>
                                    }
                                </select>
                            </div>
                        </div>
                        <div class="row">
                            <div class="col-md-12 mb-5">
                                <label class="form-label" for="IncidentClaim_Comments">{{ 'Comments' | localize }}</label>
                                <textarea
                                    id="IncidentClaim_Comments"
                                    class="form-control"
                                    name="Comments"
                                    rows="3"
                                    [ngModel]="record().comments"
                                    (ngModelChange)="updateField('comments', $event)"
                                    maxlength="1000"></textarea>
                            </div>
                        </div>
                    </div>
                    <div class="modal-footer">
                        <button type="button" class="btn btn-secondary" (click)="close()" [disabled]="saving()">
                            {{ 'Cancel' | localize }}
                        </button>
                        <button type="submit" class="btn btn-primary" [buttonBusy]="saving()" [disabled]="!recordForm.form.valid || saving()">
                            <i class="fa fa-save"></i>
                            {{ 'Save' | localize }}
                        </button>
                    </div>
                </form>
            }
        </div>
    </div>
</div>
