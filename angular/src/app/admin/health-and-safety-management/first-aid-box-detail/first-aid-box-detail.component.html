<div [@routerTransition]>
    <sub-header [title]="'FirstAidBoxes' | localize" [description]="'HealthAndSafetyManagement' | localize" />
    <div [class]="containerClass">
        <div class="card card-custom gutter-b">
            <div class="card-header align-items-center border-0">
                <h3 class="card-title align-items-start flex-column">
                    <span class="fw-bolder text-gray-900">
                        @if (firstAidBox()) {
                            <span>{{ firstAidBox().code }}</span>
                        }
                    </span>
                </h3>
            </div>
            <div class="card-body">
                @if (firstAidBoxId()) {
                    <tabset class="tab-container">
                        <tab heading="{{ 'FirstAidBoxDetails' | localize }}" [active]="true">
                            <first-aid-box-details [firstAidBoxId]="firstAidBoxId()" />
                        </tab>
                    </tabset>
                }
            </div>
        </div>
    </div>
</div>
