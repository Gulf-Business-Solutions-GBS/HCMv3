<div
    appBsModal
    #createOrEditModal="bs-modal"
    (onShown)="onShown()"
    class="modal fade"
    tabindex="-1"
    role="dialog"
    aria-hidden="true"
    [config]="{ backdrop: 'static', keyboard: !saving() }">
    <div class="modal-dialog modal-lg">
        <div class="modal-content">
            @if (active()) {
                <form #recordForm="ngForm" novalidate (ngSubmit)="save()" autocomplete="off">
                    <div class="modal-header">
                        <h4 class="modal-title">
                            {{ (record().id ? 'EditItem' : 'CreateNewItem') | localize }}: {{ 'SafetyChecklists' | localize }}
                        </h4>
                        <button type="button" class="btn-close" (click)="close()" [disabled]="saving()"></button>
                    </div>
                    <div class="modal-body">
                        <div class="row">
                            <div class="col-md-4 mb-5">
                                <label class="form-label" for="SafetyChecklist_Code">{{ 'Code' | localize }}</label>
                                <input
                                    id="SafetyChecklist_Code"
                                    class="form-control"
                                    type="text"
                                    name="Code"
                                    [ngModel]="record().code"
                                    (ngModelChange)="updateField('code', $event)"
                                    maxlength="50"
                                    [placeholder]="l('AutoGeneratedIfEmpty')" />
                            </div>
                            <div class="col-md-5 mb-5">
                                <label class="form-label required" for="SafetyChecklist_SafetyAreaAssetId">{{ 'SafetyAreaAsset' | localize }}</label>
                                <select
                                    id="SafetyChecklist_SafetyAreaAssetId"
                                    #safetyAreaAssetInput="ngModel"
                                    class="form-select"
                                    name="SafetyAreaAssetId"
                                    [ngModel]="record().safetyAreaAssetId"
                                    (ngModelChange)="updateField('safetyAreaAssetId', $event)"
                                    required>
                                    <option [ngValue]="undefined"></option>
                                    @for (item of safetyAreaAssets(); track item.id) {
                                        <option [ngValue]="item.id">{{ item.nameEn }}</option>
                                    }
                                </select>
                                <validation-messages [formCtrl]="safetyAreaAssetInput" />
                            </div>
                            <div class="col-md-3 mb-5 d-flex align-items-end">
                                <div class="form-check form-switch">
                                    <input
                                        id="SafetyChecklist_IsActive"
                                        class="form-check-input"
                                        type="checkbox"
                                        name="IsActive"
                                        [ngModel]="record().isActive"
                                        (ngModelChange)="updateField('isActive', $event)" />
                                    <label class="form-check-label" for="SafetyChecklist_IsActive">{{ 'IsActive' | localize }}</label>
                                </div>
                            </div>
                        </div>
                        <div class="row">
                            <div class="col-md-12 mb-5">
                                <label class="form-label" for="SafetyChecklist_Description">{{ 'Description' | localize }}</label>
                                <textarea
                                    id="SafetyChecklist_Description"
                                    class="form-control"
                                    name="Description"
                                    rows="3"
                                    [ngModel]="record().description"
                                    (ngModelChange)="updateField('description', $event)"
                                    maxlength="1000"></textarea>
                            </div>
                        </div>
                    </div>
                    <div class="modal-footer">
                        <button type="button" class="btn btn-secondary" (click)="close()" [disabled]="saving()">
                            {{ 'Cancel' | localize }}
                        </button>
                        <button type="submit" class="btn btn-primary" [buttonBusy]="saving()" [disabled]="!recordForm.form.valid || saving()">
                            <i class="fa fa-save"></i>
                            {{ 'Save' | localize }}
                        </button>
                    </div>
                </form>
            }
        </div>
    </div>
</div>
