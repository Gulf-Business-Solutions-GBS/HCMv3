<div
    appBsModal
    #createOrEditModal="bs-modal"
    (onShown)="onShown()"
    class="modal fade"
    tabindex="-1"
    role="dialog"
    aria-hidden="true"
    [config]="{ backdrop: 'static', keyboard: !saving() }">
    <div class="modal-dialog modal-lg">
        <div class="modal-content">
            @if (active()) {
                <form #recordForm="ngForm" novalidate (ngSubmit)="save()" autocomplete="off">
                    <div class="modal-header">
                        <h4 class="modal-title">
                            {{ (record().id ? 'EditItem' : 'CreateNewItem') | localize }}: {{ 'FirstAidBoxes' | localize }}
                        </h4>
                        <button type="button" class="btn-close" (click)="close()" [disabled]="saving()"></button>
                    </div>
                    <div class="modal-body">
                        <div class="row">
                            <div class="col-md-4 mb-5">
                                <label class="form-label" for="FirstAidBox_Code">{{ 'Code' | localize }}</label>
                                <input
                                    id="FirstAidBox_Code"
                                    class="form-control"
                                    type="text"
                                    name="Code"
                                    [ngModel]="record().code"
                                    (ngModelChange)="updateField('code', $event)"
                                    maxlength="50"
                                    [placeholder]="l('AutoGeneratedIfEmpty')" />
                            </div>
                            <div class="col-md-4 mb-5">
                                <label class="form-label required" for="FirstAidBox_LocationId">{{ 'Location' | localize }}</label>
                                <select
                                    id="FirstAidBox_LocationId"
                                    #locationInput="ngModel"
                                    class="form-select"
                                    name="LocationId"
                                    [ngModel]="record().locationId"
                                    (ngModelChange)="updateField('locationId', $event)"
                                    required>
                                    <option [ngValue]="undefined"></option>
                                    @for (item of locations(); track item.id) {
                                        <option [ngValue]="item.id">{{ item.nameEn }}</option>
                                    }
                                </select>
                                <validation-messages [formCtrl]="locationInput" />
                            </div>
                            <div class="col-md-4 mb-5">
                                <label class="form-label required" for="FirstAidBox_AllocationDate">{{ 'AllocationDate' | localize }}</label>
                                <input
                                    id="FirstAidBox_AllocationDate"
                                    #allocationDateInput="ngModel"
                                    class="form-control"
                                    type="date"
                                    name="AllocationDate"
                                    [ngModel]="record().allocationDate?.toISODate()"
                                    (ngModelChange)="updateDateField('allocationDate', $event)"
                                    required />
                                <validation-messages [formCtrl]="allocationDateInput" />
                            </div>
                        </div>
                        <div class="row">
                            <div class="col-md-6 mb-5">
                                <label class="form-label required" for="FirstAidBox_ResponsiblePersonId">{{ 'ResponsiblePerson' | localize }}</label>
                                <select
                                    id="FirstAidBox_ResponsiblePersonId"
                                    #responsiblePersonInput="ngModel"
                                    class="form-select"
                                    name="ResponsiblePersonId"
                                    [ngModel]="record().responsiblePersonId"
                                    (ngModelChange)="updateField('responsiblePersonId', $event)"
                                    required>
                                    <option [ngValue]="undefined"></option>
                                    @for (item of employees(); track item.id) {
                                        <option [ngValue]="item.id">{{ item.code }} - {{ item.fullNameEn }}</option>
                                    }
                                </select>
                                <validation-messages [formCtrl]="responsiblePersonInput" />
                            </div>
                        </div>
                        <div class="row">
                            <div class="col-md-12 mb-5">
                                <label class="form-label" for="FirstAidBox_Comments">{{ 'Comments' | localize }}</label>
                                <textarea
                                    id="FirstAidBox_Comments"
                                    class="form-control"
                                    name="Comments"
                                    rows="3"
                                    [ngModel]="record().comments"
                                    (ngModelChange)="updateField('comments', $event)"
                                    maxlength="1000"></textarea>
                            </div>
                        </div>
                    </div>
                    <div class="modal-footer">
                        <button type="button" class="btn btn-secondary" (click)="close()" [disabled]="saving()">
                            {{ 'Cancel' | localize }}
                        </button>
                        <button type="submit" class="btn btn-primary" [buttonBusy]="saving()" [disabled]="!recordForm.form.valid || saving()">
                            <i class="fa fa-save"></i>
                            {{ 'Save' | localize }}
                        </button>
                    </div>
                </form>
            }
        </div>
    </div>
</div>
