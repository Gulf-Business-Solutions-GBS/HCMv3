<div
    appBsModal
    #createOrEditModal="bs-modal"
    (onShown)="onShown()"
    class="modal fade"
    tabindex="-1"
    role="dialog"
    aria-hidden="true"
    [config]="{ backdrop: 'static', keyboard: !saving() }">
    <div class="modal-dialog modal-lg">
        <div class="modal-content">
            @if (active()) {
                <form #recordForm="ngForm" novalidate (ngSubmit)="save()" autocomplete="off">
                    <div class="modal-header">
                        <h4 class="modal-title">
                            @if (record().id) {
                                <span>{{ 'EditItem' | localize }}: {{ 'ReportInfos' | localize }}</span>
                            } @else {
                                <span>{{ 'CreateNewItem' | localize }}: {{ 'ReportInfos' | localize }}</span>
                            }
                        </h4>
                        <button type="button" class="btn-close" (click)="close()" [disabled]="saving()"></button>
                    </div>
                    <div class="modal-body">
                        <div class="row">
                            <div class="col-md-6 mb-5">
                                <label class="form-label required" for="ReportInfo_ReportName">{{ 'ReportName' | localize }}</label>
                                <input
                                    id="ReportInfo_ReportName"
                                    #reportNameInput="ngModel"
                                    class="form-control"
                                    type="text"
                                    name="ReportName"
                                    [ngModel]="record().reportName"
                                    (ngModelChange)="updateField('reportName', $event)"
                                    required
                                    maxlength="200" />
                                <validation-messages [formCtrl]="reportNameInput" />
                            </div>
                            <div class="col-md-3 mb-5">
                                <label class="form-label required" for="ReportInfo_ReportTypeId">{{ 'ReportType' | localize }}</label>
                                <select
                                    id="ReportInfo_ReportTypeId"
                                    #reportTypeIdInput="ngModel"
                                    class="form-select"
                                    name="ReportTypeId"
                                    [ngModel]="record().reportTypeId"
                                    (ngModelChange)="updateField('reportTypeId', $event)"
                                    required>
                                    <option [ngValue]="undefined"></option>
                                    @for (item of reportTypes(); track item.id) {
                                        <option [ngValue]="item.id">{{ item.nameEn }}</option>
                                    }
                                </select>
                                <validation-messages [formCtrl]="reportTypeIdInput" />
                            </div>
                            <div class="col-md-3 mb-5">
                                <label class="form-label required" for="ReportInfo_DomainTypeId">{{ 'DomainType' | localize }}</label>
                                <select
                                    id="ReportInfo_DomainTypeId"
                                    #domainTypeIdInput="ngModel"
                                    class="form-select"
                                    name="DomainTypeId"
                                    [ngModel]="record().domainTypeId"
                                    (ngModelChange)="updateField('domainTypeId', $event)"
                                    required>
                                    <option [ngValue]="undefined"></option>
                                    @for (item of domainTypes(); track item.id) {
                                        <option [ngValue]="item.id">{{ item.nameEn }}</option>
                                    }
                                </select>
                                <validation-messages [formCtrl]="domainTypeIdInput" />
                            </div>
                        </div>
                        <div class="row">
                            <div class="col-md-12 mb-5">
                                <label class="form-label" for="ReportInfo_Description">{{ 'Description' | localize }}</label>
                                <textarea
                                    id="ReportInfo_Description"
                                    class="form-control"
                                    rows="2"
                                    name="Description"
                                    [ngModel]="record().description"
                                    (ngModelChange)="updateField('description', $event)"
                                    maxlength="1000"></textarea>
                            </div>
                        </div>
                        <div class="row">
                            <div class="col-md-9 mb-5">
                                <label class="form-label" for="ReportInfo_ReportQuery">{{ 'ReportQuery' | localize }}</label>
                                <textarea
                                    id="ReportInfo_ReportQuery"
                                    class="form-control"
                                    rows="4"
                                    name="ReportQuery"
                                    [ngModel]="record().reportQuery"
                                    (ngModelChange)="updateField('reportQuery', $event)"></textarea>
                            </div>
                            <div class="col-md-3 mb-5 d-flex align-items-end">
                                <div class="form-check">
                                    <input
                                        id="ReportInfo_IsActive"
                                        class="form-check-input"
                                        type="checkbox"
                                        name="IsActive"
                                        [ngModel]="record().isActive"
                                        (ngModelChange)="updateField('isActive', $event)" />
                                    <label class="form-check-label" for="ReportInfo_IsActive">{{ 'IsActive' | localize }}</label>
                                </div>
                            </div>
                        </div>
                    </div>
                    <div class="modal-footer">
                        <button [disabled]="saving()" type="button" class="btn btn-light-primary fw-bold" (click)="close()">
                            {{ 'Cancel' | localize }}
                        </button>
                        <button
                            type="submit"
                            class="btn btn-primary fw-bold"
                            [disabled]="!recordForm.form.valid"
                            [buttonBusy]="saving()"
                            [busyText]="l('SavingWithThreeDot')">
                            <i class="fa fa-save"></i>
                            <span>{{ 'Save' | localize }}</span>
                        </button>
                    </div>
                </form>
            }
        </div>
    </div>
</div>
