<div [@routerTransition]>
    <sub-header [title]="'PrintReportPermissions' | localize" [description]="'ReportManagement' | localize">
        <div role="actions">
            @if ('Pages.ReportManagement.PrintReportPermissions.Create' | permission) {
                <button (click)="createPrintReportPermission()" class="btn btn-primary float-end">
                    <i class="fa fa-plus btn-md-icon"></i>
                    <span class="d-none d-md-inline-block">
                        {{ 'CreateNew' | localize }}
                    </span>
                </button>
            }
        </div>
    </sub-header>

    <div [class]="containerClass">
        <div class="card card-custom">
            <div class="card-body">
                <div class="row align-items-center">
                    <!--<Primeng-TurboTable-Start>-->
                    <p-tieredMenu #actionsMenu [model]="activeMenuItems()" [popup]="true" appendTo="body" />
                    <div class="primeng-datatable-container" [busyIf]="primengTableHelper.isLoading()">
                        <p-table
                            #dataTable
                            sortMode="multiple"
                            (onLazyLoad)="getPrintReportPermissions($event)"
                            [value]="primengTableHelper.records()"
                            rows="{{ primengTableHelper.defaultRecordsCountPerPage }}"
                            [paginator]="false"
                            [lazy]="true"
                            [scrollable]="true"
                            scrollDirection="horizontal"
                            [tableStyle]="{ 'min-width': '50rem' }"
                            [resizableColumns]="primengTableHelper.resizableColumns">
                            <ng-template #header>
                                <tr>
                                    <th
                                        style="width: 130px"
                                        [hidden]="
                                            !(
                                                [
                                                    'Pages.ReportManagement.PrintReportPermissions.Edit',
                                                    'Pages.ReportManagement.PrintReportPermissions.Delete',
                                                ] | permissionAny
                                            )
                                        ">
                                        {{ 'Actions' | localize }}
                                    </th>
                                    <th style="min-width: 120px" pSortableColumn="code">
                                        {{ 'Code' | localize }}
                                        <p-sortIcon field="code" />
                                    </th>
                                    <th style="min-width: 200px">
                                        {{ 'Role' | localize }}
                                    </th>
                                </tr>
                            </ng-template>
                            <ng-template #body let-record="$implicit">
                                <tr>
                                    <td
                                        style="width: 130px"
                                        [hidden]="
                                            !(
                                                [
                                                    'Pages.ReportManagement.PrintReportPermissions.Edit',
                                                    'Pages.ReportManagement.PrintReportPermissions.Delete',
                                                ] | permissionAny
                                            )
                                        ">
                                        <button
                                            type="button"
                                            class="btn btn-primary btn-sm dropdown-toggle"
                                            (click)="showMenu($event, record, actionsMenu)">
                                            <i class="fa fa-cog"></i>
                                            {{ 'Actions' | localize }}
                                        </button>
                                    </td>
                                    <td style="min-width: 120px">{{ record.code }}</td>
                                    <td style="min-width: 200px">{{ record.roleName }}</td>
                                </tr>
                            </ng-template>
                        </p-table>
                        @if (primengTableHelper.totalRecordsCount() == 0) {
                            <div class="primeng-no-data">
                                {{ 'NoData' | localize }}
                            </div>
                        }
                        <div class="primeng-paging-container">
                            <p-paginator
                                [rows]="primengTableHelper.defaultRecordsCountPerPage"
                                #paginator
                                (onPageChange)="getPrintReportPermissions($event)"
                                [totalRecords]="primengTableHelper.totalRecordsCount()"
                                [rowsPerPageOptions]="primengTableHelper.predefinedRecordsCountPerPage"
                                [showCurrentPageReport]="true"
                                [currentPageReportTemplate]="
                                    'TotalRecordsCount' | localize: primengTableHelper.totalRecordsCount()
                                " />
                        </div>
                    </div>
                    <!--<Primeng-TurboTable-End>-->
                </div>
            </div>
        </div>
    </div>

    <createOrEditPrintReportPermissionModal #createOrEditModal (modalSave)="reloadPage()" />
</div>
