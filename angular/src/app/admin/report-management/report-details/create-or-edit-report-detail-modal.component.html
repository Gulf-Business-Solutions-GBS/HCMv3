<div
    appBsModal
    #createOrEditModal="bs-modal"
    (onShown)="onShown()"
    class="modal fade"
    tabindex="-1"
    role="dialog"
    aria-hidden="true"
    [config]="{ backdrop: 'static', keyboard: !saving() }">
    <div class="modal-dialog modal-lg">
        <div class="modal-content">
            @if (active()) {
                <form #recordForm="ngForm" novalidate (ngSubmit)="save()" autocomplete="off">
                    <div class="modal-header">
                        <h4 class="modal-title">
                            @if (record().id) {
                                <span>{{ 'EditItem' | localize }}: {{ 'ReportDetails' | localize }}</span>
                            } @else {
                                <span>{{ 'CreateNewItem' | localize }}: {{ 'ReportDetails' | localize }}</span>
                            }
                        </h4>
                        <button type="button" class="btn-close" (click)="close()" [disabled]="saving()"></button>
                    </div>
                    <div class="modal-body">
                        <div class="row">
                            <div class="col-md-6 mb-5">
                                <label class="form-label required" for="ReportDetail_ReportMasterId">{{ 'ReportMaster' | localize }}</label>
                                <select
                                    id="ReportDetail_ReportMasterId"
                                    #reportMasterIdInput="ngModel"
                                    class="form-select"
                                    name="ReportMasterId"
                                    [ngModel]="record().reportMasterId"
                                    (ngModelChange)="updateField('reportMasterId', $event)"
                                    required>
                                    <option [ngValue]="undefined"></option>
                                    @for (item of reportMasters(); track item.id) {
                                        <option [ngValue]="item.id">{{ item.nameEn }}</option>
                                    }
                                </select>
                                <validation-messages [formCtrl]="reportMasterIdInput" />
                            </div>
                            <div class="col-md-6 mb-5">
                                <label class="form-label" for="ReportDetail_ReportSettingId">{{ 'ReportSetting' | localize }}</label>
                                <select
                                    id="ReportDetail_ReportSettingId"
                                    class="form-select"
                                    name="ReportSettingId"
                                    [ngModel]="record().reportSettingId"
                                    (ngModelChange)="updateField('reportSettingId', $event)">
                                    <option [ngValue]="undefined"></option>
                                    @for (item of reportSettings(); track item.id) {
                                        <option [ngValue]="item.id">{{ item.nameEn }}</option>
                                    }
                                </select>
                            </div>
                        </div>
                        <div class="row">
                            <div class="col-md-4 mb-5">
                                <label class="form-label required" for="ReportDetail_DrillDownLevel">{{ 'DrillDownLevel' | localize }}</label>
                                <input
                                    id="ReportDetail_DrillDownLevel"
                                    #drillDownLevelInput="ngModel"
                                    class="form-control"
                                    type="number"
                                    name="DrillDownLevel"
                                    [ngModel]="record().drillDownLevel"
                                    (ngModelChange)="updateField('drillDownLevel', $event)"
                                    required />
                                <validation-messages [formCtrl]="drillDownLevelInput" />
                            </div>
                        </div>
                    </div>
                    <div class="modal-footer">
                        <button [disabled]="saving()" type="button" class="btn btn-light-primary fw-bold" (click)="close()">
                            {{ 'Cancel' | localize }}
                        </button>
                        <button
                            type="submit"
                            class="btn btn-primary fw-bold"
                            [disabled]="!recordForm.form.valid"
                            [buttonBusy]="saving()"
                            [busyText]="l('SavingWithThreeDot')">
                            <i class="fa fa-save"></i>
                            <span>{{ 'Save' | localize }}</span>
                        </button>
                    </div>
                </form>
            }
        </div>
    </div>
</div>
