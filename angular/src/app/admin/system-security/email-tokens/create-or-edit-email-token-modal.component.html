<div
    appBsModal
    #createOrEditModal="bs-modal"
    (onShown)="onShown()"
    class="modal fade"
    tabindex="-1"
    role="dialog"
    aria-labelledby="createOrEditModal"
    aria-hidden="true"
    [config]="{ backdrop: 'static', keyboard: !saving() }">
    <div class="modal-dialog modal-lg">
        <div class="modal-content">
            @if (active()) {
                <form #recordForm="ngForm" novalidate (ngSubmit)="save()" autocomplete="off">
                    <div class="modal-header">
                        <h4 class="modal-title">
                            @if (record().id) {
                                <span>{{ 'EditItem' | localize }}: {{ 'EmailTokens' | localize }}</span>
                            } @else {
                                <span>{{ 'CreateNewItem' | localize }}: {{ 'EmailTokens' | localize }}</span>
                            }
                        </h4>
                        <button
                            type="button"
                            class="btn-close"
                            (click)="close()"
                            [attr.aria-label]="l('Close')"
                            [disabled]="saving()"></button>
                    </div>
                    <div class="modal-body">
                        <div class="row">
                            <div class="col-md-6 mb-5">
                                <label class="form-label required" for="EmailToken_TokenName">{{ 'TokenName' | localize }}</label>
                                <input
                                    id="EmailToken_TokenName"
                                    #tokenNameInput="ngModel"
                                    class="form-control"
                                    type="text"
                                    name="TokenName"
                                    [ngModel]="record().tokenName"
                                    (ngModelChange)="updateField('tokenName', $event)"
                                    required
                                    maxlength="256" />
                                <validation-messages [formCtrl]="tokenNameInput" />
                            </div>
                            <div class="col-md-6 mb-5">
                                <label class="form-label" for="EmailToken_TokenValue">{{ 'TokenValue' | localize }}</label>
                                <input
                                    id="EmailToken_TokenValue"
                                    class="form-control"
                                    type="text"
                                    name="TokenValue"
                                    [ngModel]="record().tokenValue"
                                    (ngModelChange)="updateField('tokenValue', $event)" />
                            </div>
                        </div>
                        <div class="row">
                            <div class="col-md-6 mb-5">
                                <label class="form-label required" for="EmailToken_EmailTemplateId">{{ 'EmailTemplate' | localize }}</label>
                                <select
                                    id="EmailToken_EmailTemplateId"
                                    #emailTemplateIdInput="ngModel"
                                    class="form-select"
                                    name="EmailTemplateId"
                                    [ngModel]="record().emailTemplateId"
                                    (ngModelChange)="updateField('emailTemplateId', $event)"
                                    required>
                                    <option [ngValue]="undefined"></option>
                                    @for (item of emailTemplates(); track item.id) {
                                        <option [ngValue]="item.id">{{ item.nameEn }}</option>
                                    }
                                </select>
                                <validation-messages [formCtrl]="emailTemplateIdInput" />
                            </div>
                        </div>
                        <div class="row">
                            <div class="col-md-6 mb-5 form-check form-switch mt-8">
                                <input
                                    id="EmailToken_IsDateTimeType"
                                    class="form-check-input"
                                    type="checkbox"
                                    name="IsDateTimeType"
                                    [ngModel]="record().isDateTimeType"
                                    (ngModelChange)="updateField('isDateTimeType', $event)" />
                                <label class="form-check-label" for="EmailToken_IsDateTimeType">{{ 'IsDateTimeType' | localize }}</label>
                            </div>
                            <div class="col-md-6 mb-5 form-check form-switch mt-8">
                                <input
                                    id="EmailToken_ObjectKey"
                                    class="form-check-input"
                                    type="checkbox"
                                    name="ObjectKey"
                                    [ngModel]="record().objectKey"
                                    (ngModelChange)="updateField('objectKey', $event)" />
                                <label class="form-check-label" for="EmailToken_ObjectKey">{{ 'ObjectKey' | localize }}</label>
                            </div>
                        </div>
                    </div>
                    <div class="modal-footer">
                        <button [disabled]="saving()" type="button" class="btn btn-light-primary fw-bold" (click)="close()">
                            {{ 'Cancel' | localize }}
                        </button>
                        <button
                            type="submit"
                            class="btn btn-primary fw-bold"
                            [disabled]="!recordForm.form.valid"
                            [buttonBusy]="saving()"
                            [busyText]="l('SavingWithThreeDot')">
                            <i class="fa fa-save"></i>
                            <span>{{ 'Save' | localize }}</span>
                        </button>
                    </div>
                </form>
            }
        </div>
    </div>
</div>
