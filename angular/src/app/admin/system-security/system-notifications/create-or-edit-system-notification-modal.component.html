<div
    appBsModal
    #createOrEditModal="bs-modal"
    (onShown)="onShown()"
    class="modal fade"
    tabindex="-1"
    role="dialog"
    aria-labelledby="createOrEditModal"
    aria-hidden="true"
    [config]="{ backdrop: 'static', keyboard: !saving() }">
    <div class="modal-dialog modal-lg">
        <div class="modal-content">
            @if (active()) {
                <form #recordForm="ngForm" novalidate (ngSubmit)="save()" autocomplete="off">
                    <div class="modal-header">
                        <h4 class="modal-title">
                            @if (record().id) {
                                <span>{{ 'EditItem' | localize }}: {{ 'SystemNotifications' | localize }}</span>
                            } @else {
                                <span>{{ 'CreateNewItem' | localize }}: {{ 'SystemNotifications' | localize }}</span>
                            }
                        </h4>
                        <button
                            type="button"
                            class="btn-close"
                            (click)="close()"
                            [attr.aria-label]="l('Close')"
                            [disabled]="saving()"></button>
                    </div>
                    <div class="modal-body">
                        <div class="row">
                            <div class="col-md-6 mb-5">
                                <label class="form-label required" for="SystemNotification_NotificationName">{{ 'NotificationName' | localize }}</label>
                                <input
                                    id="SystemNotification_NotificationName"
                                    #notificationNameInput="ngModel"
                                    class="form-control"
                                    type="text"
                                    name="NotificationName"
                                    [ngModel]="record().notificationName"
                                    (ngModelChange)="updateField('notificationName', $event)"
                                    required
                                    maxlength="256" />
                                <validation-messages [formCtrl]="notificationNameInput" />
                            </div>
                            <div class="col-md-6 mb-5">
                                <label class="form-label required" for="SystemNotification_NotificationConfigId">{{ 'NotificationConfig' | localize }}</label>
                                <select
                                    id="SystemNotification_NotificationConfigId"
                                    #notificationConfigIdInput="ngModel"
                                    class="form-select"
                                    name="NotificationConfigId"
                                    [ngModel]="record().notificationConfigId"
                                    (ngModelChange)="updateField('notificationConfigId', $event)"
                                    required>
                                    <option [ngValue]="undefined"></option>
                                    @for (item of notificationConfigs(); track item.id) {
                                        <option [ngValue]="item.id">{{ item.name }}</option>
                                    }
                                </select>
                                <validation-messages [formCtrl]="notificationConfigIdInput" />
                            </div>
                        </div>
                        <div class="row">
                            <div class="col-md-6 mb-5">
                                <label class="form-label required" for="SystemNotification_ReminderDays">{{ 'ReminderDays' | localize }}</label>
                                <input
                                    id="SystemNotification_ReminderDays"
                                    #reminderDaysInput="ngModel"
                                    type="number"
                                    class="form-control"
                                    name="ReminderDays"
                                    [ngModel]="record().reminderDays"
                                    (ngModelChange)="updateField('reminderDays', $event)"
                                    required />
                                <validation-messages [formCtrl]="reminderDaysInput" />
                            </div>
                            <div class="col-md-6 mb-5 form-check form-switch mt-8">
                                <input
                                    id="SystemNotification_IsActive"
                                    class="form-check-input"
                                    type="checkbox"
                                    name="IsActive"
                                    [ngModel]="record().isActive"
                                    (ngModelChange)="updateField('isActive', $event)" />
                                <label class="form-check-label" for="SystemNotification_IsActive">{{ 'IsActive' | localize }}</label>
                            </div>
                        </div>
                    </div>
                    <div class="modal-footer">
                        <button [disabled]="saving()" type="button" class="btn btn-light-primary fw-bold" (click)="close()">
                            {{ 'Cancel' | localize }}
                        </button>
                        <button
                            type="submit"
                            class="btn btn-primary fw-bold"
                            [disabled]="!recordForm.form.valid"
                            [buttonBusy]="saving()"
                            [busyText]="l('SavingWithThreeDot')">
                            <i class="fa fa-save"></i>
                            <span>{{ 'Save' | localize }}</span>
                        </button>
                    </div>
                </form>
            }
        </div>
    </div>
</div>
