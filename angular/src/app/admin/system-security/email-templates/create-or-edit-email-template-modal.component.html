<div
    appBsModal
    #createOrEditModal="bs-modal"
    (onShown)="onShown()"
    class="modal fade"
    tabindex="-1"
    role="dialog"
    aria-labelledby="createOrEditModal"
    aria-hidden="true"
    [config]="{ backdrop: 'static', keyboard: !saving() }">
    <div class="modal-dialog modal-lg">
        <div class="modal-content">
            @if (active()) {
                <form #recordForm="ngForm" novalidate (ngSubmit)="save()" autocomplete="off">
                    <div class="modal-header">
                        <h4 class="modal-title">
                            @if (record().id) {
                                <span>{{ 'EditItem' | localize }}: {{ 'EmailTemplates' | localize }}</span>
                            } @else {
                                <span>{{ 'CreateNewItem' | localize }}: {{ 'EmailTemplates' | localize }}</span>
                            }
                        </h4>
                        <button
                            type="button"
                            class="btn-close"
                            (click)="close()"
                            [attr.aria-label]="l('Close')"
                            [disabled]="saving()"></button>
                    </div>
                    <div class="modal-body">
                        <div class="row">
                            <div class="col-md-4 mb-5">
                                <label class="form-label" for="EmailTemplate_Code">{{ 'Code' | localize }}</label>
                                <input
                                    id="EmailTemplate_Code"
                                    class="form-control"
                                    type="text"
                                    name="Code"
                                    [ngModel]="record().code"
                                    (ngModelChange)="updateField('code', $event)"
                                    maxlength="50"
                                    [placeholder]="l('AutoGeneratedIfEmpty')" />
                            </div>
                            <div class="col-md-4 mb-5">
                                <label class="form-label required" for="EmailTemplate_NameEn">{{ 'NameEn' | localize }}</label>
                                <input
                                    id="EmailTemplate_NameEn"
                                    #nameEnInput="ngModel"
                                    class="form-control"
                                    type="text"
                                    name="NameEn"
                                    [ngModel]="record().nameEn"
                                    (ngModelChange)="updateField('nameEn', $event)"
                                    required
                                    maxlength="256" />
                                <validation-messages [formCtrl]="nameEnInput" />
                            </div>
                            <div class="col-md-4 mb-5">
                                <label class="form-label required" for="EmailTemplate_NameAr">{{ 'NameAr' | localize }}</label>
                                <input
                                    id="EmailTemplate_NameAr"
                                    #nameArInput="ngModel"
                                    class="form-control"
                                    type="text"
                                    name="NameAr"
                                    [ngModel]="record().nameAr"
                                    (ngModelChange)="updateField('nameAr', $event)"
                                    required
                                    maxlength="256" />
                                <validation-messages [formCtrl]="nameArInput" />
                            </div>
                        </div>
                        <div class="row">
                            <div class="col-md-6 mb-5">
                                <label class="form-label" for="EmailTemplate_SmtpProfile">{{ 'SmtpProfile' | localize }}</label>
                                <input
                                    id="EmailTemplate_SmtpProfile"
                                    class="form-control"
                                    type="text"
                                    name="SmtpProfile"
                                    [ngModel]="record().smtpProfile"
                                    (ngModelChange)="updateField('smtpProfile', $event)" />
                            </div>
                            <div class="col-md-6 mb-5">
                                <label class="form-label" for="EmailTemplate_Subject">{{ 'Subject' | localize }}</label>
                                <input
                                    id="EmailTemplate_Subject"
                                    class="form-control"
                                    type="text"
                                    name="Subject"
                                    [ngModel]="record().subject"
                                    (ngModelChange)="updateField('subject', $event)" />
                            </div>
                        </div>
                        <div class="row">
                            <div class="col-md-12 mb-5">
                                <label class="form-label" for="EmailTemplate_EmailBodyHtml">{{ 'EmailBodyHtml' | localize }}</label>
                                <textarea
                                    id="EmailTemplate_EmailBodyHtml"
                                    class="form-control"
                                    rows="6"
                                    name="EmailBodyHtml"
                                    [ngModel]="record().emailBodyHtml"
                                    (ngModelChange)="updateField('emailBodyHtml', $event)"></textarea>
                            </div>
                        </div>
                        <div class="row">
                            <div class="col-md-12 mb-5">
                                <label class="form-label" for="EmailTemplate_EmailBodyText">{{ 'EmailBodyText' | localize }}</label>
                                <textarea
                                    id="EmailTemplate_EmailBodyText"
                                    class="form-control"
                                    rows="6"
                                    name="EmailBodyText"
                                    [ngModel]="record().emailBodyText"
                                    (ngModelChange)="updateField('emailBodyText', $event)"></textarea>
                            </div>
                        </div>
                    </div>
                    <div class="modal-footer">
                        <button [disabled]="saving()" type="button" class="btn btn-light-primary fw-bold" (click)="close()">
                            {{ 'Cancel' | localize }}
                        </button>
                        <button
                            type="submit"
                            class="btn btn-primary fw-bold"
                            [disabled]="!recordForm.form.valid"
                            [buttonBusy]="saving()"
                            [busyText]="l('SavingWithThreeDot')">
                            <i class="fa fa-save"></i>
                            <span>{{ 'Save' | localize }}</span>
                        </button>
                    </div>
                </form>
            }
        </div>
    </div>
</div>
