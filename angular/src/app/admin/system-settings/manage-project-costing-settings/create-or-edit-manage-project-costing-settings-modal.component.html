<div
    appBsModal
    #createOrEditModal="bs-modal"
    (onShown)="onShown()"
    class="modal fade"
    tabindex="-1"
    role="dialog"
    aria-hidden="true"
    [config]="{ backdrop: 'static', keyboard: !saving() }">
    <div class="modal-dialog modal-md">
        <div class="modal-content">
            @if (active()) {
                <form #recordForm="ngForm" novalidate (ngSubmit)="save()" autocomplete="off">
                    <div class="modal-header">
                        <h4 class="modal-title">
                            @if (record().id) {
                                <span>{{ 'EditItem' | localize }}: {{ 'ProjectCostingSettings' | localize }}</span>
                            } @else {
                                <span>{{ 'CreateNewItem' | localize }}: {{ 'ProjectCostingSettings' | localize }}</span>
                            }
                        </h4>
                        <button type="button" class="btn-close" (click)="close()" [disabled]="saving()"></button>
                    </div>
                    <div class="modal-body">
                        <fieldset>
                            <legend>{{ 'ProjectCostingSettings' | localize }}</legend>
                            <div class="row">
                                <div class="col-md-12 mb-5 d-flex align-items-end">
                                    <div class="form-check form-switch">
                                        <input
                                            id="ProjectCostingSettings_CalculateNetPayProjectWise"
                                            type="checkbox"
                                            class="form-check-input"
                                            name="CalculateNetPayProjectWise"
                                            [ngModel]="record().calculateNetPayProjectWise"
                                            (ngModelChange)="updateField('calculateNetPayProjectWise', $event)" />
                                        <label class="form-check-label" for="ProjectCostingSettings_CalculateNetPayProjectWise">{{ 'CalculateNetPayProjectWise' | localize }}</label>
                                    </div>
                                </div>
                            </div>
                        </fieldset>
                    </div>
                    <div class="modal-footer">
                        <button [disabled]="saving()" type="button" class="btn btn-light-primary fw-bold" (click)="close()">
                            {{ 'Cancel' | localize }}
                        </button>
                        <button
                            type="submit"
                            class="btn btn-primary fw-bold"
                            [disabled]="!recordForm.form.valid"
                            [buttonBusy]="saving()"
                            [busyText]="l('SavingWithThreeDot')">
                            <i class="fa fa-save"></i>
                            <span>{{ 'Save' | localize }}</span>
                        </button>
                    </div>
                </form>
            }
        </div>
    </div>
</div>
