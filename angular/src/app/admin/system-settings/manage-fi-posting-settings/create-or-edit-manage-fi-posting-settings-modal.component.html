<div
    appBsModal
    #createOrEditModal="bs-modal"
    (onShown)="onShown()"
    class="modal fade"
    tabindex="-1"
    role="dialog"
    aria-hidden="true"
    [config]="{ backdrop: 'static', keyboard: !saving() }">
    <div class="modal-dialog modal-lg">
        <div class="modal-content">
            @if (active()) {
                <form #recordForm="ngForm" novalidate (ngSubmit)="save()" autocomplete="off">
                    <div class="modal-header">
                        <h4 class="modal-title">
                            @if (record().id) {
                                <span>{{ 'EditItem' | localize }}: {{ 'FIPostingSettings' | localize }}</span>
                            } @else {
                                <span>{{ 'CreateNewItem' | localize }}: {{ 'FIPostingSettings' | localize }}</span>
                            }
                        </h4>
                        <button type="button" class="btn-close" (click)="close()" [disabled]="saving()"></button>
                    </div>
                    <div class="modal-body">
                        <fieldset>
                            <legend>{{ 'FIPostingSettings' | localize }}</legend>
                            <div class="row">
                                <div class="col-md-6 mb-5 d-flex align-items-end">
                                    <div class="form-check form-switch">
                                        <input
                                            id="FIPostingSettings_SeparateProvisionPosting"
                                            type="checkbox"
                                            class="form-check-input"
                                            name="SeparateProvisionPosting"
                                            [ngModel]="record().separateProvisionPosting"
                                            (ngModelChange)="updateField('separateProvisionPosting', $event)" />
                                        <label class="form-check-label" for="FIPostingSettings_SeparateProvisionPosting">{{ 'SeparateProvisionPosting' | localize }}</label>
                                    </div>
                                </div>
                                <div class="col-md-6 mb-5 d-flex align-items-end">
                                    <div class="form-check form-switch">
                                        <input
                                            id="FIPostingSettings_EnableAutoWageAccountEntry"
                                            type="checkbox"
                                            class="form-check-input"
                                            name="EnableAutoWageAccountEntry"
                                            [ngModel]="record().enableAutoWageAccountEntry"
                                            (ngModelChange)="updateField('enableAutoWageAccountEntry', $event)" />
                                        <label class="form-check-label" for="FIPostingSettings_EnableAutoWageAccountEntry">{{ 'EnableAutoWageAccountEntry' | localize }}</label>
                                    </div>
                                </div>
                            </div>
                            <div class="row">
                                <div class="col-md-6 mb-5 d-flex align-items-end">
                                    <div class="form-check form-switch">
                                        <input
                                            id="FIPostingSettings_AllowDuplicateCodeInCostElement"
                                            type="checkbox"
                                            class="form-check-input"
                                            name="AllowDuplicateCodeInCostElement"
                                            [ngModel]="record().allowDuplicateCodeInCostElement"
                                            (ngModelChange)="updateField('allowDuplicateCodeInCostElement', $event)" />
                                        <label class="form-check-label" for="FIPostingSettings_AllowDuplicateCodeInCostElement">{{ 'AllowDuplicateCodeInCostElement' | localize }}</label>
                                    </div>
                                </div>
                                <div class="col-md-6 mb-5 d-flex align-items-end">
                                    <div class="form-check form-switch">
                                        <input
                                            id="FIPostingSettings_FIPostingAfterPayrollExit"
                                            type="checkbox"
                                            class="form-check-input"
                                            name="FIPostingAfterPayrollExit"
                                            [ngModel]="record().fiPostingAfterPayrollExit"
                                            (ngModelChange)="updateField('fiPostingAfterPayrollExit', $event)" />
                                        <label class="form-check-label" for="FIPostingSettings_FIPostingAfterPayrollExit">{{ 'FIPostingAfterPayrollExit' | localize }}</label>
                                    </div>
                                </div>
                            </div>
                        </fieldset>
                    </div>
                    <div class="modal-footer">
                        <button [disabled]="saving()" type="button" class="btn btn-light-primary fw-bold" (click)="close()">
                            {{ 'Cancel' | localize }}
                        </button>
                        <button
                            type="submit"
                            class="btn btn-primary fw-bold"
                            [disabled]="!recordForm.form.valid"
                            [buttonBusy]="saving()"
                            [busyText]="l('SavingWithThreeDot')">
                            <i class="fa fa-save"></i>
                            <span>{{ 'Save' | localize }}</span>
                        </button>
                    </div>
                </form>
            }
        </div>
    </div>
</div>
