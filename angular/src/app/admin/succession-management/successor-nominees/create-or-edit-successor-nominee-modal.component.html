<div
    appBsModal
    #createOrEditModal="bs-modal"
    (onShown)="onShown()"
    class="modal fade"
    tabindex="-1"
    role="dialog"
    aria-labelledby="createOrEditModal"
    aria-hidden="true"
    [config]="{ backdrop: 'static', keyboard: !saving() }">
    <div class="modal-dialog modal-lg">
        <div class="modal-content">
            @if (active()) {
                <form #recordForm="ngForm" novalidate (ngSubmit)="save()" autocomplete="off">
                    <div class="modal-header">
                        <h4 class="modal-title">
                            @if (record().id) {
                                <span>{{ 'Edit' | localize }}</span>
                            } @else {
                                <span>{{ 'CreateNew' | localize }}</span>
                            }
                        </h4>
                        <button type="button" class="btn-close" (click)="close()" [disabled]="saving()"></button>
                    </div>
                    <div class="modal-body">
                        <div class="row">
                            <div class="col-md-6 mb-5">
                                <label class="form-label required" for="SuccessorNominee_EmployeeId">{{ 'Employee' | localize }}</label>
                                <select
                                    id="SuccessorNominee_EmployeeId"
                                    #employeeIdInput="ngModel"
                                    class="form-select"
                                    name="EmployeeId"
                                    [ngModel]="record().employeeId"
                                    (ngModelChange)="updateField('employeeId', $event)"
                                    required>
                                    <option [ngValue]="undefined"></option>
                                    @for (employee of employees(); track employee.id) {
                                        <option [ngValue]="employee.id">{{ employeeLabel(employee) }}</option>
                                    }
                                </select>
                                <validation-messages [formCtrl]="employeeIdInput" />
                            </div>
                            <div class="col-md-6 mb-5">
                                <label class="form-label required" for="SuccessorNominee_NomineeId">{{ 'Nominee' | localize }}</label>
                                <select
                                    id="SuccessorNominee_NomineeId"
                                    #nomineeIdInput="ngModel"
                                    class="form-select"
                                    name="NomineeId"
                                    [ngModel]="record().nomineeId"
                                    (ngModelChange)="updateField('nomineeId', $event)"
                                    required>
                                    <option [ngValue]="undefined"></option>
                                    @for (employee of employees(); track employee.id) {
                                        <option [ngValue]="employee.id">{{ employeeLabel(employee) }}</option>
                                    }
                                </select>
                                <validation-messages [formCtrl]="nomineeIdInput" />
                            </div>
                        </div>
                        <div class="row">
                            <div class="col-md-6 mb-5">
                                <label class="form-label required" for="SuccessorNominee_ReadinessId">{{ 'ReadinessId' | localize }}</label>
                                <select
                                    id="SuccessorNominee_ReadinessId"
                                    #readinessIdInput="ngModel"
                                    class="form-select"
                                    name="ReadinessId"
                                    [ngModel]="record().readinessId"
                                    (ngModelChange)="updateField('readinessId', $event)"
                                    required>
                                    <option [ngValue]="undefined"></option>
                                    @for (readiness of readinesses(); track readiness.id) {
                                        <option [ngValue]="readiness.id">{{ readiness.nameEn }}</option>
                                    }
                                </select>
                                <validation-messages [formCtrl]="readinessIdInput" />
                            </div>
                            <div class="col-md-6 mb-5">
                                <label class="form-label required" for="SuccessorNominee_RankingId">{{ 'RankingId' | localize }}</label>
                                <select
                                    id="SuccessorNominee_RankingId"
                                    #rankingIdInput="ngModel"
                                    class="form-select"
                                    name="RankingId"
                                    [ngModel]="record().rankingId"
                                    (ngModelChange)="updateField('rankingId', $event)"
                                    required>
                                    <option [ngValue]="undefined"></option>
                                    @for (ranking of rankings(); track ranking.id) {
                                        <option [ngValue]="ranking.id">{{ ranking.nameEn }}</option>
                                    }
                                </select>
                                <validation-messages [formCtrl]="rankingIdInput" />
                            </div>
                        </div>
                        <div class="mb-5">
                            <label class="form-label" for="SuccessorNominee_Comments">{{ 'Comments' | localize }}</label>
                            <textarea
                                id="SuccessorNominee_Comments"
                                class="form-control"
                                rows="3"
                                name="Comments"
                                [ngModel]="record().comments"
                                (ngModelChange)="updateField('comments', $event)"></textarea>
                        </div>
                    </div>
                    <div class="modal-footer">
                        <button [disabled]="saving()" type="button" class="btn btn-light-primary fw-bold" (click)="close()">
                            {{ 'Cancel' | localize }}
                        </button>
                        <button
                            type="submit"
                            class="btn btn-primary fw-bold"
                            [disabled]="!recordForm.form.valid"
                            [buttonBusy]="saving()"
                            [busyText]="l('SavingWithThreeDot')">
                            <i class="fa fa-save"></i>
                            <span>{{ 'Save' | localize }}</span>
                        </button>
                    </div>
                </form>
            }
        </div>
    </div>
</div>
