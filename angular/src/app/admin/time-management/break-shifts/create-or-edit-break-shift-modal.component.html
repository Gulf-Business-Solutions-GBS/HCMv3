<div
    appBsModal
    #createOrEditModal="bs-modal"
    (onShown)="onShown()"
    class="modal fade"
    tabindex="-1"
    role="dialog"
    aria-labelledby="createOrEditModal"
    aria-hidden="true"
    [config]="{ backdrop: 'static', keyboard: !saving() }">
    <div class="modal-dialog modal-lg">
        <div class="modal-content">
            @if (active()) {
                <form #breakShiftForm="ngForm" novalidate (ngSubmit)="save()" autocomplete="off">
                    <div class="modal-header">
                        <h4 class="modal-title">
                            @if (breakShift().id) {
                                <span>{{ 'EditItem' | localize }}: {{ 'BreakShift' | localize }}</span>
                            } @else {
                                <span>{{ 'CreateNewItem' | localize }}: {{ 'BreakShift' | localize }}</span>
                            }
                        </h4>
                        <button
                            type="button"
                            class="btn-close"
                            (click)="close()"
                            [attr.aria-label]="l('Close')"
                            [disabled]="saving()"></button>
                    </div>
                    <div class="modal-body">
                        <div class="row">
                            <div class="col-md-4 mb-5">
                                <label class="form-label" for="BreakShift_Code">{{ 'Code' | localize }}</label>
                                <input
                                    id="BreakShift_Code"
                                    class="form-control"
                                    type="text"
                                    name="Code"
                                    [ngModel]="breakShift().code"
                                    (ngModelChange)="updateField('code', $event)"
                                    maxlength="50"
                                    [placeholder]="l('AutoGeneratedIfEmpty')" />
                            </div>
                            <div class="col-md-4 mb-5">
                                <label class="form-label required" for="BreakShift_NameEn">{{ 'NameEn' | localize }}</label>
                                <input
                                    id="BreakShift_NameEn"
                                    #nameEnInput="ngModel"
                                    class="form-control"
                                    type="text"
                                    name="NameEn"
                                    [ngModel]="breakShift().nameEn"
                                    (ngModelChange)="updateField('nameEn', $event)"
                                    required
                                    maxlength="200" />
                                <validation-messages [formCtrl]="nameEnInput" />
                            </div>
                            <div class="col-md-4 mb-5">
                                <label class="form-label required" for="BreakShift_NameAr">{{ 'NameAr' | localize }}</label>
                                <input
                                    id="BreakShift_NameAr"
                                    #nameArInput="ngModel"
                                    class="form-control"
                                    type="text"
                                    name="NameAr"
                                    dir="rtl"
                                    [ngModel]="breakShift().nameAr"
                                    (ngModelChange)="updateField('nameAr', $event)"
                                    required
                                    maxlength="200" />
                                <validation-messages [formCtrl]="nameArInput" />
                            </div>
                        </div>

                        <div class="row">
                            <div class="col-md-3 mb-5">
                                <label class="form-label" for="BreakShift_StartDate">{{ 'StartDate' | localize }}</label>
                                <input
                                    id="BreakShift_StartDate"
                                    type="date"
                                    class="form-control"
                                    name="StartDate"
                                    [ngModel]="breakShift().startDate?.toISODate()"
                                    (ngModelChange)="updateDateField('startDate', $event)" />
                            </div>
                            <div class="col-md-3 mb-5">
                                <label class="form-label" for="BreakShift_EndDate">{{ 'EndDate' | localize }}</label>
                                <input
                                    id="BreakShift_EndDate"
                                    type="date"
                                    class="form-control"
                                    name="EndDate"
                                    [ngModel]="breakShift().endDate?.toISODate()"
                                    (ngModelChange)="updateDateField('endDate', $event)" />
                            </div>
                            <div class="col-md-3 mb-5">
                                <label class="form-label" for="BreakShift_StartTime">{{ 'StartTime' | localize }}</label>
                                <input
                                    id="BreakShift_StartTime"
                                    type="time"
                                    step="1"
                                    class="form-control"
                                    name="StartTime"
                                    [ngModel]="breakShift().startTime"
                                    (ngModelChange)="updateField('startTime', $event)" />
                            </div>
                            <div class="col-md-3 mb-5">
                                <label class="form-label" for="BreakShift_EndTime">{{ 'EndTime' | localize }}</label>
                                <input
                                    id="BreakShift_EndTime"
                                    type="time"
                                    step="1"
                                    class="form-control"
                                    name="EndTime"
                                    [ngModel]="breakShift().endTime"
                                    (ngModelChange)="updateField('endTime', $event)" />
                            </div>
                        </div>

                        <div class="row">
                            <div class="col-md-4 mb-5 form-check">
                                <input
                                    id="BreakShift_IsPaid"
                                    class="form-check-input"
                                    type="checkbox"
                                    name="IsPaid"
                                    [ngModel]="breakShift().isPaid"
                                    (ngModelChange)="updateField('isPaid', $event)" />
                                <label class="form-check-label" for="BreakShift_IsPaid">{{ 'IsPaid' | localize }}</label>
                            </div>
                            <div class="col-md-4 mb-5 form-check">
                                <input
                                    id="BreakShift_IsBreakStartNextDay"
                                    class="form-check-input"
                                    type="checkbox"
                                    name="IsBreakStartNextDay"
                                    [ngModel]="breakShift().isBreakStartNextDay"
                                    (ngModelChange)="updateField('isBreakStartNextDay', $event)" />
                                <label class="form-check-label" for="BreakShift_IsBreakStartNextDay">{{ 'IsBreakStartNextDay' | localize }}</label>
                            </div>
                            <div class="col-md-4 mb-5 form-check">
                                <input
                                    id="BreakShift_IsBreakEndNextDay"
                                    class="form-check-input"
                                    type="checkbox"
                                    name="IsBreakEndNextDay"
                                    [ngModel]="breakShift().isBreakEndNextDay"
                                    (ngModelChange)="updateField('isBreakEndNextDay', $event)" />
                                <label class="form-check-label" for="BreakShift_IsBreakEndNextDay">{{ 'IsBreakEndNextDay' | localize }}</label>
                            </div>
                        </div>
                    </div>
                    <div class="modal-footer">
                        <button
                            [disabled]="saving()"
                            type="button"
                            class="btn btn-light-primary fw-bold"
                            (click)="close()">
                            {{ 'Cancel' | localize }}
                        </button>
                        <button
                            type="submit"
                            class="btn btn-primary fw-bold"
                            [disabled]="!breakShiftForm.form.valid"
                            [buttonBusy]="saving()"
                            [busyText]="l('SavingWithThreeDot')">
                            <i class="fa fa-save"></i>
                            <span>{{ 'Save' | localize }}</span>
                        </button>
                    </div>
                </form>
            }
        </div>
    </div>
</div>
