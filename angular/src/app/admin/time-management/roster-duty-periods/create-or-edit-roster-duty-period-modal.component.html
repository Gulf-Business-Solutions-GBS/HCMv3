<div
    appBsModal
    #createOrEditModal="bs-modal"
    (onShown)="onShown()"
    class="modal fade"
    tabindex="-1"
    role="dialog"
    aria-labelledby="createOrEditModal"
    aria-hidden="true"
    [config]="{ backdrop: 'static', keyboard: !saving() }">
    <div class="modal-dialog modal-lg">
        <div class="modal-content">
            @if (active()) {
                <form #rosterDutyPeriodForm="ngForm" novalidate (ngSubmit)="save()" autocomplete="off">
                    <div class="modal-header">
                        <h4 class="modal-title">
                            @if (rosterDutyPeriod().id) {
                                <span>{{ 'EditItem' | localize }}: {{ 'RosterDutyPeriod' | localize }}</span>
                            } @else {
                                <span>{{ 'CreateNewItem' | localize }}: {{ 'RosterDutyPeriod' | localize }}</span>
                            }
                        </h4>
                        <button
                            type="button"
                            class="btn-close"
                            (click)="close()"
                            [attr.aria-label]="l('Close')"
                            [disabled]="saving()"></button>
                    </div>
                    <div class="modal-body">
                        <div class="row">
                            <div class="col-md-4 mb-5">
                                <label class="form-label" for="RosterDutyPeriod_Code">{{ 'Code' | localize }}</label>
                                <input
                                    id="RosterDutyPeriod_Code"
                                    class="form-control"
                                    type="text"
                                    name="Code"
                                    [ngModel]="rosterDutyPeriod().code"
                                    (ngModelChange)="updateField('code', $event)"
                                    maxlength="50"
                                    [placeholder]="l('AutoGeneratedIfEmpty')" />
                            </div>
                            <div class="col-md-4 mb-5">
                                <label class="form-label required" for="RosterDutyPeriod_NameEn">{{ 'NameEn' | localize }}</label>
                                <input
                                    id="RosterDutyPeriod_NameEn"
                                    #nameEnInput="ngModel"
                                    class="form-control"
                                    type="text"
                                    name="NameEn"
                                    [ngModel]="rosterDutyPeriod().nameEn"
                                    (ngModelChange)="updateField('nameEn', $event)"
                                    required
                                    maxlength="200" />
                                <validation-messages [formCtrl]="nameEnInput" />
                            </div>
                            <div class="col-md-4 mb-5">
                                <label class="form-label required" for="RosterDutyPeriod_NameAr">{{ 'NameAr' | localize }}</label>
                                <input
                                    id="RosterDutyPeriod_NameAr"
                                    #nameArInput="ngModel"
                                    class="form-control"
                                    type="text"
                                    name="NameAr"
                                    dir="rtl"
                                    [ngModel]="rosterDutyPeriod().nameAr"
                                    (ngModelChange)="updateField('nameAr', $event)"
                                    required
                                    maxlength="200" />
                                <validation-messages [formCtrl]="nameArInput" />
                            </div>
                        </div>
                    </div>
                    <div class="modal-footer">
                        <button
                            [disabled]="saving()"
                            type="button"
                            class="btn btn-light-primary fw-bold"
                            (click)="close()">
                            {{ 'Cancel' | localize }}
                        </button>
                        <button
                            type="submit"
                            class="btn btn-primary fw-bold"
                            [disabled]="!rosterDutyPeriodForm.form.valid"
                            [buttonBusy]="saving()"
                            [busyText]="l('SavingWithThreeDot')">
                            <i class="fa fa-save"></i>
                            <span>{{ 'Save' | localize }}</span>
                        </button>
                    </div>
                </form>
            }
        </div>
    </div>
</div>
