<div
    appBsModal
    #createOrEditModal="bs-modal"
    (onShown)="onShown()"
    class="modal fade"
    tabindex="-1"
    role="dialog"
    aria-labelledby="createOrEditModal"
    aria-hidden="true"
    [config]="{ backdrop: 'static', keyboard: !saving() }">
    <div class="modal-dialog modal-lg">
        <div class="modal-content">
            @if (active()) {
                <form #dutyPeriodForm="ngForm" novalidate (ngSubmit)="save()" autocomplete="off">
                    <div class="modal-header">
                        <h4 class="modal-title">
                            @if (dutyPeriod().id) {
                                <span>{{ 'EditItem' | localize }}: {{ 'DutyPeriod' | localize }}</span>
                            } @else {
                                <span>{{ 'CreateNewItem' | localize }}: {{ 'DutyPeriod' | localize }}</span>
                            }
                        </h4>
                        <button
                            type="button"
                            class="btn-close"
                            (click)="close()"
                            [attr.aria-label]="l('Close')"
                            [disabled]="saving()"></button>
                    </div>
                    <div class="modal-body" style="max-height: 70vh; overflow-y: auto">
                        <div class="row">
                            <div class="col-md-4 mb-5">
                                <label class="form-label" for="DutyPeriod_Code">{{ 'Code' | localize }}</label>
                                <input
                                    id="DutyPeriod_Code"
                                    class="form-control"
                                    type="text"
                                    name="Code"
                                    [ngModel]="dutyPeriod().code"
                                    (ngModelChange)="updateField('code', $event)"
                                    maxlength="50"
                                    [placeholder]="l('AutoGeneratedIfEmpty')" />
                            </div>
                            <div class="col-md-4 mb-5">
                                <label class="form-label required" for="DutyPeriod_NameEn">{{ 'NameEn' | localize }}</label>
                                <input
                                    id="DutyPeriod_NameEn"
                                    #nameEnInput="ngModel"
                                    class="form-control"
                                    type="text"
                                    name="NameEn"
                                    [ngModel]="dutyPeriod().nameEn"
                                    (ngModelChange)="updateField('nameEn', $event)"
                                    required
                                    maxlength="200" />
                                <validation-messages [formCtrl]="nameEnInput" />
                            </div>
                            <div class="col-md-4 mb-5">
                                <label class="form-label required" for="DutyPeriod_NameAr">{{ 'NameAr' | localize }}</label>
                                <input
                                    id="DutyPeriod_NameAr"
                                    #nameArInput="ngModel"
                                    class="form-control"
                                    type="text"
                                    name="NameAr"
                                    dir="rtl"
                                    [ngModel]="dutyPeriod().nameAr"
                                    (ngModelChange)="updateField('nameAr', $event)"
                                    required
                                    maxlength="200" />
                                <validation-messages [formCtrl]="nameArInput" />
                            </div>
                        </div>

                        <div class="row">
                            <div class="col-md-4 mb-5">
                                <label class="form-label" for="DutyPeriod_StartDate">{{ 'StartDate' | localize }}</label>
                                <input
                                    id="DutyPeriod_StartDate"
                                    type="date"
                                    class="form-control"
                                    name="StartDate"
                                    [ngModel]="dutyPeriod().startDate?.toISODate()"
                                    (ngModelChange)="updateDateField('startDate', $event)" />
                            </div>
                            <div class="col-md-4 mb-5">
                                <label class="form-label" for="DutyPeriod_EndDate">{{ 'EndDate' | localize }}</label>
                                <input
                                    id="DutyPeriod_EndDate"
                                    type="date"
                                    class="form-control"
                                    name="EndDate"
                                    [ngModel]="dutyPeriod().endDate?.toISODate()"
                                    (ngModelChange)="updateDateField('endDate', $event)" />
                            </div>
                            <div class="col-md-4 mb-5">
                                <label class="form-label" for="DutyPeriod_HolidayCalendarId">{{ 'HolidayCalendar' | localize }}</label>
                                <select
                                    id="DutyPeriod_HolidayCalendarId"
                                    class="form-select"
                                    name="HolidayCalendarId"
                                    [ngModel]="dutyPeriod().holidayCalendarId"
                                    (ngModelChange)="updateField('holidayCalendarId', $event)">
                                    <option [ngValue]="undefined"></option>
                                    @for (holidayCalendar of holidayCalendars(); track holidayCalendar.id) {
                                        <option [ngValue]="holidayCalendar.id">{{ holidayCalendar.nameEn }}</option>
                                    }
                                </select>
                            </div>
                        </div>

                        <h6>{{ 'WeeklyDutyAssignment' | localize }}</h6>
                        <hr />
                        <div class="row">
                            <div class="col-md-3 mb-5">
                                <label class="form-label" for="DutyPeriod_SundayDutyId">{{ 'Sunday' | localize }}</label>
                                <select
                                    id="DutyPeriod_SundayDutyId"
                                    class="form-select"
                                    name="SundayDutyId"
                                    [ngModel]="dutyPeriod().sundayDutyId"
                                    (ngModelChange)="updateField('sundayDutyId', $event)">
                                    <option [ngValue]="undefined"></option>
                                    @for (duty of duties(); track duty.id) {
                                        <option [ngValue]="duty.id">{{ duty.nameEn }}</option>
                                    }
                                </select>
                            </div>
                            <div class="col-md-3 mb-5">
                                <label class="form-label" for="DutyPeriod_MondayDutyId">{{ 'Monday' | localize }}</label>
                                <select
                                    id="DutyPeriod_MondayDutyId"
                                    class="form-select"
                                    name="MondayDutyId"
                                    [ngModel]="dutyPeriod().mondayDutyId"
                                    (ngModelChange)="updateField('mondayDutyId', $event)">
                                    <option [ngValue]="undefined"></option>
                                    @for (duty of duties(); track duty.id) {
                                        <option [ngValue]="duty.id">{{ duty.nameEn }}</option>
                                    }
                                </select>
                            </div>
                            <div class="col-md-3 mb-5">
                                <label class="form-label" for="DutyPeriod_TuesdayDutyId">{{ 'Tuesday' | localize }}</label>
                                <select
                                    id="DutyPeriod_TuesdayDutyId"
                                    class="form-select"
                                    name="TuesdayDutyId"
                                    [ngModel]="dutyPeriod().tuesdayDutyId"
                                    (ngModelChange)="updateField('tuesdayDutyId', $event)">
                                    <option [ngValue]="undefined"></option>
                                    @for (duty of duties(); track duty.id) {
                                        <option [ngValue]="duty.id">{{ duty.nameEn }}</option>
                                    }
                                </select>
                            </div>
                            <div class="col-md-3 mb-5">
                                <label class="form-label" for="DutyPeriod_WednesdayDutyId">{{ 'Wednesday' | localize }}</label>
                                <select
                                    id="DutyPeriod_WednesdayDutyId"
                                    class="form-select"
                                    name="WednesdayDutyId"
                                    [ngModel]="dutyPeriod().wednesdayDutyId"
                                    (ngModelChange)="updateField('wednesdayDutyId', $event)">
                                    <option [ngValue]="undefined"></option>
                                    @for (duty of duties(); track duty.id) {
                                        <option [ngValue]="duty.id">{{ duty.nameEn }}</option>
                                    }
                                </select>
                            </div>
                            <div class="col-md-3 mb-5">
                                <label class="form-label" for="DutyPeriod_ThursdayDutyId">{{ 'Thursday' | localize }}</label>
                                <select
                                    id="DutyPeriod_ThursdayDutyId"
                                    class="form-select"
                                    name="ThursdayDutyId"
                                    [ngModel]="dutyPeriod().thursdayDutyId"
                                    (ngModelChange)="updateField('thursdayDutyId', $event)">
                                    <option [ngValue]="undefined"></option>
                                    @for (duty of duties(); track duty.id) {
                                        <option [ngValue]="duty.id">{{ duty.nameEn }}</option>
                                    }
                                </select>
                            </div>
                            <div class="col-md-3 mb-5">
                                <label class="form-label" for="DutyPeriod_FridayDutyId">{{ 'Friday' | localize }}</label>
                                <select
                                    id="DutyPeriod_FridayDutyId"
                                    class="form-select"
                                    name="FridayDutyId"
                                    [ngModel]="dutyPeriod().fridayDutyId"
                                    (ngModelChange)="updateField('fridayDutyId', $event)">
                                    <option [ngValue]="undefined"></option>
                                    @for (duty of duties(); track duty.id) {
                                        <option [ngValue]="duty.id">{{ duty.nameEn }}</option>
                                    }
                                </select>
                            </div>
                            <div class="col-md-3 mb-5">
                                <label class="form-label" for="DutyPeriod_SaturdayDutyId">{{ 'Saturday' | localize }}</label>
                                <select
                                    id="DutyPeriod_SaturdayDutyId"
                                    class="form-select"
                                    name="SaturdayDutyId"
                                    [ngModel]="dutyPeriod().saturdayDutyId"
                                    (ngModelChange)="updateField('saturdayDutyId', $event)">
                                    <option [ngValue]="undefined"></option>
                                    @for (duty of duties(); track duty.id) {
                                        <option [ngValue]="duty.id">{{ duty.nameEn }}</option>
                                    }
                                </select>
                            </div>
                        </div>
                    </div>
                    <div class="modal-footer">
                        <button
                            [disabled]="saving()"
                            type="button"
                            class="btn btn-light-primary fw-bold"
                            (click)="close()">
                            {{ 'Cancel' | localize }}
                        </button>
                        <button
                            type="submit"
                            class="btn btn-primary fw-bold"
                            [disabled]="!dutyPeriodForm.form.valid"
                            [buttonBusy]="saving()"
                            [busyText]="l('SavingWithThreeDot')">
                            <i class="fa fa-save"></i>
                            <span>{{ 'Save' | localize }}</span>
                        </button>
                    </div>
                </form>
            }
        </div>
    </div>
</div>
