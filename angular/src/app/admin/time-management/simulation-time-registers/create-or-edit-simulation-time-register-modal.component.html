<div
    appBsModal
    #createOrEditModal="bs-modal"
    (onShown)="onShown()"
    class="modal fade"
    tabindex="-1"
    role="dialog"
    aria-labelledby="createOrEditModal"
    aria-hidden="true"
    [config]="{ backdrop: 'static', keyboard: !saving() }">
    <div class="modal-dialog modal-lg">
        <div class="modal-content">
            @if (active()) {
                <form #simulationTimeRegisterForm="ngForm" novalidate (ngSubmit)="save()" autocomplete="off">
                    <div class="modal-header">
                        <h4 class="modal-title">
                            @if (simulationTimeRegister().id) {
                                <span>{{ 'EditItem' | localize }}: {{ 'SimulationTimeRegister' | localize }}</span>
                            } @else {
                                <span>{{ 'CreateNewItem' | localize }}: {{ 'SimulationTimeRegister' | localize }}</span>
                            }
                        </h4>
                        <button
                            type="button"
                            class="btn-close"
                            (click)="close()"
                            [attr.aria-label]="l('Close')"
                            [disabled]="saving()"></button>
                    </div>
                    <div class="modal-body">
                        <div class="row">
                            <div class="col-md-4 mb-5">
                                <label class="form-label required" for="SimulationTimeRegister_EmployeeId">{{ 'Employee' | localize }}</label>
                                <select
                                    id="SimulationTimeRegister_EmployeeId"
                                    #employeeIdInput="ngModel"
                                    class="form-select"
                                    name="EmployeeId"
                                    [ngModel]="simulationTimeRegister().employeeId"
                                    (ngModelChange)="updateField('employeeId', $event)"
                                    required>
                                    <option [ngValue]="undefined"></option>
                                    @for (employee of employees(); track employee.id) {
                                        <option [ngValue]="employee.id">{{ employeeLabel(employee) }}</option>
                                    }
                                </select>
                                <validation-messages [formCtrl]="employeeIdInput" />
                            </div>
                            <div class="col-md-4 mb-5">
                                <label class="form-label required" for="SimulationTimeRegister_DayDate">{{ 'DayDate' | localize }}</label>
                                <input
                                    id="SimulationTimeRegister_DayDate"
                                    #dayDateInput="ngModel"
                                    type="date"
                                    class="form-control"
                                    name="DayDate"
                                    [ngModel]="simulationTimeRegister().dayDate?.toISODate()"
                                    (ngModelChange)="updateDateField('dayDate', $event)"
                                    required />
                                <validation-messages [formCtrl]="dayDateInput" />
                            </div>
                            <div class="col-md-4 mb-5">
                                <label class="form-label" for="SimulationTimeRegister_DutyPeriodId">{{ 'DutyPeriod' | localize }}</label>
                                <select
                                    id="SimulationTimeRegister_DutyPeriodId"
                                    class="form-select"
                                    name="DutyPeriodId"
                                    [ngModel]="simulationTimeRegister().dutyPeriodId"
                                    (ngModelChange)="updateField('dutyPeriodId', $event)">
                                    <option [ngValue]="undefined"></option>
                                    @for (dutyPeriod of dutyPeriods(); track dutyPeriod.id) {
                                        <option [ngValue]="dutyPeriod.id">{{ dutyPeriod.nameEn }}</option>
                                    }
                                </select>
                            </div>
                        </div>
                    </div>
                    <div class="modal-footer">
                        <button
                            [disabled]="saving()"
                            type="button"
                            class="btn btn-light-primary fw-bold"
                            (click)="close()">
                            {{ 'Cancel' | localize }}
                        </button>
                        <button
                            type="submit"
                            class="btn btn-primary fw-bold"
                            [disabled]="!simulationTimeRegisterForm.form.valid"
                            [buttonBusy]="saving()"
                            [busyText]="l('SavingWithThreeDot')">
                            <i class="fa fa-save"></i>
                            <span>{{ 'Save' | localize }}</span>
                        </button>
                    </div>
                </form>
            }
        </div>
    </div>
</div>
