<div
    appBsModal
    #createOrEditModal="bs-modal"
    (onShown)="onShown()"
    class="modal fade"
    tabindex="-1"
    role="dialog"
    aria-hidden="true"
    [config]="{ backdrop: 'static', keyboard: !saving() }">
    <div class="modal-dialog modal-lg">
        <div class="modal-content">
            @if (active()) {
                <form #recordForm="ngForm" novalidate (ngSubmit)="save()" autocomplete="off">
                    <div class="modal-header">
                        <h4 class="modal-title">
                            @if (record().id) {
                                <span>{{ 'Edit' | localize }}</span>
                            } @else {
                                <span>{{ 'CreateNew' | localize }}</span>
                            }
                        </h4>
                        <button type="button" class="btn-close" (click)="close()" [disabled]="saving()"></button>
                    </div>
                    <div class="modal-body">
                        <div class="mb-5">
                            <label class="form-label required" for="WorkLocationDutyPeriod_WorkLocationId">{{ 'WorkLocation' | localize }}</label>
                            <select
                                id="WorkLocationDutyPeriod_WorkLocationId"
                                #workLocationIdInput="ngModel"
                                class="form-select"
                                name="WorkLocationId"
                                [ngModel]="record().workLocationId"
                                (ngModelChange)="updateField('workLocationId', $event)"
                                required>
                                <option [ngValue]="undefined"></option>
                                @for (item of workLocations(); track item.id) {
                                    <option [ngValue]="item.id">{{ item.nameEn }}</option>
                                }
                            </select>
                            <validation-messages [formCtrl]="workLocationIdInput" />
                        </div>
                        <div class="mb-5">
                            <label class="form-label required" for="WorkLocationDutyPeriod_DutyPeriodId">{{ 'DutyPeriod' | localize }}</label>
                            <select
                                id="WorkLocationDutyPeriod_DutyPeriodId"
                                #dutyPeriodIdInput="ngModel"
                                class="form-select"
                                name="DutyPeriodId"
                                [ngModel]="record().dutyPeriodId"
                                (ngModelChange)="updateField('dutyPeriodId', $event)"
                                required>
                                <option [ngValue]="undefined"></option>
                                @for (item of dutyPeriods(); track item.id) {
                                    <option [ngValue]="item.id">{{ item.nameEn }}</option>
                                }
                            </select>
                            <validation-messages [formCtrl]="dutyPeriodIdInput" />
                        </div>
                        <div class="mb-5">
                            <label class="form-label required" for="WorkLocationDutyPeriod_StartDate">{{ 'StartDate' | localize }}</label>
                            <input
                                id="WorkLocationDutyPeriod_StartDate"
                                #startDateInput="ngModel"
                                class="form-control"
                                type="date"
                                name="StartDate"
                                [ngModel]="record().startDate?.toISODate()"
                                (ngModelChange)="updateStartDate($event)"
                                required />
                            <validation-messages [formCtrl]="startDateInput" />
                        </div>
                    </div>
                    <div class="modal-footer">
                        <button [disabled]="saving()" type="button" class="btn btn-light-primary fw-bold" (click)="close()">
                            {{ 'Cancel' | localize }}
                        </button>
                        <button
                            type="submit"
                            class="btn btn-primary fw-bold"
                            [disabled]="!recordForm.form.valid"
                            [buttonBusy]="saving()"
                            [busyText]="l('SavingWithThreeDot')">
                            <i class="fa fa-save"></i>
                            <span>{{ 'Save' | localize }}</span>
                        </button>
                    </div>
                </form>
            }
        </div>
    </div>
</div>
