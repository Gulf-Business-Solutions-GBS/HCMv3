<div
    appBsModal
    #createOrEditModal="bs-modal"
    (onShown)="onShown()"
    class="modal fade"
    tabindex="-1"
    role="dialog"
    aria-labelledby="createOrEditModal"
    aria-hidden="true"
    [config]="{ backdrop: 'static', keyboard: !saving() }">
    <div class="modal-dialog modal-lg">
        <div class="modal-content">
            @if (active()) {
                <form #holidayForm="ngForm" novalidate (ngSubmit)="save()" autocomplete="off">
                    <div class="modal-header">
                        <h4 class="modal-title">
                            @if (holiday().id) {
                                <span>{{ 'EditItem' | localize }}: {{ 'Holiday' | localize }}</span>
                            } @else {
                                <span>{{ 'CreateNewItem' | localize }}: {{ 'Holiday' | localize }}</span>
                            }
                        </h4>
                        <button
                            type="button"
                            class="btn-close"
                            (click)="close()"
                            [attr.aria-label]="l('Close')"
                            [disabled]="saving()"></button>
                    </div>
                    <div class="modal-body">
                        <div class="mb-5">
                            <label class="form-label" for="Holiday_Code">{{ 'Code' | localize }}</label>
                            <input
                                id="Holiday_Code"
                                class="form-control"
                                type="text"
                                name="Code"
                                [ngModel]="holiday().code"
                                (ngModelChange)="updateField('code', $event)"
                                maxlength="50"
                                [placeholder]="l('AutoGeneratedIfEmpty')" />
                        </div>

                        <div class="mb-5">
                            <label class="form-label required" for="Holiday_NameEn">{{ 'NameEn' | localize }}</label>
                            <input
                                id="Holiday_NameEn"
                                #nameEnInput="ngModel"
                                class="form-control"
                                type="text"
                                name="NameEn"
                                [ngModel]="holiday().nameEn"
                                (ngModelChange)="updateField('nameEn', $event)"
                                required
                                maxlength="200" />
                            <validation-messages [formCtrl]="nameEnInput" />
                        </div>

                        <div class="mb-5">
                            <label class="form-label required" for="Holiday_NameAr">{{ 'NameAr' | localize }}</label>
                            <input
                                id="Holiday_NameAr"
                                #nameArInput="ngModel"
                                class="form-control"
                                type="text"
                                name="NameAr"
                                dir="rtl"
                                [ngModel]="holiday().nameAr"
                                (ngModelChange)="updateField('nameAr', $event)"
                                required
                                maxlength="200" />
                            <validation-messages [formCtrl]="nameArInput" />
                        </div>

                        <div class="mb-5">
                            <label class="form-label required" for="Holiday_HolidayCalendarId">{{ 'HolidayCalendar' | localize }}</label>
                            <select
                                id="Holiday_HolidayCalendarId"
                                #holidayCalendarIdInput="ngModel"
                                class="form-select"
                                name="HolidayCalendarId"
                                [ngModel]="holiday().holidayCalendarId"
                                (ngModelChange)="updateField('holidayCalendarId', $event)"
                                required>
                                <option [ngValue]="undefined"></option>
                                @for (holidayCalendar of holidayCalendars(); track holidayCalendar.id) {
                                    <option [ngValue]="holidayCalendar.id">{{ holidayCalendar.nameEn }}</option>
                                }
                            </select>
                            <validation-messages [formCtrl]="holidayCalendarIdInput" />
                        </div>

                        <div class="mb-5">
                            <label class="form-label" for="Holiday_OvertimeTypeId">{{ 'OvertimeType' | localize }}</label>
                            <select
                                id="Holiday_OvertimeTypeId"
                                class="form-select"
                                name="OvertimeTypeId"
                                [ngModel]="holiday().overtimeTypeId"
                                (ngModelChange)="updateField('overtimeTypeId', $event)">
                                <option [ngValue]="undefined"></option>
                                @for (overtimeType of overtimeTypes(); track overtimeType.id) {
                                    <option [ngValue]="overtimeType.id">{{ overtimeType.nameEn }}</option>
                                }
                            </select>
                        </div>
                    </div>
                    <div class="modal-footer">
                        <button
                            [disabled]="saving()"
                            type="button"
                            class="btn btn-light-primary fw-bold"
                            (click)="close()">
                            {{ 'Cancel' | localize }}
                        </button>
                        <button
                            type="submit"
                            class="btn btn-primary fw-bold"
                            [disabled]="!holidayForm.form.valid"
                            [buttonBusy]="saving()"
                            [busyText]="l('SavingWithThreeDot')">
                            <i class="fa fa-save"></i>
                            <span>{{ 'Save' | localize }}</span>
                        </button>
                    </div>
                </form>
            }
        </div>
    </div>
</div>
