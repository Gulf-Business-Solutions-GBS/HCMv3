<div
    appBsModal
    #createOrEditModal="bs-modal"
    (onShown)="onShown()"
    class="modal fade"
    tabindex="-1"
    role="dialog"
    aria-labelledby="createOrEditModal"
    aria-hidden="true"
    [config]="{ backdrop: 'static', keyboard: !saving() }">
    <div class="modal-dialog modal-lg">
        <div class="modal-content">
            @if (active()) {
                <form #dailyDutyForm="ngForm" novalidate (ngSubmit)="save()" autocomplete="off">
                    <div class="modal-header">
                        <h4 class="modal-title">
                            @if (dailyDuty().id) {
                                <span>{{ 'EditItem' | localize }}: {{ 'DailyDuty' | localize }}</span>
                            } @else {
                                <span>{{ 'CreateNewItem' | localize }}: {{ 'DailyDuty' | localize }}</span>
                            }
                        </h4>
                        <button
                            type="button"
                            class="btn-close"
                            (click)="close()"
                            [attr.aria-label]="l('Close')"
                            [disabled]="saving()"></button>
                    </div>
                    <div class="modal-body">
                        <div class="row">
                            <div class="col-md-4 mb-5">
                                <label class="form-label" for="DailyDuty_Code">{{ 'Code' | localize }}</label>
                                <input
                                    id="DailyDuty_Code"
                                    class="form-control"
                                    type="text"
                                    name="Code"
                                    [ngModel]="dailyDuty().code"
                                    (ngModelChange)="updateField('code', $event)"
                                    maxlength="50"
                                    [placeholder]="l('AutoGeneratedIfEmpty')" />
                            </div>
                            <div class="col-md-4 mb-5">
                                <label class="form-label required" for="DailyDuty_NameEn">{{ 'NameEn' | localize }}</label>
                                <input
                                    id="DailyDuty_NameEn"
                                    #nameEnInput="ngModel"
                                    class="form-control"
                                    type="text"
                                    name="NameEn"
                                    [ngModel]="dailyDuty().nameEn"
                                    (ngModelChange)="updateField('nameEn', $event)"
                                    required
                                    maxlength="200" />
                                <validation-messages [formCtrl]="nameEnInput" />
                            </div>
                            <div class="col-md-4 mb-5">
                                <label class="form-label required" for="DailyDuty_NameAr">{{ 'NameAr' | localize }}</label>
                                <input
                                    id="DailyDuty_NameAr"
                                    #nameArInput="ngModel"
                                    class="form-control"
                                    type="text"
                                    name="NameAr"
                                    dir="rtl"
                                    [ngModel]="dailyDuty().nameAr"
                                    (ngModelChange)="updateField('nameAr', $event)"
                                    required
                                    maxlength="200" />
                                <validation-messages [formCtrl]="nameArInput" />
                            </div>
                        </div>

                        <div class="row">
                            <div class="col-md-3 mb-5">
                                <label class="form-label" for="DailyDuty_StartDate">{{ 'StartDate' | localize }}</label>
                                <input
                                    id="DailyDuty_StartDate"
                                    type="date"
                                    class="form-control"
                                    name="StartDate"
                                    [ngModel]="dailyDuty().startDate?.toISODate()"
                                    (ngModelChange)="updateDateField('startDate', $event)" />
                            </div>
                            <div class="col-md-3 mb-5">
                                <label class="form-label" for="DailyDuty_EndDate">{{ 'EndDate' | localize }}</label>
                                <input
                                    id="DailyDuty_EndDate"
                                    type="date"
                                    class="form-control"
                                    name="EndDate"
                                    [ngModel]="dailyDuty().endDate?.toISODate()"
                                    (ngModelChange)="updateDateField('endDate', $event)" />
                            </div>
                            <div class="col-md-3 mb-5">
                                <label class="form-label" for="DailyDuty_StartTime">{{ 'StartTime' | localize }}</label>
                                <input
                                    id="DailyDuty_StartTime"
                                    type="time"
                                    step="1"
                                    class="form-control"
                                    name="StartTime"
                                    [ngModel]="dailyDuty().startTime"
                                    (ngModelChange)="updateField('startTime', $event)" />
                            </div>
                            <div class="col-md-3 mb-5">
                                <label class="form-label" for="DailyDuty_EndTime">{{ 'EndTime' | localize }}</label>
                                <input
                                    id="DailyDuty_EndTime"
                                    type="time"
                                    step="1"
                                    class="form-control"
                                    name="EndTime"
                                    [ngModel]="dailyDuty().endTime"
                                    (ngModelChange)="updateField('endTime', $event)" />
                            </div>
                        </div>

                        <div class="row">
                            <div class="col-md-4 mb-5">
                                <label class="form-label" for="DailyDuty_BreakShiftId">{{ 'BreakShift' | localize }}</label>
                                <select
                                    id="DailyDuty_BreakShiftId"
                                    class="form-select"
                                    name="BreakShiftId"
                                    [ngModel]="dailyDuty().breakShiftId"
                                    (ngModelChange)="updateField('breakShiftId', $event)">
                                    <option [ngValue]="undefined"></option>
                                    @for (breakShift of breakShifts(); track breakShift.id) {
                                        <option [ngValue]="breakShift.id">{{ breakShift.nameEn }}</option>
                                    }
                                </select>
                            </div>
                            <div class="col-md-4 mb-5 form-check">
                                <input
                                    id="DailyDuty_IsNightShift"
                                    class="form-check-input"
                                    type="checkbox"
                                    name="IsNightShift"
                                    [ngModel]="dailyDuty().isNightShift"
                                    (ngModelChange)="updateField('isNightShift', $event)" />
                                <label class="form-check-label" for="DailyDuty_IsNightShift">{{ 'IsNightShift' | localize }}</label>
                            </div>
                        </div>

                        <div class="row">
                            <div class="col-md-4 mb-5 form-check">
                                <input
                                    id="DailyDuty_AllowTransStart"
                                    class="form-check-input"
                                    type="checkbox"
                                    name="AllowTransStart"
                                    [ngModel]="dailyDuty().allowTransStart"
                                    (ngModelChange)="updateField('allowTransStart', $event)" />
                                <label class="form-check-label" for="DailyDuty_AllowTransStart">{{ 'AllowTransStart' | localize }}</label>
                            </div>
                            <div class="col-md-4 mb-5 form-check">
                                <input
                                    id="DailyDuty_AllowTransEnd"
                                    class="form-check-input"
                                    type="checkbox"
                                    name="AllowTransEnd"
                                    [ngModel]="dailyDuty().allowTransEnd"
                                    (ngModelChange)="updateField('allowTransEnd', $event)" />
                                <label class="form-check-label" for="DailyDuty_AllowTransEnd">{{ 'AllowTransEnd' | localize }}</label>
                            </div>
                        </div>
                    </div>
                    <div class="modal-footer">
                        <button
                            [disabled]="saving()"
                            type="button"
                            class="btn btn-light-primary fw-bold"
                            (click)="close()">
                            {{ 'Cancel' | localize }}
                        </button>
                        <button
                            type="submit"
                            class="btn btn-primary fw-bold"
                            [disabled]="!dailyDutyForm.form.valid"
                            [buttonBusy]="saving()"
                            [busyText]="l('SavingWithThreeDot')">
                            <i class="fa fa-save"></i>
                            <span>{{ 'Save' | localize }}</span>
                        </button>
                    </div>
                </form>
            }
        </div>
    </div>
</div>
