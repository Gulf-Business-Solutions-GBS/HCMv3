<div
    appBsModal
    #createOrEditModal="bs-modal"
    (onShown)="onShown()"
    class="modal fade"
    tabindex="-1"
    role="dialog"
    aria-labelledby="createOrEditModal"
    aria-hidden="true"
    [config]="{ backdrop: 'static', keyboard: !saving() }">
    <div class="modal-dialog modal-lg">
        <div class="modal-content">
            @if (active()) {
                <form #dutyForm="ngForm" novalidate (ngSubmit)="save()" autocomplete="off">
                    <div class="modal-header">
                        <h4 class="modal-title">
                            @if (duty().id) {
                                <span>{{ 'EditItem' | localize }}: {{ 'Duty' | localize }}</span>
                            } @else {
                                <span>{{ 'CreateNewItem' | localize }}: {{ 'Duty' | localize }}</span>
                            }
                        </h4>
                        <button
                            type="button"
                            class="btn-close"
                            (click)="close()"
                            [attr.aria-label]="l('Close')"
                            [disabled]="saving()"></button>
                    </div>
                    <div class="modal-body" style="max-height: 70vh; overflow-y: auto">
                        <div class="row">
                            <div class="col-md-4 mb-5">
                                <label class="form-label" for="Duty_Code">{{ 'Code' | localize }}</label>
                                <input
                                    id="Duty_Code"
                                    class="form-control"
                                    type="text"
                                    name="Code"
                                    [ngModel]="duty().code"
                                    (ngModelChange)="updateField('code', $event)"
                                    maxlength="50"
                                    [placeholder]="l('AutoGeneratedIfEmpty')" />
                            </div>
                            <div class="col-md-4 mb-5">
                                <label class="form-label required" for="Duty_NameEn">{{ 'NameEn' | localize }}</label>
                                <input
                                    id="Duty_NameEn"
                                    #nameEnInput="ngModel"
                                    class="form-control"
                                    type="text"
                                    name="NameEn"
                                    [ngModel]="duty().nameEn"
                                    (ngModelChange)="updateField('nameEn', $event)"
                                    required
                                    maxlength="200" />
                                <validation-messages [formCtrl]="nameEnInput" />
                            </div>
                            <div class="col-md-4 mb-5">
                                <label class="form-label required" for="Duty_NameAr">{{ 'NameAr' | localize }}</label>
                                <input
                                    id="Duty_NameAr"
                                    #nameArInput="ngModel"
                                    class="form-control"
                                    type="text"
                                    name="NameAr"
                                    dir="rtl"
                                    [ngModel]="duty().nameAr"
                                    (ngModelChange)="updateField('nameAr', $event)"
                                    required
                                    maxlength="200" />
                                <validation-messages [formCtrl]="nameArInput" />
                            </div>
                        </div>

                        <h6>{{ 'Timing' | localize }}</h6>
                        <hr />
                        <div class="row">
                            <div class="col-md-3 mb-5">
                                <label class="form-label" for="Duty_StartDate">{{ 'StartDate' | localize }}</label>
                                <input
                                    id="Duty_StartDate"
                                    type="date"
                                    class="form-control"
                                    name="StartDate"
                                    [ngModel]="duty().startDate?.toISODate()"
                                    (ngModelChange)="updateDateField('startDate', $event)" />
                            </div>
                            <div class="col-md-3 mb-5">
                                <label class="form-label" for="Duty_EndDate">{{ 'EndDate' | localize }}</label>
                                <input
                                    id="Duty_EndDate"
                                    type="date"
                                    class="form-control"
                                    name="EndDate"
                                    [ngModel]="duty().endDate?.toISODate()"
                                    (ngModelChange)="updateDateField('endDate', $event)" />
                            </div>
                            <div class="col-md-3 mb-5">
                                <label class="form-label" for="Duty_StartTime">{{ 'StartTime' | localize }}</label>
                                <input
                                    id="Duty_StartTime"
                                    type="time"
                                    step="1"
                                    class="form-control"
                                    name="StartTime"
                                    [ngModel]="duty().startTime"
                                    (ngModelChange)="updateField('startTime', $event)" />
                            </div>
                            <div class="col-md-3 mb-5">
                                <label class="form-label" for="Duty_EndTime">{{ 'EndTime' | localize }}</label>
                                <input
                                    id="Duty_EndTime"
                                    type="time"
                                    step="1"
                                    class="form-control"
                                    name="EndTime"
                                    [ngModel]="duty().endTime"
                                    (ngModelChange)="updateField('endTime', $event)" />
                            </div>
                            <div class="col-md-3 mb-5">
                                <label class="form-label" for="Duty_FlexiStartTime">{{ 'FlexiStartTime' | localize }}</label>
                                <input
                                    id="Duty_FlexiStartTime"
                                    type="time"
                                    step="1"
                                    class="form-control"
                                    name="FlexiStartTime"
                                    [ngModel]="duty().flexiStartTime"
                                    (ngModelChange)="updateField('flexiStartTime', $event)" />
                            </div>
                            <div class="col-md-3 mb-5">
                                <label class="form-label" for="Duty_FlexiEndTime">{{ 'FlexiEndTime' | localize }}</label>
                                <input
                                    id="Duty_FlexiEndTime"
                                    type="time"
                                    step="1"
                                    class="form-control"
                                    name="FlexiEndTime"
                                    [ngModel]="duty().flexiEndTime"
                                    (ngModelChange)="updateField('flexiEndTime', $event)" />
                            </div>
                        </div>

                        <h6>{{ 'RelatedRecords' | localize }}</h6>
                        <hr />
                        <div class="row">
                            <div class="col-md-6 mb-5">
                                <label class="form-label" for="Duty_BreakShiftId">{{ 'BreakShift' | localize }}</label>
                                <select
                                    id="Duty_BreakShiftId"
                                    class="form-select"
                                    name="BreakShiftId"
                                    [ngModel]="duty().breakShiftId"
                                    (ngModelChange)="updateField('breakShiftId', $event)">
                                    <option [ngValue]="undefined"></option>
                                    @for (breakShift of breakShifts(); track breakShift.id) {
                                        <option [ngValue]="breakShift.id">{{ breakShift.nameEn }}</option>
                                    }
                                </select>
                            </div>
                            <div class="col-md-6 mb-5">
                                <label class="form-label" for="Duty_OvertimeTypeId">{{ 'OvertimeType' | localize }}</label>
                                <select
                                    id="Duty_OvertimeTypeId"
                                    class="form-select"
                                    name="OvertimeTypeId"
                                    [ngModel]="duty().overtimeTypeId"
                                    (ngModelChange)="updateField('overtimeTypeId', $event)">
                                    <option [ngValue]="undefined"></option>
                                    @for (overtimeType of overtimeTypes(); track overtimeType.id) {
                                        <option [ngValue]="overtimeType.id">{{ overtimeType.nameEn }}</option>
                                    }
                                </select>
                            </div>
                        </div>

                        <h6>{{ 'Rules' | localize }}</h6>
                        <hr />
                        <div class="row">
                            <div class="col-md-3 mb-5 form-check">
                                <input
                                    id="Duty_AllowTransStart"
                                    class="form-check-input"
                                    type="checkbox"
                                    name="AllowTransStart"
                                    [ngModel]="duty().allowTransStart"
                                    (ngModelChange)="updateField('allowTransStart', $event)" />
                                <label class="form-check-label" for="Duty_AllowTransStart">{{ 'AllowTransStart' | localize }}</label>
                            </div>
                            <div class="col-md-3 mb-5 form-check">
                                <input
                                    id="Duty_AllowTransEnd"
                                    class="form-check-input"
                                    type="checkbox"
                                    name="AllowTransEnd"
                                    [ngModel]="duty().allowTransEnd"
                                    (ngModelChange)="updateField('allowTransEnd', $event)" />
                                <label class="form-check-label" for="Duty_AllowTransEnd">{{ 'AllowTransEnd' | localize }}</label>
                            </div>
                            <div class="col-md-3 mb-5 form-check">
                                <input
                                    id="Duty_IsNightShift"
                                    class="form-check-input"
                                    type="checkbox"
                                    name="IsNightShift"
                                    [ngModel]="duty().isNightShift"
                                    (ngModelChange)="updateField('isNightShift', $event)" />
                                <label class="form-check-label" for="Duty_IsNightShift">{{ 'IsNightShift' | localize }}</label>
                            </div>
                            <div class="col-md-3 mb-5 form-check">
                                <input
                                    id="Duty_IsWeeklyOff"
                                    class="form-check-input"
                                    type="checkbox"
                                    name="IsWeeklyOff"
                                    [ngModel]="duty().isWeeklyOff"
                                    (ngModelChange)="updateField('isWeeklyOff', $event)" />
                                <label class="form-check-label" for="Duty_IsWeeklyOff">{{ 'IsWeeklyOff' | localize }}</label>
                            </div>
                            <div class="col-md-3 mb-5 form-check">
                                <input
                                    id="Duty_IsRestDay"
                                    class="form-check-input"
                                    type="checkbox"
                                    name="IsRestDay"
                                    [ngModel]="duty().isRestDay"
                                    (ngModelChange)="updateField('isRestDay', $event)" />
                                <label class="form-check-label" for="Duty_IsRestDay">{{ 'IsRestDay' | localize }}</label>
                            </div>
                            <div class="col-md-3 mb-5 form-check">
                                <input
                                    id="Duty_IsHalfDay"
                                    class="form-check-input"
                                    type="checkbox"
                                    name="IsHalfDay"
                                    [ngModel]="duty().isHalfDay"
                                    (ngModelChange)="updateField('isHalfDay', $event)" />
                                <label class="form-check-label" for="Duty_IsHalfDay">{{ 'IsHalfDay' | localize }}</label>
                            </div>
                        </div>
                    </div>
                    <div class="modal-footer">
                        <button
                            [disabled]="saving()"
                            type="button"
                            class="btn btn-light-primary fw-bold"
                            (click)="close()">
                            {{ 'Cancel' | localize }}
                        </button>
                        <button
                            type="submit"
                            class="btn btn-primary fw-bold"
                            [disabled]="!dutyForm.form.valid"
                            [buttonBusy]="saving()"
                            [busyText]="l('SavingWithThreeDot')">
                            <i class="fa fa-save"></i>
                            <span>{{ 'Save' | localize }}</span>
                        </button>
                    </div>
                </form>
            }
        </div>
    </div>
</div>
