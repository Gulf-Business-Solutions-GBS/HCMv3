<div
    appBsModal
    #createOrEditModal="bs-modal"
    (onShown)="onShown()"
    class="modal fade"
    tabindex="-1"
    role="dialog"
    aria-labelledby="createOrEditModal"
    aria-hidden="true"
    [config]="{ backdrop: 'static', keyboard: !saving() }">
    <div class="modal-dialog modal-lg">
        <div class="modal-content">
            @if (active()) {
                <form #rosterDutyScheduleForm="ngForm" novalidate (ngSubmit)="save()" autocomplete="off">
                    <div class="modal-header">
                        <h4 class="modal-title">
                            @if (rosterDutySchedule().id) {
                                <span>{{ 'EditItem' | localize }}: {{ 'RosterDutySchedule' | localize }}</span>
                            } @else {
                                <span>{{ 'CreateNewItem' | localize }}: {{ 'RosterDutySchedule' | localize }}</span>
                            }
                        </h4>
                        <button
                            type="button"
                            class="btn-close"
                            (click)="close()"
                            [attr.aria-label]="l('Close')"
                            [disabled]="saving()"></button>
                    </div>
                    <div class="modal-body" style="max-height: 70vh; overflow-y: auto">
                        <div class="row">
                            <div class="col-md-4 mb-5">
                                <label class="form-label" for="RosterDutySchedule_Code">{{ 'Code' | localize }}</label>
                                <input
                                    id="RosterDutySchedule_Code"
                                    class="form-control"
                                    type="text"
                                    name="Code"
                                    [ngModel]="rosterDutySchedule().code"
                                    (ngModelChange)="updateField('code', $event)"
                                    maxlength="50"
                                    [placeholder]="l('AutoGeneratedIfEmpty')" />
                            </div>
                            <div class="col-md-4 mb-5">
                                <label class="form-label required" for="RosterDutySchedule_NameEn">{{ 'NameEn' | localize }}</label>
                                <input
                                    id="RosterDutySchedule_NameEn"
                                    #nameEnInput="ngModel"
                                    class="form-control"
                                    type="text"
                                    name="NameEn"
                                    [ngModel]="rosterDutySchedule().nameEn"
                                    (ngModelChange)="updateField('nameEn', $event)"
                                    required
                                    maxlength="200" />
                                <validation-messages [formCtrl]="nameEnInput" />
                            </div>
                            <div class="col-md-4 mb-5">
                                <label class="form-label required" for="RosterDutySchedule_NameAr">{{ 'NameAr' | localize }}</label>
                                <input
                                    id="RosterDutySchedule_NameAr"
                                    #nameArInput="ngModel"
                                    class="form-control"
                                    type="text"
                                    name="NameAr"
                                    dir="rtl"
                                    [ngModel]="rosterDutySchedule().nameAr"
                                    (ngModelChange)="updateField('nameAr', $event)"
                                    required
                                    maxlength="200" />
                                <validation-messages [formCtrl]="nameArInput" />
                            </div>
                        </div>

                        <div class="row">
                            <div class="col-md-3 mb-5">
                                <label class="form-label required" for="RosterDutySchedule_StartDate">{{ 'StartDate' | localize }}</label>
                                <input
                                    id="RosterDutySchedule_StartDate"
                                    #startDateInput="ngModel"
                                    type="date"
                                    class="form-control"
                                    name="StartDate"
                                    [ngModel]="rosterDutySchedule().startDate?.toISODate()"
                                    (ngModelChange)="updateDateField('startDate', $event)"
                                    required />
                                <validation-messages [formCtrl]="startDateInput" />
                            </div>
                            <div class="col-md-3 mb-5">
                                <label class="form-label required" for="RosterDutySchedule_DutyPeriodId">{{ 'DutyPeriod' | localize }}</label>
                                <select
                                    id="RosterDutySchedule_DutyPeriodId"
                                    #dutyPeriodIdInput="ngModel"
                                    class="form-select"
                                    name="DutyPeriodId"
                                    [ngModel]="rosterDutySchedule().dutyPeriodId"
                                    (ngModelChange)="updateField('dutyPeriodId', $event)"
                                    required>
                                    <option [ngValue]="undefined"></option>
                                    @for (dutyPeriod of dutyPeriods(); track dutyPeriod.id) {
                                        <option [ngValue]="dutyPeriod.id">{{ dutyPeriod.nameEn }}</option>
                                    }
                                </select>
                                <validation-messages [formCtrl]="dutyPeriodIdInput" />
                            </div>
                            <div class="col-md-3 mb-5">
                                <label class="form-label required" for="RosterDutySchedule_StartPoint">{{ 'StartPoint' | localize }}</label>
                                <input
                                    id="RosterDutySchedule_StartPoint"
                                    #startPointInput="ngModel"
                                    class="form-control"
                                    type="number"
                                    name="StartPoint"
                                    [ngModel]="rosterDutySchedule().startPoint"
                                    (ngModelChange)="updateField('startPoint', $event)"
                                    required />
                                <validation-messages [formCtrl]="startPointInput" />
                            </div>
                            <div class="col-md-3 mb-5">
                                <label class="form-label" for="RosterDutySchedule_HolidayCalendarId">{{ 'HolidayCalendar' | localize }}</label>
                                <select
                                    id="RosterDutySchedule_HolidayCalendarId"
                                    class="form-select"
                                    name="HolidayCalendarId"
                                    [ngModel]="rosterDutySchedule().holidayCalendarId"
                                    (ngModelChange)="updateField('holidayCalendarId', $event)">
                                    <option [ngValue]="undefined"></option>
                                    @for (holidayCalendar of holidayCalendars(); track holidayCalendar.id) {
                                        <option [ngValue]="holidayCalendar.id">{{ holidayCalendar.nameEn }}</option>
                                    }
                                </select>
                            </div>
                        </div>
                    </div>
                    <div class="modal-footer">
                        <button
                            [disabled]="saving()"
                            type="button"
                            class="btn btn-light-primary fw-bold"
                            (click)="close()">
                            {{ 'Cancel' | localize }}
                        </button>
                        <button
                            type="submit"
                            class="btn btn-primary fw-bold"
                            [disabled]="!rosterDutyScheduleForm.form.valid"
                            [buttonBusy]="saving()"
                            [busyText]="l('SavingWithThreeDot')">
                            <i class="fa fa-save"></i>
                            <span>{{ 'Save' | localize }}</span>
                        </button>
                    </div>
                </form>
            }
        </div>
    </div>
</div>
