<div
    appBsModal
    #createOrEditModal="bs-modal"
    (onShown)="onShown()"
    class="modal fade"
    tabindex="-1"
    role="dialog"
    aria-hidden="true"
    [config]="{ backdrop: 'static', keyboard: !saving() }">
    <div class="modal-dialog modal-lg">
        <div class="modal-content">
            @if (active()) {
                <form #recordForm="ngForm" novalidate (ngSubmit)="save()" autocomplete="off">
                    <div class="modal-header">
                        <h4 class="modal-title">
                            @if (record().id) {
                                <span>{{ 'EditItem' | localize }}: {{ 'AccommodationServices' | localize }}</span>
                            } @else {
                                <span>{{ 'CreateNewItem' | localize }}: {{ 'AccommodationServices' | localize }}</span>
                            }
                        </h4>
                        <button type="button" class="btn-close" (click)="close()" [disabled]="saving()"></button>
                    </div>
                    <div class="modal-body">
                        <div class="row">
                            <div class="col-md-6 mb-5">
                                <label class="form-label required" for="AccommodationService_EmployeeAccommodationId">{{ 'EmployeeAccommodation' | localize }}</label>
                                <select
                                    id="AccommodationService_EmployeeAccommodationId"
                                    #employeeAccommodationIdInput="ngModel"
                                    class="form-select"
                                    name="EmployeeAccommodationId"
                                    [ngModel]="record().employeeAccommodationId"
                                    (ngModelChange)="updateField('employeeAccommodationId', $event)"
                                    required>
                                    <option [ngValue]="undefined"></option>
                                    @for (item of employeeAccommodations(); track item.id) {
                                        <option [ngValue]="item.id">{{ employeeAccommodationLabel(item) }}</option>
                                    }
                                </select>
                                <validation-messages [formCtrl]="employeeAccommodationIdInput" />
                            </div>
                            <div class="col-md-6 mb-5">
                                <label class="form-label required" for="AccommodationService_AccommodationServiceTypeId">{{ 'AccommodationServiceType' | localize }}</label>
                                <select
                                    id="AccommodationService_AccommodationServiceTypeId"
                                    #accommodationServiceTypeIdInput="ngModel"
                                    class="form-select"
                                    name="AccommodationServiceTypeId"
                                    [ngModel]="record().accommodationServiceTypeId"
                                    (ngModelChange)="updateField('accommodationServiceTypeId', $event)"
                                    required>
                                    <option [ngValue]="undefined"></option>
                                    @for (item of accommodationServiceTypes(); track item.id) {
                                        <option [ngValue]="item.id">{{ item.nameEn }}</option>
                                    }
                                </select>
                                <validation-messages [formCtrl]="accommodationServiceTypeIdInput" />
                            </div>
                        </div>
                        <div class="row">
                            <div class="col-md-6 mb-5">
                                <label class="form-label required" for="AccommodationService_StartDate">{{ 'StartDate' | localize }}</label>
                                <input
                                    id="AccommodationService_StartDate"
                                    #startDateInput="ngModel"
                                    type="date"
                                    class="form-control"
                                    name="StartDate"
                                    [ngModel]="record().startDate?.toISODate()"
                                    (ngModelChange)="updateDateField('startDate', $event)"
                                    required />
                                <validation-messages [formCtrl]="startDateInput" />
                            </div>
                            <div class="col-md-6 mb-5">
                                <label class="form-label required" for="AccommodationService_EndDate">{{ 'EndDate' | localize }}</label>
                                <input
                                    id="AccommodationService_EndDate"
                                    #endDateInput="ngModel"
                                    type="date"
                                    class="form-control"
                                    name="EndDate"
                                    [ngModel]="record().endDate?.toISODate()"
                                    (ngModelChange)="updateDateField('endDate', $event)"
                                    required />
                                <validation-messages [formCtrl]="endDateInput" />
                            </div>
                        </div>
                        <div class="row">
                            <div class="col-md-12 mb-5">
                                <label class="form-label" for="AccommodationService_Comments">{{ 'Comments' | localize }}</label>
                                <textarea
                                    id="AccommodationService_Comments"
                                    class="form-control"
                                    name="Comments"
                                    rows="3"
                                    [ngModel]="record().comments"
                                    (ngModelChange)="updateField('comments', $event)"
                                    maxlength="1000"></textarea>
                            </div>
                        </div>
                    </div>
                    <div class="modal-footer">
                        <button [disabled]="saving()" type="button" class="btn btn-light-primary fw-bold" (click)="close()">
                            {{ 'Cancel' | localize }}
                        </button>
                        <button
                            type="submit"
                            class="btn btn-primary fw-bold"
                            [disabled]="!recordForm.form.valid"
                            [buttonBusy]="saving()"
                            [busyText]="l('SavingWithThreeDot')">
                            <i class="fa fa-save"></i>
                            <span>{{ 'Save' | localize }}</span>
                        </button>
                    </div>
                </form>
            }
        </div>
    </div>
</div>
