<div [@routerTransition]>
    <sub-header
        [title]="'PayrollAnalysisReport' | localize"
        [description]="'AnalysisReports' | localize"></sub-header>

    <div [class]="containerClass">
        <div class="card card-custom">
            <div class="card-body">
                <!-- Legacy panel is Month / Year / Run Type / Payroll Area: no date range, no employee
                     code, no employee status. -->
                <grid-report-filter
                    [showDateRange]="false"
                    [showEmployeeCode]="false"
                    [showEmployeeStatus]="false"
                    [loading]="primengTableHelper.isLoading()"
                    [exporting]="exporting()"
                    (search)="reloadPage()"
                    (exportExcel)="exportToExcel()">
                    <div class="col-md-2">
                        <label class="form-label">{{ 'Month' | localize }}</label>
                        <input
                            type="number"
                            class="form-control"
                            name="payrollAnalysisMonth"
                            min="1"
                            max="12"
                            [ngModel]="month()"
                            (ngModelChange)="month.set($event)"
                            (keydown.enter)="reloadPage()" />
                    </div>

                    <div class="col-md-2">
                        <label class="form-label">{{ 'Year' | localize }}</label>
                        <input
                            type="number"
                            class="form-control"
                            name="payrollAnalysisYear"
                            [ngModel]="year()"
                            (ngModelChange)="year.set($event)"
                            (keydown.enter)="reloadPage()" />
                    </div>

                    <div class="col-md-2">
                        <label class="form-label">{{ 'RunType' | localize }}</label>
                        <p-select
                            [options]="runTypeOptions"
                            [ngModel]="payrollRunType()"
                            (ngModelChange)="payrollRunType.set($event)"
                            name="payrollAnalysisRunType"
                            optionLabel="label"
                            optionValue="value"
                            [showClear]="true"
                            [placeholder]="'RunType' | localize"
                            styleClass="w-100" />
                    </div>
                </grid-report-filter>

                <div class="row align-items-center">
                    <!--<Primeng-TurboTable-Start>-->
                    <div class="primeng-datatable-container" [busyIf]="primengTableHelper.isLoading()">
                        <p-table
                            #dataTable
                            sortMode="multiple"
                            (onLazyLoad)="getRecords($event)"
                            [value]="primengTableHelper.records()"
                            rows="{{ primengTableHelper.defaultRecordsCountPerPage }}"
                            [paginator]="false"
                            [lazy]="true"
                            [scrollable]="true"
                            scrollDirection="horizontal"
                            [tableStyle]="{ 'min-width': '40rem' }"
                            [resizableColumns]="primengTableHelper.resizableColumns">
                            <ng-template #header>
                                <tr>
                                    <th style="min-width: 260px" pSortableColumn="orgLevel1Name">
                                        {{ 'OrgLevel1' | localize }}
                                        <p-sortIcon field="orgLevel1Name" />
                                    </th>
                                    <th style="min-width: 160px" pSortableColumn="period">
                                        {{ 'Period' | localize }}
                                        <p-sortIcon field="period" />
                                    </th>
                                    <th style="min-width: 180px" pSortableColumn="totalAmount">
                                        {{ 'Amount' | localize }}
                                        <p-sortIcon field="totalAmount" />
                                    </th>
                                </tr>
                            </ng-template>
                            <ng-template #body let-record="$implicit">
                                <tr>
                                    <td style="min-width: 260px">{{ record.orgLevel1Name }}</td>
                                    <td style="min-width: 160px">
                                        {{ record.period | luxonFormat: 'dd/MM/yyyy' }}
                                    </td>
                                    <td style="min-width: 180px">{{ record.totalAmount }}</td>
                                </tr>
                            </ng-template>
                        </p-table>
                        @if (primengTableHelper.totalRecordsCount() == 0) {
                            <div class="primeng-no-data">
                                {{ 'NoData' | localize }}
                            </div>
                        }
                        <div class="primeng-paging-container">
                            <p-paginator
                                [rows]="primengTableHelper.defaultRecordsCountPerPage"
                                #paginator
                                (onPageChange)="getRecords($event)"
                                [totalRecords]="primengTableHelper.totalRecordsCount()"
                                [rowsPerPageOptions]="primengTableHelper.predefinedRecordsCountPerPage"
                                [showCurrentPageReport]="true"
                                [currentPageReportTemplate]="
                                    'TotalRecordsCount' | localize: primengTableHelper.totalRecordsCount()
                                " />
                        </div>
                    </div>
                    <!--<Primeng-TurboTable-End>-->
                </div>
            </div>
        </div>
    </div>
</div>
