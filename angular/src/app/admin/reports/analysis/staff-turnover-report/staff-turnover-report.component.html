<div [@routerTransition]>
    <sub-header [title]="'StaffTurnoverReport' | localize" [description]="'AnalysisReports' | localize"></sub-header>

    <div [class]="containerClass">
        <div class="card card-custom">
            <div class="card-body">
                <grid-report-filter
                    [(fromDate)]="fromDate"
                    [(toDate)]="toDate"
                    [showEmployeeCode]="false"
                    [(employeeStatus)]="employeeStatus"
                    [loading]="primengTableHelper.isLoading()"
                    [exporting]="exporting"
                    (search)="reloadPage()"
                    (exportExcel)="exportToExcel()">
                </grid-report-filter>

                <div class="row align-items-center">
                    <div class="primeng-datatable-container" [busyIf]="primengTableHelper.isLoading()">
                        <p-table
                            #dataTable
                            sortMode="multiple"
                            (onLazyLoad)="getRecords($event)"
                            [value]="primengTableHelper.records()"
                            rows="{{ primengTableHelper.defaultRecordsCountPerPage }}"
                            [paginator]="false"
                            [lazy]="true"
                            [tableStyle]="{ 'min-width': '30rem' }">
                            <ng-template #header>
                                <tr>
                                    <th pSortableColumn="avgNoOfEmp">{{ 'AvgNoOfEmp' | localize }}<p-sortIcon field="avgNoOfEmp" /></th>
                                    <th>{{ 'Period' | localize }}</th>
                                    <th>{{ 'Turnover' | localize }}</th>
                                </tr>
                            </ng-template>
                            <ng-template #body let-record="$implicit">
                                <tr>
                                    <td>{{ record.avgNoOfEmp }}</td>
                                    <td>{{ record.period }}</td>
                                    <td>{{ record.turnover }}</td>
                                </tr>
                            </ng-template>
                        </p-table>
                        @if (primengTableHelper.totalRecordsCount() == 0) {
                            <div class="primeng-no-data">{{ 'NoData' | localize }}</div>
                        }
                        <div class="primeng-paging-container">
                            <p-paginator
                                [rows]="primengTableHelper.defaultRecordsCountPerPage"
                                #paginator
                                (onPageChange)="getRecords($event)"
                                [totalRecords]="primengTableHelper.totalRecordsCount()"
                                [rowsPerPageOptions]="primengTableHelper.predefinedRecordsCountPerPage"
                                [showCurrentPageReport]="true"
                                [currentPageReportTemplate]="'TotalRecordsCount' | localize: primengTableHelper.totalRecordsCount()" />
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
