<div [@routerTransition]>
    <sub-header [title]="'EmpAttendanceLogReport' | localize" [description]="'AnalysisReports' | localize"></sub-header>

    <div [class]="containerClass">
        <div class="card card-custom">
            <div class="card-body">
                <!-- Legacy panel is dtFrom / dtTo only -- no employee code box and no status combo -- so both
                     are switched off on the shared panel rather than forked away. -->
                <grid-report-filter
                    [(fromDate)]="fromDate"
                    [(toDate)]="toDate"
                    [showEmployeeCode]="false"
                    [showEmployeeStatus]="false"
                    [loading]="primengTableHelper.isLoading()"
                    [exporting]="exporting()"
                    (search)="reloadPage()"
                    (exportExcel)="exportToExcel()" />

                <div class="row align-items-center">
                    <!--<Primeng-TurboTable-Start>-->
                    <div class="primeng-datatable-container" [busyIf]="primengTableHelper.isLoading()">
                        <p-table
                            #dataTable
                            sortMode="multiple"
                            (onLazyLoad)="getRecords($event)"
                            [value]="primengTableHelper.records()"
                            rows="{{ primengTableHelper.defaultRecordsCountPerPage }}"
                            [paginator]="false"
                            [lazy]="true"
                            [scrollable]="true"
                            scrollDirection="horizontal"
                            [tableStyle]="{ 'min-width': '65rem' }"
                            [resizableColumns]="primengTableHelper.resizableColumns">
                            <ng-template #header>
                                <tr>
                                    @for (col of columns; track col.field) {
                                        @if (col.sortable) {
                                            <th [style.min-width.px]="col.width" [pSortableColumn]="col.field">
                                                {{ col.header }}
                                                <p-sortIcon [field]="col.field" />
                                            </th>
                                        } @else {
                                            <th [style.min-width.px]="col.width">{{ col.header }}</th>
                                        }
                                    }
                                </tr>
                            </ng-template>
                            <ng-template #body let-record="$implicit">
                                <tr>
                                    @for (col of columns; track col.field) {
                                        <td [style.min-width.px]="col.width">{{ record[col.field] }}</td>
                                    }
                                </tr>
                            </ng-template>
                        </p-table>
                        @if (primengTableHelper.totalRecordsCount() == 0) {
                            <div class="primeng-no-data">
                                {{ 'NoData' | localize }}
                            </div>
                        }
                        <div class="primeng-paging-container">
                            <p-paginator
                                [rows]="primengTableHelper.defaultRecordsCountPerPage"
                                #paginator
                                (onPageChange)="getRecords($event)"
                                [totalRecords]="primengTableHelper.totalRecordsCount()"
                                [rowsPerPageOptions]="primengTableHelper.predefinedRecordsCountPerPage"
                                [showCurrentPageReport]="true"
                                [currentPageReportTemplate]="
                                    'TotalRecordsCount' | localize: primengTableHelper.totalRecordsCount()
                                " />
                        </div>
                    </div>
                    <!--<Primeng-TurboTable-End>-->
                </div>
            </div>
        </div>
    </div>
</div>
