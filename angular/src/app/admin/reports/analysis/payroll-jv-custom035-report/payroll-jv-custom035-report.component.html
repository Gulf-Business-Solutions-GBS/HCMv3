<div [@routerTransition]>
    <sub-header [title]="'PayrollJVCustom035Report' | localize" [description]="'AnalysisReports' | localize"></sub-header>

    <div [class]="containerClass">
        <div class="card card-custom">
            <div class="card-body">
                <!-- Legacy panel is Payroll Area / Run Type / Month / Year / Type / Employee Code: no date
                     range and no employee status. -->
                <grid-report-filter
                    [showDateRange]="false"
                    [showEmployeeStatus]="false"
                    [employeeCode]="employeeCode()"
                    (employeeCodeChange)="employeeCode.set($event)"
                    [loading]="primengTableHelper.isLoading()"
                    [exporting]="exporting()"
                    (search)="reloadPage()"
                    (exportExcel)="exportToExcel()">
                    <div class="col-md-1">
                        <label class="form-label">{{ 'Month' | localize }}</label>
                        <input
                            type="number"
                            class="form-control"
                            name="payrollJvC35Month"
                            min="1"
                            max="12"
                            [ngModel]="month()"
                            (ngModelChange)="month.set($event)"
                            (keydown.enter)="reloadPage()" />
                    </div>

                    <div class="col-md-1">
                        <label class="form-label">{{ 'Year' | localize }}</label>
                        <input
                            type="number"
                            class="form-control"
                            name="payrollJvC35Year"
                            [ngModel]="year()"
                            (ngModelChange)="year.set($event)"
                            (keydown.enter)="reloadPage()" />
                    </div>

                    <div class="col-md-2">
                        <label class="form-label">{{ 'RunType' | localize }}</label>
                        <p-select
                            [options]="runTypeOptions"
                            [ngModel]="payrollRunType()"
                            (ngModelChange)="payrollRunType.set($event)"
                            name="payrollJvC35RunType"
                            optionLabel="label"
                            optionValue="value"
                            [showClear]="true"
                            [placeholder]="'RunType' | localize"
                            styleClass="w-100" />
                    </div>

                    <div class="col-md-3">
                        <label class="form-label">{{ 'ReportType' | localize }}</label>
                        <p-select
                            [options]="reportTypeOptions"
                            [ngModel]="reportType()"
                            (ngModelChange)="reportType.set($event)"
                            name="payrollJvC35Type"
                            optionLabel="label"
                            optionValue="value"
                            [placeholder]="'ReportType' | localize"
                            styleClass="w-100" />
                    </div>
                </grid-report-filter>

                <div class="row align-items-center">
                    <!--<Primeng-TurboTable-Start>-->
                    <div class="primeng-datatable-container" [busyIf]="primengTableHelper.isLoading()">
                        <p-table
                            #dataTable
                            sortMode="multiple"
                            (onLazyLoad)="getRecords($event)"
                            [value]="primengTableHelper.records()"
                            rows="{{ primengTableHelper.defaultRecordsCountPerPage }}"
                            [paginator]="false"
                            [lazy]="true"
                            [scrollable]="true"
                            scrollDirection="horizontal"
                            [tableStyle]="{ 'min-width': '60rem' }"
                            [resizableColumns]="primengTableHelper.resizableColumns">
                            <ng-template #header>
                                <tr>
                                    <!-- Column list comes from the backend and depends on the selected
                                         report type. Rendered untranslated on purpose. -->
                                    @for (column of columns(); track column.name) {
                                        <th style="min-width: 180px">{{ column.name }}</th>
                                    }
                                </tr>
                            </ng-template>
                            <ng-template #body let-record="$implicit">
                                <tr>
                                    @for (column of columns(); track column.name) {
                                        <td style="min-width: 180px">
                                            <span pTooltip="{{ record[column.name] }}" class="hide-overflown">
                                                {{ record[column.name] }}
                                            </span>
                                        </td>
                                    }
                                </tr>
                            </ng-template>
                        </p-table>
                        @if (primengTableHelper.totalRecordsCount() == 0) {
                            <div class="primeng-no-data">
                                {{ 'NoData' | localize }}
                            </div>
                        }
                        <div class="primeng-paging-container">
                            <p-paginator
                                [rows]="primengTableHelper.defaultRecordsCountPerPage"
                                #paginator
                                (onPageChange)="getRecords($event)"
                                [totalRecords]="primengTableHelper.totalRecordsCount()"
                                [rowsPerPageOptions]="primengTableHelper.predefinedRecordsCountPerPage"
                                [showCurrentPageReport]="true"
                                [currentPageReportTemplate]="
                                    'TotalRecordsCount' | localize: primengTableHelper.totalRecordsCount()
                                " />
                        </div>
                    </div>
                    <!--<Primeng-TurboTable-End>-->
                </div>
            </div>
        </div>
    </div>
</div>
