<div [@routerTransition]>
    <sub-header
        [title]="'OrgUnitTreeReport' | localize"
        [description]="'AnalysisReports' | localize"></sub-header>

    <div [class]="containerClass">
        <div class="card card-custom">
            <div class="card-body" [busyIf]="loading()">
                <p-tree
                    [value]="treeData()"
                    [filter]="true"
                    [filterInputAutoFocus]="false"
                    [filterPlaceholder]="'Search' | localize"
                    selectionMode="single" />
            </div>
        </div>
    </div>
</div>
