<div [@routerTransition]>
    <sub-header [title]="'PayslipReport' | localize" [description]="'PayslipReport' | localize"></sub-header>

    <div [class]="containerClass">
        <div class="card card-custom">
            <div class="card-body">
                <div class="form">
                    <div class="row mb-5">
                        <div class="col-md-3">
                            <label class="form-label required" for="PayslipReport_Month">{{ 'Month' | localize }}</label>
                            <select
                                id="PayslipReport_Month"
                                class="form-select"
                                name="Month"
                                [ngModel]="month()"
                                (ngModelChange)="month.set($event)">
                                @for (m of months; track m) {
                                    <option [ngValue]="m">{{ m }}</option>
                                }
                            </select>
                        </div>
                        <div class="col-md-3">
                            <label class="form-label required" for="PayslipReport_Year">{{ 'Year' | localize }}</label>
                            <select
                                id="PayslipReport_Year"
                                class="form-select"
                                name="Year"
                                [ngModel]="year()"
                                (ngModelChange)="year.set($event)">
                                @for (y of years; track y) {
                                    <option [ngValue]="y">{{ y }}</option>
                                }
                            </select>
                        </div>
                        <div class="col-md-2">
                            <label class="form-label" for="PayslipReport_RunType">{{ 'PayrollRunType' | localize }}</label>
                            <select
                                id="PayslipReport_RunType"
                                class="form-select"
                                name="PayrollRunType"
                                [ngModel]="payrollRunType()"
                                (ngModelChange)="payrollRunType.set($event)">
                                <option [ngValue]="0">Regular</option>
                                <option [ngValue]="1">OffCycle</option>
                            </select>
                        </div>
                        <div class="col-md-2">
                            <label class="form-label" for="PayslipReport_Status">{{ 'Status' | localize }}</label>
                            <select
                                id="PayslipReport_Status"
                                class="form-select"
                                name="EmployeeStatus"
                                [ngModel]="employeeStatus()"
                                (ngModelChange)="employeeStatus.set($event)">
                                <option [ngValue]="1">{{ 'Active' | localize }}</option>
                                <option [ngValue]="0">{{ 'Inactive' | localize }}</option>
                                <option [ngValue]="undefined">{{ 'AnyStatus' | localize }}</option>
                            </select>
                        </div>
                        <div class="col-md-2">
                            <label class="form-label" for="PayslipReport_Language">{{ 'PayslipLanguage' | localize }}</label>
                            <select
                                id="PayslipReport_Language"
                                class="form-select"
                                name="PayslipLanguage"
                                [ngModel]="language()"
                                (ngModelChange)="language.set($event)">
                                <option [ngValue]="0">English</option>
                                <option [ngValue]="1">Arabic</option>
                                <option [ngValue]="2">English/Arabic</option>
                            </select>
                        </div>
                    </div>

                    <div class="d-flex gap-3 mb-5">
                        <button
                            type="button"
                            class="btn btn-primary fw-bold"
                            [busyIf]="loading()"
                            (click)="loadRecipients()">
                            <i class="fa fa-search"></i>
                            <span>{{ 'LoadRecipients' | localize }}</span>
                        </button>

                        <button
                            type="button"
                            class="btn btn-danger fw-bold"
                            [disabled]="recipients().length === 0"
                            [busyIf]="sending()"
                            (click)="sendEmails()">
                            <i class="fa fa-envelope"></i>
                            <span>{{ 'SendPayslipEmails' | localize }}</span>
                        </button>
                    </div>

                    <h5 class="mb-3">{{ 'PayslipRecipients' | localize }} ({{ recipients().length }})</h5>
                    <p-table [value]="recipients()" [paginator]="true" [rows]="20" [loading]="loading()">
                        <ng-template pTemplate="header">
                            <tr>
                                <th>{{ 'Code' | localize }}</th>
                                <th>{{ 'Name' | localize }}</th>
                                <th>{{ 'Email' | localize }}</th>
                                <th class="text-end">{{ 'NetPay' | localize }}</th>
                            </tr>
                        </ng-template>
                        <ng-template pTemplate="body" let-record>
                            <tr>
                                <td>{{ record.employeeCode }}</td>
                                <td>{{ record.employeeName }}</td>
                                <td>{{ record.email }}</td>
                                <td class="text-end">{{ record.netPay | number: '1.3-3' }}</td>
                            </tr>
                        </ng-template>
                    </p-table>
                </div>
            </div>
        </div>
    </div>
</div>
