<div
    appBsModal
    #createOrEditModal="bs-modal"
    (onShown)="onShown()"
    class="modal fade"
    tabindex="-1"
    role="dialog"
    aria-hidden="true"
    [config]="{ backdrop: 'static', keyboard: !saving() }">
    <div class="modal-dialog modal-lg">
        <div class="modal-content">
            @if (active()) {
                <form #recordForm="ngForm" novalidate (ngSubmit)="save()" autocomplete="off">
                    <div class="modal-header">
                        <h4 class="modal-title">
                            @if (record().id) {
                                <span>{{ 'EditItem' | localize }}: {{ 'WorkflowGroupDetails' | localize }}</span>
                            } @else {
                                <span>{{ 'CreateNewItem' | localize }}: {{ 'WorkflowGroupDetails' | localize }}</span>
                            }
                        </h4>
                        <button type="button" class="btn-close" (click)="close()" [disabled]="saving()"></button>
                    </div>
                    <div class="modal-body">
                        <div class="row">
                            <div class="col-md-6 mb-5">
                                <label class="form-label required" for="WorkflowGroupDetail_RequestMasterId">{{ 'RequestMaster' | localize }}</label>
                                <select
                                    id="WorkflowGroupDetail_RequestMasterId"
                                    #requestMasterIdInput="ngModel"
                                    class="form-select"
                                    name="RequestMasterId"
                                    [ngModel]="record().requestMasterId"
                                    (ngModelChange)="updateField('requestMasterId', $event)"
                                    required>
                                    <option [ngValue]="undefined"></option>
                                    @for (requestMaster of requestMasters(); track requestMaster.id) {
                                        <option [ngValue]="requestMaster.id">{{ requestMaster.nameEn }}</option>
                                    }
                                </select>
                                <validation-messages [formCtrl]="requestMasterIdInput" />
                            </div>
                            <div class="col-md-6 mb-5">
                                <label class="form-label required" for="WorkflowGroupDetail_RequestTypeName">{{ 'RequestType' | localize }}</label>
                                <input
                                    id="WorkflowGroupDetail_RequestTypeName"
                                    #requestTypeNameInput="ngModel"
                                    type="text"
                                    class="form-control"
                                    name="RequestTypeName"
                                    maxlength="256"
                                    [ngModel]="record().requestTypeName"
                                    (ngModelChange)="updateField('requestTypeName', $event)"
                                    required />
                                <validation-messages [formCtrl]="requestTypeNameInput" />
                            </div>
                        </div>
                        <div class="row">
                            <div class="col-md-6 mb-5">
                                <label class="form-label" for="WorkflowGroupDetail_RequestSubTypeId">{{ 'RequestSubType' | localize }}</label>
                                <input
                                    id="WorkflowGroupDetail_RequestSubTypeId"
                                    type="number"
                                    class="form-control"
                                    name="RequestSubTypeId"
                                    [ngModel]="record().requestSubTypeId"
                                    (ngModelChange)="updateField('requestSubTypeId', $event)" />
                            </div>
                            <div class="col-md-6 mb-5">
                                <label class="form-label" for="WorkflowGroupDetail_CustomSubTypeId">{{ 'CustomSubType' | localize }}</label>
                                <input
                                    id="WorkflowGroupDetail_CustomSubTypeId"
                                    type="number"
                                    class="form-control"
                                    name="CustomSubTypeId"
                                    [ngModel]="record().customSubTypeId"
                                    (ngModelChange)="updateField('customSubTypeId', $event)" />
                            </div>
                            <div class="col-md-6 mb-5">
                                <label class="form-label" for="WorkflowGroupDetail_RequestAction">{{ 'RequestActionAppliesTo' | localize }}</label>
                                <select
                                    id="WorkflowGroupDetail_RequestAction"
                                    class="form-select"
                                    name="RequestAction"
                                    [ngModel]="record().requestAction"
                                    (ngModelChange)="updateField('requestAction', $event)">
                                    <option [ngValue]="undefined">{{ 'AllActions' | localize }}</option>
                                    @for (action of requestActions; track action.value) {
                                        <option [ngValue]="action.value">{{ 'WorkflowRequestAction_' + action.name | localize }}</option>
                                    }
                                </select>
                            </div>
                        </div>
                    </div>
                    <div class="modal-footer">
                        <button [disabled]="saving()" type="button" class="btn btn-light-primary fw-bold" (click)="close()">
                            {{ 'Cancel' | localize }}
                        </button>
                        <button
                            type="submit"
                            class="btn btn-primary fw-bold"
                            [disabled]="!recordForm.form.valid"
                            [buttonBusy]="saving()"
                            [busyText]="l('SavingWithThreeDot')">
                            <i class="fa fa-save"></i>
                            <span>{{ 'Save' | localize }}</span>
                        </button>
                    </div>
                </form>
            }
        </div>
    </div>
</div>
