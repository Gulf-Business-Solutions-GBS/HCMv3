<div
    appBsModal
    #actionModal="bs-modal"
    class="modal fade"
    tabindex="-1"
    role="dialog"
    aria-hidden="true"
    [config]="{ backdrop: 'static', keyboard: !saving() }">
    <div class="modal-dialog">
        <div class="modal-content">
            @if (active()) {
                <form #recordForm="ngForm" novalidate (ngSubmit)="save()" autocomplete="off">
                    <div class="modal-header">
                        <h4 class="modal-title">{{ titleKey | localize }}</h4>
                        <button type="button" class="btn-close" (click)="close()" [disabled]="saving()"></button>
                    </div>
                    <div class="modal-body">
                        @if (action() === 'Reassign') {
                            <div class="mb-5">
                                <label class="form-label required" for="WorkflowRequestAction_NewApproverEmployeeId">
                                    {{ 'DelegateTo' | localize }}
                                </label>
                                <select
                                    id="WorkflowRequestAction_NewApproverEmployeeId"
                                    #newApproverInput="ngModel"
                                    class="form-select"
                                    name="NewApproverEmployeeId"
                                    [ngModel]="newApproverEmployeeId()"
                                    (ngModelChange)="newApproverEmployeeId.set($event)"
                                    required>
                                    <option [ngValue]="undefined"></option>
                                    @for (employee of employees(); track employee.id) {
                                        <option [ngValue]="employee.id">{{ employee.code }} - {{ employee.fullNameEn }}</option>
                                    }
                                </select>
                            </div>
                        }
                        <div class="mb-5">
                            <label class="form-label" for="WorkflowRequestAction_Remark">{{ 'Remark' | localize }}</label>
                            <textarea
                                id="WorkflowRequestAction_Remark"
                                class="form-control"
                                name="Remark"
                                rows="3"
                                [ngModel]="remark()"
                                (ngModelChange)="remark.set($event)"></textarea>
                        </div>
                    </div>
                    <div class="modal-footer">
                        <button [disabled]="saving()" type="button" class="btn btn-light-primary fw-bold" (click)="close()">
                            {{ 'Cancel' | localize }}
                        </button>
                        <button
                            type="submit"
                            class="btn btn-primary fw-bold"
                            [disabled]="!recordForm.form.valid"
                            [buttonBusy]="saving()"
                            [busyText]="l('SavingWithThreeDot')">
                            <i class="fa fa-save"></i>
                            <span>{{ titleKey | localize }}</span>
                        </button>
                    </div>
                </form>
            }
        </div>
    </div>
</div>
