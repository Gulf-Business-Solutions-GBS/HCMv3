<div
    appBsModal
    #createOrEditModal="bs-modal"
    (onShown)="onShown()"
    class="modal fade"
    tabindex="-1"
    role="dialog"
    aria-hidden="true"
    [config]="{ backdrop: 'static', keyboard: !saving() }">
    <div class="modal-dialog modal-lg">
        <div class="modal-content">
            @if (active()) {
                <form #recordForm="ngForm" novalidate (ngSubmit)="save()" autocomplete="off">
                    <div class="modal-header">
                        <h4 class="modal-title">
                            @if (record().id) {
                                <span>{{ 'EditItem' | localize }}: {{ 'WorkflowRoles' | localize }}</span>
                            } @else {
                                <span>{{ 'CreateNewItem' | localize }}: {{ 'WorkflowRoles' | localize }}</span>
                            }
                        </h4>
                        <button type="button" class="btn-close" (click)="close()" [disabled]="saving()"></button>
                    </div>
                    <div class="modal-body">
                        <div class="row">
                            <div class="col-md-6 mb-5">
                                <label class="form-label required" for="WorkflowRole_Code">{{ 'Code' | localize }}</label>
                                <input
                                    id="WorkflowRole_Code"
                                    #codeInput="ngModel"
                                    type="text"
                                    class="form-control"
                                    name="Code"
                                    maxlength="64"
                                    [ngModel]="record().code"
                                    (ngModelChange)="updateField('code', $event)"
                                    required />
                                <validation-messages [formCtrl]="codeInput" />
                            </div>
                            <div class="col-md-6 mb-5">
                                <label class="form-label required" for="WorkflowRole_WorkflowRoleGroup">{{ 'WorkflowRoleGroup' | localize }}</label>
                                <select
                                    id="WorkflowRole_WorkflowRoleGroup"
                                    #groupInput="ngModel"
                                    class="form-select"
                                    name="WorkflowRoleGroup"
                                    [ngModel]="record().workflowRoleGroup"
                                    (ngModelChange)="updateField('workflowRoleGroup', $event)"
                                    required>
                                    @for (item of workflowRoleGroups; track item.value) {
                                        <option [ngValue]="item.value">{{ item.key | localize }}</option>
                                    }
                                </select>
                                <validation-messages [formCtrl]="groupInput" />
                            </div>
                        </div>
                        <div class="row">
                            <div class="col-md-6 mb-5">
                                <label class="form-label required" for="WorkflowRole_NameEn">{{ 'NameEn' | localize }}</label>
                                <input
                                    id="WorkflowRole_NameEn"
                                    #nameEnInput="ngModel"
                                    type="text"
                                    class="form-control"
                                    name="NameEn"
                                    maxlength="256"
                                    [ngModel]="record().nameEn"
                                    (ngModelChange)="updateField('nameEn', $event)"
                                    required />
                                <validation-messages [formCtrl]="nameEnInput" />
                            </div>
                            <div class="col-md-6 mb-5">
                                <label class="form-label required" for="WorkflowRole_NameAr">{{ 'NameAr' | localize }}</label>
                                <input
                                    id="WorkflowRole_NameAr"
                                    #nameArInput="ngModel"
                                    type="text"
                                    class="form-control"
                                    name="NameAr"
                                    maxlength="256"
                                    [ngModel]="record().nameAr"
                                    (ngModelChange)="updateField('nameAr', $event)"
                                    required />
                                <validation-messages [formCtrl]="nameArInput" />
                            </div>
                        </div>
                        <div class="row">
                            <div class="col-md-6 mb-5">
                                <label class="form-label" for="WorkflowRole_WorkflowRoleOrgId">{{ 'OrganizationUnit' | localize }}</label>
                                <select
                                    id="WorkflowRole_WorkflowRoleOrgId"
                                    class="form-select"
                                    name="WorkflowRoleOrgId"
                                    [ngModel]="record().workflowRoleOrgId"
                                    (ngModelChange)="updateField('workflowRoleOrgId', $event)">
                                    <option [ngValue]="undefined"></option>
                                    @for (orgUnit of orgUnits(); track orgUnit.id) {
                                        <option [ngValue]="orgUnit.id">{{ orgUnit.nameEn }}</option>
                                    }
                                </select>
                            </div>
                        </div>
                    </div>
                    <div class="modal-footer">
                        <button [disabled]="saving()" type="button" class="btn btn-light-primary fw-bold" (click)="close()">
                            {{ 'Cancel' | localize }}
                        </button>
                        <button
                            type="submit"
                            class="btn btn-primary fw-bold"
                            [disabled]="!recordForm.form.valid"
                            [buttonBusy]="saving()"
                            [busyText]="l('SavingWithThreeDot')">
                            <i class="fa fa-save"></i>
                            <span>{{ 'Save' | localize }}</span>
                        </button>
                    </div>
                </form>
            }
        </div>
    </div>
</div>
