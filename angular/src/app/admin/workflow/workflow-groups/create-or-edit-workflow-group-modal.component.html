<div
    appBsModal
    #createOrEditModal="bs-modal"
    (onShown)="onShown()"
    class="modal fade"
    tabindex="-1"
    role="dialog"
    aria-hidden="true"
    [config]="{ backdrop: 'static', keyboard: !saving() }">
    <div class="modal-dialog modal-lg">
        <div class="modal-content">
            @if (active()) {
                <form #recordForm="ngForm" novalidate (ngSubmit)="save()" autocomplete="off">
                    <div class="modal-header">
                        <h4 class="modal-title">
                            @if (record().id) {
                                <span>{{ 'EditItem' | localize }}: {{ 'WorkflowGroups' | localize }}</span>
                            } @else {
                                <span>{{ 'CreateNewItem' | localize }}: {{ 'WorkflowGroups' | localize }}</span>
                            }
                        </h4>
                        <button type="button" class="btn-close" (click)="close()" [disabled]="saving()"></button>
                    </div>
                    <div class="modal-body">
                        <div class="row">
                            <div class="col-md-6 mb-5">
                                <label class="form-label required" for="WorkflowGroup_Code">{{ 'Code' | localize }}</label>
                                <input
                                    id="WorkflowGroup_Code"
                                    #codeInput="ngModel"
                                    type="text"
                                    class="form-control"
                                    name="Code"
                                    maxlength="64"
                                    [ngModel]="record().code"
                                    (ngModelChange)="updateField('code', $event)"
                                    required />
                                <validation-messages [formCtrl]="codeInput" />
                            </div>
                            <div class="col-md-6 mb-5 d-flex align-items-end">
                                <div class="form-check form-switch">
                                    <input
                                        id="WorkflowGroup_IsDefault"
                                        type="checkbox"
                                        class="form-check-input"
                                        name="IsDefault"
                                        [ngModel]="record().isDefault"
                                        (ngModelChange)="updateField('isDefault', $event)" />
                                    <label class="form-check-label" for="WorkflowGroup_IsDefault">{{ 'IsDefault' | localize }}</label>
                                </div>
                            </div>
                        </div>
                        <div class="row">
                            <div class="col-md-6 mb-5">
                                <label class="form-label required" for="WorkflowGroup_NameEn">{{ 'NameEn' | localize }}</label>
                                <input
                                    id="WorkflowGroup_NameEn"
                                    #nameEnInput="ngModel"
                                    type="text"
                                    class="form-control"
                                    name="NameEn"
                                    maxlength="256"
                                    [ngModel]="record().nameEn"
                                    (ngModelChange)="updateField('nameEn', $event)"
                                    required />
                                <validation-messages [formCtrl]="nameEnInput" />
                            </div>
                            <div class="col-md-6 mb-5">
                                <label class="form-label required" for="WorkflowGroup_NameAr">{{ 'NameAr' | localize }}</label>
                                <input
                                    id="WorkflowGroup_NameAr"
                                    #nameArInput="ngModel"
                                    type="text"
                                    class="form-control"
                                    name="NameAr"
                                    maxlength="256"
                                    [ngModel]="record().nameAr"
                                    (ngModelChange)="updateField('nameAr', $event)"
                                    required />
                                <validation-messages [formCtrl]="nameArInput" />
                            </div>
                        </div>
                    </div>
                    <div class="modal-footer">
                        <button [disabled]="saving()" type="button" class="btn btn-light-primary fw-bold" (click)="close()">
                            {{ 'Cancel' | localize }}
                        </button>
                        <button
                            type="submit"
                            class="btn btn-primary fw-bold"
                            [disabled]="!recordForm.form.valid"
                            [buttonBusy]="saving()"
                            [busyText]="l('SavingWithThreeDot')">
                            <i class="fa fa-save"></i>
                            <span>{{ 'Save' | localize }}</span>
                        </button>
                    </div>
                </form>
            }
        </div>
    </div>
</div>
