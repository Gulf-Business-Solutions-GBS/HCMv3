<div
    appBsModal
    #createModal="bs-modal"
    (onShown)="onShown()"
    class="modal fade"
    tabindex="-1"
    role="dialog"
    aria-hidden="true"
    [config]="{ backdrop: 'static', keyboard: !saving() }">
    <div class="modal-dialog modal-lg">
        <div class="modal-content">
            @if (active()) {
                <form #recordForm="ngForm" novalidate (ngSubmit)="save()" autocomplete="off">
                    <div class="modal-header">
                        <h4 class="modal-title">{{ 'CreateNewItem' | localize }}: {{ 'WFReadLogs' | localize }}</h4>
                        <button type="button" class="btn-close" (click)="close()" [disabled]="saving()"></button>
                    </div>
                    <div class="modal-body">
                        <div class="row">
                            <div class="col-md-6 mb-5">
                                <label class="form-label required" for="WFReadLog_WorkflowRequestId">{{ 'WorkflowRequests' | localize }}</label>
                                <select
                                    id="WFReadLog_WorkflowRequestId"
                                    #workflowRequestIdInput="ngModel"
                                    class="form-select"
                                    name="WorkflowRequestId"
                                    [ngModel]="record().workflowRequestId"
                                    (ngModelChange)="updateField('workflowRequestId', $event)"
                                    required>
                                    <option [ngValue]="undefined"></option>
                                    @for (wr of workflowRequests(); track wr.id) {
                                        <option [ngValue]="wr.id">{{ wr.requestNumber }} - {{ wr.requestType }}</option>
                                    }
                                </select>
                                <validation-messages [formCtrl]="workflowRequestIdInput" />
                            </div>
                            <div class="col-md-6 mb-5">
                                <label class="form-label" for="WFReadLog_User">{{ 'User' | localize }}</label>
                                <input
                                    id="WFReadLog_User"
                                    type="text"
                                    class="form-control"
                                    name="User"
                                    maxlength="256"
                                    [ngModel]="record().user"
                                    (ngModelChange)="updateField('user', $event)" />
                            </div>
                        </div>
                    </div>
                    <div class="modal-footer">
                        <button [disabled]="saving()" type="button" class="btn btn-light-primary fw-bold" (click)="close()">
                            {{ 'Cancel' | localize }}
                        </button>
                        <button
                            type="submit"
                            class="btn btn-primary fw-bold"
                            [disabled]="!recordForm.form.valid"
                            [buttonBusy]="saving()"
                            [busyText]="l('SavingWithThreeDot')">
                            <i class="fa fa-save"></i>
                            <span>{{ 'Save' | localize }}</span>
                        </button>
                    </div>
                </form>
            }
        </div>
    </div>
</div>
