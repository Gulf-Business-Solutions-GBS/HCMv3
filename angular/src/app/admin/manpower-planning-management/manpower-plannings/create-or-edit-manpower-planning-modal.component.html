<div
    appBsModal
    #createOrEditModal="bs-modal"
    (onShown)="onShown()"
    class="modal fade"
    tabindex="-1"
    role="dialog"
    aria-hidden="true"
    [config]="{ backdrop: 'static', keyboard: !saving() }">
    <div class="modal-dialog modal-lg">
        <div class="modal-content">
            @if (active()) {
                <form #recordForm="ngForm" novalidate (ngSubmit)="save()" autocomplete="off">
                    <div class="modal-header">
                        <h4 class="modal-title">
                            @if (record().id) {
                                <span>{{ 'EditItem' | localize }}: {{ 'ManpowerPlannings' | localize }}</span>
                            } @else {
                                <span>{{ 'CreateNewItem' | localize }}: {{ 'ManpowerPlannings' | localize }}</span>
                            }
                        </h4>
                        <button type="button" class="btn-close" (click)="close()" [disabled]="saving()"></button>
                    </div>
                    <div class="modal-body">
                        <div class="row">
                            <div class="col-md-6 mb-5">
                                <label class="form-label required" for="ManpowerPlanning_EmployeeId">{{ 'Employee' | localize }}</label>
                                <select
                                    id="ManpowerPlanning_EmployeeId"
                                    #employeeIdInput="ngModel"
                                    class="form-select"
                                    name="EmployeeId"
                                    [ngModel]="record().employeeId"
                                    (ngModelChange)="updateField('employeeId', $event)"
                                    required>
                                    <option [ngValue]="undefined"></option>
                                    @for (employee of employees(); track employee.id) {
                                        <option [ngValue]="employee.id">{{ employeeLabel(employee) }}</option>
                                    }
                                </select>
                                <validation-messages [formCtrl]="employeeIdInput" />
                            </div>
                            <div class="col-md-6 mb-5">
                                <label class="form-label required" for="ManpowerPlanning_OrganizationUnitId">{{ 'OrganizationUnit' | localize }}</label>
                                <select
                                    id="ManpowerPlanning_OrganizationUnitId"
                                    #organizationUnitIdInput="ngModel"
                                    class="form-select"
                                    name="OrganizationUnitId"
                                    [ngModel]="record().organizationUnitId"
                                    (ngModelChange)="updateField('organizationUnitId', $event)"
                                    required>
                                    <option [ngValue]="undefined"></option>
                                    @for (item of organizationUnits(); track item.id) {
                                        <option [ngValue]="item.id">{{ item.displayName }}</option>
                                    }
                                </select>
                                <validation-messages [formCtrl]="organizationUnitIdInput" />
                            </div>
                        </div>
                        <div class="row">
                            <div class="col-md-6 mb-5">
                                <label class="form-label required" for="ManpowerPlanning_PeriodId">{{ 'Period' | localize }}</label>
                                <select
                                    id="ManpowerPlanning_PeriodId"
                                    #periodIdInput="ngModel"
                                    class="form-select"
                                    name="PeriodId"
                                    [ngModel]="record().periodId"
                                    (ngModelChange)="updateField('periodId', $event)"
                                    required>
                                    <option [ngValue]="undefined"></option>
                                    @for (item of periods(); track item.id) {
                                        <option [ngValue]="item.id">{{ item.name }}</option>
                                    }
                                </select>
                                <validation-messages [formCtrl]="periodIdInput" />
                            </div>
                        </div>
                        <div class="row">
                            <div class="col-md-12 mb-5">
                                <label class="form-label" for="ManpowerPlanning_RequestComments">{{ 'RequestComments' | localize }}</label>
                                <textarea
                                    id="ManpowerPlanning_RequestComments"
                                    class="form-control"
                                    name="RequestComments"
                                    rows="3"
                                    [ngModel]="record().requestComments"
                                    (ngModelChange)="updateField('requestComments', $event)"
                                    maxlength="1000"></textarea>
                            </div>
                        </div>
                    </div>
                    <div class="modal-footer">
                        <button [disabled]="saving()" type="button" class="btn btn-light-primary fw-bold" (click)="close()">
                            {{ 'Cancel' | localize }}
                        </button>
                        <button
                            type="submit"
                            class="btn btn-primary fw-bold"
                            [disabled]="!recordForm.form.valid"
                            [buttonBusy]="saving()"
                            [busyText]="l('SavingWithThreeDot')">
                            <i class="fa fa-save"></i>
                            <span>{{ 'Save' | localize }}</span>
                        </button>
                    </div>
                </form>
            }
        </div>
    </div>
</div>
