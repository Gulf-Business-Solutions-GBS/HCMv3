<div
    appBsModal
    #createOrEditModal="bs-modal"
    (onShown)="onShown()"
    class="modal fade"
    tabindex="-1"
    role="dialog"
    aria-hidden="true"
    [config]="{ backdrop: 'static', keyboard: !saving() }">
    <div class="modal-dialog modal-lg">
        <div class="modal-content">
            @if (active()) {
                <form #recordForm="ngForm" novalidate (ngSubmit)="save()" autocomplete="off">
                    <div class="modal-header">
                        <h4 class="modal-title">
                            @if (record().id) {
                                <span>{{ 'EditItem' | localize }}: {{ 'Positions' | localize }}</span>
                            } @else {
                                <span>{{ 'CreateNewItem' | localize }}: {{ 'Positions' | localize }}</span>
                            }
                        </h4>
                        <button type="button" class="btn-close" (click)="close()" [disabled]="saving()"></button>
                    </div>
                    <div class="modal-body">
                        <div class="row">
                            <div class="col-md-4 mb-5">
                                <label class="form-label" for="Position_Code">{{ 'Code' | localize }}</label>
                                <input
                                    id="Position_Code"
                                    type="text"
                                    class="form-control"
                                    name="Code"
                                    [ngModel]="record().code"
                                    (ngModelChange)="updateField('code', $event)"
                                    maxlength="64" />
                            </div>
                            <div class="col-md-4 mb-5">
                                <label class="form-label required" for="Position_NameEn">{{ 'NameEn' | localize }}</label>
                                <input
                                    id="Position_NameEn"
                                    #nameEnInput="ngModel"
                                    type="text"
                                    class="form-control"
                                    name="NameEn"
                                    [ngModel]="record().nameEn"
                                    (ngModelChange)="updateField('nameEn', $event)"
                                    required
                                    maxlength="256" />
                                <validation-messages [formCtrl]="nameEnInput" />
                            </div>
                            <div class="col-md-4 mb-5">
                                <label class="form-label required" for="Position_NameAr">{{ 'NameAr' | localize }}</label>
                                <input
                                    id="Position_NameAr"
                                    #nameArInput="ngModel"
                                    type="text"
                                    class="form-control"
                                    name="NameAr"
                                    [ngModel]="record().nameAr"
                                    (ngModelChange)="updateField('nameAr', $event)"
                                    required
                                    maxlength="256" />
                                <validation-messages [formCtrl]="nameArInput" />
                            </div>
                        </div>
                        <div class="row">
                            <div class="col-md-6 mb-5">
                                <label class="form-label required" for="Position_StartDate">{{ 'StartDate' | localize }}</label>
                                <input
                                    id="Position_StartDate"
                                    #startDateInput="ngModel"
                                    type="date"
                                    class="form-control"
                                    name="StartDate"
                                    [ngModel]="record().startDate?.toISODate()"
                                    (ngModelChange)="updateDateField('startDate', $event)"
                                    required />
                                <validation-messages [formCtrl]="startDateInput" />
                            </div>
                            <div class="col-md-6 mb-5">
                                <label class="form-label required" for="Position_EndDate">{{ 'EndDate' | localize }}</label>
                                <input
                                    id="Position_EndDate"
                                    #endDateInput="ngModel"
                                    type="date"
                                    class="form-control"
                                    name="EndDate"
                                    [ngModel]="record().endDate?.toISODate()"
                                    (ngModelChange)="updateDateField('endDate', $event)"
                                    required />
                                <validation-messages [formCtrl]="endDateInput" />
                            </div>
                        </div>
                        <div class="row">
                            <div class="col-md-4 mb-5">
                                <label class="form-label" for="Position_JobTitleId">{{ 'JobTitle' | localize }}</label>
                                <select
                                    id="Position_JobTitleId"
                                    class="form-select"
                                    name="JobTitleId"
                                    [ngModel]="record().jobTitleId"
                                    (ngModelChange)="updateField('jobTitleId', $event)">
                                    <option [ngValue]="undefined"></option>
                                    @for (item of jobTitles(); track item.id) {
                                        <option [ngValue]="item.id">{{ item.nameEn }}</option>
                                    }
                                </select>
                            </div>
                            <div class="col-md-4 mb-5">
                                <label class="form-label" for="Position_OrganizationUnitId">{{ 'OrganizationUnit' | localize }}</label>
                                <select
                                    id="Position_OrganizationUnitId"
                                    class="form-select"
                                    name="OrganizationUnitId"
                                    [ngModel]="record().organizationUnitId"
                                    (ngModelChange)="updateField('organizationUnitId', $event)">
                                    <option [ngValue]="undefined"></option>
                                    @for (item of organizationUnits(); track item.id) {
                                        <option [ngValue]="item.id">{{ item.displayName }}</option>
                                    }
                                </select>
                            </div>
                            <div class="col-md-4 mb-5">
                                <label class="form-label" for="Position_CostCenterId">{{ 'CostCenter' | localize }}</label>
                                <select
                                    id="Position_CostCenterId"
                                    class="form-select"
                                    name="CostCenterId"
                                    [ngModel]="record().costCenterId"
                                    (ngModelChange)="updateField('costCenterId', $event)">
                                    <option [ngValue]="undefined"></option>
                                    @for (item of costCenters(); track item.id) {
                                        <option [ngValue]="item.id">{{ item.nameEn }}</option>
                                    }
                                </select>
                            </div>
                        </div>
                        <div class="row">
                            <div class="col-md-4 mb-5">
                                <label class="form-label" for="Position_EmployeeGroupId">{{ 'EmployeeGroup' | localize }}</label>
                                <select
                                    id="Position_EmployeeGroupId"
                                    class="form-select"
                                    name="EmployeeGroupId"
                                    [ngModel]="record().employeeGroupId"
                                    (ngModelChange)="updateField('employeeGroupId', $event)">
                                    <option [ngValue]="undefined"></option>
                                    @for (item of employeeGroups(); track item.id) {
                                        <option [ngValue]="item.id">{{ item.nameEn }}</option>
                                    }
                                </select>
                            </div>
                            <div class="col-md-4 mb-5">
                                <label class="form-label" for="Position_EmployeeSubGroupId">{{ 'EmployeeSubGroup' | localize }}</label>
                                <select
                                    id="Position_EmployeeSubGroupId"
                                    class="form-select"
                                    name="EmployeeSubGroupId"
                                    [ngModel]="record().employeeSubGroupId"
                                    (ngModelChange)="updateField('employeeSubGroupId', $event)">
                                    <option [ngValue]="undefined"></option>
                                    @for (item of employeeSubGroups(); track item.id) {
                                        <option [ngValue]="item.id">{{ item.nameEn }}</option>
                                    }
                                </select>
                            </div>
                            <div class="col-md-4 mb-5">
                                <label class="form-label" for="Position_PayrollAreaId">{{ 'PayrollAreaId' | localize }}</label>
                                <select
                                    id="Position_PayrollAreaId"
                                    class="form-select"
                                    name="PayrollAreaId"
                                    [ngModel]="record().payrollAreaId"
                                    (ngModelChange)="updateField('payrollAreaId', $event)">
                                    <option [ngValue]="undefined"></option>
                                    @for (item of payrollAreas(); track item.id) {
                                        <option [ngValue]="item.id">{{ item.name }}</option>
                                    }
                                </select>
                            </div>
                        </div>
                        <div class="row">
                            <div class="col-md-4 mb-5">
                                <label class="form-label" for="Position_WorkLocationId">{{ 'WorkLocationId' | localize }}</label>
                                <select
                                    id="Position_WorkLocationId"
                                    class="form-select"
                                    name="WorkLocationId"
                                    [ngModel]="record().workLocationId"
                                    (ngModelChange)="updateField('workLocationId', $event)">
                                    <option [ngValue]="undefined"></option>
                                    @for (item of workLocations(); track item.id) {
                                        <option [ngValue]="item.id">{{ item.nameEn }}</option>
                                    }
                                </select>
                            </div>
                            <div class="col-md-4 mb-5">
                                <label class="form-label required" for="Position_FTELimit">{{ 'FTELimit' | localize }}</label>
                                <input
                                    id="Position_FTELimit"
                                    #fteLimitInput="ngModel"
                                    type="number"
                                    step="1"
                                    min="1"
                                    class="form-control"
                                    name="FTELimit"
                                    [ngModel]="record().fteLimit"
                                    (ngModelChange)="updateField('fteLimit', $event)"
                                    required />
                                <validation-messages [formCtrl]="fteLimitInput" />
                            </div>
                        </div>
                        <hr />
                        <div class="row">
                            <div class="col-md-4 mb-5">
                                <label class="form-label required" for="Position_MinSalary">{{ 'MinSalary' | localize }}</label>
                                <input
                                    id="Position_MinSalary"
                                    #minSalaryInput="ngModel"
                                    type="number"
                                    step="0.01"
                                    class="form-control"
                                    name="MinSalary"
                                    [ngModel]="record().minSalary"
                                    (ngModelChange)="updateField('minSalary', $event)"
                                    required />
                                <validation-messages [formCtrl]="minSalaryInput" />
                            </div>
                            <div class="col-md-4 mb-5">
                                <label class="form-label required" for="Position_MidSalary">{{ 'MidSalary' | localize }}</label>
                                <input
                                    id="Position_MidSalary"
                                    #midSalaryInput="ngModel"
                                    type="number"
                                    step="0.01"
                                    class="form-control"
                                    name="MidSalary"
                                    [ngModel]="record().midSalary"
                                    (ngModelChange)="updateField('midSalary', $event)"
                                    required />
                                <validation-messages [formCtrl]="midSalaryInput" />
                            </div>
                            <div class="col-md-4 mb-5">
                                <label class="form-label required" for="Position_MaxSalary">{{ 'MaxSalary' | localize }}</label>
                                <input
                                    id="Position_MaxSalary"
                                    #maxSalaryInput="ngModel"
                                    type="number"
                                    step="0.01"
                                    class="form-control"
                                    name="MaxSalary"
                                    [ngModel]="record().maxSalary"
                                    (ngModelChange)="updateField('maxSalary', $event)"
                                    required />
                                <validation-messages [formCtrl]="maxSalaryInput" />
                            </div>
                        </div>
                        <div class="row">
                            <div class="col-md-4 mb-5 form-check form-switch">
                                <input
                                    id="Position_Vacant"
                                    type="checkbox"
                                    class="form-check-input"
                                    name="Vacant"
                                    [ngModel]="record().vacant"
                                    (ngModelChange)="updateField('vacant', $event)" />
                                <label class="form-check-label" for="Position_Vacant">{{ 'Vacant' | localize }}</label>
                            </div>
                            <div class="col-md-4 mb-5 form-check form-switch">
                                <input
                                    id="Position_Active"
                                    type="checkbox"
                                    class="form-check-input"
                                    name="Active"
                                    [ngModel]="record().active"
                                    (ngModelChange)="updateField('active', $event)" />
                                <label class="form-check-label" for="Position_Active">{{ 'Active' | localize }}</label>
                            </div>
                            <div class="col-md-4 mb-5 form-check form-switch">
                                <input
                                    id="Position_IsBudgeted"
                                    type="checkbox"
                                    class="form-check-input"
                                    name="IsBudgeted"
                                    [ngModel]="record().isBudgeted"
                                    (ngModelChange)="updateField('isBudgeted', $event)" />
                                <label class="form-check-label" for="Position_IsBudgeted">{{ 'IsBudgeted' | localize }}</label>
                            </div>
                        </div>
                    </div>
                    <div class="modal-footer">
                        <button [disabled]="saving()" type="button" class="btn btn-light-primary fw-bold" (click)="close()">
                            {{ 'Cancel' | localize }}
                        </button>
                        <button
                            type="submit"
                            class="btn btn-primary fw-bold"
                            [disabled]="!recordForm.form.valid"
                            [buttonBusy]="saving()"
                            [busyText]="l('SavingWithThreeDot')">
                            <i class="fa fa-save"></i>
                            <span>{{ 'Save' | localize }}</span>
                        </button>
                    </div>
                </form>
            }
        </div>
    </div>
</div>
