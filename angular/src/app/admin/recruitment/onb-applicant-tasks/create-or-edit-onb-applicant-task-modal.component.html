<div
    appBsModal
    #createOrEditModal="bs-modal"
    (onShown)="onShown()"
    class="modal fade"
    tabindex="-1"
    [config]="{ backdrop: 'static', keyboard: !saving() }">
    <div class="modal-dialog modal-lg">
        <div class="modal-content">
            @if (active()) {
                <form #recordForm="ngForm" (ngSubmit)="save()">
                    <div class="modal-header">
                        <h4 class="modal-title">
                            {{ (record().id ? 'EditOnbApplicantTask' : 'CreateNewOnbApplicantTask') | localize }}
                        </h4>
                        <button type="button" class="btn-close" (click)="close()" [disabled]="saving()"></button>
                    </div>
                    <div class="modal-body">
                        <div class="mb-3">
                            <label class="form-label required" for="OnbApplicantTask_ApplicantId">{{ 'Applicant' | localize }}</label>
                            <select
                                id="OnbApplicantTask_ApplicantId"
                                #applicantInput="ngModel"
                                class="form-select"
                                name="ApplicantId"
                                [ngModel]="record().applicantId"
                                (ngModelChange)="updateField('applicantId', $event)"
                                required>
                                <option [ngValue]="undefined"></option>
                                @for (item of applicants(); track item.id) {
                                    <option [ngValue]="item.id">{{ item.fullNameEn }}</option>
                                }
                            </select>
                            <validation-messages [formCtrl]="applicantInput" />
                        </div>
                        <div class="mb-3">
                            <label class="form-label" for="OnbApplicantTask_OnbTaskId">{{ 'OnbTasks' | localize }}</label>
                            <select
                                id="OnbApplicantTask_OnbTaskId"
                                class="form-select"
                                name="OnbTaskId"
                                [ngModel]="record().onbTaskId"
                                (ngModelChange)="updateField('onbTaskId', $event)">
                                <option [ngValue]="undefined"></option>
                                @for (item of onbTasks(); track item.id) {
                                    <option [ngValue]="item.id">{{ item.taskNameEn }}</option>
                                }
                            </select>
                        </div>
                        <div class="row">
                            <div class="col-md-4 mb-3">
                                <label class="form-label" for="OnbApplicantTask_DueDays">{{ 'DueDays' | localize }}</label>
                                <input
                                    id="OnbApplicantTask_DueDays"
                                    type="number"
                                    min="0"
                                    class="form-control"
                                    name="DueDays"
                                    [ngModel]="record().dueDays"
                                    (ngModelChange)="updateField('dueDays', $event)" />
                            </div>
                            <div class="col-md-4 mb-3 form-check form-switch">
                                <input
                                    id="OnbApplicantTask_IsCompleted"
                                    class="form-check-input"
                                    type="checkbox"
                                    name="IsCompleted"
                                    [ngModel]="record().isCompleted"
                                    (ngModelChange)="updateField('isCompleted', $event)" />
                                <label class="form-check-label" for="OnbApplicantTask_IsCompleted">{{ 'IsCompleted' | localize }}</label>
                            </div>
                            <div class="col-md-4 mb-3">
                                <label class="form-label" for="OnbApplicantTask_CompletedOn">{{ 'CompletedOn' | localize }}</label>
                                <input
                                    id="OnbApplicantTask_CompletedOn"
                                    type="date"
                                    class="form-control"
                                    name="CompletedOn"
                                    [ngModel]="record().completedOn?.toISODate()"
                                    (ngModelChange)="updateDateField('completedOn', $event)" />
                            </div>
                        </div>
                        <div class="mb-3">
                            <label class="form-label" for="OnbApplicantTask_TemplateUserData">{{ 'TemplateUserData' | localize }}</label>
                            <textarea
                                id="OnbApplicantTask_TemplateUserData"
                                class="form-control"
                                name="TemplateUserData"
                                rows="3"
                                [ngModel]="record().templateUserData"
                                (ngModelChange)="updateField('templateUserData', $event)"></textarea>
                        </div>
                    </div>
                    <div class="modal-footer">
                        <button type="button" class="btn btn-secondary" (click)="close()" [disabled]="saving()">
                            {{ 'Cancel' | localize }}
                        </button>
                        <button
                            type="submit"
                            class="btn btn-primary"
                            [buttonBusy]="saving()"
                            [disabled]="!recordForm.form.valid || saving()">
                            <i class="fa fa-save"></i>
                            {{ 'Save' | localize }}
                        </button>
                    </div>
                </form>
            }
        </div>
    </div>
</div>
