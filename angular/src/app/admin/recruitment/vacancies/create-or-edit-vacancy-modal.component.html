<div
    appBsModal
    #createOrEditModal="bs-modal"
    (onShown)="onShown()"
    class="modal fade"
    tabindex="-1"
    [config]="{ backdrop: 'static', keyboard: !saving() }">
    <div class="modal-dialog modal-xl">
        <div class="modal-content">
            @if (active()) {
                <form #vacancyForm="ngForm" novalidate (ngSubmit)="save()">
                    <div class="modal-header">
                        <h4 class="modal-title">
                            {{ (record().id ? 'EditVacancy' : 'CreateNewVacancy') | localize }}
                        </h4>
                        <button type="button" class="btn-close" (click)="close()" [disabled]="saving()"></button>
                    </div>
                    <div class="modal-body" style="max-height: 70vh; overflow-y: auto">
                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label class="form-label" for="Vacancy_Code">{{ 'Code' | localize }}</label>
                                <input
                                    id="Vacancy_Code"
                                    class="form-control"
                                    type="text"
                                    name="Code"
                                    [ngModel]="record().code"
                                    (ngModelChange)="updateField('code', $event)"
                                    maxlength="50"
                                    [placeholder]="l('AutoGeneratedIfEmpty')" />
                            </div>
                            <div class="col-md-6 mb-3">
                                <label class="form-label required" for="Vacancy_VacancyTitle">{{ 'VacancyTitle' | localize }}</label>
                                <input
                                    id="Vacancy_VacancyTitle"
                                    #vacancyTitleInput="ngModel"
                                    class="form-control"
                                    type="text"
                                    name="VacancyTitle"
                                    [ngModel]="record().vacancyTitle"
                                    (ngModelChange)="updateField('vacancyTitle', $event)"
                                    required
                                    maxlength="200" />
                                <validation-messages [formCtrl]="vacancyTitleInput" />
                            </div>
                            <div class="col-md-6 mb-3">
                                <label class="form-label required" for="Vacancy_JobTitleId">{{ 'JobTitle' | localize }}</label>
                                <select
                                    id="Vacancy_JobTitleId"
                                    #jobTitleInput="ngModel"
                                    class="form-select"
                                    name="JobTitleId"
                                    [ngModel]="record().jobTitleId"
                                    (ngModelChange)="updateField('jobTitleId', $event)"
                                    required>
                                    <option [ngValue]="undefined"></option>
                                    @for (item of jobTitles(); track item.id) {
                                        <option [ngValue]="item.id">{{ item.nameEn }}</option>
                                    }
                                </select>
                                <validation-messages [formCtrl]="jobTitleInput" />
                            </div>
                            <div class="col-md-6 mb-3">
                                <label class="form-label required" for="Vacancy_OrganizationUnitId">{{ 'OrganizationUnit' | localize }}</label>
                                <select
                                    id="Vacancy_OrganizationUnitId"
                                    #orgUnitInput="ngModel"
                                    class="form-select"
                                    name="OrganizationUnitId"
                                    [ngModel]="record().organizationUnitId"
                                    (ngModelChange)="updateField('organizationUnitId', $event)"
                                    required>
                                    <option [ngValue]="undefined"></option>
                                    @for (item of organizationUnits(); track item.id) {
                                        <option [ngValue]="item.id">{{ item.displayName }}</option>
                                    }
                                </select>
                                <validation-messages [formCtrl]="orgUnitInput" />
                            </div>
                            <div class="col-md-6 mb-3">
                                <label class="form-label" for="Vacancy_RequestionDate">{{ 'RequestionDate' | localize }}</label>
                                <input
                                    id="Vacancy_RequestionDate"
                                    class="form-control"
                                    type="date"
                                    name="RequestionDate"
                                    [ngModel]="record().requestionDate?.toISODate()"
                                    (ngModelChange)="updateDateField('requestionDate', $event)" />
                            </div>
                            <div class="col-md-6 mb-3">
                                <label class="form-label" for="Vacancy_PublishOn">{{ 'PublishOn' | localize }}</label>
                                <input
                                    id="Vacancy_PublishOn"
                                    class="form-control"
                                    type="date"
                                    name="PublishOn"
                                    [ngModel]="record().publishOn?.toISODate()"
                                    (ngModelChange)="updateDateField('publishOn', $event)" />
                            </div>
                            <div class="col-md-6 mb-3">
                                <label class="form-label" for="Vacancy_ClosingDate">{{ 'ClosingDate' | localize }}</label>
                                <input
                                    id="Vacancy_ClosingDate"
                                    class="form-control"
                                    type="date"
                                    name="ClosingDate"
                                    [ngModel]="record().closingDate?.toISODate()"
                                    (ngModelChange)="updateDateField('closingDate', $event)" />
                            </div>
                            <div class="col-md-6 mb-3">
                                <label class="form-label" for="Vacancy_VacancyStatus">{{ 'VacancyStatus' | localize }}</label>
                                <select
                                    id="Vacancy_VacancyStatus"
                                    class="form-select"
                                    name="VacancyStatus"
                                    [ngModel]="record().vacancyStatus"
                                    (ngModelChange)="updateField('vacancyStatus', $event)">
                                    @for (item of vacancyStatuses; track item.value) {
                                        <option [ngValue]="item.value">{{ item.name | localize }}</option>
                                    }
                                </select>
                            </div>
                            <div class="col-md-6 mb-3">
                                <label class="form-label" for="Vacancy_EmploymentType">{{ 'EmploymentType' | localize }}</label>
                                <select
                                    id="Vacancy_EmploymentType"
                                    class="form-select"
                                    name="EmploymentType"
                                    [ngModel]="record().employmentType"
                                    (ngModelChange)="updateField('employmentType', $event)">
                                    @for (item of employmentTypes; track item.value) {
                                        <option [ngValue]="item.value">{{ item.name | localize }}</option>
                                    }
                                </select>
                            </div>
                            <div class="col-md-6 mb-3">
                                <label class="form-label" for="Vacancy_SlaDaysToFill">{{ 'SlaDaysToFill' | localize }}</label>
                                <input
                                    id="Vacancy_SlaDaysToFill"
                                    class="form-control"
                                    type="number"
                                    min="0"
                                    name="SlaDaysToFill"
                                    [ngModel]="record().slaDaysToFill"
                                    (ngModelChange)="updateField('slaDaysToFill', $event)" />
                            </div>
                            <div class="col-md-6 mb-3">
                                <label class="form-label" for="Vacancy_TotalVacancy">{{ 'TotalVacancy' | localize }}</label>
                                <input
                                    id="Vacancy_TotalVacancy"
                                    class="form-control"
                                    type="number"
                                    min="0"
                                    name="TotalVacancy"
                                    [ngModel]="record().totalVacancy"
                                    (ngModelChange)="updateField('totalVacancy', $event)" />
                            </div>
                            <div class="col-md-6 mb-3">
                                <label class="form-label" for="Vacancy_YearsOfExperience">{{ 'YearsOfExperience' | localize }}</label>
                                <input
                                    id="Vacancy_YearsOfExperience"
                                    class="form-control"
                                    type="number"
                                    min="0"
                                    name="YearsOfExperience"
                                    [ngModel]="record().yearsOfExperience"
                                    (ngModelChange)="updateField('yearsOfExperience', $event)" />
                            </div>
                            <div class="col-md-6 mb-3">
                                <label class="form-label" for="Vacancy_MonthlySalaryRange">{{ 'MonthlySalaryRange' | localize }}</label>
                                <input
                                    id="Vacancy_MonthlySalaryRange"
                                    class="form-control"
                                    type="text"
                                    name="MonthlySalaryRange"
                                    [ngModel]="record().monthlySalaryRange"
                                    (ngModelChange)="updateField('monthlySalaryRange', $event)"
                                    maxlength="100" />
                            </div>
                            <div class="col-md-6 mb-3">
                                <label class="form-label" for="Vacancy_QualificationId">{{ 'Qualification' | localize }}</label>
                                <select
                                    id="Vacancy_QualificationId"
                                    class="form-select"
                                    name="QualificationId"
                                    [ngModel]="record().qualificationId"
                                    (ngModelChange)="updateField('qualificationId', $event)">
                                    <option [ngValue]="undefined"></option>
                                    @for (item of qualifications(); track item.id) {
                                        <option [ngValue]="item.id">{{ item.nameEn }}</option>
                                    }
                                </select>
                            </div>
                            <div class="col-md-6 mb-3 form-check form-switch">
                                <input
                                    id="Vacancy_IsBudgeted"
                                    class="form-check-input"
                                    type="checkbox"
                                    name="IsBudgeted"
                                    [ngModel]="record().isBudgeted"
                                    (ngModelChange)="updateField('isBudgeted', $event)" />
                                <label class="form-check-label" for="Vacancy_IsBudgeted">{{ 'IsBudgeted' | localize }}</label>
                            </div>
                            <div class="col-md-6 mb-3">
                                <label class="form-label" for="Vacancy_TemplateOnbGroupId">{{ 'TemplateOnbGroupId' | localize }}</label>
                                <select
                                    id="Vacancy_TemplateOnbGroupId"
                                    class="form-select"
                                    name="TemplateOnbGroupId"
                                    [ngModel]="record().templateOnbGroupId"
                                    (ngModelChange)="updateField('templateOnbGroupId', $event)">
                                    <option [ngValue]="undefined"></option>
                                    @for (item of onbGroups(); track item.id) {
                                        <option [ngValue]="item.id">{{ item.nameEn }}</option>
                                    }
                                </select>
                            </div>
                            <div class="col-md-6 mb-3">
                                <label class="form-label" for="Vacancy_OnbGroupId">{{ 'OnbGroup' | localize }}</label>
                                <select
                                    id="Vacancy_OnbGroupId"
                                    class="form-select"
                                    name="OnbGroupId"
                                    [ngModel]="record().onbGroupId"
                                    (ngModelChange)="updateField('onbGroupId', $event)">
                                    <option [ngValue]="undefined"></option>
                                    @for (item of onbGroups(); track item.id) {
                                        <option [ngValue]="item.id">{{ item.nameEn }}</option>
                                    }
                                </select>
                            </div>
                            <div class="col-md-12 mb-3">
                                <label class="form-label" for="Vacancy_JobDescription">{{ 'JobDescription' | localize }}</label>
                                <textarea
                                    id="Vacancy_JobDescription"
                                    class="form-control"
                                    name="JobDescription"
                                    rows="3"
                                    [ngModel]="record().jobDescription"
                                    (ngModelChange)="updateField('jobDescription', $event)"></textarea>
                            </div>
                        </div>
                    </div>
                    <div class="modal-footer">
                        <button type="button" class="btn btn-light-primary fw-bold" (click)="close()" [disabled]="saving()">
                            {{ 'Cancel' | localize }}
                        </button>
                        <button
                            type="submit"
                            class="btn btn-primary fw-bold"
                            [disabled]="!vacancyForm.form.valid"
                            [buttonBusy]="saving()"
                            [busyText]="l('SavingWithThreeDot')">
                            <i class="fa fa-save"></i>
                            <span>{{ 'Save' | localize }}</span>
                        </button>
                    </div>
                </form>
            }
        </div>
    </div>
</div>
