<div [@routerTransition]>
    <sub-header [title]="'OnbGroupDetails' | localize" [description]="'Recruitment' | localize">
        <div role="actions">
            @if ('Pages.Recruitment.OnbGroupDetails.Create' | permission) {
                <button (click)="createRecord()" class="btn btn-primary float-end">
                    <i class="fa fa-plus btn-md-icon"></i>
                    <span class="d-none d-md-inline-block">
                        {{ 'CreateNew' | localize }}
                    </span>
                </button>
            }
        </div>
    </sub-header>

    <div [class]="containerClass">
        <div class="card card-custom">
            <div class="card-body">
                <div class="form">
                    <div class="row align-items-center mb-4">
                        <div class="col-xl-6 col-md-6">
                            <select
                                class="form-select"
                                [ngModel]="onbGroupIdFilter()"
                                (ngModelChange)="onbGroupIdFilter.set($event); getRecords()">
                                <option [ngValue]="undefined">{{ 'AllOnbGroups' | localize }}</option>
                                @for (item of onbGroups(); track item.id) {
                                    <option [ngValue]="item.id">{{ item.nameEn }}</option>
                                }
                            </select>
                        </div>
                    </div>
                </div>

                <div class="row align-items-center">
                    <p-tieredMenu #actionsMenu [model]="activeMenuItems()" [popup]="true" appendTo="body" />
                    <div class="primeng-datatable-container" [busyIf]="primengTableHelper.isLoading()">
                        <p-table
                            #dataTable
                            sortMode="multiple"
                            (onLazyLoad)="getRecords($event)"
                            [value]="primengTableHelper.records()"
                            rows="{{ primengTableHelper.defaultRecordsCountPerPage }}"
                            [paginator]="false"
                            [lazy]="true"
                            [scrollable]="true"
                            scrollDirection="horizontal"
                            [tableStyle]="{ 'min-width': '60rem' }">
                            <ng-template #header>
                                <tr>
                                    <th
                                        style="width: 130px"
                                        [hidden]="
                                            !(
                                                [
                                                    'Pages.Recruitment.OnbGroupDetails.Edit',
                                                    'Pages.Recruitment.OnbGroupDetails.Delete',
                                                ] | permissionAny
                                            )
                                        ">
                                        {{ 'Actions' | localize }}
                                    </th>
                                    <th style="min-width: 200px">{{ 'OnbTasks' | localize }}</th>
                                    <th style="min-width: 200px">{{ 'JobTitle' | localize }}</th>
                                </tr>
                            </ng-template>
                            <ng-template #body let-record="$implicit">
                                <tr>
                                    <td
                                        style="width: 130px"
                                        [hidden]="
                                            !(
                                                [
                                                    'Pages.Recruitment.OnbGroupDetails.Edit',
                                                    'Pages.Recruitment.OnbGroupDetails.Delete',
                                                ] | permissionAny
                                            )
                                        ">
                                        <button
                                            type="button"
                                            class="btn btn-primary btn-sm dropdown-toggle"
                                            (click)="showMenu($event, record, actionsMenu)">
                                            <i class="fa fa-cog"></i>
                                            {{ 'Actions' | localize }}
                                        </button>
                                    </td>
                                    <td style="min-width: 200px">{{ record.onbTaskNameEn }}</td>
                                    <td style="min-width: 200px">{{ record.jobTitleNameEn }}</td>
                                </tr>
                            </ng-template>
                        </p-table>
                        @if (primengTableHelper.totalRecordsCount() == 0) {
                            <div class="primeng-no-data">
                                {{ 'NoData' | localize }}
                            </div>
                        }
                        <div class="primeng-paging-container">
                            <p-paginator
                                [rows]="primengTableHelper.defaultRecordsCountPerPage"
                                #paginator
                                (onPageChange)="getRecords($event)"
                                [totalRecords]="primengTableHelper.totalRecordsCount()"
                                [rowsPerPageOptions]="primengTableHelper.predefinedRecordsCountPerPage"
                                [showCurrentPageReport]="true"
                                [currentPageReportTemplate]="
                                    'TotalRecordsCount' | localize: primengTableHelper.totalRecordsCount()
                                " />
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <createOrEditOnbGroupDetailModal #createOrEditModal (modalSave)="reloadPage()" />
</div>
