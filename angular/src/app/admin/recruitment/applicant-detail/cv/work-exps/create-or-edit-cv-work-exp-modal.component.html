<div
    appBsModal
    #createOrEditModal="bs-modal"
    (onShown)="onShown()"
    class="modal fade"
    tabindex="-1"
    [config]="{ backdrop: 'static', keyboard: !saving() }">
    <div class="modal-dialog modal-lg">
        <div class="modal-content">
            @if (active()) {
                <form #recordForm="ngForm" (ngSubmit)="save()">
                    <div class="modal-header">
                        <h4 class="modal-title">
                            {{ (record().id ? 'EditCVWorkExp' : 'CreateNewCVWorkExp') | localize }}
                        </h4>
                        <button type="button" class="btn-close" (click)="close()" [disabled]="saving()"></button>
                    </div>
                    <div class="modal-body">
                        <div class="mb-3">
                            <label class="form-label" for="CVWorkExp_Company">{{ 'Company' | localize }}</label>
                            <input
                                id="CVWorkExp_Company"
                                type="text"
                                class="form-control"
                                name="Company"
                                [ngModel]="record().company"
                                (ngModelChange)="updateField('company', $event)"
                                maxlength="200" />
                        </div>
                        <div class="mb-3">
                            <label class="form-label" for="CVWorkExp_Position">{{ 'Position' | localize }}</label>
                            <input
                                id="CVWorkExp_Position"
                                type="text"
                                class="form-control"
                                name="Position"
                                [ngModel]="record().position"
                                (ngModelChange)="updateField('position', $event)"
                                maxlength="200" />
                        </div>
                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label class="form-label" for="CVWorkExp_StartDate">{{ 'StartDate' | localize }}</label>
                                <input
                                    id="CVWorkExp_StartDate"
                                    type="date"
                                    class="form-control"
                                    name="StartDate"
                                    [ngModel]="record().startDate?.toISODate()"
                                    (ngModelChange)="updateDateField('startDate', $event)" />
                            </div>
                            <div class="col-md-6 mb-3">
                                <label class="form-label" for="CVWorkExp_EndDate">{{ 'EndDate' | localize }}</label>
                                <input
                                    id="CVWorkExp_EndDate"
                                    type="date"
                                    class="form-control"
                                    name="EndDate"
                                    [ngModel]="record().endDate?.toISODate()"
                                    (ngModelChange)="updateDateField('endDate', $event)" />
                            </div>
                        </div>
                        <div class="mb-3">
                            <label class="form-label" for="CVWorkExp_Responsibilities">{{ 'Responsibilities' | localize }}</label>
                            <textarea
                                id="CVWorkExp_Responsibilities"
                                class="form-control"
                                name="Responsibilities"
                                rows="3"
                                [ngModel]="record().responsibilities"
                                (ngModelChange)="updateField('responsibilities', $event)"></textarea>
                        </div>
                    </div>
                    <div class="modal-footer">
                        <button type="button" class="btn btn-secondary" (click)="close()" [disabled]="saving()">
                            {{ 'Cancel' | localize }}
                        </button>
                        <button
                            type="submit"
                            class="btn btn-primary"
                            [buttonBusy]="saving()"
                            [disabled]="!recordForm.form.valid || saving()">
                            <i class="fa fa-save"></i>
                            {{ 'Save' | localize }}
                        </button>
                    </div>
                </form>
            }
        </div>
    </div>
</div>
