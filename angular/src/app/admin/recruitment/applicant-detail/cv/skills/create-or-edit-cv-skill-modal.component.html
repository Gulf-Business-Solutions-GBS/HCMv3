<div
    appBsModal
    #createOrEditModal="bs-modal"
    (onShown)="onShown()"
    class="modal fade"
    tabindex="-1"
    [config]="{ backdrop: 'static', keyboard: !saving() }">
    <div class="modal-dialog">
        <div class="modal-content">
            @if (active()) {
                <form #recordForm="ngForm" (ngSubmit)="save()">
                    <div class="modal-header">
                        <h4 class="modal-title">
                            {{ (record().id ? 'EditCVSkill' : 'CreateNewCVSkill') | localize }}
                        </h4>
                        <button type="button" class="btn-close" (click)="close()" [disabled]="saving()"></button>
                    </div>
                    <div class="modal-body">
                        <div class="mb-3">
                            <label class="form-label required" for="CVSkill_Skill">{{ 'Skill' | localize }}</label>
                            <input
                                id="CVSkill_Skill"
                                #skillInput="ngModel"
                                type="text"
                                class="form-control"
                                name="Skill"
                                [ngModel]="record().skill"
                                (ngModelChange)="updateField('skill', $event)"
                                required
                                maxlength="200" />
                            <validation-messages [formCtrl]="skillInput" />
                        </div>
                        <div class="mb-3">
                            <label class="form-label" for="CVSkill_Proficiency">{{ 'Proficiency' | localize }}</label>
                            <select
                                id="CVSkill_Proficiency"
                                class="form-select"
                                name="Proficiency"
                                [ngModel]="record().proficiency"
                                (ngModelChange)="updateField('proficiency', $event)">
                                @for (item of proficiencyLevels; track item.value) {
                                    <option [ngValue]="item.value">{{ item.name | localize }}</option>
                                }
                            </select>
                        </div>
                    </div>
                    <div class="modal-footer">
                        <button type="button" class="btn btn-secondary" (click)="close()" [disabled]="saving()">
                            {{ 'Cancel' | localize }}
                        </button>
                        <button
                            type="submit"
                            class="btn btn-primary"
                            [buttonBusy]="saving()"
                            [disabled]="!recordForm.form.valid || saving()">
                            <i class="fa fa-save"></i>
                            {{ 'Save' | localize }}
                        </button>
                    </div>
                </form>
            }
        </div>
    </div>
</div>
