<div
    appBsModal
    #createOrEditModal="bs-modal"
    (onShown)="onShown()"
    class="modal fade"
    tabindex="-1"
    [config]="{ backdrop: 'static', keyboard: !saving() }">
    <div class="modal-dialog modal-lg">
        <div class="modal-content">
            @if (active()) {
                <form #recordForm="ngForm" (ngSubmit)="save()">
                    <div class="modal-header">
                        <h4 class="modal-title">
                            {{ (record().id ? 'EditOnbAppTaskComment' : 'CreateNewOnbAppTaskComment') | localize }}
                        </h4>
                        <button type="button" class="btn-close" (click)="close()" [disabled]="saving()"></button>
                    </div>
                    <div class="modal-body">
                        <div class="mb-3">
                            <label class="form-label required" for="OnbAppTaskComment_OnbApplicantTasksId">{{ 'OnbApplicantTasks' | localize }}</label>
                            <select
                                id="OnbAppTaskComment_OnbApplicantTasksId"
                                #taskInput="ngModel"
                                class="form-select"
                                name="OnbApplicantTasksId"
                                [ngModel]="record().onbApplicantTasksId"
                                (ngModelChange)="updateField('onbApplicantTasksId', $event)"
                                required>
                                <option [ngValue]="undefined"></option>
                                @for (item of onbApplicantTasks(); track item.id) {
                                    <option [ngValue]="item.id">{{ item.applicantFullNameEn }} - {{ item.onbTaskNameEn }}</option>
                                }
                            </select>
                            <validation-messages [formCtrl]="taskInput" />
                        </div>
                        <div class="mb-3">
                            <label class="form-label" for="OnbAppTaskComment_Comments">{{ 'Comments' | localize }}</label>
                            <textarea
                                id="OnbAppTaskComment_Comments"
                                class="form-control"
                                name="Comments"
                                rows="3"
                                [ngModel]="record().comments"
                                (ngModelChange)="updateField('comments', $event)"></textarea>
                        </div>
                        <div class="mb-3 form-check form-switch">
                            <input
                                id="OnbAppTaskComment_IsByAdmin"
                                class="form-check-input"
                                type="checkbox"
                                name="IsByAdmin"
                                [ngModel]="record().isByAdmin"
                                (ngModelChange)="updateField('isByAdmin', $event)" />
                            <label class="form-check-label" for="OnbAppTaskComment_IsByAdmin">{{ 'IsByAdmin' | localize }}</label>
                        </div>
                    </div>
                    <div class="modal-footer">
                        <button type="button" class="btn btn-secondary" (click)="close()" [disabled]="saving()">
                            {{ 'Cancel' | localize }}
                        </button>
                        <button
                            type="submit"
                            class="btn btn-primary"
                            [buttonBusy]="saving()"
                            [disabled]="!recordForm.form.valid || saving()">
                            <i class="fa fa-save"></i>
                            {{ 'Save' | localize }}
                        </button>
                    </div>
                </form>
            }
        </div>
    </div>
</div>
