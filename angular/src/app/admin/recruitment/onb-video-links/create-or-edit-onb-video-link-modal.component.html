<div
    appBsModal
    #createOrEditModal="bs-modal"
    (onShown)="onShown()"
    class="modal fade"
    tabindex="-1"
    [config]="{ backdrop: 'static', keyboard: !saving() }">
    <div class="modal-dialog">
        <div class="modal-content">
            @if (active()) {
                <form #recordForm="ngForm" (ngSubmit)="save()">
                    <div class="modal-header">
                        <h4 class="modal-title">
                            {{ (record().id ? 'EditOnbVideoLink' : 'CreateNewOnbVideoLink') | localize }}
                        </h4>
                        <button type="button" class="btn-close" (click)="close()" [disabled]="saving()"></button>
                    </div>
                    <div class="modal-body">
                        <div class="mb-3">
                            <label class="form-label required" for="OnbVideoLink_NameEn">{{ 'NameEn' | localize }}</label>
                            <input
                                id="OnbVideoLink_NameEn"
                                #nameEnInput="ngModel"
                                type="text"
                                class="form-control"
                                name="NameEn"
                                [ngModel]="record().nameEn"
                                (ngModelChange)="updateField('nameEn', $event)"
                                required
                                maxlength="200" />
                            <validation-messages [formCtrl]="nameEnInput" />
                        </div>
                        <div class="mb-3">
                            <label class="form-label required" for="OnbVideoLink_NameAr">{{ 'NameAr' | localize }}</label>
                            <input
                                id="OnbVideoLink_NameAr"
                                #nameArInput="ngModel"
                                type="text"
                                dir="rtl"
                                class="form-control"
                                name="NameAr"
                                [ngModel]="record().nameAr"
                                (ngModelChange)="updateField('nameAr', $event)"
                                required
                                maxlength="200" />
                            <validation-messages [formCtrl]="nameArInput" />
                        </div>
                        <div class="mb-3">
                            <label class="form-label" for="OnbVideoLink_Link">{{ 'Link' | localize }}</label>
                            <input
                                id="OnbVideoLink_Link"
                                type="url"
                                class="form-control"
                                name="Link"
                                [ngModel]="record().link"
                                (ngModelChange)="updateField('link', $event)"
                                maxlength="500" />
                        </div>
                        <div class="mb-3 form-check form-switch">
                            <input
                                id="OnbVideoLink_IsActive"
                                class="form-check-input"
                                type="checkbox"
                                name="IsActive"
                                [ngModel]="record().isActive"
                                (ngModelChange)="updateField('isActive', $event)" />
                            <label class="form-check-label" for="OnbVideoLink_IsActive">{{ 'IsActive' | localize }}</label>
                        </div>
                    </div>
                    <div class="modal-footer">
                        <button type="button" class="btn btn-secondary" (click)="close()" [disabled]="saving()">
                            {{ 'Cancel' | localize }}
                        </button>
                        <button
                            type="submit"
                            class="btn btn-primary"
                            [buttonBusy]="saving()"
                            [disabled]="!recordForm.form.valid || saving()">
                            <i class="fa fa-save"></i>
                            {{ 'Save' | localize }}
                        </button>
                    </div>
                </form>
            }
        </div>
    </div>
</div>
