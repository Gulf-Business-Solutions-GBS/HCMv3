<div
    appBsModal
    #createOrEditModal="bs-modal"
    (onShown)="onShown()"
    class="modal fade"
    tabindex="-1"
    role="dialog"
    aria-labelledby="createOrEditModal"
    aria-hidden="true"
    [config]="{ backdrop: 'static', keyboard: !saving() }">
    <div class="modal-dialog modal-lg">
        <div class="modal-content">
            @if (active()) {
                <form #orgUnitForm="ngForm" novalidate (ngSubmit)="save()" autocomplete="off">
                    <div class="modal-header">
                        <h4 class="modal-title">
                            @if (orgUnit().id) {
                                <span>{{ 'EditItem' | localize }}: {{ 'OrgUnit' | localize }}</span>
                            } @else {
                                <span>{{ 'CreateNewItem' | localize }}: {{ 'OrgUnit' | localize }}</span>
                            }
                        </h4>
                        <button
                            type="button"
                            class="btn-close"
                            (click)="close()"
                            [attr.aria-label]="l('Close')"
                            [disabled]="saving()"></button>
                    </div>
                    <div class="modal-body">
                        <div class="mb-5">
                            <label class="form-label" for="OrgUnit_Code">{{ 'Code' | localize }}</label>
                            <input
                                id="OrgUnit_Code"
                                class="form-control"
                                type="text"
                                name="Code"
                                [ngModel]="orgUnit().code"
                                (ngModelChange)="updateField('code', $event)"
                                maxlength="50"
                                [placeholder]="l('AutoGeneratedIfEmpty')" />
                        </div>

                        <div class="mb-5">
                            <label class="form-label required" for="OrgUnit_NameEn">{{ 'NameEn' | localize }}</label>
                            <input
                                id="OrgUnit_NameEn"
                                #nameEnInput="ngModel"
                                class="form-control"
                                type="text"
                                name="NameEn"
                                [ngModel]="orgUnit().nameEn"
                                (ngModelChange)="updateField('nameEn', $event)"
                                required
                                maxlength="200" />
                            <validation-messages [formCtrl]="nameEnInput" />
                        </div>

                        <div class="mb-5">
                            <label class="form-label required" for="OrgUnit_NameAr">{{ 'NameAr' | localize }}</label>
                            <input
                                id="OrgUnit_NameAr"
                                #nameArInput="ngModel"
                                class="form-control"
                                type="text"
                                name="NameAr"
                                dir="rtl"
                                [ngModel]="orgUnit().nameAr"
                                (ngModelChange)="updateField('nameAr', $event)"
                                required
                                maxlength="200" />
                            <validation-messages [formCtrl]="nameArInput" />
                        </div>

                        <div class="mb-5">
                            <label class="form-label" for="OrgUnit_ParentId">{{ 'ParentOrgUnit' | localize }}</label>
                            <select
                                id="OrgUnit_ParentId"
                                class="form-select"
                                name="ParentId"
                                [ngModel]="orgUnit().parentId"
                                (ngModelChange)="updateField('parentId', $event)">
                                <option [ngValue]="undefined"></option>
                                @for (unit of parentOptions(); track unit.id) {
                                    <option [ngValue]="unit.id">{{ unit.displayName }}</option>
                                }
                            </select>
                        </div>

                        <div class="mb-5">
                            <label class="form-label required" for="OrgUnit_OrganizationUnitTypeId">{{ 'OrganizationUnitType' | localize }}</label>
                            <select
                                id="OrgUnit_OrganizationUnitTypeId"
                                #organizationUnitTypeSelect="ngModel"
                                class="form-select"
                                name="OrganizationUnitTypeId"
                                [ngModel]="orgUnit().organizationUnitTypeId"
                                (ngModelChange)="updateField('organizationUnitTypeId', $event)"
                                required>
                                <option [ngValue]="undefined"></option>
                                @for (type of organizationUnitTypes(); track type.id) {
                                    <option [ngValue]="type.id">{{ type.nameEn }}</option>
                                }
                            </select>
                            <validation-messages [formCtrl]="organizationUnitTypeSelect" />
                        </div>

                        <div class="mb-5">
                            <label class="form-label" for="OrgUnit_Address">{{ 'Address' | localize }}</label>
                            <input
                                id="OrgUnit_Address"
                                class="form-control"
                                type="text"
                                name="Address"
                                [ngModel]="orgUnit().address"
                                (ngModelChange)="updateField('address', $event)"
                                maxlength="500" />
                        </div>

                        <div class="mb-5">
                            <label class="form-label" for="OrgUnit_OrgGeoLocation">{{ 'OrgGeoLocation' | localize }}</label>
                            <input
                                id="OrgUnit_OrgGeoLocation"
                                class="form-control"
                                type="text"
                                name="OrgGeoLocation"
                                [ngModel]="orgUnit().orgGeoLocation"
                                (ngModelChange)="updateField('orgGeoLocation', $event)"
                                maxlength="500" />
                        </div>

                        <div class="mb-5">
                            <label class="form-label" for="OrgUnit_PayrollAreaId">{{ 'PayrollAreaId' | localize }}</label>
                            <select
                                id="OrgUnit_PayrollAreaId"
                                class="form-select"
                                name="PayrollAreaId"
                                [ngModel]="orgUnit().payrollAreaId"
                                (ngModelChange)="updateField('payrollAreaId', $event)">
                                <option [ngValue]="undefined"></option>
                                @for (area of payrollAreas(); track area.id) {
                                    <option [ngValue]="area.id">{{ area.name }}</option>
                                }
                            </select>
                        </div>
                    </div>
                    <div class="modal-footer">
                        <button
                            [disabled]="saving()"
                            type="button"
                            class="btn btn-light-primary fw-bold"
                            (click)="close()">
                            {{ 'Cancel' | localize }}
                        </button>
                        <button
                            type="submit"
                            class="btn btn-primary fw-bold"
                            [disabled]="!orgUnitForm.form.valid"
                            [buttonBusy]="saving()"
                            [busyText]="l('SavingWithThreeDot')">
                            <i class="fa fa-save"></i>
                            <span>{{ 'Save' | localize }}</span>
                        </button>
                    </div>
                </form>
            }
        </div>
    </div>
</div>
