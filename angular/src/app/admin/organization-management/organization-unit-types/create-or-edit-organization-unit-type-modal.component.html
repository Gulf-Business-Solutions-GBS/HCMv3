<div
    appBsModal
    #createOrEditModal="bs-modal"
    (onShown)="onShown()"
    class="modal fade"
    tabindex="-1"
    role="dialog"
    aria-labelledby="createOrEditModal"
    aria-hidden="true"
    [config]="{ backdrop: 'static', keyboard: !saving() }">
    <div class="modal-dialog modal-lg">
        <div class="modal-content">
            @if (active()) {
                <form #organizationUnitTypeForm="ngForm" novalidate (ngSubmit)="save()" autocomplete="off">
                    <div class="modal-header">
                        <h4 class="modal-title">
                            @if (organizationUnitType().id) {
                                <span>{{ 'EditItem' | localize }}: {{ 'OrganizationUnitType' | localize }}</span>
                            } @else {
                                <span>{{ 'CreateNewItem' | localize }}: {{ 'OrganizationUnitType' | localize }}</span>
                            }
                        </h4>
                        <button
                            type="button"
                            class="btn-close"
                            (click)="close()"
                            [attr.aria-label]="l('Close')"
                            [disabled]="saving()"></button>
                    </div>
                    <div class="modal-body">
                        <div class="mb-5">
                            <label class="form-label required" for="OrganizationUnitType_Code">{{ 'Code' | localize }}</label>
                            <input
                                id="OrganizationUnitType_Code"
                                #codeInput="ngModel"
                                class="form-control"
                                type="text"
                                name="Code"
                                [ngModel]="organizationUnitType().code"
                                (ngModelChange)="updateField('code', $event)"
                                required
                                maxlength="50" />
                            <validation-messages [formCtrl]="codeInput" />
                        </div>

                        <div class="mb-5">
                            <label class="form-label required" for="OrganizationUnitType_NameEn">{{ 'NameEn' | localize }}</label>
                            <input
                                id="OrganizationUnitType_NameEn"
                                #nameEnInput="ngModel"
                                class="form-control"
                                type="text"
                                name="NameEn"
                                [ngModel]="organizationUnitType().nameEn"
                                (ngModelChange)="updateField('nameEn', $event)"
                                required
                                maxlength="200" />
                            <validation-messages [formCtrl]="nameEnInput" />
                        </div>

                        <div class="mb-5">
                            <label class="form-label required" for="OrganizationUnitType_NameAr">{{ 'NameAr' | localize }}</label>
                            <input
                                id="OrganizationUnitType_NameAr"
                                #nameArInput="ngModel"
                                class="form-control"
                                type="text"
                                name="NameAr"
                                dir="rtl"
                                [ngModel]="organizationUnitType().nameAr"
                                (ngModelChange)="updateField('nameAr', $event)"
                                required
                                maxlength="200" />
                            <validation-messages [formCtrl]="nameArInput" />
                        </div>

                        <div class="mb-5 form-check">
                            <input
                                id="OrganizationUnitType_AllowLeaveConflict"
                                class="form-check-input"
                                type="checkbox"
                                name="AllowLeaveConflict"
                                [ngModel]="organizationUnitType().allowLeaveConflict"
                                (ngModelChange)="updateField('allowLeaveConflict', $event)" />
                            <label class="form-check-label" for="OrganizationUnitType_AllowLeaveConflict">{{ 'AllowLeaveConflict' | localize }}</label>
                        </div>

                        <div class="mb-5 form-check">
                            <input
                                id="OrganizationUnitType_AssignPayrollArea"
                                class="form-check-input"
                                type="checkbox"
                                name="AssignPayrollArea"
                                [ngModel]="organizationUnitType().assignPayrollArea"
                                (ngModelChange)="updateField('assignPayrollArea', $event)" />
                            <label class="form-check-label" for="OrganizationUnitType_AssignPayrollArea">{{ 'AssignPayrollArea' | localize }}</label>
                        </div>
                    </div>
                    <div class="modal-footer">
                        <button
                            [disabled]="saving()"
                            type="button"
                            class="btn btn-light-primary fw-bold"
                            (click)="close()">
                            {{ 'Cancel' | localize }}
                        </button>
                        <button
                            type="submit"
                            class="btn btn-primary fw-bold"
                            [disabled]="!organizationUnitTypeForm.form.valid"
                            [buttonBusy]="saving()"
                            [busyText]="l('SavingWithThreeDot')">
                            <i class="fa fa-save"></i>
                            <span>{{ 'Save' | localize }}</span>
                        </button>
                    </div>
                </form>
            }
        </div>
    </div>
</div>
