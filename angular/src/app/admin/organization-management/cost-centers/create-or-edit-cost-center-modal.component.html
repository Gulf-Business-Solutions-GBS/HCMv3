<div
    appBsModal
    #createOrEditModal="bs-modal"
    (onShown)="onShown()"
    class="modal fade"
    tabindex="-1"
    role="dialog"
    aria-labelledby="createOrEditModal"
    aria-hidden="true"
    [config]="{ backdrop: 'static', keyboard: !saving() }">
    <div class="modal-dialog modal-lg">
        <div class="modal-content">
            @if (active()) {
                <form #costCenterForm="ngForm" novalidate (ngSubmit)="save()" autocomplete="off">
                    <div class="modal-header">
                        <h4 class="modal-title">
                            @if (costCenter().id) {
                                <span>{{ 'EditItem' | localize }}: {{ 'CostCenter' | localize }}</span>
                            } @else {
                                <span>{{ 'CreateNewItem' | localize }}: {{ 'CostCenter' | localize }}</span>
                            }
                        </h4>
                        <button
                            type="button"
                            class="btn-close"
                            (click)="close()"
                            [attr.aria-label]="l('Close')"
                            [disabled]="saving()"></button>
                    </div>
                    <div class="modal-body">
                        <div class="mb-5">
                            <label class="form-label" for="CostCenter_Code">{{ 'Code' | localize }}</label>
                            <input
                                id="CostCenter_Code"
                                class="form-control"
                                type="text"
                                name="Code"
                                [ngModel]="costCenter().code"
                                (ngModelChange)="updateField('code', $event)"
                                maxlength="50"
                                [placeholder]="l('AutoGeneratedIfEmpty')" />
                        </div>

                        <div class="mb-5">
                            <label class="form-label required" for="CostCenter_NameEn">{{ 'NameEn' | localize }}</label>
                            <input
                                id="CostCenter_NameEn"
                                #nameEnInput="ngModel"
                                class="form-control"
                                type="text"
                                name="NameEn"
                                [ngModel]="costCenter().nameEn"
                                (ngModelChange)="updateField('nameEn', $event)"
                                required
                                maxlength="200" />
                            <validation-messages [formCtrl]="nameEnInput" />
                        </div>

                        <div class="mb-5">
                            <label class="form-label required" for="CostCenter_NameAr">{{ 'NameAr' | localize }}</label>
                            <input
                                id="CostCenter_NameAr"
                                #nameArInput="ngModel"
                                class="form-control"
                                type="text"
                                name="NameAr"
                                dir="rtl"
                                [ngModel]="costCenter().nameAr"
                                (ngModelChange)="updateField('nameAr', $event)"
                                required
                                maxlength="200" />
                            <validation-messages [formCtrl]="nameArInput" />
                        </div>

                        <div class="mb-5">
                            <label class="form-label" for="CostCenter_CostCenterGroupId">{{ 'CostCenterGroup' | localize }}</label>
                            <select
                                id="CostCenter_CostCenterGroupId"
                                class="form-select"
                                name="CostCenterGroupId"
                                [ngModel]="costCenter().costCenterGroupId"
                                (ngModelChange)="updateField('costCenterGroupId', $event)">
                                <option [ngValue]="undefined"></option>
                                @for (group of costCenterGroups(); track group.id) {
                                    <option [ngValue]="group.id">{{ group.nameEn }}</option>
                                }
                            </select>
                        </div>
                    </div>
                    <div class="modal-footer">
                        <button
                            [disabled]="saving()"
                            type="button"
                            class="btn btn-light-primary fw-bold"
                            (click)="close()">
                            {{ 'Cancel' | localize }}
                        </button>
                        <button
                            type="submit"
                            class="btn btn-primary fw-bold"
                            [disabled]="!costCenterForm.form.valid"
                            [buttonBusy]="saving()"
                            [busyText]="l('SavingWithThreeDot')">
                            <i class="fa fa-save"></i>
                            <span>{{ 'Save' | localize }}</span>
                        </button>
                    </div>
                </form>
            }
        </div>
    </div>
</div>
