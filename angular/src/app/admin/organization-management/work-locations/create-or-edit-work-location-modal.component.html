<div
    appBsModal
    #createOrEditModal="bs-modal"
    (onShown)="onShown()"
    class="modal fade"
    tabindex="-1"
    role="dialog"
    aria-labelledby="createOrEditModal"
    aria-hidden="true"
    [config]="{ backdrop: 'static', keyboard: !saving() }">
    <div class="modal-dialog modal-lg">
        <div class="modal-content">
            @if (active()) {
                <form #workLocationForm="ngForm" novalidate (ngSubmit)="save()" autocomplete="off">
                    <div class="modal-header">
                        <h4 class="modal-title">
                            @if (workLocation().id) {
                                <span>{{ 'EditItem' | localize }}: {{ 'WorkLocation' | localize }}</span>
                            } @else {
                                <span>{{ 'CreateNewItem' | localize }}: {{ 'WorkLocation' | localize }}</span>
                            }
                        </h4>
                        <button
                            type="button"
                            class="btn-close"
                            (click)="close()"
                            [attr.aria-label]="l('Close')"
                            [disabled]="saving()"></button>
                    </div>
                    <div class="modal-body">
                        <div class="mb-5">
                            <label class="form-label" for="WorkLocation_Code">{{ 'Code' | localize }}</label>
                            <input
                                id="WorkLocation_Code"
                                class="form-control"
                                type="text"
                                name="Code"
                                [ngModel]="workLocation().code"
                                (ngModelChange)="updateField('code', $event)"
                                maxlength="50"
                                [placeholder]="l('AutoGeneratedIfEmpty')" />
                        </div>

                        <div class="mb-5">
                            <label class="form-label required" for="WorkLocation_NameEn">{{ 'NameEn' | localize }}</label>
                            <input
                                id="WorkLocation_NameEn"
                                #nameEnInput="ngModel"
                                class="form-control"
                                type="text"
                                name="NameEn"
                                [ngModel]="workLocation().nameEn"
                                (ngModelChange)="updateField('nameEn', $event)"
                                required
                                maxlength="200" />
                            <validation-messages [formCtrl]="nameEnInput" />
                        </div>

                        <div class="mb-5">
                            <label class="form-label required" for="WorkLocation_NameAr">{{ 'NameAr' | localize }}</label>
                            <input
                                id="WorkLocation_NameAr"
                                #nameArInput="ngModel"
                                class="form-control"
                                type="text"
                                name="NameAr"
                                dir="rtl"
                                [ngModel]="workLocation().nameAr"
                                (ngModelChange)="updateField('nameAr', $event)"
                                required
                                maxlength="200" />
                            <validation-messages [formCtrl]="nameArInput" />
                        </div>

                        <div class="mb-5">
                            <label class="form-label" for="WorkLocation_Latitude">{{ 'Latitude' | localize }}</label>
                            <input
                                id="WorkLocation_Latitude"
                                class="form-control"
                                type="number"
                                step="any"
                                name="Latitude"
                                [ngModel]="workLocation().latitude"
                                (ngModelChange)="updateField('latitude', $event)" />
                        </div>

                        <div class="mb-5">
                            <label class="form-label" for="WorkLocation_Longitude">{{ 'Longitude' | localize }}</label>
                            <input
                                id="WorkLocation_Longitude"
                                class="form-control"
                                type="number"
                                step="any"
                                name="Longitude"
                                [ngModel]="workLocation().longitude"
                                (ngModelChange)="updateField('longitude', $event)" />
                        </div>

                        <div class="mb-5">
                            <label class="form-label" for="WorkLocation_GeoRange">{{ 'GeoRange' | localize }}</label>
                            <input
                                id="WorkLocation_GeoRange"
                                class="form-control"
                                type="number"
                                step="any"
                                name="GeoRange"
                                [ngModel]="workLocation().geoRange"
                                (ngModelChange)="updateField('geoRange', $event)" />
                        </div>

                        <div class="mb-5">
                            <label class="form-label" for="WorkLocation_Address">{{ 'Address' | localize }}</label>
                            <input
                                id="WorkLocation_Address"
                                class="form-control"
                                type="text"
                                name="Address"
                                [ngModel]="workLocation().address"
                                (ngModelChange)="updateField('address', $event)"
                                maxlength="500" />
                        </div>

                        <div class="mb-5">
                            <label class="form-label" for="WorkLocation_GeoFenceCoordinates">{{ 'GeoFenceCoordinates' | localize }}</label>
                            <input
                                id="WorkLocation_GeoFenceCoordinates"
                                class="form-control"
                                type="text"
                                name="GeoFenceCoordinates"
                                [ngModel]="workLocation().geoFenceCoordinates"
                                (ngModelChange)="updateField('geoFenceCoordinates', $event)" />
                        </div>

                        <div class="mb-5 form-check">
                            <input
                                id="WorkLocation_IsActive"
                                class="form-check-input"
                                type="checkbox"
                                name="IsActive"
                                [ngModel]="workLocation().isActive"
                                (ngModelChange)="updateField('isActive', $event)" />
                            <label class="form-check-label" for="WorkLocation_IsActive">{{ 'IsActive' | localize }}</label>
                        </div>
                    </div>
                    <div class="modal-footer">
                        <button
                            [disabled]="saving()"
                            type="button"
                            class="btn btn-light-primary fw-bold"
                            (click)="close()">
                            {{ 'Cancel' | localize }}
                        </button>
                        <button
                            type="submit"
                            class="btn btn-primary fw-bold"
                            [disabled]="!workLocationForm.form.valid"
                            [buttonBusy]="saving()"
                            [busyText]="l('SavingWithThreeDot')">
                            <i class="fa fa-save"></i>
                            <span>{{ 'Save' | localize }}</span>
                        </button>
                    </div>
                </form>
            }
        </div>
    </div>
</div>
