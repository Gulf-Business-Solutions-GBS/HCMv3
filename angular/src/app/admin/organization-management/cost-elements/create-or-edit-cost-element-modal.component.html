<div
    appBsModal
    #createOrEditModal="bs-modal"
    (onShown)="onShown()"
    class="modal fade"
    tabindex="-1"
    role="dialog"
    aria-labelledby="createOrEditModal"
    aria-hidden="true"
    [config]="{ backdrop: 'static', keyboard: !saving() }">
    <div class="modal-dialog modal-lg">
        <div class="modal-content">
            @if (active()) {
                <form #costElementForm="ngForm" novalidate (ngSubmit)="save()" autocomplete="off">
                    <div class="modal-header">
                        <h4 class="modal-title">
                            @if (costElement().id) {
                                <span>{{ 'EditItem' | localize }}: {{ 'CostElement' | localize }}</span>
                            } @else {
                                <span>{{ 'CreateNewItem' | localize }}: {{ 'CostElement' | localize }}</span>
                            }
                        </h4>
                        <button
                            type="button"
                            class="btn-close"
                            (click)="close()"
                            [attr.aria-label]="l('Close')"
                            [disabled]="saving()"></button>
                    </div>
                    <div class="modal-body">
                        <div class="mb-5">
                            <label class="form-label" for="CostElement_Code">{{ 'Code' | localize }}</label>
                            <input
                                id="CostElement_Code"
                                class="form-control"
                                type="text"
                                name="Code"
                                [ngModel]="costElement().code"
                                (ngModelChange)="updateField('code', $event)"
                                maxlength="50"
                                [placeholder]="l('AutoGeneratedIfEmpty')" />
                        </div>

                        <div class="mb-5">
                            <label class="form-label required" for="CostElement_NameEn">{{ 'NameEn' | localize }}</label>
                            <input
                                id="CostElement_NameEn"
                                #nameEnInput="ngModel"
                                class="form-control"
                                type="text"
                                name="NameEn"
                                [ngModel]="costElement().nameEn"
                                (ngModelChange)="updateField('nameEn', $event)"
                                required
                                maxlength="200" />
                            <validation-messages [formCtrl]="nameEnInput" />
                        </div>

                        <div class="mb-5">
                            <label class="form-label required" for="CostElement_NameAr">{{ 'NameAr' | localize }}</label>
                            <input
                                id="CostElement_NameAr"
                                #nameArInput="ngModel"
                                class="form-control"
                                type="text"
                                name="NameAr"
                                dir="rtl"
                                [ngModel]="costElement().nameAr"
                                (ngModelChange)="updateField('nameAr', $event)"
                                required
                                maxlength="200" />
                            <validation-messages [formCtrl]="nameArInput" />
                        </div>

                        <div class="mb-5">
                            <label class="form-label" for="CostElement_CostElementTypeId">{{ 'CostElementType' | localize }}</label>
                            <select
                                id="CostElement_CostElementTypeId"
                                class="form-select"
                                name="CostElementTypeId"
                                [ngModel]="costElement().costElementTypeId"
                                (ngModelChange)="updateField('costElementTypeId', $event)">
                                <option [ngValue]="undefined"></option>
                                @for (type of costElementTypes(); track type.id) {
                                    <option [ngValue]="type.id">{{ type.nameEn }}</option>
                                }
                            </select>
                        </div>
                    </div>
                    <div class="modal-footer">
                        <button
                            [disabled]="saving()"
                            type="button"
                            class="btn btn-light-primary fw-bold"
                            (click)="close()">
                            {{ 'Cancel' | localize }}
                        </button>
                        <button
                            type="submit"
                            class="btn btn-primary fw-bold"
                            [disabled]="!costElementForm.form.valid"
                            [buttonBusy]="saving()"
                            [busyText]="l('SavingWithThreeDot')">
                            <i class="fa fa-save"></i>
                            <span>{{ 'Save' | localize }}</span>
                        </button>
                    </div>
                </form>
            }
        </div>
    </div>
</div>
