<div
    appBsModal
    #createOrEditModal="bs-modal"
    (onShown)="onShown()"
    class="modal fade"
    tabindex="-1"
    role="dialog"
    aria-labelledby="createOrEditModal"
    aria-hidden="true"
    [config]="{ backdrop: 'static', keyboard: !saving() }">
    <div class="modal-dialog modal-lg">
        <div class="modal-content">
            @if (active()) {
                <form #clearanceRequestFieldDetailForm="ngForm" novalidate (ngSubmit)="save()" autocomplete="off">
                    <div class="modal-header">
                        <h4 class="modal-title">
                            @if (clearanceRequestFieldDetail().id) {
                                <span>{{ 'EditingClearanceRequestFieldDetail' | localize }}</span>
                            } @else {
                                <span>{{ 'CreatingNewClearanceRequestFieldDetail' | localize }}</span>
                            }
                        </h4>
                        <button
                            type="button"
                            class="btn-close"
                            (click)="close()"
                            [attr.aria-label]="l('Close')"
                            [disabled]="saving()"></button>
                    </div>
                    <div class="modal-body">
                        <div class="mb-5">
                            <label class="form-label" for="ClearanceRequestFieldDetail_ClearanceRequestFieldId">{{ 'ClearanceRequestField' | localize }}</label>
                            <select
                                id="ClearanceRequestFieldDetail_ClearanceRequestFieldId"
                                class="form-select"
                                name="ClearanceRequestFieldId"
                                [ngModel]="clearanceRequestFieldDetail().clearanceRequestFieldId"
                                (ngModelChange)="updateField('clearanceRequestFieldId', $event)">
                                <option [ngValue]="undefined"></option>
                                @for (clearanceRequestField of clearanceRequestFields(); track clearanceRequestField.id) {
                                    <option [ngValue]="clearanceRequestField.id">{{ clearanceRequestField.nameEn }}</option>
                                }
                            </select>
                        </div>
                    </div>
                    <div class="modal-footer">
                        <button
                            [disabled]="saving()"
                            type="button"
                            class="btn btn-light-primary fw-bold"
                            (click)="close()">
                            {{ 'Cancel' | localize }}
                        </button>
                        <button
                            type="submit"
                            class="btn btn-primary fw-bold"
                            [disabled]="!clearanceRequestFieldDetailForm.form.valid"
                            [buttonBusy]="saving()"
                            [busyText]="l('SavingWithThreeDot')">
                            <i class="fa fa-save"></i>
                            <span>{{ 'Save' | localize }}</span>
                        </button>
                    </div>
                </form>
            }
        </div>
    </div>
</div>
