<div
    appBsModal
    #createOrEditModal="bs-modal"
    (onShown)="onShown()"
    class="modal fade"
    tabindex="-1"
    role="dialog"
    aria-labelledby="createOrEditModal"
    aria-hidden="true"
    [config]="{ backdrop: 'static', keyboard: !saving() }">
    <div class="modal-dialog modal-lg">
        <div class="modal-content">
            @if (active()) {
                <form #clearanceRequestFieldForm="ngForm" novalidate (ngSubmit)="save()" autocomplete="off">
                    <div class="modal-header">
                        <h4 class="modal-title">
                            @if (clearanceRequestField().id) {
                                <span>{{ 'EditingClearanceRequestField' | localize }}</span>
                            } @else {
                                <span>{{ 'CreatingNewClearanceRequestField' | localize }}</span>
                            }
                        </h4>
                        <button
                            type="button"
                            class="btn-close"
                            (click)="close()"
                            [attr.aria-label]="l('Close')"
                            [disabled]="saving()"></button>
                    </div>
                    <div class="modal-body">
                        <div class="mb-5">
                            <label class="form-label" for="ClearanceRequestField_Code">{{ 'Code' | localize }}</label>
                            <input
                                id="ClearanceRequestField_Code"
                                class="form-control"
                                type="text"
                                name="Code"
                                [ngModel]="clearanceRequestField().code"
                                (ngModelChange)="updateField('code', $event)"
                                maxlength="50" [placeholder]="l('AutoGeneratedIfEmpty')" />
                            
                        </div>

                        <div class="mb-5">
                            <label class="form-label required" for="ClearanceRequestField_NameEn">{{ 'NameEn' | localize }}</label>
                            <input
                                id="ClearanceRequestField_NameEn"
                                #nameEnInput="ngModel"
                                class="form-control"
                                type="text"
                                name="NameEn"
                                [ngModel]="clearanceRequestField().nameEn"
                                (ngModelChange)="updateField('nameEn', $event)"
                                required
                                maxlength="200" />
                            <validation-messages [formCtrl]="nameEnInput" />
                        </div>

                        <div class="mb-5">
                            <label class="form-label required" for="ClearanceRequestField_NameAr">{{ 'NameAr' | localize }}</label>
                            <input
                                id="ClearanceRequestField_NameAr"
                                #nameArInput="ngModel"
                                class="form-control"
                                type="text"
                                name="NameAr"
                                dir="rtl"
                                [ngModel]="clearanceRequestField().nameAr"
                                (ngModelChange)="updateField('nameAr', $event)"
                                required
                                maxlength="200" />
                            <validation-messages [formCtrl]="nameArInput" />
                        </div>

                        <div class="mb-5">
                            <label class="form-label" for="ClearanceRequestField_ClearanceRequestTypeId">{{ 'ClearanceRequestType' | localize }}</label>
                            <select
                                id="ClearanceRequestField_ClearanceRequestTypeId"
                                class="form-select"
                                name="ClearanceRequestTypeId"
                                [ngModel]="clearanceRequestField().clearanceRequestTypeId"
                                (ngModelChange)="updateField('clearanceRequestTypeId', $event)">
                                <option [ngValue]="undefined"></option>
                                @for (clearanceRequestType of clearanceRequestTypes(); track clearanceRequestType.id) {
                                    <option [ngValue]="clearanceRequestType.id">{{ clearanceRequestType.nameEn }}</option>
                                }
                            </select>
                        </div>

                        <div class="mb-5 form-check">
                            <input
                                id="ClearanceRequestField_IsActive"
                                type="checkbox"
                                class="form-check-input"
                                name="IsActive"
                                [ngModel]="clearanceRequestField().isActive"
                                (ngModelChange)="updateField('isActive', $event)" />
                            <label class="form-check-label" for="ClearanceRequestField_IsActive">{{ 'IsActive' | localize }}</label>
                        </div>
                    </div>
                    <div class="modal-footer">
                        <button
                            [disabled]="saving()"
                            type="button"
                            class="btn btn-light-primary fw-bold"
                            (click)="close()">
                            {{ 'Cancel' | localize }}
                        </button>
                        <button
                            type="submit"
                            class="btn btn-primary fw-bold"
                            [disabled]="!clearanceRequestFieldForm.form.valid"
                            [buttonBusy]="saving()"
                            [busyText]="l('SavingWithThreeDot')">
                            <i class="fa fa-save"></i>
                            <span>{{ 'Save' | localize }}</span>
                        </button>
                    </div>
                </form>
            }
        </div>
    </div>
</div>
