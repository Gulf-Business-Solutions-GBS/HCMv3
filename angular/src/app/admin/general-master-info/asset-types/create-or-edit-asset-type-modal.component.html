<div
    appBsModal
    #createOrEditModal="bs-modal"
    (onShown)="onShown()"
    class="modal fade"
    tabindex="-1"
    role="dialog"
    aria-labelledby="createOrEditModal"
    aria-hidden="true"
    [config]="{ backdrop: 'static', keyboard: !saving() }">
    <div class="modal-dialog modal-lg">
        <div class="modal-content">
            @if (active()) {
                <form #assetTypeForm="ngForm" novalidate (ngSubmit)="save()" autocomplete="off">
                    <div class="modal-header">
                        <h4 class="modal-title">
                            @if (assetType().id) {
                                <span>{{ 'EditingAssetType' | localize }}</span>
                            } @else {
                                <span>{{ 'CreatingNewAssetType' | localize }}</span>
                            }
                        </h4>
                        <button
                            type="button"
                            class="btn-close"
                            (click)="close()"
                            [attr.aria-label]="l('Close')"
                            [disabled]="saving()"></button>
                    </div>
                    <div class="modal-body">
                        <div class="mb-5">
                            <label class="form-label" for="AssetType_Code">{{ 'Code' | localize }}</label>
                            <input
                                id="AssetType_Code"
                                class="form-control"
                                type="text"
                                name="Code"
                                [ngModel]="assetType().code"
                                (ngModelChange)="updateField('code', $event)"
                                maxlength="50"
                                [placeholder]="l('AutoGeneratedIfEmpty')" />
                        </div>

                        <div class="mb-5">
                            <label class="form-label required" for="AssetType_NameEn">{{ 'NameEn' | localize }}</label>
                            <input
                                id="AssetType_NameEn"
                                #nameEnInput="ngModel"
                                class="form-control"
                                type="text"
                                name="NameEn"
                                [ngModel]="assetType().nameEn"
                                (ngModelChange)="updateField('nameEn', $event)"
                                required
                                maxlength="200" />
                            <validation-messages [formCtrl]="nameEnInput" />
                        </div>

                        <div class="mb-5">
                            <label class="form-label required" for="AssetType_NameAr">{{ 'NameAr' | localize }}</label>
                            <input
                                id="AssetType_NameAr"
                                #nameArInput="ngModel"
                                class="form-control"
                                type="text"
                                name="NameAr"
                                dir="rtl"
                                [ngModel]="assetType().nameAr"
                                (ngModelChange)="updateField('nameAr', $event)"
                                required
                                maxlength="200" />
                            <validation-messages [formCtrl]="nameArInput" />
                        </div>

                        <div class="mb-5">
                            <label class="form-label" for="AssetType_WageTypeId">{{ 'WageType' | localize }}</label>
                            <select
                                id="AssetType_WageTypeId"
                                class="form-select"
                                name="WageTypeId"
                                [ngModel]="assetType().wageTypeId"
                                (ngModelChange)="updateField('wageTypeId', $event)">
                                <option [ngValue]="undefined"></option>
                                @for (wageType of wageTypes(); track wageType.id) {
                                    <option [ngValue]="wageType.id">{{ wageType.code }} - {{ wageType.nameEn }}</option>
                                }
                            </select>
                        </div>

                        <div class="mb-5 form-check">
                            <input
                                id="AssetType_IncludeInWorkflow"
                                class="form-check-input"
                                type="checkbox"
                                name="IncludeInWorkflow"
                                [ngModel]="assetType().includeInWorkflow"
                                (ngModelChange)="updateField('includeInWorkflow', $event)" />
                            <label class="form-check-label" for="AssetType_IncludeInWorkflow">{{ 'IncludeInWorkflow' | localize }}</label>
                        </div>
                    </div>
                    <div class="modal-footer">
                        <button [disabled]="saving()" type="button" class="btn btn-light-primary fw-bold" (click)="close()">
                            {{ 'Cancel' | localize }}
                        </button>
                        <button
                            type="submit"
                            class="btn btn-primary fw-bold"
                            [disabled]="!assetTypeForm.form.valid"
                            [buttonBusy]="saving()"
                            [busyText]="l('SavingWithThreeDot')">
                            <i class="fa fa-save"></i>
                            <span>{{ 'Save' | localize }}</span>
                        </button>
                    </div>
                </form>
            }
        </div>
    </div>
</div>
