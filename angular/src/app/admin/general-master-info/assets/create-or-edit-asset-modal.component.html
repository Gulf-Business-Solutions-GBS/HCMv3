<div
    appBsModal
    #createOrEditModal="bs-modal"
    (onShown)="onShown()"
    class="modal fade"
    tabindex="-1"
    role="dialog"
    aria-labelledby="createOrEditModal"
    aria-hidden="true"
    [config]="{ backdrop: 'static', keyboard: !saving() }">
    <div class="modal-dialog modal-lg">
        <div class="modal-content">
            @if (active()) {
                <form #assetForm="ngForm" novalidate (ngSubmit)="save()" autocomplete="off">
                    <div class="modal-header">
                        <h4 class="modal-title">
                            @if (asset().id) {
                                <span>{{ 'EditingAsset' | localize }}</span>
                            } @else {
                                <span>{{ 'CreatingNewAsset' | localize }}</span>
                            }
                        </h4>
                        <button
                            type="button"
                            class="btn-close"
                            (click)="close()"
                            [attr.aria-label]="l('Close')"
                            [disabled]="saving()"></button>
                    </div>
                    <div class="modal-body">
                        <div class="row">
                            <div class="col-md-4 mb-5">
                                <label class="form-label" for="Asset_Code">{{ 'Code' | localize }}</label>
                                <input
                                    id="Asset_Code"
                                    class="form-control"
                                    type="text"
                                    name="Code"
                                    [ngModel]="asset().code"
                                    (ngModelChange)="updateField('code', $event)"
                                    maxlength="50"
                                    [placeholder]="l('AutoGeneratedIfEmpty')" />
                            </div>

                            <div class="col-md-4 mb-5">
                                <label class="form-label required" for="Asset_NameEn">{{ 'NameEn' | localize }}</label>
                                <input
                                    id="Asset_NameEn"
                                    #nameEnInput="ngModel"
                                    class="form-control"
                                    type="text"
                                    name="NameEn"
                                    [ngModel]="asset().nameEn"
                                    (ngModelChange)="updateField('nameEn', $event)"
                                    required
                                    maxlength="200" />
                                <validation-messages [formCtrl]="nameEnInput" />
                            </div>

                            <div class="col-md-4 mb-5">
                                <label class="form-label required" for="Asset_NameAr">{{ 'NameAr' | localize }}</label>
                                <input
                                    id="Asset_NameAr"
                                    #nameArInput="ngModel"
                                    class="form-control"
                                    type="text"
                                    name="NameAr"
                                    dir="rtl"
                                    [ngModel]="asset().nameAr"
                                    (ngModelChange)="updateField('nameAr', $event)"
                                    required
                                    maxlength="200" />
                                <validation-messages [formCtrl]="nameArInput" />
                            </div>

                            <div class="col-md-4 mb-5">
                                <label class="form-label" for="Asset_Brand">{{ 'Brand' | localize }}</label>
                                <input
                                    id="Asset_Brand"
                                    class="form-control"
                                    type="text"
                                    name="Brand"
                                    [ngModel]="asset().brand"
                                    (ngModelChange)="updateField('brand', $event)" />
                            </div>

                            <div class="col-md-4 mb-5">
                                <label class="form-label" for="Asset_Model">{{ 'Model' | localize }}</label>
                                <input
                                    id="Asset_Model"
                                    class="form-control"
                                    type="text"
                                    name="Model"
                                    [ngModel]="asset().model"
                                    (ngModelChange)="updateField('model', $event)" />
                            </div>

                            <div class="col-md-4 mb-5">
                                <label class="form-label" for="Asset_Color">{{ 'Color' | localize }}</label>
                                <input
                                    id="Asset_Color"
                                    class="form-control"
                                    type="text"
                                    name="Color"
                                    [ngModel]="asset().color"
                                    (ngModelChange)="updateField('color', $event)" />
                            </div>

                            <div class="col-md-4 mb-5">
                                <label class="form-label" for="Asset_VinNumber">{{ 'VIN_Number' | localize }}</label>
                                <input
                                    id="Asset_VinNumber"
                                    class="form-control"
                                    type="text"
                                    name="VinNumber"
                                    [ngModel]="asset().viN_Number"
                                    (ngModelChange)="updateField('viN_Number', $event)" />
                            </div>

                            <div class="col-md-4 mb-5">
                                <label class="form-label" for="Asset_Serial">{{ 'Serial' | localize }}</label>
                                <input
                                    id="Asset_Serial"
                                    class="form-control"
                                    type="text"
                                    name="Serial"
                                    [ngModel]="asset().serial"
                                    (ngModelChange)="updateField('serial', $event)" />
                            </div>

                            <div class="col-md-4 mb-5">
                                <label class="form-label" for="Asset_PlateNumber">{{ 'PlateNumber' | localize }}</label>
                                <input
                                    id="Asset_PlateNumber"
                                    class="form-control"
                                    type="text"
                                    name="PlateNumber"
                                    [ngModel]="asset().plateNumber"
                                    (ngModelChange)="updateField('plateNumber', $event)" />
                            </div>

                            <div class="col-md-4 mb-5">
                                <label class="form-label" for="Asset_Barcode">{{ 'Barcode' | localize }}</label>
                                <input
                                    id="Asset_Barcode"
                                    class="form-control"
                                    type="text"
                                    name="Barcode"
                                    [ngModel]="asset().barcode"
                                    (ngModelChange)="updateField('barcode', $event)" />
                            </div>

                            <div class="col-md-4 mb-5">
                                <label class="form-label" for="Asset_Year">{{ 'Year' | localize }}</label>
                                <input
                                    id="Asset_Year"
                                    class="form-control"
                                    type="number"
                                    name="Year"
                                    [ngModel]="asset().year"
                                    (ngModelChange)="updateField('year', $event)" />
                            </div>

                            <div class="col-md-4 mb-5">
                                <label class="form-label" for="Asset_ExpiryDate">{{ 'ExpiryDate' | localize }}</label>
                                <input
                                    id="Asset_ExpiryDate"
                                    type="date"
                                    class="form-control"
                                    name="ExpiryDate"
                                    [ngModel]="asset().expiryDate?.toISODate()"
                                    (ngModelChange)="updateDateField('expiryDate', $event)" />
                            </div>

                            <div class="col-md-4 mb-5">
                                <label class="form-label" for="Asset_Value">{{ 'Value' | localize }}</label>
                                <input
                                    id="Asset_Value"
                                    class="form-control"
                                    type="number"
                                    name="Value"
                                    [ngModel]="asset().value"
                                    (ngModelChange)="updateField('value', $event)" />
                            </div>

                            <div class="col-md-4 mb-5">
                                <label class="form-label" for="Asset_AssetTypeId">{{ 'AssetType' | localize }}</label>
                                <select
                                    id="Asset_AssetTypeId"
                                    class="form-select"
                                    name="AssetTypeId"
                                    [ngModel]="asset().assetTypeId"
                                    (ngModelChange)="updateField('assetTypeId', $event)">
                                    <option [ngValue]="undefined"></option>
                                    @for (assetType of assetTypes(); track assetType.id) {
                                        <option [ngValue]="assetType.id">{{ assetType.nameEn }}</option>
                                    }
                                </select>
                            </div>

                            <div class="col-md-4 mb-5">
                                <label class="form-label" for="Asset_Status">{{ 'Status' | localize }}</label>
                                <select
                                    id="Asset_Status"
                                    class="form-select"
                                    name="Status"
                                    [ngModel]="asset().status"
                                    (ngModelChange)="updateField('status', $event)">
                                    @for (s of statuses; track s.value) {
                                        <option [ngValue]="s.value">{{ s.label | localize }}</option>
                                    }
                                </select>
                            </div>

                            <div class="col-md-4 mb-5">
                                <label class="form-label" for="Asset_AssetAllocationStatus">
                                    {{ 'AssetAllocationStatus' | localize }}
                                </label>
                                <select
                                    id="Asset_AssetAllocationStatus"
                                    class="form-select"
                                    name="AssetAllocationStatus"
                                    [ngModel]="asset().assetAllocationStatus"
                                    (ngModelChange)="updateField('assetAllocationStatus', $event)">
                                    @for (s of allocationStatuses; track s.value) {
                                        <option [ngValue]="s.value">{{ s.label | localize }}</option>
                                    }
                                </select>
                            </div>
                        </div>

                        <div class="row">
                            <div class="col-md-6 mb-5">
                                <label class="form-label" for="Asset_EarningWageTypeId">{{ 'Earning' | localize }}</label>
                                <select
                                    id="Asset_EarningWageTypeId"
                                    class="form-select"
                                    name="EarningWageTypeId"
                                    [ngModel]="asset().earningWageTypeId"
                                    (ngModelChange)="updateField('earningWageTypeId', $event)">
                                    <option [ngValue]="undefined"></option>
                                    @for (wageType of wageTypes(); track wageType.id) {
                                        <option [ngValue]="wageType.id">{{ wageType.code }} - {{ wageType.nameEn }}</option>
                                    }
                                </select>
                            </div>

                            <div class="col-md-6 mb-5">
                                <label class="form-label" for="Asset_DeductionWageTypeId">{{ 'Deduction' | localize }}</label>
                                <select
                                    id="Asset_DeductionWageTypeId"
                                    class="form-select"
                                    name="DeductionWageTypeId"
                                    [ngModel]="asset().deductionWageTypeId"
                                    (ngModelChange)="updateField('deductionWageTypeId', $event)">
                                    <option [ngValue]="undefined"></option>
                                    @for (wageType of wageTypes(); track wageType.id) {
                                        <option [ngValue]="wageType.id">{{ wageType.code }} - {{ wageType.nameEn }}</option>
                                    }
                                </select>
                            </div>
                        </div>

                        @if (asset().id) {
                            <div class="mb-5">
                                <app-attachments entityType="Asset" [entityId]="asset().id" />
                            </div>
                        }
                    </div>
                    <div class="modal-footer">
                        <button
                            [disabled]="saving()"
                            type="button"
                            class="btn btn-light-primary fw-bold"
                            (click)="close()">
                            {{ 'Cancel' | localize }}
                        </button>
                        <button
                            type="submit"
                            class="btn btn-primary fw-bold"
                            [disabled]="!assetForm.form.valid"
                            [buttonBusy]="saving()"
                            [busyText]="l('SavingWithThreeDot')">
                            <i class="fa fa-save"></i>
                            <span>{{ 'Save' | localize }}</span>
                        </button>
                    </div>
                </form>
            }
        </div>
    </div>
</div>
