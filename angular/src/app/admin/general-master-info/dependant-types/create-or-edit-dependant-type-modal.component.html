<div
    appBsModal
    #createOrEditModal="bs-modal"
    (onShown)="onShown()"
    class="modal fade"
    tabindex="-1"
    role="dialog"
    aria-labelledby="createOrEditModal"
    aria-hidden="true"
    [config]="{ backdrop: 'static', keyboard: !saving() }">
    <div class="modal-dialog modal-lg">
        <div class="modal-content">
            @if (active()) {
                <form #dependantTypeForm="ngForm" novalidate (ngSubmit)="save()" autocomplete="off">
                    <div class="modal-header">
                        <h4 class="modal-title">
                            @if (dependantType().id) {
                                <span>{{ 'EditingDependantType' | localize }}</span>
                            } @else {
                                <span>{{ 'CreatingNewDependantType' | localize }}</span>
                            }
                        </h4>
                        <button
                            type="button"
                            class="btn-close"
                            (click)="close()"
                            [attr.aria-label]="l('Close')"
                            [disabled]="saving()"></button>
                    </div>
                    <div class="modal-body">
                        <div class="mb-5">
                            <label class="form-label" for="DependantType_Code">{{ 'Code' | localize }}</label>
                            <input
                                id="DependantType_Code"
                                class="form-control"
                                type="text"
                                name="Code"
                                [ngModel]="dependantType().code"
                                (ngModelChange)="updateField('code', $event)"
                                maxlength="50"
                                [placeholder]="l('AutoGeneratedIfEmpty')" />
                        </div>

                        <div class="mb-5">
                            <label class="form-label required" for="DependantType_NameEn">{{ 'NameEn' | localize }}</label>
                            <input
                                id="DependantType_NameEn"
                                #nameEnInput="ngModel"
                                class="form-control"
                                type="text"
                                name="NameEn"
                                [ngModel]="dependantType().nameEn"
                                (ngModelChange)="updateField('nameEn', $event)"
                                required
                                maxlength="200" />
                            <validation-messages [formCtrl]="nameEnInput" />
                        </div>

                        <div class="mb-5">
                            <label class="form-label required" for="DependantType_NameAr">{{ 'NameAr' | localize }}</label>
                            <input
                                id="DependantType_NameAr"
                                #nameArInput="ngModel"
                                class="form-control"
                                type="text"
                                name="NameAr"
                                dir="rtl"
                                [ngModel]="dependantType().nameAr"
                                (ngModelChange)="updateField('nameAr', $event)"
                                required
                                maxlength="200" />
                            <validation-messages [formCtrl]="nameArInput" />
                        </div>

                        <div class="mb-5">
                            <label class="form-label required" for="DependantType_Gender">{{ 'Gender' | localize }}</label>
                            <select
                                id="DependantType_Gender"
                                class="form-select"
                                name="Gender"
                                [ngModel]="dependantType().gender"
                                (ngModelChange)="updateField('gender', $event)"
                                required>
                                @for (genderOption of genders; track genderOption.value) {
                                    <option [ngValue]="genderOption.value">{{ genderOption.label | localize }}</option>
                                }
                            </select>
                        </div>

                        <div class="mb-5 form-check">
                            <input
                                id="DependantType_IsEmployee"
                                type="checkbox"
                                class="form-check-input"
                                name="IsEmployee"
                                [ngModel]="dependantType().isEmployee"
                                (ngModelChange)="updateField('isEmployee', $event)" />
                            <label class="form-check-label" for="DependantType_IsEmployee">{{ 'IsEmployee' | localize }}</label>
                        </div>
                    </div>
                    <div class="modal-footer">
                        <button
                            [disabled]="saving()"
                            type="button"
                            class="btn btn-light-primary fw-bold"
                            (click)="close()">
                            {{ 'Cancel' | localize }}
                        </button>
                        <button
                            type="submit"
                            class="btn btn-primary fw-bold"
                            [disabled]="!dependantTypeForm.form.valid"
                            [buttonBusy]="saving()"
                            [busyText]="l('SavingWithThreeDot')">
                            <i class="fa fa-save"></i>
                            <span>{{ 'Save' | localize }}</span>
                        </button>
                    </div>
                </form>
            }
        </div>
    </div>
</div>
