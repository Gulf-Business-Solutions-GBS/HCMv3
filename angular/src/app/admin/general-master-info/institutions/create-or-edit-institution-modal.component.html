<div
    appBsModal
    #createOrEditModal="bs-modal"
    (onShown)="onShown()"
    class="modal fade"
    tabindex="-1"
    role="dialog"
    aria-labelledby="createOrEditModal"
    aria-hidden="true"
    [config]="{ backdrop: 'static', keyboard: !saving() }">
    <div class="modal-dialog modal-lg">
        <div class="modal-content">
            @if (active()) {
                <form #institutionForm="ngForm" novalidate (ngSubmit)="save()" autocomplete="off">
                    <div class="modal-header">
                        <h4 class="modal-title">
                            @if (institution().id) {
                                <span>{{ 'EditingInstitution' | localize }}</span>
                            } @else {
                                <span>{{ 'CreatingNewInstitution' | localize }}</span>
                            }
                        </h4>
                        <button
                            type="button"
                            class="btn-close"
                            (click)="close()"
                            [attr.aria-label]="l('Close')"
                            [disabled]="saving()"></button>
                    </div>
                    <div class="modal-body">
                        <div class="mb-5">
                            <label class="form-label" for="Institution_Code">{{ 'Code' | localize }}</label>
                            <input
                                id="Institution_Code"
                                class="form-control"
                                type="text"
                                name="Code"
                                [ngModel]="institution().code"
                                (ngModelChange)="updateField('code', $event)"
                                maxlength="50"
                                [placeholder]="l('AutoGeneratedIfEmpty')" />
                        </div>

                        <div class="mb-5">
                            <label class="form-label required" for="Institution_NameEn">{{ 'NameEn' | localize }}</label>
                            <input
                                id="Institution_NameEn"
                                #nameEnInput="ngModel"
                                class="form-control"
                                type="text"
                                name="NameEn"
                                [ngModel]="institution().nameEn"
                                (ngModelChange)="updateField('nameEn', $event)"
                                required
                                maxlength="200" />
                            <validation-messages [formCtrl]="nameEnInput" />
                        </div>

                        <div class="mb-5">
                            <label class="form-label required" for="Institution_NameAr">{{ 'NameAr' | localize }}</label>
                            <input
                                id="Institution_NameAr"
                                #nameArInput="ngModel"
                                class="form-control"
                                type="text"
                                name="NameAr"
                                dir="rtl"
                                [ngModel]="institution().nameAr"
                                (ngModelChange)="updateField('nameAr', $event)"
                                required
                                maxlength="200" />
                            <validation-messages [formCtrl]="nameArInput" />
                        </div>

                        <div class="mb-5">
                            <label class="form-label" for="Institution_UniversityId">{{ 'University' | localize }}</label>
                            <select
                                id="Institution_UniversityId"
                                class="form-select"
                                name="UniversityId"
                                [ngModel]="institution().universityId"
                                (ngModelChange)="updateField('universityId', $event)">
                                <option [ngValue]="undefined"></option>
                                @for (university of universities(); track university.id) {
                                    <option [ngValue]="university.id">{{ university.nameEn }}</option>
                                }
                            </select>
                        </div>

                        <div class="mb-5">
                            <label class="form-label" for="Institution_CountryId">{{ 'Country' | localize }}</label>
                            <select
                                id="Institution_CountryId"
                                class="form-select"
                                name="CountryId"
                                [ngModel]="institution().countryId"
                                (ngModelChange)="updateField('countryId', $event)">
                                <option [ngValue]="undefined"></option>
                                @for (country of countries(); track country.id) {
                                    <option [ngValue]="country.id">{{ country.nameEn }}</option>
                                }
                            </select>
                        </div>
                    </div>
                    <div class="modal-footer">
                        <button
                            [disabled]="saving()"
                            type="button"
                            class="btn btn-light-primary fw-bold"
                            (click)="close()">
                            {{ 'Cancel' | localize }}
                        </button>
                        <button
                            type="submit"
                            class="btn btn-primary fw-bold"
                            [disabled]="!institutionForm.form.valid"
                            [buttonBusy]="saving()"
                            [busyText]="l('SavingWithThreeDot')">
                            <i class="fa fa-save"></i>
                            <span>{{ 'Save' | localize }}</span>
                        </button>
                    </div>
                </form>
            }
        </div>
    </div>
</div>
