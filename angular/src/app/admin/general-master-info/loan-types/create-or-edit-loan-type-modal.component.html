<div
    appBsModal
    #createOrEditModal="bs-modal"
    (onShown)="onShown()"
    class="modal fade"
    tabindex="-1"
    role="dialog"
    aria-labelledby="createOrEditModal"
    aria-hidden="true"
    [config]="{ backdrop: 'static', keyboard: !saving() }">
    <div class="modal-dialog modal-lg">
        <div class="modal-content">
            @if (active()) {
                <form #loanTypeForm="ngForm" novalidate (ngSubmit)="save()" autocomplete="off">
                    <div class="modal-header">
                        <h4 class="modal-title">
                            @if (loanType().id) {
                                <span>{{ 'EditingLoanType' | localize }}</span>
                            } @else {
                                <span>{{ 'CreatingNewLoanType' | localize }}</span>
                            }
                        </h4>
                        <button
                            type="button"
                            class="btn-close"
                            (click)="close()"
                            [attr.aria-label]="l('Close')"
                            [disabled]="saving()"></button>
                    </div>
                    <div class="modal-body">
                        <div class="mb-5">
                            <label class="form-label" for="LoanType_Code">{{ 'Code' | localize }}</label>
                            <input
                                id="LoanType_Code"
                                class="form-control"
                                type="text"
                                name="Code"
                                [ngModel]="loanType().code"
                                (ngModelChange)="updateField('code', $event)"
                                maxlength="50" [placeholder]="l('AutoGeneratedIfEmpty')" />
                            
                        </div>

                        <div class="mb-5">
                            <label class="form-label required" for="LoanType_NameEn">{{ 'NameEn' | localize }}</label>
                            <input
                                id="LoanType_NameEn"
                                #nameEnInput="ngModel"
                                class="form-control"
                                type="text"
                                name="NameEn"
                                [ngModel]="loanType().nameEn"
                                (ngModelChange)="updateField('nameEn', $event)"
                                required
                                maxlength="200" />
                            <validation-messages [formCtrl]="nameEnInput" />
                        </div>

                        <div class="mb-5">
                            <label class="form-label required" for="LoanType_NameAr">{{ 'NameAr' | localize }}</label>
                            <input
                                id="LoanType_NameAr"
                                #nameArInput="ngModel"
                                class="form-control"
                                type="text"
                                name="NameAr"
                                dir="rtl"
                                [ngModel]="loanType().nameAr"
                                (ngModelChange)="updateField('nameAr', $event)"
                                required
                                maxlength="200" />
                            <validation-messages [formCtrl]="nameArInput" />
                        </div>

                        <div class="mb-5">
                            <label class="form-label" for="LoanType_LoanDeductionType">{{ 'LoanDeductionType' | localize }}</label>
                            <select
                                id="LoanType_LoanDeductionType"
                                class="form-select"
                                name="LoanDeductionType"
                                [ngModel]="loanType().loanDeductionType"
                                (ngModelChange)="updateField('loanDeductionType', $event)">
                                <option [ngValue]="0">{{ 'Fixed' | localize }}</option>
                                <option [ngValue]="1">{{ 'Variable' | localize }}</option>
                            </select>
                        </div>

                        <div class="mb-5">
                            <label class="form-label" for="LoanType_RecoveryOption">{{ 'RecoveryOption' | localize }}</label>
                            <select
                                id="LoanType_RecoveryOption"
                                class="form-select"
                                name="RecoveryOption"
                                [ngModel]="loanType().recoveryOption"
                                (ngModelChange)="updateField('recoveryOption', $event)">
                                <option [ngValue]="0">{{ 'All' | localize }}</option>
                                <option [ngValue]="1">{{ 'ThroughPayroll' | localize }}</option>
                                <option [ngValue]="2">{{ 'ThroughExternal' | localize }}</option>
                            </select>
                        </div>

                        <div class="mb-5">
                            <label class="form-label required" for="LoanType_EligiblePeriod">{{ 'EligiblePeriod' | localize }}</label>
                            <input
                                id="LoanType_EligiblePeriod"
                                #eligiblePeriodInput="ngModel"
                                class="form-control"
                                type="number"
                                name="EligiblePeriod"
                                [ngModel]="loanType().eligiblePeriod"
                                (ngModelChange)="updateField('eligiblePeriod', $event)"
                                required
                                min="0" />
                            <validation-messages [formCtrl]="eligiblePeriodInput" />
                        </div>

                        <div class="mb-5">
                            <label class="form-label required" for="LoanType_EligibleCountPerYear">{{ 'EligibleCountPerYear' | localize }}</label>
                            <input
                                id="LoanType_EligibleCountPerYear"
                                #eligibleCountPerYearInput="ngModel"
                                class="form-control"
                                type="number"
                                name="EligibleCountPerYear"
                                [ngModel]="loanType().eligibleCountPerYear"
                                (ngModelChange)="updateField('eligibleCountPerYear', $event)"
                                required
                                min="0" />
                            <validation-messages [formCtrl]="eligibleCountPerYearInput" />
                        </div>

                        <div class="mb-5">
                            <label class="form-label required" for="LoanType_MaxInstallments">{{ 'MaxInstallments' | localize }}</label>
                            <input
                                id="LoanType_MaxInstallments"
                                #maxInstallmentsInput="ngModel"
                                class="form-control"
                                type="number"
                                name="MaxInstallments"
                                [ngModel]="loanType().maxInstallments"
                                (ngModelChange)="updateField('maxInstallments', $event)"
                                required
                                min="0" />
                            <validation-messages [formCtrl]="maxInstallmentsInput" />
                        </div>

                        <div class="mb-5">
                            <label class="form-label" for="LoanType_EligibleAmount">{{ 'EligibleAmount' | localize }}</label>
                            <select
                                id="LoanType_EligibleAmount"
                                class="form-select"
                                name="EligibleAmount"
                                [ngModel]="loanType().eligibleAmount"
                                (ngModelChange)="updateField('eligibleAmount', $event)">
                                <option [ngValue]="0">{{ 'Default' | localize }}</option>
                                <option [ngValue]="1">{{ 'BasicSalary' | localize }}</option>
                            </select>
                        </div>

                        <div class="mb-5">
                            <label class="form-label required" for="LoanType_EligibleAmountNumber">{{ 'EligibleAmountNumber' | localize }}</label>
                            <input
                                id="LoanType_EligibleAmountNumber"
                                #eligibleAmountNumberInput="ngModel"
                                class="form-control"
                                type="number"
                                name="EligibleAmountNumber"
                                [ngModel]="loanType().eligibleAmountNumber"
                                (ngModelChange)="updateField('eligibleAmountNumber', $event)"
                                required
                                step="0.01"
                                min="0" />
                            <validation-messages [formCtrl]="eligibleAmountNumberInput" />
                        </div>
                    </div>
                    <div class="modal-footer">
                        <button
                            [disabled]="saving()"
                            type="button"
                            class="btn btn-light-primary fw-bold"
                            (click)="close()">
                            {{ 'Cancel' | localize }}
                        </button>
                        <button
                            type="submit"
                            class="btn btn-primary fw-bold"
                            [disabled]="!loanTypeForm.form.valid"
                            [buttonBusy]="saving()"
                            [busyText]="l('SavingWithThreeDot')">
                            <i class="fa fa-save"></i>
                            <span>{{ 'Save' | localize }}</span>
                        </button>
                    </div>
                </form>
            }
        </div>
    </div>
</div>
