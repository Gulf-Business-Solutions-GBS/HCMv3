<div
    appBsModal
    #createOrEditModal="bs-modal"
    (onShown)="onShown()"
    class="modal fade"
    tabindex="-1"
    role="dialog"
    aria-labelledby="createOrEditModal"
    aria-hidden="true"
    [config]="{ backdrop: 'static', keyboard: !saving() }">
    <div class="modal-dialog modal-lg">
        <div class="modal-content">
            @if (active()) {
                <form #documentTypeForm="ngForm" novalidate (ngSubmit)="save()" autocomplete="off">
                    <div class="modal-header">
                        <h4 class="modal-title">
                            @if (documentType().id) {
                                <span>{{ 'EditingDocumentType' | localize }}</span>
                            } @else {
                                <span>{{ 'CreatingNewDocumentType' | localize }}</span>
                            }
                        </h4>
                        <button
                            type="button"
                            class="btn-close"
                            (click)="close()"
                            [attr.aria-label]="l('Close')"
                            [disabled]="saving()"></button>
                    </div>
                    <div class="modal-body">
                        <div class="mb-5">
                            <label class="form-label" for="DocumentType_Code">{{ 'Code' | localize }}</label>
                            <input
                                id="DocumentType_Code"
                                class="form-control"
                                type="text"
                                name="Code"
                                [ngModel]="documentType().code"
                                (ngModelChange)="updateField('code', $event)"
                                maxlength="50" [placeholder]="l('AutoGeneratedIfEmpty')" />
                            
                        </div>

                        <div class="mb-5">
                            <label class="form-label required" for="DocumentType_NameEn">{{ 'NameEn' | localize }}</label>
                            <input
                                id="DocumentType_NameEn"
                                #nameEnInput="ngModel"
                                class="form-control"
                                type="text"
                                name="NameEn"
                                [ngModel]="documentType().nameEn"
                                (ngModelChange)="updateField('nameEn', $event)"
                                required
                                maxlength="200" />
                            <validation-messages [formCtrl]="nameEnInput" />
                        </div>

                        <div class="mb-5">
                            <label class="form-label required" for="DocumentType_NameAr">{{ 'NameAr' | localize }}</label>
                            <input
                                id="DocumentType_NameAr"
                                #nameArInput="ngModel"
                                class="form-control"
                                type="text"
                                name="NameAr"
                                dir="rtl"
                                [ngModel]="documentType().nameAr"
                                (ngModelChange)="updateField('nameAr', $event)"
                                required
                                maxlength="200" />
                            <validation-messages [formCtrl]="nameArInput" />
                        </div>

                        <div class="mb-5">
                            <label class="form-label required" for="DocumentType_NotificationPeriod">{{ 'NotificationPeriod' | localize }}</label>
                            <input
                                id="DocumentType_NotificationPeriod"
                                #notificationPeriodInput="ngModel"
                                class="form-control"
                                type="number"
                                name="NotificationPeriod"
                                [ngModel]="documentType().notificationPeriod"
                                (ngModelChange)="updateField('notificationPeriod', $event)"
                                required
                                min="0" />
                            <validation-messages [formCtrl]="notificationPeriodInput" />
                        </div>

                        <div class="mb-5">
                            <label class="form-label" for="DocumentType_NotificationConfigId">{{ 'NotificationConfig' | localize }}</label>
                            <select
                                id="DocumentType_NotificationConfigId"
                                class="form-select"
                                name="NotificationConfigId"
                                [ngModel]="documentType().notificationConfigId"
                                (ngModelChange)="updateField('notificationConfigId', $event)">
                                <option [ngValue]="undefined"></option>
                                @for (notificationConfig of notificationConfigs(); track notificationConfig.id) {
                                    <option [ngValue]="notificationConfig.id">{{ notificationConfig.name }}</option>
                                }
                            </select>
                        </div>

                        <div class="mb-5">
                            <label class="form-label" for="DocumentType_NotificationFrequency">{{ 'NotificationFrequency' | localize }}</label>
                            <select
                                id="DocumentType_NotificationFrequency"
                                class="form-select"
                                name="NotificationFrequency"
                                [ngModel]="documentType().notificationFrequency"
                                (ngModelChange)="updateField('notificationFrequency', $event)">
                                <option [ngValue]="0">{{ 'Once' | localize }}</option>
                                <option [ngValue]="1">{{ 'Daily' | localize }}</option>
                                <option [ngValue]="2">{{ 'Weekly' | localize }}</option>
                                <option [ngValue]="3">{{ 'Monthly' | localize }}</option>
                            </select>
                        </div>

                        <div class="mb-5">
                            <label class="form-label required" for="DocumentType_NotificationCountLimit">{{ 'NotificationCountLimit' | localize }}</label>
                            <input
                                id="DocumentType_NotificationCountLimit"
                                #notificationCountLimitInput="ngModel"
                                class="form-control"
                                type="number"
                                name="NotificationCountLimit"
                                [ngModel]="documentType().notificationCountLimit"
                                (ngModelChange)="updateField('notificationCountLimit', $event)"
                                required
                                min="0" />
                            <validation-messages [formCtrl]="notificationCountLimitInput" />
                        </div>

                        <div class="mb-5">
                            <label class="form-label" for="DocumentType_DocumentBelongsTo">{{ 'DocumentBelongsTo' | localize }}</label>
                            <select
                                id="DocumentType_DocumentBelongsTo"
                                class="form-select"
                                name="DocumentBelongsTo"
                                [ngModel]="documentType().documentBelongsTo"
                                (ngModelChange)="updateField('documentBelongsTo', $event)">
                                <option [ngValue]="0">{{ 'ALL' | localize }}</option>
                                <option [ngValue]="1">{{ 'Employee' | localize }}</option>
                                <option [ngValue]="2">{{ 'Organization' | localize }}</option>
                            </select>
                        </div>

                        <!-- What an employee may do with this type in self-service. These switches, not the
                             type's name or code, decide where it is offered. -->
                        <div class="mb-5">
                            <label class="form-label">{{ 'DocumentTypeSelfService' | localize }}</label>
                            <div class="form-check form-check-custom form-check-solid mb-3">
                                <input
                                    id="DocumentType_IncludeInWorkflow"
                                    class="form-check-input"
                                    type="checkbox"
                                    name="IncludeInWorkflow"
                                    [ngModel]="documentType().includeInWorkflow"
                                    (ngModelChange)="updateField('includeInWorkflow', $event)" />
                                <label class="form-check-label" for="DocumentType_IncludeInWorkflow">{{ 'IncludeInWorkflow' | localize }}</label>
                            </div>
                            <div class="form-check form-check-custom form-check-solid mb-3">
                                <input
                                    id="DocumentType_IsLetterType"
                                    class="form-check-input"
                                    type="checkbox"
                                    name="IsLetterType"
                                    [ngModel]="documentType().isLetterType"
                                    (ngModelChange)="updateField('isLetterType', $event)" />
                                <label class="form-check-label" for="DocumentType_IsLetterType">{{ 'IsLetterType' | localize }}</label>
                            </div>
                            <div class="form-check form-check-custom form-check-solid mb-3">
                                <input
                                    id="DocumentType_IsWithdrawable"
                                    class="form-check-input"
                                    type="checkbox"
                                    name="IsWithdrawable"
                                    [ngModel]="documentType().isWithdrawable"
                                    (ngModelChange)="updateField('isWithdrawable', $event)" />
                                <label class="form-check-label" for="DocumentType_IsWithdrawable">{{ 'IsWithdrawable' | localize }}</label>
                            </div>
                            <div class="form-check form-check-custom form-check-solid mb-3">
                                <input
                                    id="DocumentType_IsHiddenFromEmployee"
                                    class="form-check-input"
                                    type="checkbox"
                                    name="IsHiddenFromEmployee"
                                    [ngModel]="documentType().isHiddenFromEmployee"
                                    (ngModelChange)="updateField('isHiddenFromEmployee', $event)" />
                                <label class="form-check-label" for="DocumentType_IsHiddenFromEmployee">{{ 'IsHiddenFromEmployee' | localize }}</label>
                            </div>
                            <div class="form-check form-check-custom form-check-solid mb-3">
                                <input
                                    id="DocumentType_IsExpiryDateRequired"
                                    class="form-check-input"
                                    type="checkbox"
                                    name="IsExpiryDateRequired"
                                    [ngModel]="documentType().isExpiryDateRequired"
                                    (ngModelChange)="updateField('isExpiryDateRequired', $event)" />
                                <label class="form-check-label" for="DocumentType_IsExpiryDateRequired">{{ 'IsExpiryDateRequired' | localize }}</label>
                            </div>
                            <div class="form-check form-check-custom form-check-solid mb-3">
                                <input
                                    id="DocumentType_AllowDateOverlap"
                                    class="form-check-input"
                                    type="checkbox"
                                    name="AllowDateOverlap"
                                    [ngModel]="documentType().allowDateOverlap"
                                    (ngModelChange)="updateField('allowDateOverlap', $event)" />
                                <label class="form-check-label" for="DocumentType_AllowDateOverlap">{{ 'AllowDateOverlap' | localize }}</label>
                            </div>
                        </div>
                    </div>
                    <div class="modal-footer">
                        <button
                            [disabled]="saving()"
                            type="button"
                            class="btn btn-light-primary fw-bold"
                            (click)="close()">
                            {{ 'Cancel' | localize }}
                        </button>
                        <button
                            type="submit"
                            class="btn btn-primary fw-bold"
                            [disabled]="!documentTypeForm.form.valid"
                            [buttonBusy]="saving()"
                            [busyText]="l('SavingWithThreeDot')">
                            <i class="fa fa-save"></i>
                            <span>{{ 'Save' | localize }}</span>
                        </button>
                    </div>
                </form>
            }
        </div>
    </div>
</div>
