<div
    appBsModal
    #createOrEditModal="bs-modal"
    (onShown)="onShown()"
    class="modal fade"
    tabindex="-1"
    role="dialog"
    aria-labelledby="createOrEditModal"
    aria-hidden="true"
    [config]="{ backdrop: 'static', keyboard: !saving() }">
    <div class="modal-dialog modal-lg">
        <div class="modal-content">
            @if (active()) {
                <form #currencyForm="ngForm" novalidate (ngSubmit)="save()" autocomplete="off">
                    <div class="modal-header">
                        <h4 class="modal-title">
                            @if (currency().id) {
                                <span>{{ 'EditingCurrency' | localize }}</span>
                            } @else {
                                <span>{{ 'CreatingNewCurrency' | localize }}</span>
                            }
                        </h4>
                        <button
                            type="button"
                            class="btn-close"
                            (click)="close()"
                            [attr.aria-label]="l('Close')"
                            [disabled]="saving()"></button>
                    </div>
                    <div class="modal-body">
                        <div class="mb-5">
                            <label class="form-label" for="Currency_Code">{{ 'Code' | localize }}</label>
                            <input
                                id="Currency_Code"
                                class="form-control"
                                type="text"
                                name="Code"
                                [ngModel]="currency().code"
                                (ngModelChange)="updateField('code', $event)"
                                maxlength="50"
                                [placeholder]="l('AutoGeneratedIfEmpty')" />
                        </div>

                        <div class="mb-5">
                            <label class="form-label required" for="Currency_NameEn">{{ 'NameEn' | localize }}</label>
                            <input
                                id="Currency_NameEn"
                                #nameEnInput="ngModel"
                                class="form-control"
                                type="text"
                                name="NameEn"
                                [ngModel]="currency().nameEn"
                                (ngModelChange)="updateField('nameEn', $event)"
                                required
                                maxlength="200" />
                            <validation-messages [formCtrl]="nameEnInput" />
                        </div>

                        <div class="mb-5">
                            <label class="form-label required" for="Currency_NameAr">{{ 'NameAr' | localize }}</label>
                            <input
                                id="Currency_NameAr"
                                #nameArInput="ngModel"
                                class="form-control"
                                type="text"
                                name="NameAr"
                                dir="rtl"
                                [ngModel]="currency().nameAr"
                                (ngModelChange)="updateField('nameAr', $event)"
                                required
                                maxlength="200" />
                            <validation-messages [formCtrl]="nameArInput" />
                        </div>

                        <div class="mb-5">
                            <label class="form-label required" for="Currency_DecimalCount">{{ 'DecimalCount' | localize }}</label>
                            <input
                                id="Currency_DecimalCount"
                                #decimalCountInput="ngModel"
                                class="form-control"
                                type="number"
                                name="DecimalCount"
                                [ngModel]="currency().decimalCount"
                                (ngModelChange)="updateField('decimalCount', $event)"
                                required
                                min="0" />
                            <validation-messages [formCtrl]="decimalCountInput" />
                        </div>

                        <div class="mb-5">
                            <label class="form-label" for="Currency_CurrencyShortFormEn">{{ 'CurrencyShortFormEn' | localize }}</label>
                            <input
                                id="Currency_CurrencyShortFormEn"
                                class="form-control"
                                type="text"
                                name="CurrencyShortFormEn"
                                [ngModel]="currency().currencyShortFormEn"
                                (ngModelChange)="updateField('currencyShortFormEn', $event)"
                                maxlength="50" />
                        </div>

                        <div class="mb-5">
                            <label class="form-label" for="Currency_CurrencyDenominationFormEn">{{ 'CurrencyDenominationFormEn' | localize }}</label>
                            <input
                                id="Currency_CurrencyDenominationFormEn"
                                class="form-control"
                                type="text"
                                name="CurrencyDenominationFormEn"
                                [ngModel]="currency().currencyDenominationFormEn"
                                (ngModelChange)="updateField('currencyDenominationFormEn', $event)"
                                maxlength="50" />
                        </div>

                        <div class="mb-5">
                            <label class="form-label" for="Currency_CurrencyShortFormAr">{{ 'CurrencyShortFormAr' | localize }}</label>
                            <input
                                id="Currency_CurrencyShortFormAr"
                                class="form-control"
                                type="text"
                                name="CurrencyShortFormAr"
                                dir="rtl"
                                [ngModel]="currency().currencyShortFormAr"
                                (ngModelChange)="updateField('currencyShortFormAr', $event)"
                                maxlength="50" />
                        </div>

                        <div class="mb-5">
                            <label class="form-label" for="Currency_CurrencyDenominationFormAr">{{ 'CurrencyDenominationFormAr' | localize }}</label>
                            <input
                                id="Currency_CurrencyDenominationFormAr"
                                class="form-control"
                                type="text"
                                name="CurrencyDenominationFormAr"
                                dir="rtl"
                                [ngModel]="currency().currencyDenominationFormAr"
                                (ngModelChange)="updateField('currencyDenominationFormAr', $event)"
                                maxlength="50" />
                        </div>
                    </div>
                    <div class="modal-footer">
                        <button
                            [disabled]="saving()"
                            type="button"
                            class="btn btn-light-primary fw-bold"
                            (click)="close()">
                            {{ 'Cancel' | localize }}
                        </button>
                        <button
                            type="submit"
                            class="btn btn-primary fw-bold"
                            [disabled]="!currencyForm.form.valid"
                            [buttonBusy]="saving()"
                            [busyText]="l('SavingWithThreeDot')">
                            <i class="fa fa-save"></i>
                            <span>{{ 'Save' | localize }}</span>
                        </button>
                    </div>
                </form>
            }
        </div>
    </div>
</div>
