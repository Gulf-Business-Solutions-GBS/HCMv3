<div
    appBsModal
    #createOrEditModal="bs-modal"
    (onShown)="onShown()"
    class="modal fade"
    tabindex="-1"
    role="dialog"
    aria-labelledby="createOrEditModal"
    aria-hidden="true"
    [config]="{ backdrop: 'static', keyboard: !saving() }">
    <div class="modal-dialog modal-lg">
        <div class="modal-content">
            @if (active()) {
                <form #personalActionForm="ngForm" novalidate (ngSubmit)="save()" autocomplete="off">
                    <div class="modal-header">
                        <h4 class="modal-title">
                            @if (personalAction().id) {
                                <span>{{ 'EditingPersonalAction' | localize }}</span>
                            } @else {
                                <span>{{ 'CreatingNewPersonalAction' | localize }}</span>
                            }
                        </h4>
                        <button
                            type="button"
                            class="btn-close"
                            (click)="close()"
                            [attr.aria-label]="l('Close')"
                            [disabled]="saving()"></button>
                    </div>
                    <div class="modal-body">
                        <div class="mb-5">
                            <label class="form-label" for="PersonalAction_Code">{{ 'Code' | localize }}</label>
                            <input
                                id="PersonalAction_Code"
                                class="form-control"
                                type="text"
                                name="Code"
                                [ngModel]="personalAction().code"
                                (ngModelChange)="updateField('code', $event)"
                                maxlength="50"
                                [placeholder]="l('AutoGeneratedIfEmpty')" />
                        </div>

                        <div class="mb-5">
                            <label class="form-label required" for="PersonalAction_NameEn">{{ 'NameEn' | localize }}</label>
                            <input
                                id="PersonalAction_NameEn"
                                #nameEnInput="ngModel"
                                class="form-control"
                                type="text"
                                name="NameEn"
                                [ngModel]="personalAction().nameEn"
                                (ngModelChange)="updateField('nameEn', $event)"
                                required
                                maxlength="200" />
                            <validation-messages [formCtrl]="nameEnInput" />
                        </div>

                        <div class="mb-5">
                            <label class="form-label required" for="PersonalAction_NameAr">{{ 'NameAr' | localize }}</label>
                            <input
                                id="PersonalAction_NameAr"
                                #nameArInput="ngModel"
                                class="form-control"
                                type="text"
                                name="NameAr"
                                dir="rtl"
                                [ngModel]="personalAction().nameAr"
                                (ngModelChange)="updateField('nameAr', $event)"
                                required
                                maxlength="200" />
                            <validation-messages [formCtrl]="nameArInput" />
                        </div>

                        <div class="row">
                            <div class="col-md-6">
                                <div class="mb-5 form-check">
                                    <input
                                        id="PersonalAction_ReqOrgAssignment"
                                        type="checkbox"
                                        class="form-check-input"
                                        name="ReqOrgAssignment"
                                        [ngModel]="personalAction().reqOrgAssignment"
                                        (ngModelChange)="updateField('reqOrgAssignment', $event)" />
                                    <label class="form-check-label" for="PersonalAction_ReqOrgAssignment">{{ 'ReqOrgAssignment' | localize }}</label>
                                </div>
                                <div class="mb-5 form-check">
                                    <input
                                        id="PersonalAction_ReqBasicPay"
                                        type="checkbox"
                                        class="form-check-input"
                                        name="ReqBasicPay"
                                        [ngModel]="personalAction().reqBasicPay"
                                        (ngModelChange)="updateField('reqBasicPay', $event)" />
                                    <label class="form-check-label" for="PersonalAction_ReqBasicPay">{{ 'ReqBasicPay' | localize }}</label>
                                </div>
                                <div class="mb-5 form-check">
                                    <input
                                        id="PersonalAction_ReqContract"
                                        type="checkbox"
                                        class="form-check-input"
                                        name="ReqContract"
                                        [ngModel]="personalAction().reqContract"
                                        (ngModelChange)="updateField('reqContract', $event)" />
                                    <label class="form-check-label" for="PersonalAction_ReqContract">{{ 'ReqContract' | localize }}</label>
                                </div>
                                <div class="mb-5 form-check">
                                    <input
                                        id="PersonalAction_ReqManager"
                                        type="checkbox"
                                        class="form-check-input"
                                        name="ReqManager"
                                        [ngModel]="personalAction().reqManager"
                                        (ngModelChange)="updateField('reqManager', $event)" />
                                    <label class="form-check-label" for="PersonalAction_ReqManager">{{ 'ReqManager' | localize }}</label>
                                </div>
                                <div class="mb-5 form-check">
                                    <input
                                        id="PersonalAction_ReqOnHold"
                                        type="checkbox"
                                        class="form-check-input"
                                        name="ReqOnHold"
                                        [ngModel]="personalAction().reqOnHold"
                                        (ngModelChange)="updateField('reqOnHold', $event)" />
                                    <label class="form-check-label" for="PersonalAction_ReqOnHold">{{ 'ReqOnHold' | localize }}</label>
                                </div>
                            </div>
                            <div class="col-md-6">
                                <div class="mb-5 form-check">
                                    <input
                                        id="PersonalAction_ReqSeparation"
                                        type="checkbox"
                                        class="form-check-input"
                                        name="ReqSeparation"
                                        [ngModel]="personalAction().reqSeparation"
                                        (ngModelChange)="updateField('reqSeparation', $event)" />
                                    <label class="form-check-label" for="PersonalAction_ReqSeparation">{{ 'ReqSeparation' | localize }}</label>
                                </div>
                                <div class="mb-5 form-check">
                                    <input
                                        id="PersonalAction_ReqFnFPayment"
                                        type="checkbox"
                                        class="form-check-input"
                                        name="ReqFnFPayment"
                                        [ngModel]="personalAction().reqFnFPayment"
                                        (ngModelChange)="updateField('reqFnFPayment', $event)" />
                                    <label class="form-check-label" for="PersonalAction_ReqFnFPayment">{{ 'ReqFnFPayment' | localize }}</label>
                                </div>
                                <div class="mb-5 form-check">
                                    <input
                                        id="PersonalAction_IncludeInWorkflow"
                                        type="checkbox"
                                        class="form-check-input"
                                        name="IncludeInWorkflow"
                                        [ngModel]="personalAction().includeInWorkflow"
                                        (ngModelChange)="updateField('includeInWorkflow', $event)" />
                                    <label class="form-check-label" for="PersonalAction_IncludeInWorkflow">{{ 'IncludeInWorkflow' | localize }}</label>
                                </div>
                                <div class="mb-5 form-check">
                                    <input
                                        id="PersonalAction_IsAttachmentRequired"
                                        type="checkbox"
                                        class="form-check-input"
                                        name="IsAttachmentRequired"
                                        [ngModel]="personalAction().isAttachmentRequired"
                                        (ngModelChange)="updateField('isAttachmentRequired', $event)" />
                                    <label class="form-check-label" for="PersonalAction_IsAttachmentRequired">{{ 'IsAttachmentRequired' | localize }}</label>
                                </div>
                            </div>
                        </div>
                    </div>
                    <div class="modal-footer">
                        <button
                            [disabled]="saving()"
                            type="button"
                            class="btn btn-light-primary fw-bold"
                            (click)="close()">
                            {{ 'Cancel' | localize }}
                        </button>
                        <button
                            type="submit"
                            class="btn btn-primary fw-bold"
                            [disabled]="!personalActionForm.form.valid"
                            [buttonBusy]="saving()"
                            [busyText]="l('SavingWithThreeDot')">
                            <i class="fa fa-save"></i>
                            <span>{{ 'Save' | localize }}</span>
                        </button>
                    </div>
                </form>
            }
        </div>
    </div>
</div>
