<div
    appBsModal
    #createOrEditModal="bs-modal"
    (onShown)="onShown()"
    class="modal fade"
    tabindex="-1"
    role="dialog"
    aria-labelledby="createOrEditModal"
    aria-hidden="true"
    [config]="{ backdrop: 'static', keyboard: !saving() }">
    <div class="modal-dialog modal-lg">
        <div class="modal-content">
            @if (active()) {
                <form #bankForm="ngForm" novalidate (ngSubmit)="save()" autocomplete="off">
                    <div class="modal-header">
                        <h4 class="modal-title">
                            @if (bank().id) {
                                <span>{{ 'EditingBank' | localize }}</span>
                            } @else {
                                <span>{{ 'CreatingNewBank' | localize }}</span>
                            }
                        </h4>
                        <button
                            type="button"
                            class="btn-close"
                            (click)="close()"
                            [attr.aria-label]="l('Close')"
                            [disabled]="saving()"></button>
                    </div>
                    <div class="modal-body">
                        <div class="mb-5">
                            <label class="form-label" for="Bank_Code">{{ 'Code' | localize }}</label>
                            <input
                                id="Bank_Code"
                                class="form-control"
                                type="text"
                                name="Code"
                                [ngModel]="bank().code"
                                (ngModelChange)="updateField('code', $event)"
                                maxlength="50" [placeholder]="l('AutoGeneratedIfEmpty')" />
                            
                        </div>

                        <div class="mb-5">
                            <label class="form-label required" for="Bank_NameEn">{{ 'NameEn' | localize }}</label>
                            <input
                                id="Bank_NameEn"
                                #nameEnInput="ngModel"
                                class="form-control"
                                type="text"
                                name="NameEn"
                                [ngModel]="bank().nameEn"
                                (ngModelChange)="updateField('nameEn', $event)"
                                required
                                maxlength="200" />
                            <validation-messages [formCtrl]="nameEnInput" />
                        </div>

                        <div class="mb-5">
                            <label class="form-label required" for="Bank_NameAr">{{ 'NameAr' | localize }}</label>
                            <input
                                id="Bank_NameAr"
                                #nameArInput="ngModel"
                                class="form-control"
                                type="text"
                                name="NameAr"
                                dir="rtl"
                                [ngModel]="bank().nameAr"
                                (ngModelChange)="updateField('nameAr', $event)"
                                required
                                maxlength="200" />
                            <validation-messages [formCtrl]="nameArInput" />
                        </div>

                        <div class="mb-5">
                            <label class="form-label" for="Bank_ExternalCode">{{ 'ExternalCode' | localize }}</label>
                            <input
                                id="Bank_ExternalCode"
                                class="form-control"
                                type="text"
                                name="ExternalCode"
                                [ngModel]="bank().externalCode"
                                (ngModelChange)="updateField('externalCode', $event)"
                                maxlength="50" />
                            
                        </div>

                        <div class="mb-5">
                            <label class="form-label" for="Bank_SWIFTCode">{{ 'SWIFTCode' | localize }}</label>
                            <input
                                id="Bank_SWIFTCode"
                                class="form-control"
                                type="text"
                                name="SWIFTCode"
                                [ngModel]="bank().swiftCode"
                                (ngModelChange)="updateField('swiftCode', $event)"
                                maxlength="50" />
                            
                        </div>

                        <div class="mb-5">
                            <label class="form-label" for="Bank_CompanyCode">{{ 'CompanyCode' | localize }}</label>
                            <input
                                id="Bank_CompanyCode"
                                class="form-control"
                                type="text"
                                name="CompanyCode"
                                [ngModel]="bank().companyCode"
                                (ngModelChange)="updateField('companyCode', $event)"
                                maxlength="50" />
                            
                        </div>

                        <div class="mb-5">
                            <label class="form-label" for="Bank_BankFileId">{{ 'BankFile' | localize }}</label>
                            <select
                                id="Bank_BankFileId"
                                class="form-select"
                                name="BankFileId"
                                [ngModel]="bank().bankFileId"
                                (ngModelChange)="updateField('bankFileId', $event)">
                                <option [ngValue]="undefined"></option>
                                @for (bankFile of bankFiles(); track bankFile.id) {
                                    <option [ngValue]="bankFile.id">{{ bankFile.nameEn }}</option>
                                }
                            </select>
                        </div>
                    </div>
                    <div class="modal-footer">
                        <button
                            [disabled]="saving()"
                            type="button"
                            class="btn btn-light-primary fw-bold"
                            (click)="close()">
                            {{ 'Cancel' | localize }}
                        </button>
                        <button
                            type="submit"
                            class="btn btn-primary fw-bold"
                            [disabled]="!bankForm.form.valid"
                            [buttonBusy]="saving()"
                            [busyText]="l('SavingWithThreeDot')">
                            <i class="fa fa-save"></i>
                            <span>{{ 'Save' | localize }}</span>
                        </button>
                    </div>
                </form>
            }
        </div>
    </div>
</div>
