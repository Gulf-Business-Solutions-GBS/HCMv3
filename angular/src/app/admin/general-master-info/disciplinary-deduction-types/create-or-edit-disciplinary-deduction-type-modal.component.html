<div
    appBsModal
    #createOrEditModal="bs-modal"
    (onShown)="onShown()"
    class="modal fade"
    tabindex="-1"
    role="dialog"
    aria-labelledby="createOrEditModal"
    aria-hidden="true"
    [config]="{ backdrop: 'static', keyboard: !saving() }">
    <div class="modal-dialog modal-lg">
        <div class="modal-content">
            @if (active()) {
                <form #disciplinaryDeductionTypeForm="ngForm" novalidate (ngSubmit)="save()" autocomplete="off">
                    <div class="modal-header">
                        <h4 class="modal-title">
                            @if (disciplinaryDeductionType().id) {
                                <span>{{ 'EditingDisciplinaryDeductionType' | localize }}</span>
                            } @else {
                                <span>{{ 'CreatingNewDisciplinaryDeductionType' | localize }}</span>
                            }
                        </h4>
                        <button
                            type="button"
                            class="btn-close"
                            (click)="close()"
                            [attr.aria-label]="l('Close')"
                            [disabled]="saving()"></button>
                    </div>
                    <div class="modal-body">
                        <div class="mb-5">
                            <label class="form-label" for="DisciplinaryDeductionType_Code">{{ 'Code' | localize }}</label>
                            <input
                                id="DisciplinaryDeductionType_Code"
                                class="form-control"
                                type="text"
                                name="Code"
                                [ngModel]="disciplinaryDeductionType().code"
                                (ngModelChange)="updateField('code', $event)"
                                maxlength="50"
                                [placeholder]="l('AutoGeneratedIfEmpty')" />
                        </div>

                        <div class="mb-5">
                            <label class="form-label required" for="DisciplinaryDeductionType_NameEn">{{ 'NameEn' | localize }}</label>
                            <input
                                id="DisciplinaryDeductionType_NameEn"
                                #nameEnInput="ngModel"
                                class="form-control"
                                type="text"
                                name="NameEn"
                                [ngModel]="disciplinaryDeductionType().nameEn"
                                (ngModelChange)="updateField('nameEn', $event)"
                                required
                                maxlength="200" />
                            <validation-messages [formCtrl]="nameEnInput" />
                        </div>

                        <div class="mb-5">
                            <label class="form-label required" for="DisciplinaryDeductionType_NameAr">{{ 'NameAr' | localize }}</label>
                            <input
                                id="DisciplinaryDeductionType_NameAr"
                                #nameArInput="ngModel"
                                class="form-control"
                                type="text"
                                name="NameAr"
                                dir="rtl"
                                [ngModel]="disciplinaryDeductionType().nameAr"
                                (ngModelChange)="updateField('nameAr', $event)"
                                required
                                maxlength="200" />
                            <validation-messages [formCtrl]="nameArInput" />
                        </div>

                        <div class="mb-5">
                            <label class="form-label required" for="DisciplinaryDeductionType_DisciplinaryDeductionUnit">
                                {{ 'DisciplinaryDeductionUnit' | localize }}
                            </label>
                            <select
                                id="DisciplinaryDeductionType_DisciplinaryDeductionUnit"
                                class="form-select"
                                name="DisciplinaryDeductionUnit"
                                [ngModel]="disciplinaryDeductionType().disciplinaryDeductionUnit"
                                (ngModelChange)="updateField('disciplinaryDeductionUnit', $event)"
                                required>
                                @for (unitOption of deductionUnits; track unitOption.value) {
                                    <option [ngValue]="unitOption.value">{{ unitOption.label | localize }}</option>
                                }
                            </select>
                        </div>

                        <div class="mb-5">
                            <label class="form-label required" for="DisciplinaryDeductionType_DeductionValue">
                                {{ 'DeductionValue' | localize }}
                            </label>
                            <input
                                id="DisciplinaryDeductionType_DeductionValue"
                                #deductionValueInput="ngModel"
                                class="form-control"
                                type="number"
                                name="DeductionValue"
                                [ngModel]="disciplinaryDeductionType().deductionValue"
                                (ngModelChange)="updateField('deductionValue', $event)"
                                required
                                min="0"
                                step="0.01" />
                            <validation-messages [formCtrl]="deductionValueInput" />
                        </div>
                    </div>
                    <div class="modal-footer">
                        <button
                            [disabled]="saving()"
                            type="button"
                            class="btn btn-light-primary fw-bold"
                            (click)="close()">
                            {{ 'Cancel' | localize }}
                        </button>
                        <button
                            type="submit"
                            class="btn btn-primary fw-bold"
                            [disabled]="!disciplinaryDeductionTypeForm.form.valid"
                            [buttonBusy]="saving()"
                            [busyText]="l('SavingWithThreeDot')">
                            <i class="fa fa-save"></i>
                            <span>{{ 'Save' | localize }}</span>
                        </button>
                    </div>
                </form>
            }
        </div>
    </div>
</div>
