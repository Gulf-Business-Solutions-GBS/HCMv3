<div
    appBsModal
    #createOrEditModal="bs-modal"
    (onShown)="onShown()"
    class="modal fade"
    tabindex="-1"
    role="dialog"
    aria-labelledby="createOrEditModal"
    aria-hidden="true"
    [config]="{ backdrop: 'static', keyboard: !saving() }">
    <div class="modal-dialog modal-lg">
        <div class="modal-content">
            @if (active()) {
                <form #disciplinaryTypeForm="ngForm" novalidate (ngSubmit)="save()" autocomplete="off">
                    <div class="modal-header">
                        <h4 class="modal-title">
                            @if (disciplinaryType().id) {
                                <span>{{ 'EditingDisciplinaryType' | localize }}</span>
                            } @else {
                                <span>{{ 'CreatingNewDisciplinaryType' | localize }}</span>
                            }
                        </h4>
                        <button
                            type="button"
                            class="btn-close"
                            (click)="close()"
                            [attr.aria-label]="l('Close')"
                            [disabled]="saving()"></button>
                    </div>
                    <div class="modal-body">
                        <div class="mb-5">
                            <label class="form-label" for="DisciplinaryType_Code">{{ 'Code' | localize }}</label>
                            <input
                                id="DisciplinaryType_Code"
                                class="form-control"
                                type="text"
                                name="Code"
                                [ngModel]="disciplinaryType().code"
                                (ngModelChange)="updateField('code', $event)"
                                maxlength="50" [placeholder]="l('AutoGeneratedIfEmpty')" />
                            
                        </div>

                        <div class="mb-5">
                            <label class="form-label required" for="DisciplinaryType_NameEn">{{ 'NameEn' | localize }}</label>
                            <input
                                id="DisciplinaryType_NameEn"
                                #nameEnInput="ngModel"
                                class="form-control"
                                type="text"
                                name="NameEn"
                                [ngModel]="disciplinaryType().nameEn"
                                (ngModelChange)="updateField('nameEn', $event)"
                                required
                                maxlength="200" />
                            <validation-messages [formCtrl]="nameEnInput" />
                        </div>

                        <div class="mb-5">
                            <label class="form-label required" for="DisciplinaryType_NameAr">{{ 'NameAr' | localize }}</label>
                            <input
                                id="DisciplinaryType_NameAr"
                                #nameArInput="ngModel"
                                class="form-control"
                                type="text"
                                name="NameAr"
                                dir="rtl"
                                [ngModel]="disciplinaryType().nameAr"
                                (ngModelChange)="updateField('nameAr', $event)"
                                required
                                maxlength="200" />
                            <validation-messages [formCtrl]="nameArInput" />
                        </div>

                        <div class="mb-5">
                            <label class="form-label required" for="DisciplinaryType_RepeatDurationInDays">{{ 'RepeatDurationInDays' | localize }}</label>
                            <input
                                id="DisciplinaryType_RepeatDurationInDays"
                                #repeatDurationInDaysInput="ngModel"
                                class="form-control"
                                type="number"
                                name="RepeatDurationInDays"
                                [ngModel]="disciplinaryType().repeatDurationInDays"
                                (ngModelChange)="updateField('repeatDurationInDays', $event)"
                                required
                                min="0" />
                            <validation-messages [formCtrl]="repeatDurationInDaysInput" />
                        </div>
                    </div>
                    <div class="modal-footer">
                        <button
                            [disabled]="saving()"
                            type="button"
                            class="btn btn-light-primary fw-bold"
                            (click)="close()">
                            {{ 'Cancel' | localize }}
                        </button>
                        <button
                            type="submit"
                            class="btn btn-primary fw-bold"
                            [disabled]="!disciplinaryTypeForm.form.valid"
                            [buttonBusy]="saving()"
                            [busyText]="l('SavingWithThreeDot')">
                            <i class="fa fa-save"></i>
                            <span>{{ 'Save' | localize }}</span>
                        </button>
                    </div>
                </form>
            }
        </div>
    </div>
</div>
