<div
    appBsModal
    #createOrEditModal="bs-modal"
    (onShown)="onShown()"
    class="modal fade"
    tabindex="-1"
    role="dialog"
    aria-labelledby="createOrEditModal"
    aria-hidden="true"
    [config]="{ backdrop: 'static', keyboard: !saving() }">
    <div class="modal-dialog modal-lg">
        <div class="modal-content">
            @if (active()) {
                <form #roleForm="ngForm" novalidate (ngSubmit)="save()" autocomplete="new-password">
                    <div class="modal-header">
                        <h4 class="modal-title">
                            @if (role().id) {
                                <span>{{ 'EditRole' | localize }}: {{ role().displayName }}</span>
                            }
                            @if (!role().id) {
                                <span>{{ 'CreateNewRole' | localize }}</span>
                            }
                        </h4>
                        <button
                            type="button"
                            class="btn-close"
                            (click)="close()"
                            [attr.aria-label]="l('Close')"
                            [disabled]="saving()"></button>
                    </div>
                    <div class="modal-body">
                        <tabset class="tab-container tabbable-line">
                            <tab heading="{{ 'RoleName' | localize }}" class="p-5">
                                <div class="mb-5">
                                    <label class="form-label required">{{ 'RoleName' | localize }}</label>
                                    <input
                                        id="RoleDisplayName"
                                        #roleNameInput="ngModel"
                                        class="form-control"
                                        type="text"
                                        name="DisplayName"
                                        [ngModel]="role().displayName"
                                        (ngModelChange)="updateRoleDisplayName($event)"
                                        required
                                        maxlength="64" />
                                    <validation-messages [formCtrl]="roleNameInput" />
                                </div>
                                <label class="form-check form-check-custom form-check-solid py-1">
                                    <input
                                        id="EditRole_IsDefault"
                                        type="checkbox"
                                        name="IsDefault"
                                        [ngModel]="role().isDefault"
                                        (ngModelChange)="updateRoleIsDefault($event)"
                                        class="form-check-input" />
                                    <span class="form-check-label">
                                        {{ 'Default' | localize }}
                                        <small class="form-text text-muted ms-3">
                                            ({{ 'DefaultRole_Description' | localize }})
                                        </small>
                                    </span>
                                </label>
                            </tab>
                            <tab heading="{{ 'Permissions' | localize }}" class="p-5">
                                <permission-tree #permissionTree [editData]="permissionData()" />
                            </tab>
                        </tabset>
                        <div class="alert alert-warning" style="margin-top: 30px">
                            <em>{{ 'Note_RefreshPageForPermissionChanges' | localize }}</em>
                        </div>
                    </div>
                    <div class="modal-footer">
                        <button
                            [disabled]="saving()"
                            type="button"
                            class="btn btn-light-primary fw-bold"
                            (click)="close()">
                            {{ 'Cancel' | localize }}
                        </button>
                        <button
                            type="submit"
                            class="btn btn-primary fw-bold"
                            [disabled]="!roleForm.form.valid"
                            [buttonBusy]="saving()"
                            [busyText]="l('SavingWithThreeDot')">
                            <i class="fa fa-save"></i>
                            <span>{{ 'Save' | localize }}</span>
                        </button>
                    </div>
                </form>
            }
        </div>
    </div>
</div>
