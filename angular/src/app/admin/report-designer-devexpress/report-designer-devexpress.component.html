<div [@routerTransition]>

        [description]="'ReportDesignerDevExpressDescription' | localize"></sub-header>

    <div [class]="containerClass">
        <div class="card card-custom">
            <div class="card-body p-0">
                <dx-report-designer [reportUrl]="reportUrl" [height]="'80vh'">

                </dx-report-designer>
            </div>
        </div>
    </div>
</div>
