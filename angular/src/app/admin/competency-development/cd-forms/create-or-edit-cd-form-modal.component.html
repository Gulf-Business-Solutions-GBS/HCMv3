<div
    appBsModal
    #createOrEditModal="bs-modal"
    (onShown)="onShown()"
    class="modal fade"
    tabindex="-1"
    role="dialog"
    aria-labelledby="createOrEditModal"
    aria-hidden="true"
    [config]="{ backdrop: 'static', keyboard: !saving() }">
    <div class="modal-dialog modal-lg">
        <div class="modal-content">
            @if (active()) {
                <form #cdFormForm="ngForm" novalidate (ngSubmit)="save()" autocomplete="off">
                    <div class="modal-header">
                        <h4 class="modal-title">
                            @if (cdForm().id) {
                                <span>{{ 'EditItem' | localize }}: {{ 'CDForms' | localize }}</span>
                            } @else {
                                <span>{{ 'CreateNewItem' | localize }}: {{ 'CDForms' | localize }}</span>
                            }
                        </h4>
                        <button
                            type="button"
                            class="btn-close"
                            (click)="close()"
                            [attr.aria-label]="l('Close')"
                            [disabled]="saving()"></button>
                    </div>
                    <div class="modal-body">
                        <div class="row">
                            <div class="col-md-4 mb-5">
                                <label class="form-label required" for="CDForm_CDPeriodId">{{ 'CDPeriod' | localize }}</label>
                                <select
                                    id="CDForm_CDPeriodId"
                                    #cdPeriodIdInput="ngModel"
                                    class="form-select"
                                    name="CDPeriodId"
                                    [ngModel]="cdForm().cdPeriodId"
                                    (ngModelChange)="updateField('cdPeriodId', $event)"
                                    required>
                                    <option [ngValue]="undefined"></option>
                                    @for (period of cdPeriods(); track period.id) {
                                        <option [ngValue]="period.id">{{ period.name }}</option>
                                    }
                                </select>
                                <validation-messages [formCtrl]="cdPeriodIdInput" />
                            </div>
                            <div class="col-md-4 mb-5">
                                <label class="form-label required" for="CDForm_EmployeeId">{{ 'Employee' | localize }}</label>
                                <select
                                    id="CDForm_EmployeeId"
                                    #employeeIdInput="ngModel"
                                    class="form-select"
                                    name="EmployeeId"
                                    [ngModel]="cdForm().employeeId"
                                    (ngModelChange)="updateField('employeeId', $event)"
                                    required>
                                    <option [ngValue]="undefined"></option>
                                    @for (employee of employees(); track employee.id) {
                                        <option [ngValue]="employee.id">{{ employeeLabel(employee) }}</option>
                                    }
                                </select>
                                <validation-messages [formCtrl]="employeeIdInput" />
                            </div>
                            <div class="col-md-4 mb-5">
                                <label class="form-label" for="CDForm_ModeratedScore">{{ 'ModeratedScore' | localize }}</label>
                                <input
                                    id="CDForm_ModeratedScore"
                                    type="number"
                                    class="form-control"
                                    name="ModeratedScore"
                                    [ngModel]="cdForm().moderatedScore"
                                    (ngModelChange)="updateField('moderatedScore', $event)" />
                            </div>
                        </div>
                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <div class="form-check">
                                    <input id="CDForm_EmployeeSignedOff" type="checkbox" class="form-check-input" name="EmployeeSignedOff"
                                        [ngModel]="cdForm().employeeSignedOff" (ngModelChange)="updateField('employeeSignedOff', $event)" />
                                    <label class="form-check-label" for="CDForm_EmployeeSignedOff">{{ 'EmployeeSignedOff' | localize }}</label>
                                </div>
                            </div>
                            <div class="col-md-6 mb-3">
                                <div class="form-check">
                                    <input id="CDForm_ManagerSignedOff" type="checkbox" class="form-check-input" name="ManagerSignedOff"
                                        [ngModel]="cdForm().managerSignedOff" (ngModelChange)="updateField('managerSignedOff', $event)" />
                                    <label class="form-check-label" for="CDForm_ManagerSignedOff">{{ 'ManagerSignedOff' | localize }}</label>
                                </div>
                            </div>
                        </div>
                    </div>
                    <div class="modal-footer">
                        <button [disabled]="saving()" type="button" class="btn btn-light-primary fw-bold" (click)="close()">
                            {{ 'Cancel' | localize }}
                        </button>
                        <button
                            type="submit"
                            class="btn btn-primary fw-bold"
                            [disabled]="!cdFormForm.form.valid"
                            [buttonBusy]="saving()"
                            [busyText]="l('SavingWithThreeDot')">
                            <i class="fa fa-save"></i>
                            <span>{{ 'Save' | localize }}</span>
                        </button>
                    </div>
                </form>
            }
        </div>
    </div>
</div>
