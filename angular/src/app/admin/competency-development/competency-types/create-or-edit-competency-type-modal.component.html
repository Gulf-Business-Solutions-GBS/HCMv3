<div
    appBsModal
    #createOrEditModal="bs-modal"
    (onShown)="onShown()"
    class="modal fade"
    tabindex="-1"
    role="dialog"
    aria-labelledby="createOrEditModal"
    aria-hidden="true"
    [config]="{ backdrop: 'static', keyboard: !saving() }">
    <div class="modal-dialog modal-lg">
        <div class="modal-content">
            @if (active()) {
                <form #competencyTypeForm="ngForm" novalidate (ngSubmit)="save()" autocomplete="off">
                    <div class="modal-header">
                        <h4 class="modal-title">
                            @if (competencyType().id) {
                                <span>{{ 'EditItem' | localize }}: {{ 'CompetencyTypes' | localize }}</span>
                            } @else {
                                <span>{{ 'CreateNewItem' | localize }}: {{ 'CompetencyTypes' | localize }}</span>
                            }
                        </h4>
                        <button
                            type="button"
                            class="btn-close"
                            (click)="close()"
                            [attr.aria-label]="l('Close')"
                            [disabled]="saving()"></button>
                    </div>
                    <div class="modal-body">
                        <div class="row">
                            <div class="col-md-4 mb-5">
                                <label class="form-label" for="CompetencyType_Code">{{ 'Code' | localize }}</label>
                                <input
                                    id="CompetencyType_Code"
                                    type="text"
                                    class="form-control"
                                    name="Code"
                                    maxlength="64"
                                    [ngModel]="competencyType().code"
                                    (ngModelChange)="updateField('code', $event)" />
                            </div>
                            <div class="col-md-4 mb-5">
                                <label class="form-label required" for="CompetencyType_NameEn">{{ 'NameEn' | localize }}</label>
                                <input
                                    id="CompetencyType_NameEn"
                                    #nameEnInput="ngModel"
                                    type="text"
                                    class="form-control"
                                    name="NameEn"
                                    maxlength="256"
                                    [ngModel]="competencyType().nameEn"
                                    (ngModelChange)="updateField('nameEn', $event)"
                                    required />
                                <validation-messages [formCtrl]="nameEnInput" />
                            </div>
                            <div class="col-md-4 mb-5">
                                <label class="form-label required" for="CompetencyType_NameAr">{{ 'NameAr' | localize }}</label>
                                <input
                                    id="CompetencyType_NameAr"
                                    #nameArInput="ngModel"
                                    type="text"
                                    class="form-control"
                                    name="NameAr"
                                    maxlength="256"
                                    [ngModel]="competencyType().nameAr"
                                    (ngModelChange)="updateField('nameAr', $event)"
                                    required />
                                <validation-messages [formCtrl]="nameArInput" />
                            </div>
                        </div>
                        <div class="row">
                            <div class="col-md-6 mb-5">
                                <label class="form-label" for="CompetencyType_BackColor">{{ 'BackColor' | localize }}</label>
                                <input
                                    id="CompetencyType_BackColor"
                                    type="text"
                                    class="form-control"
                                    name="BackColor"
                                    maxlength="32"
                                    placeholder="#RRGGBB"
                                    [ngModel]="competencyType().backColor"
                                    (ngModelChange)="updateField('backColor', $event)" />
                            </div>
                            <div class="col-md-6 mb-5">
                                <label class="form-label" for="CompetencyType_ForeColor">{{ 'ForeColor' | localize }}</label>
                                <input
                                    id="CompetencyType_ForeColor"
                                    type="text"
                                    class="form-control"
                                    name="ForeColor"
                                    maxlength="32"
                                    placeholder="#RRGGBB"
                                    [ngModel]="competencyType().foreColor"
                                    (ngModelChange)="updateField('foreColor', $event)" />
                            </div>
                        </div>
                    </div>
                    <div class="modal-footer">
                        <button [disabled]="saving()" type="button" class="btn btn-light-primary fw-bold" (click)="close()">
                            {{ 'Cancel' | localize }}
                        </button>
                        <button
                            type="submit"
                            class="btn btn-primary fw-bold"
                            [disabled]="!competencyTypeForm.form.valid"
                            [buttonBusy]="saving()"
                            [busyText]="l('SavingWithThreeDot')">
                            <i class="fa fa-save"></i>
                            <span>{{ 'Save' | localize }}</span>
                        </button>
                    </div>
                </form>
            }
        </div>
    </div>
</div>
