<div
    appBsModal
    #createOrEditModal="bs-modal"
    (onShown)="onShown()"
    class="modal fade"
    tabindex="-1"
    role="dialog"
    aria-labelledby="createOrEditModal"
    aria-hidden="true"
    [config]="{ backdrop: 'static', keyboard: !saving() }">
    <div class="modal-dialog modal-lg">
        <div class="modal-content">
            @if (active()) {
                <form #competencyByJobTitleForm="ngForm" novalidate (ngSubmit)="save()" autocomplete="off">
                    <div class="modal-header">
                        <h4 class="modal-title">
                            @if (competencyByJobTitle().id) {
                                <span>{{ 'EditItem' | localize }}: {{ 'CompetencyByJobTitles' | localize }}</span>
                            } @else {
                                <span>{{ 'CreateNewItem' | localize }}: {{ 'CompetencyByJobTitles' | localize }}</span>
                            }
                        </h4>
                        <button
                            type="button"
                            class="btn-close"
                            (click)="close()"
                            [attr.aria-label]="l('Close')"
                            [disabled]="saving()"></button>
                    </div>
                    <div class="modal-body">
                        <div class="row">
                            <div class="col-md-4 mb-5">
                                <label class="form-label required" for="CompetencyByJobTitle_JobTitleId">{{ 'JobTitle' | localize }}</label>
                                <select
                                    id="CompetencyByJobTitle_JobTitleId"
                                    #jobTitleIdInput="ngModel"
                                    class="form-select"
                                    name="JobTitleId"
                                    [ngModel]="competencyByJobTitle().jobTitleId"
                                    (ngModelChange)="updateField('jobTitleId', $event)"
                                    required>
                                    <option [ngValue]="undefined"></option>
                                    @for (jobTitle of jobTitles(); track jobTitle.id) {
                                        <option [ngValue]="jobTitle.id">{{ jobTitle.nameEn }}</option>
                                    }
                                </select>
                                <validation-messages [formCtrl]="jobTitleIdInput" />
                            </div>
                            <div class="col-md-4 mb-5">
                                <label class="form-label required" for="CompetencyByJobTitle_StartDate">{{ 'StartDate' | localize }}</label>
                                <input
                                    id="CompetencyByJobTitle_StartDate"
                                    #startDateInput="ngModel"
                                    type="date"
                                    class="form-control"
                                    name="StartDate"
                                    [ngModel]="competencyByJobTitle().startDate?.toISODate()"
                                    (ngModelChange)="updateStartDate($event)"
                                    required />
                                <validation-messages [formCtrl]="startDateInput" />
                            </div>
                            <div class="col-md-4 mb-5">
                                <label class="form-label required" for="CompetencyByJobTitle_EndDate">{{ 'EndDate' | localize }}</label>
                                <input
                                    id="CompetencyByJobTitle_EndDate"
                                    #endDateInput="ngModel"
                                    type="date"
                                    class="form-control"
                                    name="EndDate"
                                    [ngModel]="competencyByJobTitle().endDate?.toISODate()"
                                    (ngModelChange)="updateEndDate($event)"
                                    required />
                                <validation-messages [formCtrl]="endDateInput" />
                            </div>
                        </div>
                    </div>
                    <div class="modal-footer">
                        <button [disabled]="saving()" type="button" class="btn btn-light-primary fw-bold" (click)="close()">
                            {{ 'Cancel' | localize }}
                        </button>
                        <button
                            type="submit"
                            class="btn btn-primary fw-bold"
                            [disabled]="!competencyByJobTitleForm.form.valid"
                            [buttonBusy]="saving()"
                            [busyText]="l('SavingWithThreeDot')">
                            <i class="fa fa-save"></i>
                            <span>{{ 'Save' | localize }}</span>
                        </button>
                    </div>
                </form>
            }
        </div>
    </div>
</div>
