<div [@routerTransition]>
    <sub-header [title]="'OrganizationUnits' | localize" [description]="'OrganizationUnitsHeaderInfo' | localize" />
    <div [class]="containerClass">
        <div class="row">
            <div class="col-6">
                <organization-tree #ouTree (ouSelected)="ouSelected($event)" />
            </div>
            <div class="col-6">
                <div class="card card-custom gutter-b">
                    <div class="card-header align-items-center border-0">
                        <h3 class="card-title align-items-start flex-column">
                            <span class="fw-bolder text-gray-900">
                                @if (organizationUnit()) {
                                    <span>{{ organizationUnit().displayName }}</span>
                                }
                            </span>
                        </h3>
                    </div>
                    <div class="card-body">
                        <tabset class="tab-container">
                            <tab heading="{{ 'Members' | localize }}" [active]="true">
                                <organization-unit-members
                                    #ouMembers
                                    [organizationUnit]="organizationUnit()"
                                    (membersAdded)="ouTree.membersAdded($event)"
                                    (memberRemoved)="ouTree.memberRemoved($event)" />
                            </tab>
                            <tab heading="{{ 'Roles' | localize }}">
                                <organization-unit-roles
                                    #ouRoles
                                    [organizationUnit]="organizationUnit()"
                                    (rolesAdded)="ouTree.rolesAdded($event)"
                                    (roleRemoved)="ouTree.roleRemoved($event)" />
                            </tab>
                        </tabset>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
