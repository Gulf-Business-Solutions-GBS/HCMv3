<div
    appBsModal
    #createOrEditModal="bs-modal"
    (onShown)="onShown()"
    class="modal fade"
    tabindex="-1"
    role="dialog"
    aria-labelledby="createOrEditModal"
    aria-hidden="true"
    [config]="{ backdrop: 'static', keyboard: !saving() }">
    <div class="modal-dialog modal-lg">
        <div class="modal-content">
            @if (active()) {
                <form #editForm="ngForm" novalidate (ngSubmit)="save()">
                    <div class="modal-header">
                        <h5 class="modal-title">
                            @if (organizationUnit().id) {
                                <span>{{ 'Edit' | localize }}: {{ organizationUnit().displayName }}</span>
                            }
                            @if (!organizationUnit().id) {
                                <span>{{ 'NewOrganizationUnit' | localize }}</span>
                            }
                        </h5>
                        <button
                            type="button"
                            class="btn-close"
                            (click)="close()"
                            [attr.aria-label]="l('Close')"
                            [disabled]="saving()"></button>
                    </div>
                    <div class="modal-body">
                        <div class="mb-5 form-md-line-input form-md-floating-label no-hint">
                            <label class="form-label required" for="OrganizationUnitDisplayName">
                                {{ 'Name' | localize }}
                            </label>
                            <input
                                id="OrganizationUnitDisplayName"
                                #organizationUnitDisplayName="ngModel"
                                class="form-control"
                                type="text"
                                name="displayName"
                                [ngClass]="{ edited: organizationUnit().displayName }"
                                [ngModel]="organizationUnit().displayName"
                                (ngModelChange)="updateDisplayName($event)"
                                required
                                maxlength="128" />
                            <validation-messages [formCtrl]="organizationUnitDisplayName" />
                        </div>
                    </div>
                    <div class="modal-footer">
                        <button
                            [disabled]="saving()"
                            type="button"
                            class="btn btn-light-primary fw-bold"
                            (click)="close()">
                            {{ 'Cancel' | localize }}
                        </button>
                        <button
                            type="submit"
                            class="btn btn-primary fw-bold"
                            [disabled]="!editForm.form.valid"
                            [buttonBusy]="saving()"
                            [busyText]="l('SavingWithThreeDot')">
                            <i class="fa fa-save"></i>
                            <span>{{ 'Save' | localize }}</span>
                        </button>
                    </div>
                </form>
            }
        </div>
    </div>
</div>
