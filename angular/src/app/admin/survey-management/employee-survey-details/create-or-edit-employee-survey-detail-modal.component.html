<div
    appBsModal
    #createOrEditModal="bs-modal"
    (onShown)="onShown()"
    class="modal fade"
    tabindex="-1"
    role="dialog"
    aria-labelledby="createOrEditModal"
    aria-hidden="true"
    [config]="{ backdrop: 'static', keyboard: !saving() }">
    <div class="modal-dialog modal-lg">
        <div class="modal-content">
            @if (active()) {
                <form #employeeSurveyDetailForm="ngForm" novalidate (ngSubmit)="save()" autocomplete="off">
                    <div class="modal-header">
                        <h4 class="modal-title">
                            @if (employeeSurveyDetail().id) {
                                <span>{{ 'EditItem' | localize }}: {{ 'EmployeeSurveyDetails' | localize }}</span>
                            } @else {
                                <span>{{ 'CreateNewItem' | localize }}: {{ 'EmployeeSurveyDetails' | localize }}</span>
                            }
                        </h4>
                        <button
                            type="button"
                            class="btn-close"
                            (click)="close()"
                            [attr.aria-label]="l('Close')"
                            [disabled]="saving()"></button>
                    </div>
                    <div class="modal-body">
                        <div class="row">
                            <div class="col-md-12 mb-5">
                                <label class="form-label required" for="EmployeeSurveyDetail_EmployeeSurveyId">{{ 'EmployeeSurveys' | localize }}</label>
                                <select
                                    id="EmployeeSurveyDetail_EmployeeSurveyId"
                                    #employeeSurveyIdInput="ngModel"
                                    class="form-select"
                                    name="EmployeeSurveyId"
                                    [ngModel]="employeeSurveyDetail().employeeSurveyId"
                                    (ngModelChange)="updateField('employeeSurveyId', $event)"
                                    required>
                                    <option [ngValue]="undefined"></option>
                                    @for (employeeSurvey of employeeSurveys(); track employeeSurvey.id) {
                                        <option [ngValue]="employeeSurvey.id">{{ employeeSurveyLabel(employeeSurvey) }}</option>
                                    }
                                </select>
                                <validation-messages [formCtrl]="employeeSurveyIdInput" />
                            </div>
                        </div>
                        <div class="row">
                            <div class="col-md-12 mb-5">
                                <label class="form-label required" for="EmployeeSurveyDetail_QuestionId">{{ 'Question' | localize }}</label>
                                <select
                                    id="EmployeeSurveyDetail_QuestionId"
                                    #questionIdInput="ngModel"
                                    class="form-select"
                                    name="QuestionId"
                                    [ngModel]="employeeSurveyDetail().questionId"
                                    (ngModelChange)="updateField('questionId', $event)"
                                    required>
                                    <option [ngValue]="undefined"></option>
                                    @for (question of questions(); track question.id) {
                                        <option [ngValue]="question.id">{{ question.question }}</option>
                                    }
                                </select>
                                <validation-messages [formCtrl]="questionIdInput" />
                            </div>
                        </div>
                        <div class="row">
                            <div class="col-md-12 mb-5">
                                <label class="form-label" for="EmployeeSurveyDetail_Answer">{{ 'Answer' | localize }}</label>
                                <input
                                    id="EmployeeSurveyDetail_Answer"
                                    class="form-control"
                                    type="text"
                                    name="Answer"
                                    [ngModel]="employeeSurveyDetail().answer"
                                    (ngModelChange)="updateField('answer', $event)"
                                    maxlength="1000" />
                            </div>
                        </div>
                    </div>
                    <div class="modal-footer">
                        <button
                            [disabled]="saving()"
                            type="button"
                            class="btn btn-light-primary fw-bold"
                            (click)="close()">
                            {{ 'Cancel' | localize }}
                        </button>
                        <button
                            type="submit"
                            class="btn btn-primary fw-bold"
                            [disabled]="!employeeSurveyDetailForm.form.valid"
                            [buttonBusy]="saving()"
                            [busyText]="l('SavingWithThreeDot')">
                            <i class="fa fa-save"></i>
                            <span>{{ 'Save' | localize }}</span>
                        </button>
                    </div>
                </form>
            }
        </div>
    </div>
</div>
