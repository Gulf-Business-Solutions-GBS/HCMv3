<div
    appBsModal
    #createOrEditModal="bs-modal"
    (onShown)="onShown()"
    class="modal fade"
    tabindex="-1"
    role="dialog"
    aria-labelledby="createOrEditModal"
    aria-hidden="true"
    [config]="{ backdrop: 'static', keyboard: !saving() }">
    <div class="modal-dialog modal-lg">
        <div class="modal-content">
            @if (active()) {
                <form #recordForm="ngForm" novalidate (ngSubmit)="save()" autocomplete="off">
                    <div class="modal-header">
                        <h4 class="modal-title">
                            @if (record().id) {
                                <span>{{ 'Edit' | localize }}</span>
                            } @else {
                                <span>{{ 'CreateNew' | localize }}</span>
                            }
                        </h4>
                        <button type="button" class="btn-close" (click)="close()" [disabled]="saving()"></button>
                    </div>
                    <div class="modal-body">
                        <div class="row">
                            <div class="col-md-12 mb-5">
                                <label class="form-label required" for="EmployeeFundDetail_EmployeeFundId">{{ 'EmployeeFundId' | localize }}</label>
                                <select
                                    id="EmployeeFundDetail_EmployeeFundId"
                                    #employeeFundIdInput="ngModel"
                                    class="form-select"
                                    name="EmployeeFundId"
                                    [ngModel]="record().employeeFundId"
                                    (ngModelChange)="updateField('employeeFundId', $event)"
                                    required>
                                    <option [ngValue]="undefined"></option>
                                    @for (fund of employeeFunds(); track fund.id) {
                                        <option [ngValue]="fund.id">
                                            {{ fund.employeeCode }} - {{ fund.employeeFullNameEn }} ({{ fund.startDate | luxonFormat: 'yyyy-MM-dd' }} - {{ fund.endDate | luxonFormat: 'yyyy-MM-dd' }})
                                        </option>
                                    }
                                </select>
                                <validation-messages [formCtrl]="employeeFundIdInput" />
                            </div>
                        </div>
                        <div class="row">
                            <div class="col-md-4 mb-5">
                                <label class="form-label required" for="EmployeeFundDetail_TransactionDate">{{ 'TransactionDate' | localize }}</label>
                                <input
                                    id="EmployeeFundDetail_TransactionDate"
                                    #transactionDateInput="ngModel"
                                    type="date"
                                    class="form-control"
                                    name="TransactionDate"
                                    [ngModel]="record().transactionDate?.toISODate()"
                                    (ngModelChange)="updateDateField('transactionDate', $event)"
                                    required />
                                <validation-messages [formCtrl]="transactionDateInput" />
                            </div>
                            <div class="col-md-4 mb-5">
                                <label class="form-label" for="EmployeeFundDetail_Amount">{{ 'Amount' | localize }}</label>
                                <input
                                    id="EmployeeFundDetail_Amount"
                                    class="form-control"
                                    type="number"
                                    step="0.01"
                                    name="Amount"
                                    [ngModel]="record().amount"
                                    (ngModelChange)="updateNumberField('amount', $event)" />
                            </div>
                            <div class="col-md-4 mb-5">
                                <label class="form-label" for="EmployeeFundDetail_FundPayType">{{ 'FundPayType' | localize }}</label>
                                <select
                                    id="EmployeeFundDetail_FundPayType"
                                    class="form-select"
                                    name="FundPayType"
                                    [ngModel]="record().fundPayType"
                                    (ngModelChange)="updateField('fundPayType', $event)">
                                    @for (option of fundPayTypes; track option.value) {
                                        <option [ngValue]="option.value">{{ option.name | localize }}</option>
                                    }
                                </select>
                            </div>
                        </div>
                        <div class="mb-5">
                            <label class="form-label" for="EmployeeFundDetail_Comments">{{ 'Comments' | localize }}</label>
                            <textarea
                                id="EmployeeFundDetail_Comments"
                                class="form-control"
                                rows="3"
                                name="Comments"
                                [ngModel]="record().comments"
                                (ngModelChange)="updateField('comments', $event)"></textarea>
                        </div>
                    </div>
                    <div class="modal-footer">
                        <button [disabled]="saving()" type="button" class="btn btn-light-primary fw-bold" (click)="close()">
                            {{ 'Cancel' | localize }}
                        </button>
                        <button
                            type="submit"
                            class="btn btn-primary fw-bold"
                            [disabled]="!recordForm.form.valid"
                            [buttonBusy]="saving()"
                            [busyText]="l('SavingWithThreeDot')">
                            <i class="fa fa-save"></i>
                            <span>{{ 'Save' | localize }}</span>
                        </button>
                    </div>
                </form>
            }
        </div>
    </div>
</div>
