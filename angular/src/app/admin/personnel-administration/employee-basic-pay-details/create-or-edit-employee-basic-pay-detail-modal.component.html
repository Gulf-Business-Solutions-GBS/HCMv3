<div
    appBsModal
    #createOrEditModal="bs-modal"
    (onShown)="onShown()"
    class="modal fade"
    tabindex="-1"
    role="dialog"
    aria-labelledby="createOrEditModal"
    aria-hidden="true"
    [config]="{ backdrop: 'static', keyboard: !saving() }">
    <div class="modal-dialog modal-xl">
        <div class="modal-content">
            @if (active()) {
                <form #recordForm="ngForm" novalidate (ngSubmit)="save()" autocomplete="off">
                    <div class="modal-header">
                        <h4 class="modal-title">
                            @if (record().id) {
                                <span>{{ 'Edit' | localize }}</span>
                            } @else {
                                <span>{{ 'CreateNew' | localize }}</span>
                            }
                        </h4>
                        <button type="button" class="btn-close" (click)="close()" [disabled]="saving()"></button>
                    </div>
                    <div class="modal-body">
                        <div class="row">
                            @if (!presetEmployeeBasicPayId()) {
                                <div class="col-md-6 mb-5">
                                    <label class="form-label required" for="EmployeeBasicPayDetail_EmployeeBasicPayId">{{ 'EmployeeBasicPayId' | localize }}</label>
                                    <select
                                        id="EmployeeBasicPayDetail_EmployeeBasicPayId"
                                        #employeeBasicPayIdInput="ngModel"
                                        class="form-select"
                                        name="EmployeeBasicPayId"
                                        [ngModel]="record().employeeBasicPayId"
                                        (ngModelChange)="updateField('employeeBasicPayId', $event)"
                                        required>
                                        <option [ngValue]="undefined"></option>
                                        @for (basicPay of employeeBasicPays(); track basicPay.id) {
                                            <option [ngValue]="basicPay.id">
                                                {{ basicPay.employeeCode }} - {{ basicPay.employeeFullNameEn }} ({{ basicPay.startDate | luxonFormat: 'yyyy-MM-dd' }} - {{ basicPay.endDate | luxonFormat: 'yyyy-MM-dd' }})
                                            </option>
                                        }
                                    </select>
                                    <validation-messages [formCtrl]="employeeBasicPayIdInput" />
                                </div>
                            }
                            <div [class]="presetEmployeeBasicPayId() ? 'col-md-12 mb-5' : 'col-md-6 mb-5'">
                                <label class="form-label required" for="EmployeeBasicPayDetail_WageTypeId">{{ 'WageTypeId' | localize }}</label>
                                <select
                                    id="EmployeeBasicPayDetail_WageTypeId"
                                    #wageTypeIdInput="ngModel"
                                    class="form-select"
                                    name="WageTypeId"
                                    [ngModel]="record().wageTypeId"
                                    (ngModelChange)="updateField('wageTypeId', $event)"
                                    required>
                                    <option [ngValue]="undefined"></option>
                                    @for (type of wageTypes(); track type.id) {
                                        <option [ngValue]="type.id">{{ type.nameEn }}</option>
                                    }
                                </select>
                                <validation-messages [formCtrl]="wageTypeIdInput" />
                            </div>
                        </div>
                        <div class="row">
                            <div class="col-md-4 mb-5">
                                <label class="form-label" for="EmployeeBasicPayDetail_Amount">{{ 'Amount' | localize }}</label>
                                <input
                                    id="EmployeeBasicPayDetail_Amount"
                                    class="form-control"
                                    type="number"
                                    step="0.01"
                                    name="Amount"
                                    [ngModel]="record().amount"
                                    (ngModelChange)="updateNumberField('amount', $event)" />
                            </div>
                            <div class="col-md-4 mb-5">
                                <label class="form-label required" for="EmployeeBasicPayDetail_CurrencyId">{{ 'CurrencyId' | localize }}</label>
                                <select
                                    id="EmployeeBasicPayDetail_CurrencyId"
                                    #currencyIdInput="ngModel"
                                    class="form-select"
                                    name="CurrencyId"
                                    [ngModel]="record().currencyId"
                                    (ngModelChange)="updateField('currencyId', $event)"
                                    required>
                                    <option [ngValue]="undefined"></option>
                                    @for (currency of currencies(); track currency.id) {
                                        <option [ngValue]="currency.id">{{ currency.nameEn }}</option>
                                    }
                                </select>
                                <validation-messages [formCtrl]="currencyIdInput" />
                            </div>
                            <div class="col-md-4 mb-5">
                                <label class="form-label" for="EmployeeBasicPayDetail_DependantUnit">{{ 'DependantUnit' | localize }}</label>
                                <select
                                    id="EmployeeBasicPayDetail_DependantUnit"
                                    class="form-select"
                                    name="DependantUnit"
                                    [ngModel]="record().dependantUnit"
                                    (ngModelChange)="updateField('dependantUnit', $event)">
                                    @for (option of dependantUnits; track option.value) {
                                        <option [ngValue]="option.value">{{ option.name | localize }}</option>
                                    }
                                </select>
                            </div>
                        </div>
                        <div class="row">
                            <div class="col-md-6 mb-5">
                                <label class="form-label" for="EmployeeBasicPayDetail_DependantNumber">{{ 'DependantNumber' | localize }}</label>
                                <input
                                    id="EmployeeBasicPayDetail_DependantNumber"
                                    class="form-control"
                                    type="number"
                                    step="0.01"
                                    name="DependantNumber"
                                    [ngModel]="record().dependantNumber"
                                    (ngModelChange)="updateNumberField('dependantNumber', $event)" />
                            </div>
                            <div class="col-md-6 mb-5">
                                <label class="form-label" for="EmployeeBasicPayDetail_DependantWageTypeId">{{ 'DependantWageTypeId' | localize }}</label>
                                <select
                                    id="EmployeeBasicPayDetail_DependantWageTypeId"
                                    class="form-select"
                                    name="DependantWageTypeId"
                                    [ngModel]="record().dependantWageTypeId"
                                    (ngModelChange)="updateField('dependantWageTypeId', $event)">
                                    <option [ngValue]="undefined"></option>
                                    @for (type of wageTypes(); track type.id) {
                                        <option [ngValue]="type.id">{{ type.nameEn }}</option>
                                    }
                                </select>
                            </div>
                        </div>
                    </div>
                    <div class="modal-footer">
                        <button [disabled]="saving()" type="button" class="btn btn-light-primary fw-bold" (click)="close()">
                            {{ 'Cancel' | localize }}
                        </button>
                        <button
                            type="submit"
                            class="btn btn-primary fw-bold"
                            [disabled]="!recordForm.form.valid"
                            [buttonBusy]="saving()"
                            [busyText]="l('SavingWithThreeDot')">
                            <i class="fa fa-save"></i>
                            <span>{{ 'Save' | localize }}</span>
                        </button>
                    </div>
                </form>
            }
        </div>
    </div>
</div>
