<div
    appBsModal
    #createOrEditModal="bs-modal"
    (onShown)="onShown()"
    class="modal fade"
    tabindex="-1"
    role="dialog"
    aria-labelledby="createOrEditModal"
    aria-hidden="true"
    [config]="{ backdrop: 'static', keyboard: !saving() }">
    <div class="modal-dialog modal-lg">
        <div class="modal-content">
            @if (active()) {
                <form #recordForm="ngForm" novalidate (ngSubmit)="save()" autocomplete="off">
                    <div class="modal-header">
                        <h4 class="modal-title">
                            @if (record().id) {
                                <span>{{ 'Edit' | localize }}</span>
                            } @else {
                                <span>{{ 'CreateNew' | localize }}</span>
                            }
                        </h4>
                        <button type="button" class="btn-close" (click)="close()" [disabled]="saving()"></button>
                    </div>
                    <div class="modal-body">
                        <div class="row">
                            <div class="col-md-12 mb-5">
                                <label class="form-label required" for="EmployeeFundExemption_EmployeeFundId">{{ 'EmployeeFundId' | localize }}</label>
                                <select
                                    id="EmployeeFundExemption_EmployeeFundId"
                                    #employeeFundIdInput="ngModel"
                                    class="form-select"
                                    name="EmployeeFundId"
                                    [ngModel]="record().employeeFundId"
                                    (ngModelChange)="updateField('employeeFundId', $event)"
                                    required>
                                    <option [ngValue]="undefined"></option>
                                    @for (fund of employeeFunds(); track fund.id) {
                                        <option [ngValue]="fund.id">
                                            {{ fund.employeeCode }} - {{ fund.employeeFullNameEn }} ({{ fund.startDate | luxonFormat: 'yyyy-MM-dd' }} - {{ fund.endDate | luxonFormat: 'yyyy-MM-dd' }})
                                        </option>
                                    }
                                </select>
                                <validation-messages [formCtrl]="employeeFundIdInput" />
                            </div>
                        </div>
                        <div class="row">
                            <div class="col-md-6 mb-5">
                                <label class="form-label required" for="EmployeeFundExemption_StartDate">{{ 'StartDate' | localize }}</label>
                                <input
                                    id="EmployeeFundExemption_StartDate"
                                    #startDateInput="ngModel"
                                    type="date"
                                    class="form-control"
                                    name="StartDate"
                                    [ngModel]="record().startDate?.toISODate()"
                                    (ngModelChange)="updateDateField('startDate', $event)"
                                    required />
                                <validation-messages [formCtrl]="startDateInput" />
                            </div>
                            <div class="col-md-6 mb-5">
                                <label class="form-label required" for="EmployeeFundExemption_EndDate">{{ 'EndDate' | localize }}</label>
                                <input
                                    id="EmployeeFundExemption_EndDate"
                                    #endDateInput="ngModel"
                                    type="date"
                                    class="form-control"
                                    name="EndDate"
                                    [ngModel]="record().endDate?.toISODate()"
                                    (ngModelChange)="updateDateField('endDate', $event)"
                                    required />
                                <validation-messages [formCtrl]="endDateInput" />
                            </div>
                        </div>
                        <div class="mb-5">
                            <label class="form-label" for="EmployeeFundExemption_Comments">{{ 'Comments' | localize }}</label>
                            <textarea
                                id="EmployeeFundExemption_Comments"
                                class="form-control"
                                rows="3"
                                name="Comments"
                                [ngModel]="record().comments"
                                (ngModelChange)="updateField('comments', $event)"></textarea>
                        </div>
                    </div>
                    <div class="modal-footer">
                        <button [disabled]="saving()" type="button" class="btn btn-light-primary fw-bold" (click)="close()">
                            {{ 'Cancel' | localize }}
                        </button>
                        <button
                            type="submit"
                            class="btn btn-primary fw-bold"
                            [disabled]="!recordForm.form.valid"
                            [buttonBusy]="saving()"
                            [busyText]="l('SavingWithThreeDot')">
                            <i class="fa fa-save"></i>
                            <span>{{ 'Save' | localize }}</span>
                        </button>
                    </div>
                </form>
            }
        </div>
    </div>
</div>
