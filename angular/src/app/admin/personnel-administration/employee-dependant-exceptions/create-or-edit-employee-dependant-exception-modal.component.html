<div
    appBsModal
    #createOrEditModal="bs-modal"
    (onShown)="onShown()"
    class="modal fade"
    tabindex="-1"
    role="dialog"
    aria-labelledby="createOrEditModal"
    aria-hidden="true"
    [config]="{ backdrop: 'static', keyboard: !saving() }">
    <div class="modal-dialog modal-lg">
        <div class="modal-content">
            @if (active()) {
                <form #recordForm="ngForm" novalidate (ngSubmit)="save()" autocomplete="off">
                    <div class="modal-header">
                        <h4 class="modal-title">
                            @if (record().id) {
                                <span>{{ 'Edit' | localize }}</span>
                            } @else {
                                <span>{{ 'CreateNew' | localize }}</span>
                            }
                        </h4>
                        <button type="button" class="btn-close" (click)="close()" [disabled]="saving()"></button>
                    </div>
                    <div class="modal-body">
                        <div class="row">
                            <div class="col-md-12 mb-5">
                                <label class="form-label required" for="EmployeeDependantException_EmployeeDependantId">{{ 'EmployeeDependantId' | localize }}</label>
                                <select
                                    id="EmployeeDependantException_EmployeeDependantId"
                                    #employeeDependantIdInput="ngModel"
                                    class="form-select"
                                    name="EmployeeDependantId"
                                    [ngModel]="record().employeeDependantId"
                                    (ngModelChange)="updateField('employeeDependantId', $event)"
                                    required>
                                    <option [ngValue]="undefined"></option>
                                    @for (dependant of employeeDependants(); track dependant.id) {
                                        <option [ngValue]="dependant.id">
                                            {{ dependant.employeeCode }} - {{ dependant.employeeFullNameEn }} - {{ dependant.nameEn }}
                                        </option>
                                    }
                                </select>
                                <validation-messages [formCtrl]="employeeDependantIdInput" />
                            </div>
                        </div>
                        <div class="row">
                            <div class="col-md-4 mb-5">
                                <label class="form-label" for="EmployeeDependantException_ExceptionBenefitType">{{ 'ExceptionBenefitType' | localize }}</label>
                                <select
                                    id="EmployeeDependantException_ExceptionBenefitType"
                                    class="form-select"
                                    name="ExceptionBenefitType"
                                    [ngModel]="record().exceptionBenefitType"
                                    (ngModelChange)="updateField('exceptionBenefitType', $event)">
                                    @for (option of exceptionBenefitTypes; track option.value) {
                                        <option [ngValue]="option.value">{{ option.name | localize }}</option>
                                    }
                                </select>
                            </div>
                            <div class="col-md-4 mb-5">
                                <label class="form-label required" for="EmployeeDependantException_StartDate">{{ 'StartDate' | localize }}</label>
                                <input
                                    id="EmployeeDependantException_StartDate"
                                    #startDateInput="ngModel"
                                    type="date"
                                    class="form-control"
                                    name="StartDate"
                                    [ngModel]="record().startDate?.toISODate()"
                                    (ngModelChange)="updateDateField('startDate', $event)"
                                    required />
                                <validation-messages [formCtrl]="startDateInput" />
                            </div>
                            <div class="col-md-4 mb-5">
                                <label class="form-label required" for="EmployeeDependantException_EndDate">{{ 'EndDate' | localize }}</label>
                                <input
                                    id="EmployeeDependantException_EndDate"
                                    #endDateInput="ngModel"
                                    type="date"
                                    class="form-control"
                                    name="EndDate"
                                    [ngModel]="record().endDate?.toISODate()"
                                    (ngModelChange)="updateDateField('endDate', $event)"
                                    required />
                                <validation-messages [formCtrl]="endDateInput" />
                            </div>
                        </div>
                        <div class="row">
                            <div class="col-md-4 mb-5">
                                <label class="form-label" for="EmployeeDependantException_Amount">{{ 'Amount' | localize }}</label>
                                <input
                                    id="EmployeeDependantException_Amount"
                                    class="form-control"
                                    type="number"
                                    step="0.01"
                                    name="Amount"
                                    [ngModel]="record().amount"
                                    (ngModelChange)="updateNumberField('amount', $event)" />
                            </div>
                        </div>
                    </div>
                    <div class="modal-footer">
                        <button [disabled]="saving()" type="button" class="btn btn-light-primary fw-bold" (click)="close()">
                            {{ 'Cancel' | localize }}
                        </button>
                        <button
                            type="submit"
                            class="btn btn-primary fw-bold"
                            [disabled]="!recordForm.form.valid"
                            [buttonBusy]="saving()"
                            [busyText]="l('SavingWithThreeDot')">
                            <i class="fa fa-save"></i>
                            <span>{{ 'Save' | localize }}</span>
                        </button>
                    </div>
                </form>
            }
        </div>
    </div>
</div>
