<div
    appBsModal
    #createOrEditModal="bs-modal"
    (onShown)="onShown()"
    class="modal fade"
    tabindex="-1"
    role="dialog"
    aria-labelledby="createOrEditModal"
    aria-hidden="true"
    [config]="{ backdrop: 'static', keyboard: !saving() }">
    <div class="modal-dialog modal-lg">
        <div class="modal-content">
            @if (active()) {
                <form #recordForm="ngForm" novalidate (ngSubmit)="save()" autocomplete="off">
                    <div class="modal-header">
                        <h4 class="modal-title">
                            @if (record().id) {
                                <span>{{ 'Edit' | localize }}</span>
                            } @else {
                                <span>{{ 'CreateNew' | localize }}</span>
                            }
                        </h4>
                        <button type="button" class="btn-close" (click)="close()" [disabled]="saving()"></button>
                    </div>
                    <div class="modal-body">
                        <div class="row">
                            <div class="col-md-3 mb-5">
                                <label class="form-label required" for="EmployeeAsset_StartDate">{{ 'StartDate' | localize }}</label>
                                <input
                                    id="EmployeeAsset_StartDate"
                                    #startDateInput="ngModel"
                                    type="date"
                                    class="form-control"
                                    name="StartDate"
                                    [ngModel]="record().startDate?.toISODate()"
                                    (ngModelChange)="updateDateField('startDate', $event)"
                                    required />
                                <validation-messages [formCtrl]="startDateInput" />
                            </div>
                            <div class="col-md-3 mb-5">
                                <label class="form-label required" for="EmployeeAsset_EndDate">{{ 'EndDate' | localize }}</label>
                                <input
                                    id="EmployeeAsset_EndDate"
                                    #endDateInput="ngModel"
                                    type="date"
                                    class="form-control"
                                    name="EndDate"
                                    [ngModel]="record().endDate?.toISODate()"
                                    (ngModelChange)="updateDateField('endDate', $event)"
                                    required />
                                <validation-messages [formCtrl]="endDateInput" />
                            </div>
                            <div class="col-md-6 mb-5">
                                <label class="form-label required" for="EmployeeAsset_AssetId">{{ 'AssetId' | localize }}</label>
                                <select
                                    id="EmployeeAsset_AssetId"
                                    #assetIdInput="ngModel"
                                    class="form-select"
                                    name="AssetId"
                                    [ngModel]="record().assetId"
                                    (ngModelChange)="updateField('assetId', $event)"
                                    required>
                                    <option [ngValue]="undefined"></option>
                                    @for (asset of assets(); track asset.id) {
                                        <option [ngValue]="asset.id">{{ asset.nameEn }}</option>
                                    }
                                </select>
                                <validation-messages [formCtrl]="assetIdInput" />
                            </div>
                        </div>
                        <div class="row">
                            <div class="col-md-6 mb-5">
                                <label class="form-label" for="EmployeeAsset_AssetDeductionMode">{{ 'AssetDeductionMode' | localize }}</label>
                                <select
                                    id="EmployeeAsset_AssetDeductionMode"
                                    class="form-select"
                                    name="AssetDeductionMode"
                                    [ngModel]="record().assetDeductionMode"
                                    (ngModelChange)="updateField('assetDeductionMode', $event)">
                                    @for (option of assetDeductionModes; track option.value) {
                                        <option [ngValue]="option.value">{{ option.name | localize }}</option>
                                    }
                                </select>
                            </div>
                        </div>
                        <div class="mb-5">
                            <label class="form-label" for="EmployeeAsset_Comments">{{ 'Comments' | localize }}</label>
                            <textarea
                                id="EmployeeAsset_Comments"
                                class="form-control"
                                rows="3"
                                name="Comments"
                                [ngModel]="record().comments"
                                (ngModelChange)="updateField('comments', $event)"></textarea>
                        </div>
                        <!-- Shows itself only if this user may bypass approval AND the catalog allows it for
                             this type; otherwise the form is exactly as it was. -->
                        <record-directly-check
                            requestType="EmployeeAsset"
                            [value]="record().recordDirectly"
                            (valueChange)="updateField('recordDirectly', $event)" />
                    </div>
                    <div class="modal-footer">
                        <button [disabled]="saving()" type="button" class="btn btn-light-primary fw-bold" (click)="close()">
                            {{ 'Cancel' | localize }}
                        </button>
                        <button
                            type="submit"
                            class="btn btn-primary fw-bold"
                            [disabled]="!recordForm.form.valid"
                            [buttonBusy]="saving()"
                            [busyText]="l('SavingWithThreeDot')">
                            <i class="fa fa-save"></i>
                            <span>{{ 'Save' | localize }}</span>
                        </button>
                    </div>
                </form>
            }
        </div>
    </div>
</div>
