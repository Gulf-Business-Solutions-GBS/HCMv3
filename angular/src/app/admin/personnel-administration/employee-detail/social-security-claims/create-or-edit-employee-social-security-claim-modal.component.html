<div
    appBsModal
    #createOrEditModal="bs-modal"
    (onShown)="onShown()"
    class="modal fade"
    tabindex="-1"
    role="dialog"
    aria-labelledby="createOrEditModal"
    aria-hidden="true"
    [config]="{ backdrop: 'static', keyboard: !saving() }">
    <div class="modal-dialog modal-lg">
        <div class="modal-content">
            @if (active()) {
                <form #recordForm="ngForm" novalidate (ngSubmit)="save()" autocomplete="off">
                    <div class="modal-header">
                        <h4 class="modal-title">
                            @if (record().id) {
                                <span>{{ 'Edit' | localize }}</span>
                            } @else {
                                <span>{{ 'CreateNew' | localize }}</span>
                            }
                        </h4>
                        <button type="button" class="btn-close" (click)="close()" [disabled]="saving()"></button>
                    </div>
                    <div class="modal-body">
                        <div class="row">
                            <div class="col-md-12 mb-5">
                                <label class="form-label required" for="EmployeeSocialSecurityClaim_ClaimDate">{{ 'ClaimDate' | localize }}</label>
                                <input
                                    id="EmployeeSocialSecurityClaim_ClaimDate"
                                    #claimDateInput="ngModel"
                                    type="date"
                                    class="form-control"
                                    name="ClaimDate"
                                    [ngModel]="record().claimDate?.toISODate()"
                                    (ngModelChange)="updateDateField('claimDate', $event)"
                                    required />
                                <validation-messages [formCtrl]="claimDateInput" />
                            </div>
                        </div>
                        <div class="row">
                            <div class="col-md-6 mb-5">
                                <label class="form-label" for="EmployeeSocialSecurityClaim_EmployeeContributionAmount">{{ 'EmployeeContributionAmount' | localize }}</label>
                                <input
                                    id="EmployeeSocialSecurityClaim_EmployeeContributionAmount"
                                    class="form-control"
                                    type="number"
                                    step="0.01"
                                    name="EmployeeContributionAmount"
                                    [ngModel]="record().employeeContributionAmount"
                                    (ngModelChange)="updateNumberField('employeeContributionAmount', $event)" />
                            </div>
                            <div class="col-md-6 mb-5">
                                <label class="form-label" for="EmployeeSocialSecurityClaim_EmployerContributionAmount">{{ 'EmployerContributionAmount' | localize }}</label>
                                <input
                                    id="EmployeeSocialSecurityClaim_EmployerContributionAmount"
                                    class="form-control"
                                    type="number"
                                    step="0.01"
                                    name="EmployerContributionAmount"
                                    [ngModel]="record().employerContributionAmount"
                                    (ngModelChange)="updateNumberField('employerContributionAmount', $event)" />
                            </div>
                        </div>
                    </div>
                    <div class="modal-footer">
                        <button [disabled]="saving()" type="button" class="btn btn-light-primary fw-bold" (click)="close()">
                            {{ 'Cancel' | localize }}
                        </button>
                        <button
                            type="submit"
                            class="btn btn-primary fw-bold"
                            [disabled]="!recordForm.form.valid"
                            [buttonBusy]="saving()"
                            [busyText]="l('SavingWithThreeDot')">
                            <i class="fa fa-save"></i>
                            <span>{{ 'Save' | localize }}</span>
                        </button>
                    </div>
                </form>
            }
        </div>
    </div>
</div>
