<div
    appBsModal
    #createOrEditModal="bs-modal"
    (onShown)="onShown()"
    class="modal fade"
    tabindex="-1"
    role="dialog"
    aria-labelledby="createOrEditModal"
    aria-hidden="true"
    [config]="{ backdrop: 'static', keyboard: !saving() }">
    <div class="modal-dialog modal-xl">
        <div class="modal-content">
            @if (active()) {
                <form #recordForm="ngForm" novalidate (ngSubmit)="save()" autocomplete="off">
                    <div class="modal-header">
                        <h4 class="modal-title">
                            @if (record().id) {
                                <span>{{ 'Edit' | localize }}</span>
                            } @else {
                                <span>{{ 'CreateNew' | localize }}</span>
                            }
                        </h4>
                        <button type="button" class="btn-close" (click)="close()" [disabled]="saving()"></button>
                    </div>
                    <div class="modal-body">
                        <div class="row">
                            <div class="col-md-4 mb-5">
                                <label class="form-label required" for="EmployeeAttendance_AttendanceTypeId">{{ 'AttendanceTypeId' | localize }}</label>
                                <select
                                    id="EmployeeAttendance_AttendanceTypeId"
                                    #attendanceTypeIdInput="ngModel"
                                    class="form-select"
                                    name="AttendanceTypeId"
                                    [ngModel]="record().attendanceTypeId"
                                    (ngModelChange)="updateField('attendanceTypeId', $event)"
                                    required>
                                    <option [ngValue]="undefined"></option>
                                    @for (type of attendanceTypes(); track type.id) {
                                        <option [ngValue]="type.id">{{ type.nameEn }}</option>
                                    }
                                </select>
                                <validation-messages [formCtrl]="attendanceTypeIdInput" />
                            </div>
                            <div class="col-md-4 mb-5">
                                <label class="form-label" for="EmployeeAttendance_AttendanceUnit">{{ 'AttendanceUnit' | localize }}</label>
                                <select
                                    id="EmployeeAttendance_AttendanceUnit"
                                    class="form-select"
                                    name="AttendanceUnit"
                                    [ngModel]="record().attendanceUnit"
                                    (ngModelChange)="updateField('attendanceUnit', $event)">
                                    @for (option of attendanceUnits; track option.value) {
                                        <option [ngValue]="option.value">{{ option.name | localize }}</option>
                                    }
                                </select>
                            </div>
                            <div class="col-md-4 mb-5">
                                <label class="form-label" for="EmployeeAttendance_AttendanceHours">{{ 'AttendanceHours' | localize }}</label>
                                <input
                                    id="EmployeeAttendance_AttendanceHours"
                                    class="form-control"
                                    type="number"
                                    step="0.01"
                                    name="AttendanceHours"
                                    [ngModel]="record().attendanceHours"
                                    (ngModelChange)="updateNumberField('attendanceHours', $event)" />
                            </div>
                        </div>
                        <div class="row">
                            <div class="col-md-3 mb-5">
                                <label class="form-label required" for="EmployeeAttendance_StartDate">{{ 'StartDate' | localize }}</label>
                                <input
                                    id="EmployeeAttendance_StartDate"
                                    #startDateInput="ngModel"
                                    type="date"
                                    class="form-control"
                                    name="StartDate"
                                    [ngModel]="record().startDate?.toISODate()"
                                    (ngModelChange)="updateDateField('startDate', $event)"
                                    required />
                                <validation-messages [formCtrl]="startDateInput" />
                            </div>
                            <div class="col-md-3 mb-5">
                                <label class="form-label required" for="EmployeeAttendance_EndDate">{{ 'EndDate' | localize }}</label>
                                <input
                                    id="EmployeeAttendance_EndDate"
                                    #endDateInput="ngModel"
                                    type="date"
                                    class="form-control"
                                    name="EndDate"
                                    [ngModel]="record().endDate?.toISODate()"
                                    (ngModelChange)="updateDateField('endDate', $event)"
                                    required />
                                <validation-messages [formCtrl]="endDateInput" />
                            </div>
                            <div class="col-md-3 mb-5">
                                <label class="form-label" for="EmployeeAttendance_StartTime">{{ 'StartTime' | localize }}</label>
                                <input
                                    id="EmployeeAttendance_StartTime"
                                    class="form-control"
                                    type="time"
                                    step="1"
                                    name="StartTime"
                                    [ngModel]="getTimeValue('startTime')"
                                    (ngModelChange)="updateTimeField('startTime', $event)" />
                            </div>
                            <div class="col-md-3 mb-5">
                                <label class="form-label" for="EmployeeAttendance_EndTime">{{ 'EndTime' | localize }}</label>
                                <input
                                    id="EmployeeAttendance_EndTime"
                                    class="form-control"
                                    type="time"
                                    step="1"
                                    name="EndTime"
                                    [ngModel]="getTimeValue('endTime')"
                                    (ngModelChange)="updateTimeField('endTime', $event)" />
                            </div>
                        </div>
                        <div class="mb-5">
                            <label class="form-label" for="EmployeeAttendance_Comments">{{ 'Comments' | localize }}</label>
                            <textarea
                                id="EmployeeAttendance_Comments"
                                class="form-control"
                                rows="3"
                                name="Comments"
                                [ngModel]="record().comments"
                                (ngModelChange)="updateField('comments', $event)"></textarea>
                        </div>
                    </div>
                    <div class="modal-footer">
                        <button [disabled]="saving()" type="button" class="btn btn-light-primary fw-bold" (click)="close()">
                            {{ 'Cancel' | localize }}
                        </button>
                        <button
                            type="submit"
                            class="btn btn-primary fw-bold"
                            [disabled]="!recordForm.form.valid"
                            [buttonBusy]="saving()"
                            [busyText]="l('SavingWithThreeDot')">
                            <i class="fa fa-save"></i>
                            <span>{{ 'Save' | localize }}</span>
                        </button>
                    </div>
                </form>
            }
        </div>
    </div>
</div>
