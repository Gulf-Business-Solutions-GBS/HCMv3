<div
    appBsModal
    #createOrEditModal="bs-modal"
    (onShown)="onShown()"
    class="modal fade"
    tabindex="-1"
    role="dialog"
    aria-labelledby="createOrEditModal"
    aria-hidden="true"
    [config]="{ backdrop: 'static', keyboard: !saving() }">
    <div class="modal-dialog modal-xl">
        <div class="modal-content">
            @if (active()) {
                <form #recordForm="ngForm" novalidate (ngSubmit)="save()" autocomplete="off">
                    <div class="modal-header">
                        <h4 class="modal-title">
                            @if (record().id) {
                                <span>{{ 'Edit' | localize }}</span>
                            } @else {
                                <span>{{ 'CreateNew' | localize }}</span>
                            }
                        </h4>
                        <button type="button" class="btn-close" (click)="close()" [disabled]="saving()"></button>
                    </div>
                    <div class="modal-body">
                        <div class="row">
                            <div class="col-md-4 mb-5">
                                <label class="form-label required" for="EmployeeLoan_StartDate">{{ 'LoanPaymentDate' | localize }}</label>
                                <input
                                    id="EmployeeLoan_StartDate"
                                    #startDateInput="ngModel"
                                    type="date"
                                    class="form-control"
                                    name="StartDate"
                                    [ngModel]="record().startDate?.toISODate()"
                                    (ngModelChange)="updateDateField('startDate', $event)"
                                    required />
                                <validation-messages [formCtrl]="startDateInput" />
                            </div>
                            <div class="col-md-4 mb-5">
                                <label class="form-label required" for="EmployeeLoan_EndDate">{{ 'RecoveryEndDate' | localize }}</label>
                                <input
                                    id="EmployeeLoan_EndDate"
                                    #endDateInput="ngModel"
                                    type="date"
                                    class="form-control"
                                    name="EndDate"
                                    [ngModel]="record().endDate?.toISODate()"
                                    (ngModelChange)="updateDateField('endDate', $event)"
                                    required />
                                <validation-messages [formCtrl]="endDateInput" />
                            </div>
                            <div class="col-md-4 mb-5">
                                <label class="form-label required" for="EmployeeLoan_LoanTypeId">{{ 'LoanTypeId' | localize }}</label>
                                <select
                                    id="EmployeeLoan_LoanTypeId"
                                    #loanTypeIdInput="ngModel"
                                    class="form-select"
                                    name="LoanTypeId"
                                    [ngModel]="record().loanTypeId"
                                    (ngModelChange)="updateField('loanTypeId', $event)"
                                    required>
                                    <option [ngValue]="undefined"></option>
                                    @for (type of loanTypes(); track type.id) {
                                        <option [ngValue]="type.id">{{ type.nameEn }}</option>
                                    }
                                </select>
                                <validation-messages [formCtrl]="loanTypeIdInput" />
                            </div>
                            <div class="col-md-4 mb-5">
                                <label class="form-label required" for="EmployeeLoan_RecoveryStartDate">{{ 'RecoveryStartDate' | localize }}</label>
                                <input
                                    id="EmployeeLoan_RecoveryStartDate"
                                    #recoveryStartDateInput="ngModel"
                                    type="date"
                                    class="form-control"
                                    name="RecoveryStartDate"
                                    [ngModel]="record().recoveryStartDate?.toISODate()"
                                    (ngModelChange)="updateDateField('recoveryStartDate', $event)"
                                    required />
                                <validation-messages [formCtrl]="recoveryStartDateInput" />
                            </div>
                        </div>
                        <div class="row">
                            <div class="col-md-4 mb-5">
                                <label class="form-label" for="EmployeeLoan_ActualAmount">{{ 'ActualAmount' | localize }}</label>
                                <input
                                    id="EmployeeLoan_ActualAmount"
                                    class="form-control"
                                    type="number"
                                    step="0.01"
                                    name="ActualAmount"
                                    [ngModel]="record().actualAmount"
                                    (ngModelChange)="updateNumberField('actualAmount', $event)" />
                            </div>
                            <div class="col-md-4 mb-5">
                                <label class="form-label" for="EmployeeLoan_DueAmount">{{ 'DueAmount' | localize }}</label>
                                <input
                                    id="EmployeeLoan_DueAmount"
                                    class="form-control"
                                    type="number"
                                    step="0.01"
                                    name="DueAmount"
                                    [ngModel]="record().dueAmount"
                                    (ngModelChange)="updateNumberField('dueAmount', $event)" />
                            </div>
                        </div>
                        <div class="row">
                            <div class="col-md-4 mb-5">
                                <label class="form-label" for="EmployeeLoan_FixedAmount">{{ 'FixedAmount' | localize }}</label>
                                <input
                                    id="EmployeeLoan_FixedAmount"
                                    class="form-control"
                                    type="number"
                                    step="0.01"
                                    name="FixedAmount"
                                    [ngModel]="record().fixedAmount"
                                    [disabled]="!!record().id"
                                    (ngModelChange)="updateNumberField('fixedAmount', $event)" />
                                <!-- Legacy keeps Fixed Amount read-only once the loan exists: changes go in as
                                     effective-dated rows under Installments, Recoveries & Exemptions. -->
                                <div class="form-text">{{ 'LoanInstallmentFixedAmountHint' | localize }}</div>
                            </div>
                            <div class="col-md-4 mb-5 d-flex align-items-end">
                                <div class="form-check">
                                    <input
                                        id="EmployeeLoan_RecoverFracInLastTrans"
                                        class="form-check-input"
                                        type="checkbox"
                                        name="RecoverFracInLastTrans"
                                        [ngModel]="record().recoverFracInLastTrans"
                                        (ngModelChange)="updateField('recoverFracInLastTrans', $event)" />
                                    <label class="form-check-label" for="EmployeeLoan_RecoverFracInLastTrans">{{ 'RecoverFracInLastTrans' | localize }}</label>
                                </div>
                            </div>
                            <div class="col-md-4 mb-5 d-flex align-items-end">
                                <div class="form-check">
                                    <input
                                        id="EmployeeLoan_IncludeInLoanPay"
                                        class="form-check-input"
                                        type="checkbox"
                                        name="IncludeInLoanPay"
                                        [ngModel]="record().includeInLoanPay"
                                        (ngModelChange)="updateField('includeInLoanPay', $event)" />
                                    <label class="form-check-label" for="EmployeeLoan_IncludeInLoanPay">{{ 'IncludeLoanPaymentInPayroll' | localize }}</label>
                                </div>
                            </div>
                        </div>
                        <div class="mb-5">
                            <label class="form-label" for="EmployeeLoan_Comments">{{ 'Comments' | localize }}</label>
                            <textarea
                                id="EmployeeLoan_Comments"
                                class="form-control"
                                rows="3"
                                name="Comments"
                                [ngModel]="record().comments"
                                (ngModelChange)="updateField('comments', $event)"></textarea>
                        </div>
                        @if (record().id) {
                            <div class="mb-5">
                                <app-attachments entityType="EmployeeLoan" [entityId]="record().id" />
                            </div>
                        }
                        <!-- Shows itself only if this user may bypass approval AND the catalog allows it for
                             this type; otherwise the form is exactly as it was. -->
                        <record-directly-check
                            requestType="EmployeeLoan"
                            [value]="record().recordDirectly"
                            (valueChange)="updateField('recordDirectly', $event)" />
                    </div>
                    <div class="modal-footer">
                        <button [disabled]="saving()" type="button" class="btn btn-light-primary fw-bold" (click)="close()">
                            {{ 'Cancel' | localize }}
                        </button>
                        <button
                            type="submit"
                            class="btn btn-primary fw-bold"
                            [disabled]="!recordForm.form.valid"
                            [buttonBusy]="saving()"
                            [busyText]="l('SavingWithThreeDot')">
                            <i class="fa fa-save"></i>
                            <span>{{ 'Save' | localize }}</span>
                        </button>
                    </div>
                </form>
            }
        </div>
    </div>
</div>
