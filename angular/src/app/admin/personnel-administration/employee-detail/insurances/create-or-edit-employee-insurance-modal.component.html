<div
    appBsModal
    #createOrEditModal="bs-modal"
    (onShown)="onShown()"
    class="modal fade"
    tabindex="-1"
    role="dialog"
    aria-labelledby="createOrEditModal"
    aria-hidden="true"
    [config]="{ backdrop: 'static', keyboard: !saving() }">
    <div class="modal-dialog modal-xl">
        <div class="modal-content">
            @if (active()) {
                <form #recordForm="ngForm" novalidate (ngSubmit)="save()" autocomplete="off">
                    <div class="modal-header">
                        <h4 class="modal-title">
                            @if (record().id) {
                                <span>{{ 'Edit' | localize }}</span>
                            } @else {
                                <span>{{ 'CreateNew' | localize }}</span>
                            }
                        </h4>
                        <button type="button" class="btn-close" (click)="close()" [disabled]="saving()"></button>
                    </div>
                    <div class="modal-body">
                        <div class="row">
                            <div class="col-md-4 mb-5">
                                <label class="form-label required" for="EmployeeInsurance_StartDate">{{ 'StartDate' | localize }}</label>
                                <input
                                    id="EmployeeInsurance_StartDate"
                                    #startDateInput="ngModel"
                                    type="date"
                                    class="form-control"
                                    name="StartDate"
                                    [ngModel]="record().startDate?.toISODate()"
                                    (ngModelChange)="updateDateField('startDate', $event)"
                                    required />
                                <validation-messages [formCtrl]="startDateInput" />
                            </div>
                            <div class="col-md-4 mb-5">
                                <label class="form-label required" for="EmployeeInsurance_EndDate">{{ 'EndDate' | localize }}</label>
                                <input
                                    id="EmployeeInsurance_EndDate"
                                    #endDateInput="ngModel"
                                    type="date"
                                    class="form-control"
                                    name="EndDate"
                                    [ngModel]="record().endDate?.toISODate()"
                                    (ngModelChange)="updateDateField('endDate', $event)"
                                    required />
                                <validation-messages [formCtrl]="endDateInput" />
                            </div>
                            <div class="col-md-4 mb-5">
                                <label class="form-label required" for="EmployeeInsurance_InsurancePlanId">{{ 'InsurancePlanId' | localize }}</label>
                                <select
                                    id="EmployeeInsurance_InsurancePlanId"
                                    #insurancePlanIdInput="ngModel"
                                    class="form-select"
                                    name="InsurancePlanId"
                                    [ngModel]="record().insurancePlanId"
                                    (ngModelChange)="updateField('insurancePlanId', $event)"
                                    required>
                                    <option [ngValue]="undefined"></option>
                                    @for (item of insurancePlans(); track item.id) {
                                        <option [ngValue]="item.id">{{ item.nameEn }}</option>
                                    }
                                </select>
                                <validation-messages [formCtrl]="insurancePlanIdInput" />
                            </div>
                            <div class="col-md-4 mb-5">
                                <label class="form-label required" for="EmployeeInsurance_InsuranceProviderId">{{ 'InsuranceProviderId' | localize }}</label>
                                <select
                                    id="EmployeeInsurance_InsuranceProviderId"
                                    #insuranceProviderIdInput="ngModel"
                                    class="form-select"
                                    name="InsuranceProviderId"
                                    [ngModel]="record().insuranceProviderId"
                                    (ngModelChange)="updateField('insuranceProviderId', $event)"
                                    required>
                                    <option [ngValue]="undefined"></option>
                                    @for (item of insuranceProviders(); track item.id) {
                                        <option [ngValue]="item.id">{{ item.nameEn }}</option>
                                    }
                                </select>
                                <validation-messages [formCtrl]="insuranceProviderIdInput" />
                            </div>
                            <div class="col-md-4 mb-5">
                                <label class="form-label" for="EmployeeInsurance_DependantId">{{ 'DependantId' | localize }}</label>
                                <select
                                    id="EmployeeInsurance_DependantId"
                                    class="form-select"
                                    name="DependantId"
                                    [ngModel]="record().dependantId"
                                    (ngModelChange)="updateField('dependantId', $event)">
                                    <option [ngValue]="undefined"></option>
                                    @for (item of employeeDependants(); track item.id) {
                                        <option [ngValue]="item.id">{{ item.nameEn }}</option>
                                    }
                                </select>
                            </div>
                        </div>
                        <div class="row">
                            <div class="col-md-4 mb-5">
                                <label class="form-label required" for="EmployeeInsurance_InstallmentStartDate">{{ 'InstallmentStartDate' | localize }}</label>
                                <input
                                    id="EmployeeInsurance_InstallmentStartDate"
                                    #installmentStartDateInput="ngModel"
                                    type="date"
                                    class="form-control"
                                    name="InstallmentStartDate"
                                    [ngModel]="record().installmentStartDate?.toISODate()"
                                    (ngModelChange)="updateDateField('installmentStartDate', $event)"
                                    required />
                                <validation-messages [formCtrl]="installmentStartDateInput" />
                            </div>
                        </div>
                        <div class="row">
                            <div class="col-md-4 mb-5">
                                <label class="form-label" for="EmployeeInsurance_InsuranceAmount">{{ 'InsuranceAmount' | localize }}</label>
                                <input
                                    id="EmployeeInsurance_InsuranceAmount"
                                    class="form-control"
                                    type="number"
                                    step="0.01"
                                    name="InsuranceAmount"
                                    [ngModel]="record().insuranceAmount"
                                    (ngModelChange)="updateNumberField('insuranceAmount', $event)" />
                            </div>
                            <div class="col-md-4 mb-5">
                                <label class="form-label" for="EmployeeInsurance_Comments">{{ 'Comments' | localize }}</label>
                                <input
                                    id="EmployeeInsurance_Comments"
                                    class="form-control"
                                    type="text"
                                    name="Comments"
                                    [ngModel]="record().comments"
                                    (ngModelChange)="updateField('comments', $event)" />
                            </div>
                        </div>
                        <hr />
                        <div class="row">
                            <div class="col-md-3 mb-5">
                                <label class="form-label" for="EmployeeInsurance_CompanyInterval">{{ 'CompanyInterval' | localize }}</label>
                                <select
                                    id="EmployeeInsurance_CompanyInterval"
                                    class="form-select"
                                    name="CompanyInterval"
                                    [ngModel]="record().companyInterval"
                                    (ngModelChange)="updateField('companyInterval', $event)">
                                    @for (item of installmentIntervals; track item.value) {
                                        <option [ngValue]="item.value">{{ item.name | localize }}</option>
                                    }
                                </select>
                            </div>
                            <div class="col-md-3 mb-5">
                                <label class="form-label" for="EmployeeInsurance_CompanyContribution">{{ 'CompanyContribution' | localize }}</label>
                                <input
                                    id="EmployeeInsurance_CompanyContribution"
                                    class="form-control"
                                    type="number"
                                    step="0.01"
                                    name="CompanyContribution"
                                    [ngModel]="record().companyContribution"
                                    (ngModelChange)="updateNumberField('companyContribution', $event)" />
                            </div>
                            <div class="col-md-3 mb-5">
                                <label class="form-label" for="EmployeeInsurance_InstallmentCompanyDedAmount">{{ 'InstallmentCompanyDedAmount' | localize }}</label>
                                <input
                                    id="EmployeeInsurance_InstallmentCompanyDedAmount"
                                    class="form-control"
                                    type="number"
                                    step="0.01"
                                    name="InstallmentCompanyDedAmount"
                                    [ngModel]="record().installmentCompanyDedAmount"
                                    (ngModelChange)="updateNumberField('installmentCompanyDedAmount', $event)" />
                            </div>
                        </div>
                        <div class="row">
                            <div class="col-md-3 mb-5">
                                <label class="form-label" for="EmployeeInsurance_EmployeeInterval">{{ 'EmployeeInterval' | localize }}</label>
                                <select
                                    id="EmployeeInsurance_EmployeeInterval"
                                    class="form-select"
                                    name="EmployeeInterval"
                                    [ngModel]="record().employeeInterval"
                                    (ngModelChange)="updateField('employeeInterval', $event)">
                                    @for (item of installmentIntervals; track item.value) {
                                        <option [ngValue]="item.value">{{ item.name | localize }}</option>
                                    }
                                </select>
                            </div>
                            <div class="col-md-3 mb-5">
                                <label class="form-label" for="EmployeeInsurance_EmployeeContribution">{{ 'EmployeeContribution' | localize }}</label>
                                <input
                                    id="EmployeeInsurance_EmployeeContribution"
                                    class="form-control"
                                    type="number"
                                    step="0.01"
                                    name="EmployeeContribution"
                                    [ngModel]="record().employeeContribution"
                                    (ngModelChange)="updateNumberField('employeeContribution', $event)" />
                            </div>
                            <div class="col-md-3 mb-5">
                                <label class="form-label" for="EmployeeInsurance_InstallmentEmployeeDedAmount">{{ 'InstallmentEmployeeDedAmount' | localize }}</label>
                                <input
                                    id="EmployeeInsurance_InstallmentEmployeeDedAmount"
                                    class="form-control"
                                    type="number"
                                    step="0.01"
                                    name="InstallmentEmployeeDedAmount"
                                    [ngModel]="record().installmentEmployeeDedAmount"
                                    (ngModelChange)="updateNumberField('installmentEmployeeDedAmount', $event)" />
                            </div>
                        </div>
                    </div>
                    <div class="modal-footer">
                        <button [disabled]="saving()" type="button" class="btn btn-light-primary fw-bold" (click)="close()">
                            {{ 'Cancel' | localize }}
                        </button>
                        <button
                            type="submit"
                            class="btn btn-primary fw-bold"
                            [disabled]="!recordForm.form.valid"
                            [buttonBusy]="saving()"
                            [busyText]="l('SavingWithThreeDot')">
                            <i class="fa fa-save"></i>
                            <span>{{ 'Save' | localize }}</span>
                        </button>
                    </div>
                </form>
            }
        </div>
    </div>
</div>
