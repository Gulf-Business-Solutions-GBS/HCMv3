<div
    appBsModal
    #createOrEditModal="bs-modal"
    (onShown)="onShown()"
    class="modal fade"
    tabindex="-1"
    role="dialog"
    aria-labelledby="createOrEditModal"
    aria-hidden="true"
    [config]="{ backdrop: 'static', keyboard: !saving() }">
    <div class="modal-dialog modal-lg">
        <div class="modal-content">
            @if (active()) {
                <form #recordForm="ngForm" novalidate (ngSubmit)="save()" autocomplete="off">
                    <div class="modal-header">
                        <h4 class="modal-title">
                            @if (record().id) {
                                <span>{{ 'Edit' | localize }}</span>
                            } @else {
                                <span>{{ 'CreateNew' | localize }}</span>
                            }
                        </h4>
                        <button type="button" class="btn-close" (click)="close()" [disabled]="saving()"></button>
                    </div>
                    <div class="modal-body">
                        <div class="row">
                            <div class="col-md-6 mb-5">
                                <label class="form-label required" for="EmployeeTalentFlag_RiskOfLossId">{{ 'RiskOfLossId' | localize }}</label>
                                <select
                                    id="EmployeeTalentFlag_RiskOfLossId"
                                    #riskOfLossIdInput="ngModel"
                                    class="form-select"
                                    name="RiskOfLossId"
                                    [ngModel]="record().riskOfLossId"
                                    (ngModelChange)="updateField('riskOfLossId', $event)"
                                    required>
                                    <option [ngValue]="undefined"></option>
                                    @for (item of riskOfLosses(); track item.id) {
                                        <option [ngValue]="item.id">{{ item.nameEn }}</option>
                                    }
                                </select>
                                <validation-messages [formCtrl]="riskOfLossIdInput" />
                            </div>
                            <div class="col-md-6 mb-5">
                                <label class="form-label required" for="EmployeeTalentFlag_ImpactOfLossId">{{ 'ImpactOfLossId' | localize }}</label>
                                <select
                                    id="EmployeeTalentFlag_ImpactOfLossId"
                                    #impactOfLossIdInput="ngModel"
                                    class="form-select"
                                    name="ImpactOfLossId"
                                    [ngModel]="record().impactOfLossId"
                                    (ngModelChange)="updateField('impactOfLossId', $event)"
                                    required>
                                    <option [ngValue]="undefined"></option>
                                    @for (item of impactOfLosses(); track item.id) {
                                        <option [ngValue]="item.id">{{ item.nameEn }}</option>
                                    }
                                </select>
                                <validation-messages [formCtrl]="impactOfLossIdInput" />
                            </div>
                        </div>
                        <div class="row">
                            <div class="col-md-6 mb-5">
                                <label class="form-label required" for="EmployeeTalentFlag_ReasonForLeavingId">{{ 'ReasonForLeavingId' | localize }}</label>
                                <select
                                    id="EmployeeTalentFlag_ReasonForLeavingId"
                                    #reasonForLeavingIdInput="ngModel"
                                    class="form-select"
                                    name="ReasonForLeavingId"
                                    [ngModel]="record().reasonForLeavingId"
                                    (ngModelChange)="updateField('reasonForLeavingId', $event)"
                                    required>
                                    <option [ngValue]="undefined"></option>
                                    @for (item of reasonForLeavings(); track item.id) {
                                        <option [ngValue]="item.id">{{ item.nameEn }}</option>
                                    }
                                </select>
                                <validation-messages [formCtrl]="reasonForLeavingIdInput" />
                            </div>
                            <div class="col-md-6 mb-5">
                                <label class="form-label required" for="EmployeeTalentFlag_TalentPoolId">{{ 'TalentPoolId' | localize }}</label>
                                <select
                                    id="EmployeeTalentFlag_TalentPoolId"
                                    #talentPoolIdInput="ngModel"
                                    class="form-select"
                                    name="TalentPoolId"
                                    [ngModel]="record().talentPoolId"
                                    (ngModelChange)="updateField('talentPoolId', $event)"
                                    required>
                                    <option [ngValue]="undefined"></option>
                                    @for (item of talentPools(); track item.id) {
                                        <option [ngValue]="item.id">{{ item.nameEn }}</option>
                                    }
                                </select>
                                <validation-messages [formCtrl]="talentPoolIdInput" />
                            </div>
                        </div>
                    </div>
                    <div class="modal-footer">
                        <button [disabled]="saving()" type="button" class="btn btn-light-primary fw-bold" (click)="close()">
                            {{ 'Cancel' | localize }}
                        </button>
                        <button
                            type="submit"
                            class="btn btn-primary fw-bold"
                            [disabled]="!recordForm.form.valid"
                            [buttonBusy]="saving()"
                            [busyText]="l('SavingWithThreeDot')">
                            <i class="fa fa-save"></i>
                            <span>{{ 'Save' | localize }}</span>
                        </button>
                    </div>
                </form>
            }
        </div>
    </div>
</div>
