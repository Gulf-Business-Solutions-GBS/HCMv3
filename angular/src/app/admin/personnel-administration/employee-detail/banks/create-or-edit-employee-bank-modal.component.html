<div
    appBsModal
    #createOrEditModal="bs-modal"
    (onShown)="onShown()"
    class="modal fade"
    tabindex="-1"
    role="dialog"
    aria-labelledby="createOrEditModal"
    aria-hidden="true"
    [config]="{ backdrop: 'static', keyboard: !saving() }">
    <div class="modal-dialog modal-lg">
        <div class="modal-content">
            @if (active()) {
                <form #recordForm="ngForm" novalidate (ngSubmit)="save()" autocomplete="off">
                    <div class="modal-header">
                        <h4 class="modal-title">
                            @if (record().id) {
                                <span>{{ 'Edit' | localize }}</span>
                            } @else {
                                <span>{{ 'CreateNew' | localize }}</span>
                            }
                        </h4>
                        <button type="button" class="btn-close" (click)="close()" [disabled]="saving()"></button>
                    </div>
                    <div class="modal-body">
                        <div class="row">
                            <div class="col-md-4 mb-5">
                                <label class="form-label" for="EmployeeBank_BankId">{{ 'BankId' | localize }}</label>
                                <select
                                    id="EmployeeBank_BankId"
                                    class="form-select"
                                    name="BankId"
                                    [ngModel]="record().bankId"
                                    (ngModelChange)="updateField('bankId', $event)">
                                    <option [ngValue]="undefined"></option>
                                    @for (bank of banks(); track bank.id) {
                                        <option [ngValue]="bank.id">{{ bank.nameEn }}</option>
                                    }
                                </select>
                            </div>
                            <div class="col-md-4 mb-5">
                                <label class="form-label" for="EmployeeBank_PayerBankId">{{ 'PayerBankId' | localize }}</label>
                                <select
                                    id="EmployeeBank_PayerBankId"
                                    class="form-select"
                                    name="PayerBankId"
                                    [ngModel]="record().payerBankId"
                                    (ngModelChange)="updateField('payerBankId', $event)">
                                    <option [ngValue]="undefined"></option>
                                    @for (bank of banks(); track bank.id) {
                                        <option [ngValue]="bank.id">{{ bank.nameEn }}</option>
                                    }
                                </select>
                            </div>
                            <div class="col-md-4 mb-5">
                                <label class="form-label" for="EmployeeBank_BankCountryId">{{ 'BankCountryId' | localize }}</label>
                                <select
                                    id="EmployeeBank_BankCountryId"
                                    class="form-select"
                                    name="BankCountryId"
                                    [ngModel]="record().bankCountryId"
                                    (ngModelChange)="updateField('bankCountryId', $event)">
                                    <option [ngValue]="undefined"></option>
                                    @for (country of countries(); track country.id) {
                                        <option [ngValue]="country.id">{{ country.nameEn }}</option>
                                    }
                                </select>
                            </div>
                        </div>
                        <div class="row">
                            <div class="col-md-3 mb-5">
                                <label class="form-label required" for="EmployeeBank_StartDate">{{ 'StartDate' | localize }}</label>
                                <input
                                    id="EmployeeBank_StartDate"
                                    #startDateInput="ngModel"
                                    type="date"
                                    class="form-control"
                                    name="StartDate"
                                    [ngModel]="record().startDate?.toISODate()"
                                    (ngModelChange)="updateDateField('startDate', $event)"
                                    required />
                                <validation-messages [formCtrl]="startDateInput" />
                            </div>
                            <div class="col-md-3 mb-5">
                                <label class="form-label required" for="EmployeeBank_EndDate">{{ 'EndDate' | localize }}</label>
                                <input
                                    id="EmployeeBank_EndDate"
                                    #endDateInput="ngModel"
                                    type="date"
                                    class="form-control"
                                    name="EndDate"
                                    [ngModel]="record().endDate?.toISODate()"
                                    (ngModelChange)="updateDateField('endDate', $event)"
                                    required />
                                <validation-messages [formCtrl]="endDateInput" />
                            </div>
                            <div class="col-md-3 mb-5">
                                <label class="form-label" for="EmployeeBank_PaymentType">{{ 'PaymentType' | localize }}</label>
                                <select
                                    id="EmployeeBank_PaymentType"
                                    class="form-select"
                                    name="PaymentType"
                                    [ngModel]="record().paymentType"
                                    (ngModelChange)="updateField('paymentType', $event)">
                                    @for (option of paymentTypes; track option.value) {
                                        <option [ngValue]="option.value">{{ option.name | localize }}</option>
                                    }
                                </select>
                            </div>
                            <div class="col-md-3 mb-5">
                                <label class="form-label" for="EmployeeBank_PaymentCurrencyId">{{ 'PaymentCurrencyId' | localize }}</label>
                                <select
                                    id="EmployeeBank_PaymentCurrencyId"
                                    class="form-select"
                                    name="PaymentCurrencyId"
                                    [ngModel]="record().paymentCurrencyId"
                                    (ngModelChange)="updateField('paymentCurrencyId', $event)">
                                    <option [ngValue]="undefined"></option>
                                    @for (currency of currencies(); track currency.id) {
                                        <option [ngValue]="currency.id">{{ currency.nameEn }}</option>
                                    }
                                </select>
                            </div>
                        </div>
                        <div class="row">
                            <div class="col-md-4 mb-5">
                                <label class="form-label" for="EmployeeBank_AccountNum">{{ 'AccountNum' | localize }}</label>
                                <input
                                    id="EmployeeBank_AccountNum"
                                    class="form-control"
                                    type="text"
                                    name="AccountNum"
                                    [ngModel]="record().accountNum"
                                    (ngModelChange)="updateField('accountNum', $event)"
                                    maxlength="100" />
                            </div>
                            <div class="col-md-4 mb-5">
                                <label class="form-label" for="EmployeeBank_Iban">{{ 'Iban' | localize }}</label>
                                <input
                                    id="EmployeeBank_Iban"
                                    class="form-control"
                                    type="text"
                                    name="Iban"
                                    [ngModel]="record().iban"
                                    (ngModelChange)="updateField('iban', $event)"
                                    maxlength="100" />
                            </div>
                            <div class="col-md-4 mb-5">
                                <label class="form-label" for="EmployeeBank_BankBranch">{{ 'BankBranch' | localize }}</label>
                                <input
                                    id="EmployeeBank_BankBranch"
                                    class="form-control"
                                    type="text"
                                    name="BankBranch"
                                    [ngModel]="record().bankBranch"
                                    (ngModelChange)="updateField('bankBranch', $event)"
                                    maxlength="200" />
                            </div>
                        </div>
                        <!-- Shows itself only if this user may bypass approval AND the catalog allows it for
                             this type; otherwise the form is exactly as it was. -->
                        <record-directly-check
                            requestType="EmployeeBank"
                            [value]="record().recordDirectly"
                            (valueChange)="updateField('recordDirectly', $event)" />
                    </div>
                    <div class="modal-footer">
                        <button [disabled]="saving()" type="button" class="btn btn-light-primary fw-bold" (click)="close()">
                            {{ 'Cancel' | localize }}
                        </button>
                        <button
                            type="submit"
                            class="btn btn-primary fw-bold"
                            [disabled]="!recordForm.form.valid"
                            [buttonBusy]="saving()"
                            [busyText]="l('SavingWithThreeDot')">
                            <i class="fa fa-save"></i>
                            <span>{{ 'Save' | localize }}</span>
                        </button>
                    </div>
                </form>
            }
        </div>
    </div>
</div>
