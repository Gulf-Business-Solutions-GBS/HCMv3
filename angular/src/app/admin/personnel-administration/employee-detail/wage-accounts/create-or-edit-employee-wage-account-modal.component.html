<div
    appBsModal
    #createOrEditModal="bs-modal"
    (onShown)="onShown()"
    class="modal fade"
    tabindex="-1"
    role="dialog"
    aria-labelledby="createOrEditModal"
    aria-hidden="true"
    [config]="{ backdrop: 'static', keyboard: !saving() }">
    <div class="modal-dialog modal-xl">
        <div class="modal-content">
            @if (active()) {
                <form #recordForm="ngForm" novalidate (ngSubmit)="save()" autocomplete="off">
                    <div class="modal-header">
                        <h4 class="modal-title">
                            @if (record().id) {
                                <span>{{ 'Edit' | localize }}</span>
                            } @else {
                                <span>{{ 'CreateNew' | localize }}</span>
                            }
                        </h4>
                        <button type="button" class="btn-close" (click)="close()" [disabled]="saving()"></button>
                    </div>
                    <div class="modal-body">
                        <div class="row">
                            <div class="col-md-4 mb-5">
                                <label class="form-label required" for="EmployeeWageAccount_StartDate">{{ 'StartDate' | localize }}</label>
                                <input
                                    id="EmployeeWageAccount_StartDate"
                                    #startDateInput="ngModel"
                                    type="date"
                                    class="form-control"
                                    name="StartDate"
                                    [ngModel]="record().startDate?.toISODate()"
                                    (ngModelChange)="updateStartDate($event)"
                                    required />
                                <validation-messages [formCtrl]="startDateInput" />
                            </div>
                            <div class="col-md-4 mb-5">
                                <label class="form-label required" for="EmployeeWageAccount_WageTypeId">{{ 'WageTypeId' | localize }}</label>
                                <select
                                    id="EmployeeWageAccount_WageTypeId"
                                    #wageTypeIdInput="ngModel"
                                    class="form-select"
                                    name="WageTypeId"
                                    [ngModel]="record().wageTypeId"
                                    (ngModelChange)="updateField('wageTypeId', $event)"
                                    required>
                                    <option [ngValue]="undefined"></option>
                                    @for (wt of wageTypes(); track wt.id) {
                                        <option [ngValue]="wt.id">{{ wt.nameEn }}</option>
                                    }
                                </select>
                                <validation-messages [formCtrl]="wageTypeIdInput" />
                            </div>
                            <div class="col-md-4 mb-5">
                                <label class="form-label" for="EmployeeWageAccount_CostPercentage">{{ 'CostPercentage' | localize }}</label>
                                <input
                                    id="EmployeeWageAccount_CostPercentage"
                                    class="form-control"
                                    type="number"
                                    name="CostPercentage"
                                    [ngModel]="record().costPercentage"
                                    (ngModelChange)="updateField('costPercentage', $event)" />
                            </div>
                        </div>
                        <div class="row">
                            <div class="col-md-4 mb-5">
                                <label class="form-label required" for="EmployeeWageAccount_AccountInfoId">{{ 'AccountInfoId' | localize }}</label>
                                <select
                                    id="EmployeeWageAccount_AccountInfoId"
                                    #accountInfoIdInput="ngModel"
                                    class="form-select"
                                    name="AccountInfoId"
                                    [ngModel]="record().accountInfoId"
                                    (ngModelChange)="updateField('accountInfoId', $event)"
                                    required>
                                    <option [ngValue]="undefined"></option>
                                    @for (account of accountInfos(); track account.id) {
                                        <option [ngValue]="account.id">{{ account.nameEn }}</option>
                                    }
                                </select>
                                <validation-messages [formCtrl]="accountInfoIdInput" />
                            </div>
                            <div class="col-md-4 mb-5">
                                <label class="form-label" for="EmployeeWageAccount_OffsetAccountInfoId">{{ 'OffsetAccountInfoId' | localize }}</label>
                                <select
                                    id="EmployeeWageAccount_OffsetAccountInfoId"
                                    class="form-select"
                                    name="OffsetAccountInfoId"
                                    [ngModel]="record().offsetAccountInfoId"
                                    (ngModelChange)="updateField('offsetAccountInfoId', $event)">
                                    <option [ngValue]="undefined"></option>
                                    @for (account of accountInfos(); track account.id) {
                                        <option [ngValue]="account.id">{{ account.nameEn }}</option>
                                    }
                                </select>
                            </div>
                            <div class="col-md-4 mb-5 d-flex align-items-end">
                                <div class="form-check">
                                    <input
                                        id="EmployeeWageAccount_MergeOffsetAccount"
                                        class="form-check-input"
                                        type="checkbox"
                                        name="MergeOffsetAccount"
                                        [ngModel]="record().mergeOffsetAccount"
                                        (ngModelChange)="updateField('mergeOffsetAccount', $event)" />
                                    <label class="form-check-label" for="EmployeeWageAccount_MergeOffsetAccount">{{ 'MergeOffsetAccount' | localize }}</label>
                                </div>
                            </div>
                        </div>
                        <hr />
                        <div class="row">
                            @for (field of costElementFields; track field; let i = $index) {
                                <div class="col-md-3 mb-5">
                                    <label class="form-label" [for]="'EmployeeWageAccount_' + field">{{ ('CostElement' + (i + 1) + 'Id') | localize }}</label>
                                    <select
                                        [id]="'EmployeeWageAccount_' + field"
                                        class="form-select"
                                        [name]="field"
                                        [ngModel]="getCostElementValue(field)"
                                        (ngModelChange)="updateField(field, $event)">
                                        <option [ngValue]="undefined"></option>
                                        @for (ce of costElements(); track ce.id) {
                                            <option [ngValue]="ce.id">{{ ce.nameEn }}</option>
                                        }
                                    </select>
                                </div>
                            }
                        </div>
                    </div>
                    <div class="modal-footer">
                        <button [disabled]="saving()" type="button" class="btn btn-light-primary fw-bold" (click)="close()">
                            {{ 'Cancel' | localize }}
                        </button>
                        <button
                            type="submit"
                            class="btn btn-primary fw-bold"
                            [disabled]="!recordForm.form.valid"
                            [buttonBusy]="saving()"
                            [busyText]="l('SavingWithThreeDot')">
                            <i class="fa fa-save"></i>
                            <span>{{ 'Save' | localize }}</span>
                        </button>
                    </div>
                </form>
            }
        </div>
    </div>
</div>
