<div
    appBsModal
    #createOrEditModal="bs-modal"
    (onShown)="onShown()"
    class="modal fade"
    tabindex="-1"
    role="dialog"
    aria-labelledby="createOrEditModal"
    aria-hidden="true"
    [config]="{ backdrop: 'static', keyboard: !saving() }">
    <div class="modal-dialog modal-lg">
        <div class="modal-content">
            @if (active()) {
                <form #recordForm="ngForm" novalidate (ngSubmit)="save()" autocomplete="off">
                    <div class="modal-header">
                        <h4 class="modal-title">
                            @if (record().id) {
                                <span>{{ 'Edit' | localize }}</span>
                            } @else {
                                <span>{{ 'CreateNew' | localize }}</span>
                            }
                        </h4>
                        <button type="button" class="btn-close" (click)="close()" [disabled]="saving()"></button>
                    </div>
                    <div class="modal-body">
                        <div class="row">
                            <div class="col-md-6 mb-5">
                                <label class="form-label required" for="EmployeeGratuity_GratuityPaidDate">{{ 'GratuityPaidDate' | localize }}</label>
                                <input
                                    id="EmployeeGratuity_GratuityPaidDate"
                                    #gratuityPaidDateInput="ngModel"
                                    type="date"
                                    class="form-control"
                                    name="GratuityPaidDate"
                                    [ngModel]="record().gratuityPaidDate?.toISODate()"
                                    (ngModelChange)="updateDateField('gratuityPaidDate', $event)"
                                    required />
                                <validation-messages [formCtrl]="gratuityPaidDateInput" />
                            </div>
                            <div class="col-md-6 mb-5">
                                <label class="form-label" for="EmployeeGratuity_GratuityPaidDays">{{ 'GratuityPaidDays' | localize }}</label>
                                <input
                                    id="EmployeeGratuity_GratuityPaidDays"
                                    class="form-control"
                                    type="number"
                                    step="0.01"
                                    name="GratuityPaidDays"
                                    [ngModel]="record().gratuityPaidDays"
                                    (ngModelChange)="updateNumberField('gratuityPaidDays', $event)" />
                            </div>
                        </div>
                        <div class="row">
                            <div class="col-md-6 mb-5 d-flex align-items-end">
                                <div class="form-check">
                                    <input
                                        id="EmployeeGratuity_ResetGratuityCalc"
                                        class="form-check-input"
                                        type="checkbox"
                                        name="ResetGratuityCalc"
                                        [ngModel]="record().resetGratuityCalc"
                                        (ngModelChange)="updateField('resetGratuityCalc', $event)" />
                                    <label class="form-check-label" for="EmployeeGratuity_ResetGratuityCalc">{{ 'ResetGratuityCalc' | localize }}</label>
                                </div>
                            </div>
                        </div>
                        <div class="mb-5">
                            <label class="form-label" for="EmployeeGratuity_Comments">{{ 'Comments' | localize }}</label>
                            <textarea
                                id="EmployeeGratuity_Comments"
                                class="form-control"
                                rows="3"
                                name="Comments"
                                [ngModel]="record().comments"
                                (ngModelChange)="updateField('comments', $event)"></textarea>
                        </div>
                    </div>
                    <div class="modal-footer">
                        <button [disabled]="saving()" type="button" class="btn btn-light-primary fw-bold" (click)="close()">
                            {{ 'Cancel' | localize }}
                        </button>
                        <button
                            type="submit"
                            class="btn btn-primary fw-bold"
                            [disabled]="!recordForm.form.valid"
                            [buttonBusy]="saving()"
                            [busyText]="l('SavingWithThreeDot')">
                            <i class="fa fa-save"></i>
                            <span>{{ 'Save' | localize }}</span>
                        </button>
                    </div>
                </form>
            }
        </div>
    </div>
</div>
