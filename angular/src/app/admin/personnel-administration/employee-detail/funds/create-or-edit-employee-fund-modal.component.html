<div
    appBsModal
    #createOrEditModal="bs-modal"
    (onShown)="onShown()"
    class="modal fade"
    tabindex="-1"
    role="dialog"
    aria-labelledby="createOrEditModal"
    aria-hidden="true"
    [config]="{ backdrop: 'static', keyboard: !saving() }">
    <div class="modal-dialog modal-xl">
        <div class="modal-content">
            @if (active()) {
                <form #recordForm="ngForm" novalidate (ngSubmit)="save()" autocomplete="off">
                    <div class="modal-header">
                        <h4 class="modal-title">
                            @if (record().id) {
                                <span>{{ 'Edit' | localize }}</span>
                            } @else {
                                <span>{{ 'CreateNew' | localize }}</span>
                            }
                        </h4>
                        <button type="button" class="btn-close" (click)="close()" [disabled]="saving()"></button>
                    </div>
                    <div class="modal-body">
                        <!-- Layout follows legacy (LHRMS) EmployeeFund: Employee / Start Date / End Date, then the
                             read-only Amount / Paid Amount / Balance Amount, then Comments. -->
                        <div class="row">
                            <div class="col-md-6">
                                <div class="mb-5">
                                    @if (choosesEmployee()) {
                                        <label class="form-label required" for="EmployeeFund_EmployeeId">{{ 'Employee' | localize }}</label>
                                        <!-- Type in the dropdown's own box to find an employee by code or name. The list
                                             renders inside the dialog: appended to <body> it would sit beneath it. -->
                                        <p-select
                                            inputId="EmployeeFund_EmployeeId"
                                            #employeeIdInput="ngModel"
                                            name="EmployeeId"
                                            styleClass="w-100"
                                            [appendTo]="null"
                                            [options]="employeeOptions()"
                                            optionLabel="label"
                                            optionValue="id"
                                            [filter]="true"
                                            filterBy="label"
                                            [showClear]="true"
                                            [virtualScroll]="true"
                                            [virtualScrollItemSize]="38"
                                            [ngModel]="record().employeeId"
                                            (ngModelChange)="updateField('employeeId', $event)"
                                            required />
                                        <validation-messages [formCtrl]="employeeIdInput" />
                                    } @else {
                                        @let employee = currentEmployee();
                                        <label class="form-label" for="EmployeeFund_EmployeeName">{{ 'Employee' | localize }}</label>
                                        <input
                                            id="EmployeeFund_EmployeeName"
                                            class="form-control"
                                            type="text"
                                            [value]="employee ? employee.code + ' - ' + employee.nameEn : ''"
                                            disabled />
                                    }
                                </div>
                                <div class="mb-5">
                                    <label class="form-label required" for="EmployeeFund_StartDate">{{ 'StartDate' | localize }}</label>
                                    <input
                                        id="EmployeeFund_StartDate"
                                        #startDateInput="ngModel"
                                        type="date"
                                        class="form-control"
                                        name="StartDate"
                                        [ngModel]="record().startDate?.toISODate()"
                                        (ngModelChange)="updateDateField('startDate', $event)"
                                        required />
                                    <validation-messages [formCtrl]="startDateInput" />
                                </div>
                                <div class="mb-5">
                                    <label class="form-label required" for="EmployeeFund_EndDate">{{ 'EndDate' | localize }}</label>
                                    <input
                                        id="EmployeeFund_EndDate"
                                        #endDateInput="ngModel"
                                        type="date"
                                        class="form-control"
                                        name="EndDate"
                                        [ngModel]="record().endDate?.toISODate()"
                                        (ngModelChange)="updateDateField('endDate', $event)"
                                        required />
                                    <validation-messages [formCtrl]="endDateInput" />
                                </div>
                            </div>
                            <div class="col-md-3">
                                <!-- Read-only, as in legacy: worked out from the Fund Detail rows (and by payroll). -->
                                <div class="mb-5">
                                    <label class="form-label" for="EmployeeFund_Amount">{{ 'Amount' | localize }}</label>
                                    <input id="EmployeeFund_Amount" class="form-control" type="number" [value]="totals().amount" disabled />
                                </div>
                                <div class="mb-5">
                                    <label class="form-label" for="EmployeeFund_PaidAmount">{{ 'PaidAmount' | localize }}</label>
                                    <input id="EmployeeFund_PaidAmount" class="form-control" type="number" [value]="totals().paidAmount" disabled />
                                </div>
                                <div class="mb-5">
                                    <label class="form-label" for="EmployeeFund_BalanceAmount">{{ 'BalanceAmount' | localize }}</label>
                                    <input id="EmployeeFund_BalanceAmount" class="form-control" type="number" [value]="totals().balanceAmount" disabled />
                                </div>
                            </div>
                        </div>
                        <div class="mb-5">
                            <label class="form-label" for="EmployeeFund_Comments">{{ 'Comments' | localize }}</label>
                            <textarea
                                id="EmployeeFund_Comments"
                                class="form-control"
                                rows="3"
                                maxlength="500"
                                name="Comments"
                                [ngModel]="record().comments"
                                (ngModelChange)="updateField('comments', $event)"></textarea>
                        </div>
                    </div>
                </form>
                <!-- Outside the form on purpose: the tabs open dialogs with forms of their own. Shown for a new fund
                     too: "Create new" on a tab saves the fund first, then adds the row under it. -->
                <div class="modal-body pt-0">
                    <employeeFundTabs [fundId]="record().id" [ensureFund]="saveForDetails" (changed)="onDetailsChanged()" />
                </div>
                <div class="modal-footer">
                    <button [disabled]="saving()" type="button" class="btn btn-light-primary fw-bold" (click)="close()">
                        {{ 'Cancel' | localize }}
                    </button>
                    <button
                        type="button"
                        class="btn btn-primary fw-bold"
                        (click)="save()"
                        [disabled]="!recordForm.form.valid"
                        [buttonBusy]="saving()"
                        [busyText]="l('SavingWithThreeDot')">
                        <i class="fa fa-save"></i>
                        <span>{{ 'Save' | localize }}</span>
                    </button>
                </div>
            }
        </div>
    </div>
</div>
