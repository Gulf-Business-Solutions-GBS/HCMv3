<div
    appBsModal
    #createOrEditModal="bs-modal"
    (onShown)="onShown()"
    class="modal fade"
    tabindex="-1"
    role="dialog"
    aria-hidden="true"
    [config]="{ backdrop: 'static', keyboard: !saving() }">
    <div class="modal-dialog modal-lg">
        <div class="modal-content">
            @if (active()) {
                <form #recordForm="ngForm" novalidate (ngSubmit)="save()" autocomplete="off">
                    <div class="modal-header">
                        <h4 class="modal-title">
                            @if (record().id) {
                                <span>{{ 'Edit' | localize }}</span>
                            } @else {
                                <span>{{ 'CreateNew' | localize }}</span>
                            }
                        </h4>
                        <button type="button" class="btn-close" (click)="close()" [disabled]="saving()"></button>
                    </div>
                    <div class="modal-body">
                        <div class="mb-5">
                            <label class="form-label required" for="EmployeeTimesheet_TransDate">{{ 'TransDate' | localize }}</label>
                            <input
                                id="EmployeeTimesheet_TransDate"
                                #transDateInput="ngModel"
                                class="form-control"
                                type="date"
                                name="TransDate"
                                [ngModel]="record().transDate?.toISODate()"
                                (ngModelChange)="updateTransDate($event)"
                                required />
                            <validation-messages [formCtrl]="transDateInput" />
                        </div>
                        <div class="row">
                            <div class="col-md-6 mb-5">
                                <label class="form-label" for="EmployeeTimesheet_ActualStartTime">{{ 'ActualStartTime' | localize }}</label>
                                <input
                                    id="EmployeeTimesheet_ActualStartTime"
                                    class="form-control"
                                    type="time"
                                    step="1"
                                    name="ActualStartTime"
                                    [ngModel]="record().actualStartTime"
                                    (ngModelChange)="updateField('actualStartTime', $event)" />
                            </div>
                            <div class="col-md-6 mb-5">
                                <label class="form-label" for="EmployeeTimesheet_ActualEndTime">{{ 'ActualEndTime' | localize }}</label>
                                <input
                                    id="EmployeeTimesheet_ActualEndTime"
                                    class="form-control"
                                    type="time"
                                    step="1"
                                    name="ActualEndTime"
                                    [ngModel]="record().actualEndTime"
                                    (ngModelChange)="updateField('actualEndTime', $event)" />
                            </div>
                            <div class="col-md-6 mb-5">
                                <label class="form-label" for="EmployeeTimesheet_BreakStartTime">{{ 'BreakStartTime' | localize }}</label>
                                <input
                                    id="EmployeeTimesheet_BreakStartTime"
                                    class="form-control"
                                    type="time"
                                    step="1"
                                    name="BreakStartTime"
                                    [ngModel]="record().breakStartTime"
                                    (ngModelChange)="updateField('breakStartTime', $event)" />
                            </div>
                            <div class="col-md-6 mb-5">
                                <label class="form-label" for="EmployeeTimesheet_BreakEndTime">{{ 'BreakEndTime' | localize }}</label>
                                <input
                                    id="EmployeeTimesheet_BreakEndTime"
                                    class="form-control"
                                    type="time"
                                    step="1"
                                    name="BreakEndTime"
                                    [ngModel]="record().breakEndTime"
                                    (ngModelChange)="updateField('breakEndTime', $event)" />
                            </div>
                        </div>
                        <div class="row">
                            <div class="col-md-6 mb-5">
                                <label class="form-label" for="EmployeeTimesheet_TotalHours">{{ 'TotalHours' | localize }}</label>
                                <input
                                    id="EmployeeTimesheet_TotalHours"
                                    class="form-control"
                                    type="number"
                                    step="0.01"
                                    name="TotalHours"
                                    [ngModel]="record().totalHours"
                                    (ngModelChange)="updateNumberField('totalHours', $event)" />
                            </div>
                            <div class="col-md-6 mb-5">
                                <label class="form-label" for="EmployeeTimesheet_Approved">{{ 'Approved' | localize }}</label>
                                <input
                                    id="EmployeeTimesheet_Approved"
                                    class="form-control"
                                    type="number"
                                    name="Approved"
                                    [ngModel]="record().approved"
                                    (ngModelChange)="updateNumberField('approved', $event)" />
                            </div>
                        </div>
                        <div class="mb-5">
                            <label class="form-label" for="EmployeeTimesheet_Comments">{{ 'Comments' | localize }}</label>
                            <textarea
                                id="EmployeeTimesheet_Comments"
                                class="form-control"
                                rows="3"
                                name="Comments"
                                [ngModel]="record().comments"
                                (ngModelChange)="updateField('comments', $event)"></textarea>
                        </div>
                    </div>
                    <div class="modal-footer">
                        <button [disabled]="saving()" type="button" class="btn btn-light-primary fw-bold" (click)="close()">
                            {{ 'Cancel' | localize }}
                        </button>
                        <button
                            type="submit"
                            class="btn btn-primary fw-bold"
                            [disabled]="!recordForm.form.valid"
                            [buttonBusy]="saving()"
                            [busyText]="l('SavingWithThreeDot')">
                            <i class="fa fa-save"></i>
                            <span>{{ 'Save' | localize }}</span>
                        </button>
                    </div>
                </form>
            }
        </div>
    </div>
</div>
