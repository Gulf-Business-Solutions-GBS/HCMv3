<div
    appBsModal
    #createOrEditModal="bs-modal"
    (onShown)="onShown()"
    class="modal fade"
    tabindex="-1"
    role="dialog"
    aria-hidden="true"
    [config]="{ backdrop: 'static', keyboard: !saving() }">
    <div class="modal-dialog modal-lg">
        <div class="modal-content">
            @if (active()) {
                <form #recordForm="ngForm" novalidate (ngSubmit)="save()" autocomplete="off">
                    <div class="modal-header">
                        <h4 class="modal-title">
                            @if (record().id) {
                                <span>{{ 'Edit' | localize }}</span>
                            } @else {
                                <span>{{ 'CreateNew' | localize }}</span>
                            }
                        </h4>
                        <button type="button" class="btn-close" (click)="close()" [disabled]="saving()"></button>
                    </div>
                    <div class="modal-body">
                        <div class="mb-5">
                            <label class="form-label required" for="EmployeeSubstituteDuty_SubstituteDate">{{ 'SubstituteDate' | localize }}</label>
                            <input
                                id="EmployeeSubstituteDuty_SubstituteDate"
                                #substituteDateInput="ngModel"
                                class="form-control"
                                type="date"
                                name="SubstituteDate"
                                [ngModel]="record().substituteDate?.toISODate()"
                                (ngModelChange)="updateSubstituteDate($event)"
                                required />
                            <validation-messages [formCtrl]="substituteDateInput" />
                        </div>
                        <div class="mb-5">
                            <label class="form-label required" for="EmployeeSubstituteDuty_DutyId">{{ 'Duty' | localize }}</label>
                            <select
                                id="EmployeeSubstituteDuty_DutyId"
                                #dutyIdInput="ngModel"
                                class="form-select"
                                name="DutyId"
                                [ngModel]="record().dutyId"
                                (ngModelChange)="updateField('dutyId', $event)"
                                required>
                                <option [ngValue]="undefined"></option>
                                @for (item of duties(); track item.id) {
                                    <option [ngValue]="item.id">{{ item.nameEn }}</option>
                                }
                            </select>
                            <validation-messages [formCtrl]="dutyIdInput" />
                        </div>
                    </div>
                    <div class="modal-footer">
                        <button [disabled]="saving()" type="button" class="btn btn-light-primary fw-bold" (click)="close()">
                            {{ 'Cancel' | localize }}
                        </button>
                        <button
                            type="submit"
                            class="btn btn-primary fw-bold"
                            [disabled]="!recordForm.form.valid"
                            [buttonBusy]="saving()"
                            [busyText]="l('SavingWithThreeDot')">
                            <i class="fa fa-save"></i>
                            <span>{{ 'Save' | localize }}</span>
                        </button>
                    </div>
                </form>
            }
        </div>
    </div>
</div>
