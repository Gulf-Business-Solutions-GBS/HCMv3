<div
    appBsModal
    #createOrEditModal="bs-modal"
    (onShown)="onShown()"
    class="modal fade"
    tabindex="-1"
    role="dialog"
    aria-labelledby="createOrEditModal"
    aria-hidden="true"
    [config]="{ backdrop: 'static', keyboard: !saving() }">
    <div class="modal-dialog modal-lg">
        <div class="modal-content">
            @if (active()) {
                <form #recordForm="ngForm" novalidate (ngSubmit)="save()" autocomplete="off">
                    <div class="modal-header">
                        <h4 class="modal-title">
                            @if (record().id) {
                                <span>{{ 'Edit' | localize }}</span>
                            } @else {
                                <span>{{ 'CreateNew' | localize }}</span>
                            }
                        </h4>
                        <button type="button" class="btn-close" (click)="close()" [disabled]="saving()"></button>
                    </div>
                    <div class="modal-body">
                        <div class="row">
                            <div class="col-md-6 mb-5">
                                <label class="form-label required" for="EmployeeOvertime_EffectiveDate">{{ 'EffectiveDate' | localize }}</label>
                                <input
                                    id="EmployeeOvertime_EffectiveDate"
                                    #effectiveDateInput="ngModel"
                                    type="date"
                                    class="form-control"
                                    name="EffectiveDate"
                                    [ngModel]="record().effectiveDate?.toISODate()"
                                    (ngModelChange)="updateDateField('effectiveDate', $event)"
                                    required />
                                <validation-messages [formCtrl]="effectiveDateInput" />
                            </div>
                            <div class="col-md-6 mb-5">
                                <label class="form-label required" for="EmployeeOvertime_OvertimeTypeId">{{ 'OvertimeTypeId' | localize }}</label>
                                <select
                                    id="EmployeeOvertime_OvertimeTypeId"
                                    #overtimeTypeIdInput="ngModel"
                                    class="form-select"
                                    name="OvertimeTypeId"
                                    [ngModel]="record().overtimeTypeId"
                                    (ngModelChange)="updateField('overtimeTypeId', $event)"
                                    required>
                                    <option [ngValue]="undefined"></option>
                                    @for (type of overtimeTypes(); track type.id) {
                                        <option [ngValue]="type.id">{{ type.nameEn }}</option>
                                    }
                                </select>
                                <validation-messages [formCtrl]="overtimeTypeIdInput" />
                            </div>
                        </div>
                        <div class="row">
                            <div class="col-md-4 mb-5">
                                <label class="form-label" for="EmployeeOvertime_OvertimeHours">{{ 'OvertimeHours' | localize }}</label>
                                <input
                                    id="EmployeeOvertime_OvertimeHours"
                                    class="form-control"
                                    type="number"
                                    step="0.01"
                                    name="OvertimeHours"
                                    [ngModel]="record().overtimeHours"
                                    (ngModelChange)="updateNumberField('overtimeHours', $event)" />
                            </div>
                            <div class="col-md-4 mb-5">
                                <label class="form-label" for="EmployeeOvertime_ActualOvertimeHours">{{ 'ActualOvertimeHours' | localize }}</label>
                                <input
                                    id="EmployeeOvertime_ActualOvertimeHours"
                                    class="form-control"
                                    type="number"
                                    step="0.01"
                                    name="ActualOvertimeHours"
                                    [ngModel]="record().actualOvertimeHours"
                                    (ngModelChange)="updateNumberField('actualOvertimeHours', $event)" />
                            </div>
                            <div class="col-md-4 mb-5">
                                <label class="form-label" for="EmployeeOvertime_ApprovedOvertimeHours">{{ 'ApprovedOvertimeHours' | localize }}</label>
                                <input
                                    id="EmployeeOvertime_ApprovedOvertimeHours"
                                    class="form-control"
                                    type="number"
                                    step="0.01"
                                    name="ApprovedOvertimeHours"
                                    [ngModel]="record().approvedOvertimeHours"
                                    (ngModelChange)="updateNumberField('approvedOvertimeHours', $event)" />
                            </div>
                        </div>
                        @if (record().id) {
                            <!-- Read-only: worked out by the server from the saved record, never posted back. -->
                            <div class="row">
                                <div class="col-md-4 mb-5">
                                    <label class="form-label" for="EmployeeOvertime_ExpectedOvertimeAmount">{{ 'ExpectedOvertimeAmount' | localize }}</label>
                                    <input
                                        id="EmployeeOvertime_ExpectedOvertimeAmount"
                                        class="form-control"
                                        type="text"
                                        name="ExpectedOvertimeAmount"
                                        [value]="expectedOvertimeAmount() | number: '1.3-3'"
                                        readonly
                                        disabled />
                                </div>
                            </div>
                        }
                        <div class="mb-5">
                            <label class="form-label" for="EmployeeOvertime_Comments">{{ 'Comments' | localize }}</label>
                            <textarea
                                id="EmployeeOvertime_Comments"
                                class="form-control"
                                rows="3"
                                name="Comments"
                                [ngModel]="record().comments"
                                (ngModelChange)="updateField('comments', $event)"></textarea>
                        </div>
                        <!-- Shows itself only if this user may bypass approval AND the catalog allows it for
                             this type; otherwise the form is exactly as it was. -->
                        <record-directly-check
                            requestType="EmployeeOvertime"
                            [value]="record().recordDirectly"
                            (valueChange)="updateField('recordDirectly', $event)" />
                    </div>
                    <div class="modal-footer">
                        <button [disabled]="saving()" type="button" class="btn btn-light-primary fw-bold" (click)="close()">
                            {{ 'Cancel' | localize }}
                        </button>
                        <button
                            type="submit"
                            class="btn btn-primary fw-bold"
                            [disabled]="!recordForm.form.valid"
                            [buttonBusy]="saving()"
                            [busyText]="l('SavingWithThreeDot')">
                            <i class="fa fa-save"></i>
                            <span>{{ 'Save' | localize }}</span>
                        </button>
                    </div>
                </form>
            }
        </div>
    </div>
</div>
