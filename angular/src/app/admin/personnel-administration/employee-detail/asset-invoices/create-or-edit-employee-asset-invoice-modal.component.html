<div
    appBsModal
    #createOrEditModal="bs-modal"
    (onShown)="onShown()"
    class="modal fade"
    tabindex="-1"
    role="dialog"
    aria-labelledby="createOrEditModal"
    aria-hidden="true"
    [config]="{ backdrop: 'static', keyboard: !saving() }">
    <div class="modal-dialog modal-lg">
        <div class="modal-content">
            @if (active()) {
                <form #recordForm="ngForm" novalidate (ngSubmit)="save()" autocomplete="off">
                    <div class="modal-header">
                        <h4 class="modal-title">
                            @if (record().id) {
                                <span>{{ 'Edit' | localize }}</span>
                            } @else {
                                <span>{{ 'CreateNew' | localize }}</span>
                            }
                        </h4>
                        <button type="button" class="btn-close" (click)="close()" [disabled]="saving()"></button>
                    </div>
                    <div class="modal-body">
                        <div class="row">
                            <div class="col-md-6 mb-5">
                                <label class="form-label required" for="EmployeeAssetInvoice_AssetId">{{ 'AssetId' | localize }}</label>
                                <select
                                    id="EmployeeAssetInvoice_AssetId"
                                    #assetIdInput="ngModel"
                                    class="form-select"
                                    name="AssetId"
                                    [ngModel]="record().assetId"
                                    (ngModelChange)="updateField('assetId', $event)"
                                    required>
                                    <option [ngValue]="undefined"></option>
                                    @for (asset of assets(); track asset.id) {
                                        <option [ngValue]="asset.id">{{ asset.nameEn }}</option>
                                    }
                                </select>
                                <validation-messages [formCtrl]="assetIdInput" />
                            </div>
                            <div class="col-md-6 mb-5">
                                <label class="form-label required" for="EmployeeAssetInvoice_InvoiceDate">{{ 'InvoiceDate' | localize }}</label>
                                <input
                                    id="EmployeeAssetInvoice_InvoiceDate"
                                    #invoiceDateInput="ngModel"
                                    type="date"
                                    class="form-control"
                                    name="InvoiceDate"
                                    [ngModel]="record().invoiceDate?.toISODate()"
                                    (ngModelChange)="updateDateField('invoiceDate', $event)"
                                    required />
                                <validation-messages [formCtrl]="invoiceDateInput" />
                            </div>
                        </div>
                        <div class="row">
                            <div class="col-md-4 mb-5">
                                <label class="form-label" for="EmployeeAssetInvoice_InvoiceAmount">{{ 'InvoiceAmount' | localize }}</label>
                                <input
                                    id="EmployeeAssetInvoice_InvoiceAmount"
                                    class="form-control"
                                    type="number"
                                    step="0.001"
                                    name="InvoiceAmount"
                                    [ngModel]="record().invoiceAmount"
                                    (ngModelChange)="updateNumberField('invoiceAmount', $event)" />
                            </div>
                            <div class="col-md-4 mb-5">
                                <label class="form-label" for="EmployeeAssetInvoice_EmployeePlanAmount">{{ 'EmployeePlanAmount' | localize }}</label>
                                <input
                                    id="EmployeeAssetInvoice_EmployeePlanAmount"
                                    class="form-control"
                                    type="number"
                                    step="0.001"
                                    name="EmployeePlanAmount"
                                    [ngModel]="record().employeePlanAmount"
                                    (ngModelChange)="updateNumberField('employeePlanAmount', $event)" />
                            </div>
                            <div class="col-md-4 mb-5">
                                <label class="form-label" for="EmployeeAssetInvoice_DeductionAmount">{{ 'DeductionAmount' | localize }}</label>
                                <input
                                    id="EmployeeAssetInvoice_DeductionAmount"
                                    class="form-control"
                                    type="number"
                                    step="0.001"
                                    name="DeductionAmount"
                                    [ngModel]="record().deductionAmount"
                                    (ngModelChange)="updateNumberField('deductionAmount', $event)" />
                            </div>
                        </div>
                        <div class="mb-5">
                            <div class="form-check">
                                <input
                                    id="EmployeeAssetInvoice_DeductFromEmployee"
                                    class="form-check-input"
                                    type="checkbox"
                                    name="DeductFromEmployee"
                                    [ngModel]="record().deductFromEmployee"
                                    (ngModelChange)="updateField('deductFromEmployee', $event)" />
                                <label class="form-check-label" for="EmployeeAssetInvoice_DeductFromEmployee">{{ 'DeductFromEmployee' | localize }}</label>
                            </div>
                        </div>
                        <div class="mb-5">
                            <label class="form-label" for="EmployeeAssetInvoice_Comments">{{ 'Comments' | localize }}</label>
                            <textarea
                                id="EmployeeAssetInvoice_Comments"
                                class="form-control"
                                rows="3"
                                name="Comments"
                                [ngModel]="record().comments"
                                (ngModelChange)="updateField('comments', $event)"></textarea>
                        </div>
                        <!-- Files belong to a saved invoice (same as Employee Assets): the attachment list
                             appears once the record has an id. -->
                        @if (record().id) {
                            <div class="mb-5">
                                <app-attachments entityType="EmployeeAssetInvoice" [entityId]="record().id" />
                            </div>
                        }
                    </div>
                    <div class="modal-footer">
                        <button [disabled]="saving()" type="button" class="btn btn-light-primary fw-bold" (click)="close()">
                            {{ 'Cancel' | localize }}
                        </button>
                        <button
                            type="submit"
                            class="btn btn-primary fw-bold"
                            [disabled]="!recordForm.form.valid"
                            [buttonBusy]="saving()"
                            [busyText]="l('SavingWithThreeDot')">
                            <i class="fa fa-save"></i>
                            <span>{{ 'Save' | localize }}</span>
                        </button>
                    </div>
                </form>
            }
        </div>
    </div>
</div>
