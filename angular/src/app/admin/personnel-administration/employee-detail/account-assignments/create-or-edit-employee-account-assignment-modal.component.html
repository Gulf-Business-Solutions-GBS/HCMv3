<div
    appBsModal
    #createOrEditModal="bs-modal"
    (onShown)="onShown()"
    class="modal fade"
    tabindex="-1"
    role="dialog"
    aria-labelledby="createOrEditModal"
    aria-hidden="true"
    [config]="{ backdrop: 'static', keyboard: !saving() }">
    <div class="modal-dialog modal-xl">
        <div class="modal-content">
            @if (active()) {
                <form #recordForm="ngForm" novalidate (ngSubmit)="save()" autocomplete="off">
                    <div class="modal-header">
                        <h4 class="modal-title">
                            @if (record().id) {
                                <span>{{ 'Edit' | localize }}</span>
                            } @else {
                                <span>{{ 'CreateNew' | localize }}</span>
                            }
                        </h4>
                        <button type="button" class="btn-close" (click)="close()" [disabled]="saving()"></button>
                    </div>
                    <div class="modal-body">
                        <div class="row">
                            <div class="col-md-4 mb-5">
                                <label class="form-label required" for="EmployeeAccountAssignment_StartDate">{{ 'StartDate' | localize }}</label>
                                <input
                                    id="EmployeeAccountAssignment_StartDate"
                                    #startDateInput="ngModel"
                                    type="date"
                                    class="form-control"
                                    name="StartDate"
                                    [ngModel]="record().startDate?.toISODate()"
                                    (ngModelChange)="updateDateField('startDate', $event)"
                                    required />
                                <validation-messages [formCtrl]="startDateInput" />
                            </div>
                            <div class="col-md-4 mb-5">
                                <label class="form-label required" for="EmployeeAccountAssignment_EndDate">{{ 'EndDate' | localize }}</label>
                                <input
                                    id="EmployeeAccountAssignment_EndDate"
                                    #endDateInput="ngModel"
                                    type="date"
                                    class="form-control"
                                    name="EndDate"
                                    [ngModel]="record().endDate?.toISODate()"
                                    (ngModelChange)="updateDateField('endDate', $event)"
                                    required />
                                <validation-messages [formCtrl]="endDateInput" />
                            </div>
                            <div class="col-md-4 mb-5">
                                <label class="form-label" for="EmployeeAccountAssignment_CostPercentage">{{ 'CostPercentage' | localize }}</label>
                                <input
                                    id="EmployeeAccountAssignment_CostPercentage"
                                    class="form-control"
                                    type="number"
                                    step="0.01"
                                    name="CostPercentage"
                                    [ngModel]="record().costPercentage"
                                    (ngModelChange)="updateNumberField('costPercentage', $event)" />
                            </div>
                        </div>
                        <hr />
                        <div class="row">
                            @for (field of costElementFields; track field; let i = $index) {
                                <div class="col-md-3 mb-5">
                                    <label class="form-label" [for]="'EmployeeAccountAssignment_' + field">{{ ('CostElement' + (i + 1) + 'Id') | localize }}</label>
                                    <select
                                        [id]="'EmployeeAccountAssignment_' + field"
                                        class="form-select"
                                        [name]="field"
                                        [ngModel]="getCostElementValue(field)"
                                        (ngModelChange)="updateField(field, $event)">
                                        <option [ngValue]="undefined"></option>
                                        @for (ce of costElements(); track ce.id) {
                                            <option [ngValue]="ce.id">{{ ce.nameEn }}</option>
                                        }
                                    </select>
                                </div>
                            }
                        </div>
                    </div>
                    <div class="modal-footer">
                        <button [disabled]="saving()" type="button" class="btn btn-light-primary fw-bold" (click)="close()">
                            {{ 'Cancel' | localize }}
                        </button>
                        <button
                            type="submit"
                            class="btn btn-primary fw-bold"
                            [disabled]="!recordForm.form.valid"
                            [buttonBusy]="saving()"
                            [busyText]="l('SavingWithThreeDot')">
                            <i class="fa fa-save"></i>
                            <span>{{ 'Save' | localize }}</span>
                        </button>
                    </div>
                </form>
            }
        </div>
    </div>
</div>
