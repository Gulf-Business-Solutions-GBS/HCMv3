<div
    appBsModal
    #createOrEditModal="bs-modal"
    (onShown)="onShown()"
    class="modal fade"
    tabindex="-1"
    role="dialog"
    aria-labelledby="createOrEditModal"
    aria-hidden="true"
    [config]="{ backdrop: 'static', keyboard: !saving() }">
    <div class="modal-dialog modal-lg">
        <div class="modal-content">
            @if (active()) {
                <form #recordForm="ngForm" novalidate (ngSubmit)="save()" autocomplete="off">
                    <div class="modal-header">
                        <h4 class="modal-title">
                            @if (record().id) {
                                <span>{{ 'Edit' | localize }}</span>
                            } @else {
                                <span>{{ 'CreateNew' | localize }}</span>
                            }
                        </h4>
                        <button type="button" class="btn-close" (click)="close()" [disabled]="saving()"></button>
                    </div>
                    <div class="modal-body">
                        <div class="row">
                            <div class="col-md-6 mb-5">
                                <label class="form-label required" for="EmployeeTktAdjustment_TicketTypeId">{{ 'TicketTypeId' | localize }}</label>
                                <select
                                    id="EmployeeTktAdjustment_TicketTypeId"
                                    #ticketTypeIdInput="ngModel"
                                    class="form-select"
                                    name="TicketTypeId"
                                    [ngModel]="record().ticketTypeId"
                                    (ngModelChange)="updateField('ticketTypeId', $event)"
                                    required>
                                    <option [ngValue]="undefined"></option>
                                    @for (type of ticketTypes(); track type.id) {
                                        <option [ngValue]="type.id">{{ type.nameEn }}</option>
                                    }
                                </select>
                                <validation-messages [formCtrl]="ticketTypeIdInput" />
                            </div>
                            <div class="col-md-6 mb-5">
                                <label class="form-label required" for="EmployeeTktAdjustment_EffectiveDate">{{ 'EffectiveDate' | localize }}</label>
                                <input
                                    id="EmployeeTktAdjustment_EffectiveDate"
                                    #effectiveDateInput="ngModel"
                                    type="date"
                                    class="form-control"
                                    name="EffectiveDate"
                                    [ngModel]="record().effectiveDate?.toISODate()"
                                    (ngModelChange)="updateDateField('effectiveDate', $event)"
                                    required />
                                <validation-messages [formCtrl]="effectiveDateInput" />
                            </div>
                        </div>
                        <div class="row">
                            <div class="col-md-4 mb-5">
                                <label class="form-label" for="EmployeeTktAdjustment_AdjustmentType">{{ 'AdjustmentType' | localize }}</label>
                                <select
                                    id="EmployeeTktAdjustment_AdjustmentType"
                                    class="form-select"
                                    name="AdjustmentType"
                                    [ngModel]="record().adjustmentType"
                                    (ngModelChange)="updateField('adjustmentType', $event)">
                                    @for (option of adjustmentTypes; track option.value) {
                                        <option [ngValue]="option.value">{{ option.name | localize }}</option>
                                    }
                                </select>
                            </div>
                            <div class="col-md-4 mb-5">
                                <label class="form-label" for="EmployeeTktAdjustment_TicketPaymentType">{{ 'TicketPaymentType' | localize }}</label>
                                <select
                                    id="EmployeeTktAdjustment_TicketPaymentType"
                                    class="form-select"
                                    name="TicketPaymentType"
                                    [ngModel]="record().ticketPaymentType"
                                    (ngModelChange)="updateField('ticketPaymentType', $event)">
                                    @for (option of ticketPaymentTypes; track option.value) {
                                        <option [ngValue]="option.value">{{ option.name | localize }}</option>
                                    }
                                </select>
                            </div>
                        </div>
                        <div class="row">
                            <div class="col-md-6 mb-5">
                                <label class="form-label" for="EmployeeTktAdjustment_QuotaAccrued">{{ 'QuotaAccrued' | localize }}</label>
                                <input
                                    id="EmployeeTktAdjustment_QuotaAccrued"
                                    class="form-control"
                                    type="number"
                                    step="0.01"
                                    name="QuotaAccrued"
                                    [ngModel]="record().quotaAccrued"
                                    (ngModelChange)="updateNumberField('quotaAccrued', $event)" />
                            </div>
                            <div class="col-md-6 mb-5">
                                <label class="form-label" for="EmployeeTktAdjustment_QuotaAdjusted">{{ 'QuotaAdjusted' | localize }}</label>
                                <input
                                    id="EmployeeTktAdjustment_QuotaAdjusted"
                                    class="form-control"
                                    type="number"
                                    step="0.01"
                                    name="QuotaAdjusted"
                                    [ngModel]="record().quotaAdjusted"
                                    (ngModelChange)="updateNumberField('quotaAdjusted', $event)" />
                            </div>
                        </div>
                        <div class="mb-5">
                            <label class="form-label" for="EmployeeTktAdjustment_Comments">{{ 'Comments' | localize }}</label>
                            <textarea
                                id="EmployeeTktAdjustment_Comments"
                                class="form-control"
                                rows="3"
                                name="Comments"
                                [ngModel]="record().comments"
                                (ngModelChange)="updateField('comments', $event)"></textarea>
                        </div>
                    </div>
                    <div class="modal-footer">
                        <button [disabled]="saving()" type="button" class="btn btn-light-primary fw-bold" (click)="close()">
                            {{ 'Cancel' | localize }}
                        </button>
                        <button
                            type="submit"
                            class="btn btn-primary fw-bold"
                            [disabled]="!recordForm.form.valid"
                            [buttonBusy]="saving()"
                            [busyText]="l('SavingWithThreeDot')">
                            <i class="fa fa-save"></i>
                            <span>{{ 'Save' | localize }}</span>
                        </button>
                    </div>
                </form>
            }
        </div>
    </div>
</div>
