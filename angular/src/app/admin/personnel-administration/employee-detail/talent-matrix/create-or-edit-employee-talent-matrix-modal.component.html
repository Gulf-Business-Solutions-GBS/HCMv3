<div
    appBsModal
    #createOrEditModal="bs-modal"
    (onShown)="onShown()"
    class="modal fade"
    tabindex="-1"
    role="dialog"
    aria-labelledby="createOrEditModal"
    aria-hidden="true"
    [config]="{ backdrop: 'static', keyboard: !saving() }">
    <div class="modal-dialog modal-lg">
        <div class="modal-content">
            @if (active()) {
                <form #recordForm="ngForm" novalidate (ngSubmit)="save()" autocomplete="off">
                    <div class="modal-header">
                        <h4 class="modal-title">
                            @if (record().id) {
                                <span>{{ 'Edit' | localize }}</span>
                            } @else {
                                <span>{{ 'CreateNew' | localize }}</span>
                            }
                        </h4>
                        <button type="button" class="btn-close" (click)="close()" [disabled]="saving()"></button>
                    </div>
                    <div class="modal-body">
                        <div class="row">
                            <div class="col-md-6 mb-5">
                                <label class="form-label required" for="EmpTalentMatrixData_StartDate">{{ 'StartDate' | localize }}</label>
                                <input
                                    id="EmpTalentMatrixData_StartDate"
                                    #startDateInput="ngModel"
                                    type="date"
                                    class="form-control"
                                    name="StartDate"
                                    [ngModel]="record().startDate?.toISODate()"
                                    (ngModelChange)="updateDateField('startDate', $event)"
                                    required />
                                <validation-messages [formCtrl]="startDateInput" />
                            </div>
                            <div class="col-md-6 mb-5">
                                <label class="form-label required" for="EmpTalentMatrixData_EndDate">{{ 'EndDate' | localize }}</label>
                                <input
                                    id="EmpTalentMatrixData_EndDate"
                                    #endDateInput="ngModel"
                                    type="date"
                                    class="form-control"
                                    name="EndDate"
                                    [ngModel]="record().endDate?.toISODate()"
                                    (ngModelChange)="updateDateField('endDate', $event)"
                                    required />
                                <validation-messages [formCtrl]="endDateInput" />
                            </div>
                        </div>
                        <div class="row">
                            <div class="col-md-6 mb-5">
                                <label class="form-label required" for="EmpTalentMatrixData_PerformanceRatingId">{{ 'PerformanceRatingId' | localize }}</label>
                                <select
                                    id="EmpTalentMatrixData_PerformanceRatingId"
                                    #performanceRatingIdInput="ngModel"
                                    class="form-select"
                                    name="PerformanceRatingId"
                                    [ngModel]="record().performanceRatingId"
                                    (ngModelChange)="updateField('performanceRatingId', $event)"
                                    required>
                                    <option [ngValue]="undefined"></option>
                                    @for (rating of nineBoxRatings(); track rating.id) {
                                        <option [ngValue]="rating.id">{{ rating.nameEn }}</option>
                                    }
                                </select>
                                <validation-messages [formCtrl]="performanceRatingIdInput" />
                            </div>
                            <div class="col-md-6 mb-5">
                                <label class="form-label required" for="EmpTalentMatrixData_PotentialRatingId">{{ 'PotentialRatingId' | localize }}</label>
                                <select
                                    id="EmpTalentMatrixData_PotentialRatingId"
                                    #potentialRatingIdInput="ngModel"
                                    class="form-select"
                                    name="PotentialRatingId"
                                    [ngModel]="record().potentialRatingId"
                                    (ngModelChange)="updateField('potentialRatingId', $event)"
                                    required>
                                    <option [ngValue]="undefined"></option>
                                    @for (rating of nineBoxRatings(); track rating.id) {
                                        <option [ngValue]="rating.id">{{ rating.nameEn }}</option>
                                    }
                                </select>
                                <validation-messages [formCtrl]="potentialRatingIdInput" />
                            </div>
                        </div>
                        <div class="row">
                            <div class="col-md-6 mb-5">
                                <label class="form-label required" for="EmpTalentMatrixData_OverallRatingId">{{ 'OverallRatingId' | localize }}</label>
                                <select
                                    id="EmpTalentMatrixData_OverallRatingId"
                                    #overallRatingIdInput="ngModel"
                                    class="form-select"
                                    name="OverallRatingId"
                                    [ngModel]="record().overallRatingId"
                                    (ngModelChange)="updateField('overallRatingId', $event)"
                                    required>
                                    <option [ngValue]="undefined"></option>
                                    @for (rating of nineBoxRatings(); track rating.id) {
                                        <option [ngValue]="rating.id">{{ rating.nameEn }}</option>
                                    }
                                </select>
                                <validation-messages [formCtrl]="overallRatingIdInput" />
                            </div>
                            <div class="col-md-6 mb-5">
                                <label class="form-label required" for="EmpTalentMatrixData_CalibratedRatingId">{{ 'CalibratedRatingId' | localize }}</label>
                                <select
                                    id="EmpTalentMatrixData_CalibratedRatingId"
                                    #calibratedRatingIdInput="ngModel"
                                    class="form-select"
                                    name="CalibratedRatingId"
                                    [ngModel]="record().calibratedRatingId"
                                    (ngModelChange)="updateField('calibratedRatingId', $event)"
                                    required>
                                    <option [ngValue]="undefined"></option>
                                    @for (rating of nineBoxRatings(); track rating.id) {
                                        <option [ngValue]="rating.id">{{ rating.nameEn }}</option>
                                    }
                                </select>
                                <validation-messages [formCtrl]="calibratedRatingIdInput" />
                            </div>
                        </div>
                    </div>
                    <div class="modal-footer">
                        <button [disabled]="saving()" type="button" class="btn btn-light-primary fw-bold" (click)="close()">
                            {{ 'Cancel' | localize }}
                        </button>
                        <button
                            type="submit"
                            class="btn btn-primary fw-bold"
                            [disabled]="!recordForm.form.valid"
                            [buttonBusy]="saving()"
                            [busyText]="l('SavingWithThreeDot')">
                            <i class="fa fa-save"></i>
                            <span>{{ 'Save' | localize }}</span>
                        </button>
                    </div>
                </form>
            }
        </div>
    </div>
</div>
