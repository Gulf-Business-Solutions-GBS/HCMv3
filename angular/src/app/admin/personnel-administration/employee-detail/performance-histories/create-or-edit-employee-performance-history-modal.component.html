<div
    appBsModal
    #createOrEditModal="bs-modal"
    (onShown)="onShown()"
    class="modal fade"
    tabindex="-1"
    role="dialog"
    aria-labelledby="createOrEditModal"
    aria-hidden="true"
    [config]="{ backdrop: 'static', keyboard: !saving() }">
    <div class="modal-dialog modal-lg">
        <div class="modal-content">
            @if (active()) {
                <form #recordForm="ngForm" novalidate (ngSubmit)="save()" autocomplete="off">
                    <div class="modal-header">
                        <h4 class="modal-title">
                            @if (record().id) {
                                <span>{{ 'Edit' | localize }}</span>
                            } @else {
                                <span>{{ 'CreateNew' | localize }}</span>
                            }
                        </h4>
                        <button type="button" class="btn-close" (click)="close()" [disabled]="saving()"></button>
                    </div>
                    <div class="modal-body">
                        <div class="row">
                            <div class="col-md-6 mb-5">
                                <label class="form-label required" for="EmpPerformanceHistory_StartDate">{{ 'StartDate' | localize }}</label>
                                <input
                                    id="EmpPerformanceHistory_StartDate"
                                    #startDateInput="ngModel"
                                    type="date"
                                    class="form-control"
                                    name="StartDate"
                                    [ngModel]="record().startDate?.toISODate()"
                                    (ngModelChange)="updateDateField('startDate', $event)"
                                    required />
                                <validation-messages [formCtrl]="startDateInput" />
                            </div>
                            <div class="col-md-6 mb-5">
                                <label class="form-label required" for="EmpPerformanceHistory_EndDate">{{ 'EndDate' | localize }}</label>
                                <input
                                    id="EmpPerformanceHistory_EndDate"
                                    #endDateInput="ngModel"
                                    type="date"
                                    class="form-control"
                                    name="EndDate"
                                    [ngModel]="record().endDate?.toISODate()"
                                    (ngModelChange)="updateDateField('endDate', $event)"
                                    required />
                                <validation-messages [formCtrl]="endDateInput" />
                            </div>
                        </div>
                        <div class="mb-5">
                            <label class="form-label" for="EmpPerformanceHistory_Description">{{ 'Description' | localize }}</label>
                            <textarea
                                id="EmpPerformanceHistory_Description"
                                class="form-control"
                                rows="2"
                                name="Description"
                                [ngModel]="record().description"
                                (ngModelChange)="updateField('description', $event)"></textarea>
                        </div>
                        <div class="row">
                            <div class="col-md-4 mb-5">
                                <label class="form-label required" for="EmpPerformanceHistory_Score">{{ 'Score' | localize }}</label>
                                <input
                                    id="EmpPerformanceHistory_Score"
                                    #scoreInput="ngModel"
                                    type="number"
                                    class="form-control"
                                    name="Score"
                                    [ngModel]="record().score"
                                    (ngModelChange)="updateField('score', $event)"
                                    required />
                                <validation-messages [formCtrl]="scoreInput" />
                            </div>
                            <div class="col-md-4 mb-5">
                                <label class="form-label" for="EmpPerformanceHistory_Source">{{ 'Source' | localize }}</label>
                                <select
                                    id="EmpPerformanceHistory_Source"
                                    class="form-select"
                                    name="Source"
                                    [ngModel]="record().source"
                                    (ngModelChange)="updateField('source', $event)">
                                    @for (option of scoreSources; track option.value) {
                                        <option [ngValue]="option.value">{{ option.name | localize }}</option>
                                    }
                                </select>
                            </div>
                        </div>
                        <div class="row">
                            <div class="col-md-6 mb-5">
                                <label class="form-label required" for="EmpPerformanceHistory_RatingId">{{ 'RatingId' | localize }}</label>
                                <select
                                    id="EmpPerformanceHistory_RatingId"
                                    #ratingIdInput="ngModel"
                                    class="form-select"
                                    name="RatingId"
                                    [ngModel]="record().ratingId"
                                    (ngModelChange)="updateField('ratingId', $event)"
                                    required>
                                    <option [ngValue]="undefined"></option>
                                    @for (rating of successionRatings(); track rating.id) {
                                        <option [ngValue]="rating.id">{{ rating.nameEn }}</option>
                                    }
                                </select>
                                <validation-messages [formCtrl]="ratingIdInput" />
                            </div>
                            <div class="col-md-6 mb-5">
                                <label class="form-label required" for="EmpPerformanceHistory_NineBoxRatingId">{{ 'NineBoxRatingId' | localize }}</label>
                                <select
                                    id="EmpPerformanceHistory_NineBoxRatingId"
                                    #nineBoxRatingIdInput="ngModel"
                                    class="form-select"
                                    name="NineBoxRatingId"
                                    [ngModel]="record().nineBoxRatingId"
                                    (ngModelChange)="updateField('nineBoxRatingId', $event)"
                                    required>
                                    <option [ngValue]="undefined"></option>
                                    @for (rating of nineBoxRatings(); track rating.id) {
                                        <option [ngValue]="rating.id">{{ rating.nameEn }}</option>
                                    }
                                </select>
                                <validation-messages [formCtrl]="nineBoxRatingIdInput" />
                            </div>
                        </div>
                    </div>
                    <div class="modal-footer">
                        <button [disabled]="saving()" type="button" class="btn btn-light-primary fw-bold" (click)="close()">
                            {{ 'Cancel' | localize }}
                        </button>
                        <button
                            type="submit"
                            class="btn btn-primary fw-bold"
                            [disabled]="!recordForm.form.valid"
                            [buttonBusy]="saving()"
                            [busyText]="l('SavingWithThreeDot')">
                            <i class="fa fa-save"></i>
                            <span>{{ 'Save' | localize }}</span>
                        </button>
                    </div>
                </form>
            }
        </div>
    </div>
</div>
