<div
    appBsModal
    #createOrEditModal="bs-modal"
    (onShown)="onShown()"
    class="modal fade"
    tabindex="-1"
    role="dialog"
    aria-hidden="true"
    [config]="{ backdrop: 'static', keyboard: !saving() }">
    <div class="modal-dialog modal-lg">
        <div class="modal-content">
            @if (active()) {
                <form #recordForm="ngForm" novalidate (ngSubmit)="save()" autocomplete="off">
                    <div class="modal-header">
                        <h4 class="modal-title">
                            @if (record().id) {
                                <span>{{ 'Edit' | localize }}</span>
                            } @else {
                                <span>{{ 'CreateNew' | localize }}</span>
                            }
                        </h4>
                        <button type="button" class="btn-close" (click)="close()" [disabled]="saving()"></button>
                    </div>
                    <div class="modal-body">
                        <div class="mb-5">
                            <label class="form-label required" for="EmployeeSeparation_SubmissionDate">{{ 'SubmissionDate' | localize }}</label>
                            <input
                                id="EmployeeSeparation_SubmissionDate"
                                #submissionDateInput="ngModel"
                                class="form-control"
                                type="date"
                                name="SubmissionDate"
                                [ngModel]="record().submissionDate?.toISODate()"
                                (ngModelChange)="updateSubmissionDate($event)"
                                required />
                            <validation-messages [formCtrl]="submissionDateInput" />
                        </div>
                        <div class="mb-5">
                            <label class="form-label required" for="EmployeeSeparation_LastDayInService">{{ 'LastDayInService' | localize }}</label>
                            <input
                                id="EmployeeSeparation_LastDayInService"
                                #lastDayInServiceInput="ngModel"
                                class="form-control"
                                type="date"
                                name="LastDayInService"
                                [ngModel]="record().lastDayInService?.toISODate()"
                                (ngModelChange)="updateLastDayInService($event)"
                                required />
                            <validation-messages [formCtrl]="lastDayInServiceInput" />
                        </div>
                        <div class="mb-5">
                            <label class="form-label required" for="EmployeeSeparation_NoticePeriodDays">{{ 'NoticePeriodDays' | localize }}</label>
                            <input
                                id="EmployeeSeparation_NoticePeriodDays"
                                #noticePeriodDaysInput="ngModel"
                                class="form-control"
                                type="number"
                                name="NoticePeriodDays"
                                [ngModel]="record().noticePeriodDays"
                                (ngModelChange)="updateField('noticePeriodDays', $event)"
                                required />
                            <validation-messages [formCtrl]="noticePeriodDaysInput" />
                        </div>
                        <div class="mb-5">
                            <label class="form-label required" for="EmployeeSeparation_PlannedLastDayInService">{{ 'PlannedLastDayInService' | localize }}</label>
                            <input
                                id="EmployeeSeparation_PlannedLastDayInService"
                                #plannedLastDayInServiceInput="ngModel"
                                class="form-control"
                                type="date"
                                name="PlannedLastDayInService"
                                [ngModel]="record().plannedLastDayInService?.toISODate()"
                                (ngModelChange)="updatePlannedLastDayInService($event)"
                                required />
                            <validation-messages [formCtrl]="plannedLastDayInServiceInput" />
                        </div>
                        <div class="mb-5">
                            <label class="form-label required" for="EmployeeSeparation_SeparationType">{{ 'SeparationType' | localize }}</label>
                            <select
                                id="EmployeeSeparation_SeparationType"
                                #separationTypeInput="ngModel"
                                class="form-select"
                                name="SeparationType"
                                [ngModel]="record().separationType"
                                (ngModelChange)="updateField('separationType', $event)"
                                required>
                                <option [ngValue]="undefined"></option>
                                @for (item of separationTypes; track item.value) {
                                    <option [ngValue]="item.value">{{ item.name }}</option>
                                }
                            </select>
                            <validation-messages [formCtrl]="separationTypeInput" />
                        </div>
                        <div class="mb-5">
                            <label class="form-label required" for="EmployeeSeparation_SeparationReasonId">{{ 'SeparationReason' | localize }}</label>
                            <select
                                id="EmployeeSeparation_SeparationReasonId"
                                #separationReasonInput="ngModel"
                                class="form-select"
                                name="SeparationReasonId"
                                [ngModel]="record().separationReasonId"
                                (ngModelChange)="updateField('separationReasonId', $event)"
                                required>
                                <option [ngValue]="undefined"></option>
                                @for (item of separationReasons(); track item.id) {
                                    <option [ngValue]="item.id">{{ item.nameEn }}</option>
                                }
                            </select>
                            <validation-messages [formCtrl]="separationReasonInput" />
                        </div>
                        <div class="mb-5">
                            <label class="form-label" for="EmployeeSeparation_RevokeDate">{{ 'RevokeDate' | localize }}</label>
                            <input
                                id="EmployeeSeparation_RevokeDate"
                                class="form-control"
                                type="date"
                                name="RevokeDate"
                                [ngModel]="record().revokeDate?.toISODate()"
                                (ngModelChange)="updateRevokeDate($event)" />
                        </div>
                        <div class="mb-5">
                            <label class="form-label" for="EmployeeSeparation_RevokeComments">{{ 'RevokeComments' | localize }}</label>
                            <textarea
                                id="EmployeeSeparation_RevokeComments"
                                class="form-control"
                                rows="2"
                                maxlength="500"
                                name="RevokeComments"
                                [ngModel]="record().revokeComments"
                                (ngModelChange)="updateField('revokeComments', $event)"></textarea>
                        </div>

                        <!-- Legacy "OnHold Information". Saving with a from-date and a ticked flag writes the On Hold record payroll reads. -->
                        <h5 class="mb-4">{{ 'OnHoldInformation' | localize }}</h5>
                        <div class="row">
                            <div class="col-md-4 mb-5">
                                <label class="form-label" for="EmployeeSeparation_OnHoldFromDate">{{ 'OnHoldFromDate' | localize }}</label>
                                <input
                                    id="EmployeeSeparation_OnHoldFromDate"
                                    class="form-control"
                                    type="date"
                                    name="OnHoldFromDate"
                                    [ngModel]="record().onHoldFromDate?.toISODate()"
                                    (ngModelChange)="updateOnHoldFromDate($event)" />
                            </div>
                            <div class="col-md-4 mb-5">
                                <label class="form-label" for="EmployeeSeparation_OnHoldTillDate">{{ 'OnHoldTillDate' | localize }}</label>
                                <input
                                    id="EmployeeSeparation_OnHoldTillDate"
                                    class="form-control"
                                    type="date"
                                    name="OnHoldTillDate"
                                    [ngModel]="record().onHoldTillDate?.toISODate()"
                                    (ngModelChange)="updateOnHoldTillDate($event)" />
                            </div>
                            <div class="col-md-4 mb-5">
                                <label class="form-label" for="EmployeeSeparation_BankTransfer">{{ 'BankTransfer' | localize }}</label>
                                <select
                                    id="EmployeeSeparation_BankTransfer"
                                    class="form-select"
                                    name="BankTransfer"
                                    [ngModel]="record().bankTransfer"
                                    (ngModelChange)="updateField('bankTransfer', $event)">
                                    @for (option of bankTransferOptions; track option.value) {
                                        <option [ngValue]="option.value">{{ option.name | localize }}</option>
                                    }
                                </select>
                            </div>
                        </div>
                        <div class="row">
                            @for (flag of holdFlags; track flag.field) {
                                <div class="col-md-3 mb-5 d-flex align-items-end">
                                    <div class="form-check">
                                        <input
                                            [id]="'EmployeeSeparation_' + flag.field"
                                            class="form-check-input"
                                            type="checkbox"
                                            [name]="flag.field"
                                            [ngModel]="flagValue(flag.field)"
                                            (ngModelChange)="updateField(flag.field, $event)" />
                                        <label class="form-check-label" [attr.for]="'EmployeeSeparation_' + flag.field">{{ flag.label | localize }}</label>
                                    </div>
                                </div>
                            }
                        </div>

                        <div class="mb-5">
                            <label class="form-label" for="EmployeeSeparation_Comments">{{ 'Comments' | localize }}</label>
                            <textarea
                                id="EmployeeSeparation_Comments"
                                class="form-control"
                                rows="3"
                                maxlength="500"
                                name="Comments"
                                [ngModel]="record().comments"
                                (ngModelChange)="updateField('comments', $event)"></textarea>
                        </div>
                        @if (record().id) {
                            <div class="mb-5">
                                <app-attachments entityType="EmployeeSeparation" [entityId]="record().id" />
                            </div>
                        }
                    </div>
                    <div class="modal-footer">
                        <button [disabled]="saving()" type="button" class="btn btn-light-primary fw-bold" (click)="close()">
                            {{ 'Cancel' | localize }}
                        </button>
                        <button
                            type="submit"
                            class="btn btn-primary fw-bold"
                            [disabled]="!recordForm.form.valid"
                            [buttonBusy]="saving()"
                            [busyText]="l('SavingWithThreeDot')">
                            <i class="fa fa-save"></i>
                            <span>{{ 'Save' | localize }}</span>
                        </button>
                    </div>
                </form>
            }
        </div>
    </div>
</div>
