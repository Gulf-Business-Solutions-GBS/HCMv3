<div
    appBsModal
    #createOrEditModal="bs-modal"
    (onShown)="onShown()"
    class="modal fade"
    tabindex="-1"
    role="dialog"
    aria-labelledby="createOrEditModal"
    aria-hidden="true"
    [config]="{ backdrop: 'static', keyboard: !saving() }">
    <div class="modal-dialog modal-xl">
        <div class="modal-content">
            @if (active()) {
                <form #recordForm="ngForm" novalidate (ngSubmit)="save()" autocomplete="off">
                    <div class="modal-header">
                        <h4 class="modal-title">
                            @if (record().id) {
                                <span>{{ 'Edit' | localize }}</span>
                            } @else {
                                <span>{{ 'CreateNew' | localize }}</span>
                            }
                        </h4>
                        <button type="button" class="btn-close" (click)="close()" [disabled]="saving()"></button>
                    </div>
                    <div class="modal-body">
                        <div class="row">
                            <div class="col-md-4 mb-5">
                                <label class="form-label required" for="EmployeeAbsence_StartDate">{{ 'StartDate' | localize }}</label>
                                <input
                                    id="EmployeeAbsence_StartDate"
                                    #startDateInput="ngModel"
                                    type="date"
                                    class="form-control"
                                    name="StartDate"
                                    [ngModel]="record().startDate?.toISODate()"
                                    (ngModelChange)="updateDateField('startDate', $event)"
                                    required />
                                <validation-messages [formCtrl]="startDateInput" />
                            </div>
                            <div class="col-md-4 mb-5">
                                <label class="form-label required" for="EmployeeAbsence_EndDate">{{ 'EndDate' | localize }}</label>
                                <input
                                    id="EmployeeAbsence_EndDate"
                                    #endDateInput="ngModel"
                                    type="date"
                                    class="form-control"
                                    name="EndDate"
                                    [ngModel]="record().endDate?.toISODate()"
                                    (ngModelChange)="updateDateField('endDate', $event)"
                                    required />
                                <validation-messages [formCtrl]="endDateInput" />
                            </div>
                            <div class="col-md-4 mb-5">
                                <label class="form-label required" for="EmployeeAbsence_AbsenceTypeId">{{ 'AbsenceTypeId' | localize }}</label>
                                <select
                                    id="EmployeeAbsence_AbsenceTypeId"
                                    #absenceTypeIdInput="ngModel"
                                    class="form-select"
                                    name="AbsenceTypeId"
                                    [ngModel]="record().absenceTypeId"
                                    (ngModelChange)="updateField('absenceTypeId', $event)"
                                    required>
                                    <option [ngValue]="undefined"></option>
                                    @for (type of absenceTypes(); track type.id) {
                                        <option [ngValue]="type.id">{{ type.nameEn }}</option>
                                    }
                                </select>
                                <validation-messages [formCtrl]="absenceTypeIdInput" />
                            </div>
                        </div>
                        <div class="row">
                            <div class="col-md-4 mb-5">
                                <label class="form-label" for="EmployeeAbsence_HalfdayType">{{ 'HalfdayType' | localize }}</label>
                                <select
                                    id="EmployeeAbsence_HalfdayType"
                                    class="form-select"
                                    name="HalfdayType"
                                    [ngModel]="record().halfdayType"
                                    (ngModelChange)="updateField('halfdayType', $event)">
                                    @for (option of halfdayTypes; track option.value) {
                                        <option [ngValue]="option.value">{{ option.name | localize }}</option>
                                    }
                                </select>
                            </div>
                            <div class="col-md-4 mb-5">
                                <label class="form-label" for="EmployeeAbsence_StartTime">{{ 'StartTime' | localize }}</label>
                                <input
                                    id="EmployeeAbsence_StartTime"
                                    class="form-control"
                                    type="time"
                                    step="1"
                                    name="StartTime"
                                    [ngModel]="getTimeValue('startTime')"
                                    (ngModelChange)="updateTimeField('startTime', $event)" />
                            </div>
                            <div class="col-md-4 mb-5">
                                <label class="form-label" for="EmployeeAbsence_EndTime">{{ 'EndTime' | localize }}</label>
                                <input
                                    id="EmployeeAbsence_EndTime"
                                    class="form-control"
                                    type="time"
                                    step="1"
                                    name="EndTime"
                                    [ngModel]="getTimeValue('endTime')"
                                    (ngModelChange)="updateTimeField('endTime', $event)" />
                            </div>
                        </div>
                        <div class="row">
                            <div class="col-md-4 mb-5">
                                <label class="form-label" for="EmployeeAbsence_LeavePaymentType">{{ 'LeavePaymentType' | localize }}</label>
                                <select
                                    id="EmployeeAbsence_LeavePaymentType"
                                    class="form-select"
                                    name="LeavePaymentType"
                                    [ngModel]="record().leavePaymentType"
                                    (ngModelChange)="updateField('leavePaymentType', $event)">
                                    @for (option of leavePaymentTypes; track option.value) {
                                        <option [ngValue]="option.value">{{ option.name | localize }}</option>
                                    }
                                </select>
                            </div>
                            <div class="col-md-4 mb-5">
                                <label class="form-label" for="EmployeeAbsence_PaymentDate">{{ 'PaymentDate' | localize }}</label>
                                <input
                                    id="EmployeeAbsence_PaymentDate"
                                    class="form-control"
                                    type="date"
                                    name="PaymentDate"
                                    [ngModel]="record().paymentDate?.toISODate()"
                                    (ngModelChange)="updateDateField('paymentDate', $event)" />
                            </div>
                            <div class="col-md-4 mb-5">
                                <label class="form-label" for="EmployeeAbsence_ReturnDate">{{ 'ReturnDate' | localize }}</label>
                                <input
                                    id="EmployeeAbsence_ReturnDate"
                                    class="form-control"
                                    type="date"
                                    name="ReturnDate"
                                    [ngModel]="record().returnDate?.toISODate()"
                                    (ngModelChange)="updateDateField('returnDate', $event)" />
                            </div>
                        </div>
                        <div class="row">
                            <div class="col-md-3 mb-5 d-flex align-items-end">
                                <div class="form-check">
                                    <input
                                        id="EmployeeAbsence_IsTravelling"
                                        class="form-check-input"
                                        type="checkbox"
                                        name="IsTravelling"
                                        [ngModel]="record().isTravelling"
                                        (ngModelChange)="updateField('isTravelling', $event)" />
                                    <label class="form-check-label" for="EmployeeAbsence_IsTravelling">{{ 'IsTravelling' | localize }}</label>
                                </div>
                            </div>
                            <div class="col-md-3 mb-5 d-flex align-items-end">
                                <div class="form-check">
                                    <input
                                        id="EmployeeAbsence_AdvanceLeavePaid"
                                        class="form-check-input"
                                        type="checkbox"
                                        name="AdvanceLeavePaid"
                                        [ngModel]="record().advanceLeavePaid"
                                        (ngModelChange)="updateField('advanceLeavePaid', $event)" />
                                    <label class="form-check-label" for="EmployeeAbsence_AdvanceLeavePaid">{{ 'AdvanceLeavePaid' | localize }}</label>
                                </div>
                            </div>
                            <div class="col-md-3 mb-5 d-flex align-items-end">
                                <div class="form-check">
                                    <input
                                        id="EmployeeAbsence_IsReturned"
                                        class="form-check-input"
                                        type="checkbox"
                                        name="IsReturned"
                                        [ngModel]="record().isReturned"
                                        (ngModelChange)="updateField('isReturned', $event)" />
                                    <label class="form-check-label" for="EmployeeAbsence_IsReturned">{{ 'IsReturned' | localize }}</label>
                                </div>
                            </div>
                        </div>
                        <div class="row">
                            <div class="col-md-4 mb-5">
                                <label class="form-label" for="EmployeeAbsence_ExtAbsenceTypeId">{{ 'ExtAbsenceTypeId' | localize }}</label>
                                <select
                                    id="EmployeeAbsence_ExtAbsenceTypeId"
                                    class="form-select"
                                    name="ExtAbsenceTypeId"
                                    [ngModel]="record().extAbsenceTypeId"
                                    (ngModelChange)="updateField('extAbsenceTypeId', $event)">
                                    <option [ngValue]="undefined"></option>
                                    @for (type of absenceTypes(); track type.id) {
                                        <option [ngValue]="type.id">{{ type.nameEn }}</option>
                                    }
                                </select>
                            </div>
                            <div class="col-md-4 mb-5">
                                <label class="form-label" for="EmployeeAbsence_ExtStartDate">{{ 'ExtStartDate' | localize }}</label>
                                <input
                                    id="EmployeeAbsence_ExtStartDate"
                                    class="form-control"
                                    type="date"
                                    name="ExtStartDate"
                                    [ngModel]="record().extStartDate?.toISODate()"
                                    (ngModelChange)="updateDateField('extStartDate', $event)" />
                            </div>
                            <div class="col-md-4 mb-5">
                                <label class="form-label" for="EmployeeAbsence_ExtEndDate">{{ 'ExtEndDate' | localize }}</label>
                                <input
                                    id="EmployeeAbsence_ExtEndDate"
                                    class="form-control"
                                    type="date"
                                    name="ExtEndDate"
                                    [ngModel]="record().extEndDate?.toISODate()"
                                    (ngModelChange)="updateDateField('extEndDate', $event)" />
                            </div>
                        </div>
                        <div class="mb-5">
                            <label class="form-label" for="EmployeeAbsence_Comments">{{ 'Comments' | localize }}</label>
                            <textarea
                                id="EmployeeAbsence_Comments"
                                class="form-control"
                                rows="3"
                                name="Comments"
                                [ngModel]="record().comments"
                                (ngModelChange)="updateField('comments', $event)"></textarea>
                        </div>
                        @if (record().id) {
                            <div class="mb-5">
                                <app-attachments entityType="EmployeeAbsence" [entityId]="record().id" />
                            </div>
                        }
                        <!-- Shows itself only if this user may bypass approval AND the catalog allows it for
                             this type; otherwise the form is exactly as it was. -->
                        <record-directly-check
                            requestType="EmployeeAbsence"
                            [value]="record().recordDirectly"
                            (valueChange)="updateField('recordDirectly', $event)" />
                    </div>
                    <div class="modal-footer">
                        <button [disabled]="saving()" type="button" class="btn btn-light-primary fw-bold" (click)="close()">
                            {{ 'Cancel' | localize }}
                        </button>
                        <button
                            type="submit"
                            class="btn btn-primary fw-bold"
                            [disabled]="!recordForm.form.valid"
                            [buttonBusy]="saving()"
                            [busyText]="l('SavingWithThreeDot')">
                            <i class="fa fa-save"></i>
                            <span>{{ 'Save' | localize }}</span>
                        </button>
                    </div>
                </form>
            }
        </div>
    </div>
</div>
