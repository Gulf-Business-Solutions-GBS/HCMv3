<div
    appBsModal
    #createOrEditModal="bs-modal"
    (onShown)="onShown()"
    class="modal fade"
    tabindex="-1"
    role="dialog"
    aria-hidden="true"
    [config]="{ backdrop: 'static', keyboard: !saving() }">
    <div class="modal-dialog modal-lg">
        <div class="modal-content">
            @if (active()) {
                <form #recordForm="ngForm" novalidate (ngSubmit)="save()" autocomplete="off">
                    <div class="modal-header">
                        <h4 class="modal-title">
                            @if (record().id) {
                                <span>{{ 'Edit' | localize }}</span>
                            } @else {
                                <span>{{ 'CreateNew' | localize }}</span>
                            }
                        </h4>
                        <button type="button" class="btn-close" (click)="close()" [disabled]="saving()"></button>
                    </div>
                    <div class="modal-body">
                        <div class="mb-5">
                            <label class="form-label required" for="EmployeeDottedLineManager_ManagerId">{{ 'Manager' | localize }}</label>
                            <select
                                id="EmployeeDottedLineManager_ManagerId"
                                #managerInput="ngModel"
                                class="form-select"
                                name="ManagerId"
                                [ngModel]="record().managerId"
                                (ngModelChange)="updateField('managerId', $event)"
                                required>
                                <option [ngValue]="undefined"></option>
                                @for (item of employees(); track item.id) {
                                    <option [ngValue]="item.id">{{ item.fullNameEn }} ({{ item.code }})</option>
                                }
                            </select>
                            <validation-messages [formCtrl]="managerInput" />
                        </div>
                        <div class="mb-5">
                            <label class="form-label required" for="EmployeeDottedLineManager_StartDate">{{ 'StartDate' | localize }}</label>
                            <input
                                id="EmployeeDottedLineManager_StartDate"
                                #startDateInput="ngModel"
                                class="form-control"
                                type="date"
                                name="StartDate"
                                [ngModel]="record().startDate?.toISODate()"
                                (ngModelChange)="updateDateField('startDate', $event)"
                                required />
                            <validation-messages [formCtrl]="startDateInput" />
                        </div>
                        <div class="mb-5">
                            <label class="form-label required" for="EmployeeDottedLineManager_EndDate">{{ 'EndDate' | localize }}</label>
                            <input
                                id="EmployeeDottedLineManager_EndDate"
                                #endDateInput="ngModel"
                                class="form-control"
                                type="date"
                                name="EndDate"
                                [ngModel]="record().endDate?.toISODate()"
                                (ngModelChange)="updateDateField('endDate', $event)"
                                required />
                            <validation-messages [formCtrl]="endDateInput" />
                        </div>
                    </div>
                    <div class="modal-footer">
                        <button [disabled]="saving()" type="button" class="btn btn-light-primary fw-bold" (click)="close()">
                            {{ 'Cancel' | localize }}
                        </button>
                        <button
                            type="submit"
                            class="btn btn-primary fw-bold"
                            [disabled]="!recordForm.form.valid"
                            [buttonBusy]="saving()"
                            [busyText]="l('SavingWithThreeDot')">
                            <i class="fa fa-save"></i>
                            <span>{{ 'Save' | localize }}</span>
                        </button>
                    </div>
                </form>
            }
        </div>
    </div>
</div>
