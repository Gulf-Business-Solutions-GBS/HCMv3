<div
    appBsModal
    #createOrEditModal="bs-modal"
    (onShown)="onShown()"
    class="modal fade"
    tabindex="-1"
    role="dialog"
    aria-hidden="true"
    [config]="{ backdrop: 'static', keyboard: !saving() }">
    <div class="modal-dialog modal-lg">
        <div class="modal-content">
            @if (active()) {
                <form #recordForm="ngForm" novalidate (ngSubmit)="save()" autocomplete="off">
                    <div class="modal-header">
                        <h4 class="modal-title">
                            @if (record().id) {
                                <span>{{ 'Edit' | localize }}</span>
                            } @else {
                                <span>{{ 'CreateNew' | localize }}</span>
                            }
                        </h4>
                        <button type="button" class="btn-close" (click)="close()" [disabled]="saving()"></button>
                    </div>
                    <div class="modal-body">
                        <div class="mb-5">
                            <label class="form-label required" for="EmployeeRejoin_RejoinDate">{{ 'RejoinDate' | localize }}</label>
                            <input
                                id="EmployeeRejoin_RejoinDate"
                                #rejoinDateInput="ngModel"
                                class="form-control"
                                type="date"
                                name="RejoinDate"
                                [ngModel]="record().rejoinDate?.toISODate()"
                                (ngModelChange)="updateRejoinDate($event)"
                                required />
                            <validation-messages [formCtrl]="rejoinDateInput" />
                        </div>
                        <div class="mb-5">
                            <label class="form-label" for="EmployeeRejoin_Comments">{{ 'Comments' | localize }}</label>
                            <textarea
                                id="EmployeeRejoin_Comments"
                                class="form-control"
                                rows="3"
                                name="Comments"
                                [ngModel]="record().comments"
                                (ngModelChange)="updateField('comments', $event)"></textarea>
                        </div>
                        <div class="form-check mb-3">
                            <input
                                id="EmployeeRejoin_CarryForwardLeaveBalance"
                                class="form-check-input"
                                type="checkbox"
                                name="CarryForwardLeaveBalance"
                                [ngModel]="record().carryForwardLeaveBalance"
                                (ngModelChange)="updateField('carryForwardLeaveBalance', $event)" />
                            <label class="form-check-label" for="EmployeeRejoin_CarryForwardLeaveBalance">
                                {{ 'CarryForwardLeaveBalance' | localize }}
                            </label>
                        </div>
                        <div class="form-check mb-3">
                            <input
                                id="EmployeeRejoin_CarryForwardTicketBalance"
                                class="form-check-input"
                                type="checkbox"
                                name="CarryForwardTicketBalance"
                                [ngModel]="record().carryForwardTicketBalance"
                                (ngModelChange)="updateField('carryForwardTicketBalance', $event)" />
                            <label class="form-check-label" for="EmployeeRejoin_CarryForwardTicketBalance">
                                {{ 'CarryForwardTicketBalance' | localize }}
                            </label>
                        </div>
                        <div class="form-check mb-3">
                            <input
                                id="EmployeeRejoin_CarryForwardIndemnityBalance"
                                class="form-check-input"
                                type="checkbox"
                                name="CarryForwardIndemnityBalance"
                                [ngModel]="record().carryForwardIndemnityBalance"
                                (ngModelChange)="updateField('carryForwardIndemnityBalance', $event)" />
                            <label class="form-check-label" for="EmployeeRejoin_CarryForwardIndemnityBalance">
                                {{ 'CarryForwardIndemnityBalance' | localize }}
                            </label>
                        </div>
                        <div class="form-check mb-3">
                            <input
                                id="EmployeeRejoin_CarryForwardLoanBalance"
                                class="form-check-input"
                                type="checkbox"
                                name="CarryForwardLoanBalance"
                                [ngModel]="record().carryForwardLoanBalance"
                                (ngModelChange)="updateField('carryForwardLoanBalance', $event)" />
                            <label class="form-check-label" for="EmployeeRejoin_CarryForwardLoanBalance">
                                {{ 'CarryForwardLoanBalance' | localize }}
                            </label>
                        </div>
                    </div>
                    <div class="modal-footer">
                        <button [disabled]="saving()" type="button" class="btn btn-light-primary fw-bold" (click)="close()">
                            {{ 'Cancel' | localize }}
                        </button>
                        <button
                            type="submit"
                            class="btn btn-primary fw-bold"
                            [disabled]="!recordForm.form.valid"
                            [buttonBusy]="saving()"
                            [busyText]="l('SavingWithThreeDot')">
                            <i class="fa fa-save"></i>
                            <span>{{ 'Save' | localize }}</span>
                        </button>
                    </div>
                </form>
            }
        </div>
    </div>
</div>
