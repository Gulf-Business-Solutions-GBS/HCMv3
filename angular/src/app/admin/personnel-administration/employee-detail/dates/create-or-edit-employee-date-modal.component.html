<div
    appBsModal
    #createOrEditModal="bs-modal"
    (onShown)="onShown()"
    class="modal fade"
    tabindex="-1"
    role="dialog"
    aria-hidden="true"
    [config]="{ backdrop: 'static', keyboard: !saving() }">
    <div class="modal-dialog modal-lg">
        <div class="modal-content">
            @if (active()) {
                <form #recordForm="ngForm" novalidate (ngSubmit)="save()" autocomplete="off">
                    <div class="modal-header">
                        <h4 class="modal-title">
                            @if (record().id) {
                                <span>{{ 'Edit' | localize }}</span>
                            } @else {
                                <span>{{ 'CreateNew' | localize }}</span>
                            }
                        </h4>
                        <button type="button" class="btn-close" (click)="close()" [disabled]="saving()"></button>
                    </div>
                    <div class="modal-body">
                        <div class="mb-5">
                            <label class="form-label" for="EmployeeDate_DateTypeId">{{ 'DateType' | localize }}</label>
                            <select
                                id="EmployeeDate_DateTypeId"
                                class="form-select"
                                name="DateTypeId"
                                [ngModel]="record().dateTypeId"
                                (ngModelChange)="updateField('dateTypeId', $event)">
                                <option [ngValue]="undefined"></option>
                                @for (item of dateTypes(); track item.id) {
                                    <option [ngValue]="item.id">{{ item.nameEn }}</option>
                                }
                            </select>
                        </div>
                        <div class="mb-5">
                            <label class="form-label required" for="EmployeeDate_DateData">{{ 'DateData' | localize }}</label>
                            <input
                                id="EmployeeDate_DateData"
                                #dateDataInput="ngModel"
                                class="form-control"
                                type="date"
                                name="DateData"
                                [ngModel]="record().dateData?.toISODate()"
                                (ngModelChange)="updateDateData($event)"
                                required />
                            <validation-messages [formCtrl]="dateDataInput" />
                        </div>
                        <div class="mb-5">
                            <label class="form-label" for="EmployeeDate_DayData">{{ 'DayData' | localize }}</label>
                            <input
                                id="EmployeeDate_DayData"
                                class="form-control"
                                type="number"
                                name="DayData"
                                [ngModel]="record().dayData"
                                (ngModelChange)="updateField('dayData', $event)" />
                        </div>
                    </div>
                    <div class="modal-footer">
                        <button [disabled]="saving()" type="button" class="btn btn-light-primary fw-bold" (click)="close()">
                            {{ 'Cancel' | localize }}
                        </button>
                        <button
                            type="submit"
                            class="btn btn-primary fw-bold"
                            [disabled]="!recordForm.form.valid"
                            [buttonBusy]="saving()"
                            [busyText]="l('SavingWithThreeDot')">
                            <i class="fa fa-save"></i>
                            <span>{{ 'Save' | localize }}</span>
                        </button>
                    </div>
                </form>
            }
        </div>
    </div>
</div>
