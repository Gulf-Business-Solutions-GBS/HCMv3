<div
    appBsModal
    #createOrEditModal="bs-modal"
    (onShown)="onShown()"
    class="modal fade"
    tabindex="-1"
    role="dialog"
    aria-hidden="true"
    [config]="{ backdrop: 'static', keyboard: !saving() }">
    <div class="modal-dialog modal-lg">
        <div class="modal-content">
            @if (active()) {
                <form #recordForm="ngForm" novalidate (ngSubmit)="save()" autocomplete="off">
                    <div class="modal-header">
                        <h4 class="modal-title">
                            @if (record().id) {
                                <span>{{ 'Edit' | localize }}</span>
                            } @else {
                                <span>{{ 'CreateNew' | localize }}</span>
                            }
                        </h4>
                        <button type="button" class="btn-close" (click)="close()" [disabled]="saving()"></button>
                    </div>
                    <div class="modal-body">
                        <div class="mb-5">
                            <label class="form-label required" for="EmployeeOrgAssignment_StartDate">{{ 'StartDate' | localize }}</label>
                            <input
                                id="EmployeeOrgAssignment_StartDate"
                                #startDateInput="ngModel"
                                class="form-control"
                                type="date"
                                name="StartDate"
                                [ngModel]="record().startDate?.toISODate()"
                                (ngModelChange)="updateStartDate($event)"
                                required />
                            <validation-messages [formCtrl]="startDateInput" />
                        </div>
                        <div class="mb-5">
                            <label class="form-label" for="EmployeeOrgAssignment_PositionId">{{ 'Position' | localize }}</label>
                            <select
                                id="EmployeeOrgAssignment_PositionId"
                                class="form-select"
                                name="PositionId"
                                [ngModel]="record().positionId"
                                (ngModelChange)="updatePosition($event)">
                                <option [ngValue]="undefined"></option>
                                @for (item of positions(); track item.id) {
                                    <option [ngValue]="item.id">{{ item.code }} - {{ item.nameEn }}</option>
                                }
                            </select>
                        </div>
                        <div class="mb-5">
                            <label class="form-label" for="EmployeeOrgAssignment_JobTitleId">{{ 'JobTitle' | localize }}</label>
                            <select
                                id="EmployeeOrgAssignment_JobTitleId"
                                class="form-select"
                                name="JobTitleId"
                                [ngModel]="record().jobTitleId"
                                (ngModelChange)="updateField('jobTitleId', $event)">
                                <option [ngValue]="undefined"></option>
                                @for (item of jobTitles(); track item.id) {
                                    <option [ngValue]="item.id">{{ item.nameEn }}</option>
                                }
                            </select>
                        </div>
                        <div class="mb-5">
                            <label class="form-label" for="EmployeeOrgAssignment_CostCenterId">{{ 'CostCenter' | localize }}</label>
                            <select
                                id="EmployeeOrgAssignment_CostCenterId"
                                class="form-select"
                                name="CostCenterId"
                                [ngModel]="record().costCenterId"
                                (ngModelChange)="updateField('costCenterId', $event)">
                                <option [ngValue]="undefined"></option>
                                @for (item of costCenters(); track item.id) {
                                    <option [ngValue]="item.id">{{ item.nameEn }}</option>
                                }
                            </select>
                        </div>
                        <div class="mb-5">
                            <label class="form-label" for="EmployeeOrgAssignment_WorkLocationId">{{ 'WorkLocation' | localize }}</label>
                            <select
                                id="EmployeeOrgAssignment_WorkLocationId"
                                class="form-select"
                                name="WorkLocationId"
                                [ngModel]="record().workLocationId"
                                (ngModelChange)="updateField('workLocationId', $event)">
                                <option [ngValue]="undefined"></option>
                                @for (item of workLocations(); track item.id) {
                                    <option [ngValue]="item.id">{{ item.nameEn }}</option>
                                }
                            </select>
                        </div>
                        <div class="mb-5">
                            <label class="form-label" for="EmployeeOrgAssignment_PostingGroupId">{{ 'PostingGroup' | localize }}</label>
                            <select
                                id="EmployeeOrgAssignment_PostingGroupId"
                                class="form-select"
                                name="PostingGroupId"
                                [ngModel]="record().postingGroupId"
                                (ngModelChange)="updateField('postingGroupId', $event)">
                                <option [ngValue]="undefined"></option>
                                @for (item of postingGroups(); track item.id) {
                                    <option [ngValue]="item.id">{{ item.nameEn }}</option>
                                }
                            </select>
                        </div>
                        <div class="mb-5">
                            <label class="form-label" for="EmployeeOrgAssignment_BudgetingGroupId">{{ 'BudgetingGroup' | localize }}</label>
                            <select
                                id="EmployeeOrgAssignment_BudgetingGroupId"
                                class="form-select"
                                name="BudgetingGroupId"
                                [ngModel]="record().budgetingGroupId"
                                (ngModelChange)="updateField('budgetingGroupId', $event)">
                                <option [ngValue]="undefined"></option>
                                @for (item of budgetingGroups(); track item.id) {
                                    <option [ngValue]="item.id">{{ item.nameEn }}</option>
                                }
                            </select>
                        </div>
                        <div class="mb-5">
                            <label class="form-label" for="EmployeeOrgAssignment_OrganizationUnitId">{{ 'OrganizationUnit' | localize }}</label>
                            <select
                                id="EmployeeOrgAssignment_OrganizationUnitId"
                                class="form-select"
                                name="OrganizationUnitId"
                                [ngModel]="record().organizationUnitId"
                                (ngModelChange)="updateField('organizationUnitId', $event)">
                                <option [ngValue]="undefined"></option>
                                @for (item of organizationUnits(); track item.id) {
                                    <option [ngValue]="item.id">{{ item.displayName }}</option>
                                }
                            </select>
                        </div>
                        <div class="mb-5">
                            <label class="form-label" for="EmployeeOrgAssignment_EmployeeGroupId">{{ 'EmployeeGroup' | localize }}</label>
                            <select
                                id="EmployeeOrgAssignment_EmployeeGroupId"
                                class="form-select"
                                name="EmployeeGroupId"
                                [ngModel]="record().employeeGroupId"
                                (ngModelChange)="updateEmployeeGroup($event)">
                                <option [ngValue]="undefined"></option>
                                @for (item of employeeGroups(); track item.id) {
                                    <option [ngValue]="item.id">{{ item.nameEn }}</option>
                                }
                            </select>
                        </div>
                        <div class="mb-5">
                            <label class="form-label" for="EmployeeOrgAssignment_EmployeeSubGroupId">{{ 'EmployeeSubGroup' | localize }}</label>
                            <select
                                id="EmployeeOrgAssignment_EmployeeSubGroupId"
                                class="form-select"
                                name="EmployeeSubGroupId"
                                [ngModel]="record().employeeSubGroupId"
                                (ngModelChange)="updateField('employeeSubGroupId', $event)">
                                <option [ngValue]="undefined"></option>
                                @for (item of filteredEmployeeSubGroups(); track item.id) {
                                    <option [ngValue]="item.id">{{ item.nameEn }}</option>
                                }
                            </select>
                        </div>
                        <div class="mb-5">
                            <label class="form-label" for="EmployeeOrgAssignment_PayrollAreaId">{{ 'PayrollArea' | localize }}</label>
                            <select
                                id="EmployeeOrgAssignment_PayrollAreaId"
                                class="form-select"
                                name="PayrollAreaId"
                                [ngModel]="record().payrollAreaId"
                                (ngModelChange)="updateField('payrollAreaId', $event)">
                                <option [ngValue]="undefined"></option>
                                @for (item of payrollAreas(); track item.id) {
                                    <option [ngValue]="item.id">{{ item.name }}</option>
                                }
                            </select>
                        </div>
                        <div class="mb-5">
                            <label class="form-label" for="EmployeeOrgAssignment_WorkflowGroupId">{{ 'WorkflowGroup' | localize }}</label>
                            <select
                                id="EmployeeOrgAssignment_WorkflowGroupId"
                                class="form-select"
                                name="WorkflowGroupId"
                                [ngModel]="record().workflowGroupId"
                                (ngModelChange)="updateField('workflowGroupId', $event)">
                                <option [ngValue]="undefined"></option>
                                @for (item of workflowGroups(); track item.id) {
                                    <option [ngValue]="item.id">{{ item.nameEn }}</option>
                                }
                            </select>
                        </div>
                    </div>
                    <div class="modal-footer">
                        <button [disabled]="saving()" type="button" class="btn btn-light-primary fw-bold" (click)="close()">
                            {{ 'Cancel' | localize }}
                        </button>
                        <button
                            type="submit"
                            class="btn btn-primary fw-bold"
                            [disabled]="!recordForm.form.valid"
                            [buttonBusy]="saving()"
                            [busyText]="l('SavingWithThreeDot')">
                            <i class="fa fa-save"></i>
                            <span>{{ 'Save' | localize }}</span>
                        </button>
                    </div>
                </form>
            }
        </div>
    </div>
</div>
