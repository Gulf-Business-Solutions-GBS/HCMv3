<div
    appBsModal
    #createOrEditModal="bs-modal"
    (onShown)="onShown()"
    class="modal fade"
    tabindex="-1"
    role="dialog"
    aria-labelledby="createOrEditModal"
    aria-hidden="true"
    [config]="{ backdrop: 'static', keyboard: !saving() }">
    <div class="modal-dialog modal-lg">
        <div class="modal-content">
            @if (active()) {
                <form #recordForm="ngForm" novalidate (ngSubmit)="save()" autocomplete="off">
                    <div class="modal-header">
                        <h4 class="modal-title">
                            @if (record().id) {
                                <span>{{ 'Edit' | localize }}</span>
                            } @else {
                                <span>{{ 'CreateNew' | localize }}</span>
                            }
                        </h4>
                        <button type="button" class="btn-close" (click)="close()" [disabled]="saving()"></button>
                    </div>
                    <div class="modal-body">
                        <div class="row">
                            <div class="col-md-6 mb-5">
                                <label class="form-label required" for="EmployeeNonPayrollTran_WageTypeId">{{ 'WageTypeId' | localize }}</label>
                                <select
                                    id="EmployeeNonPayrollTran_WageTypeId"
                                    #wageTypeIdInput="ngModel"
                                    class="form-select"
                                    name="WageTypeId"
                                    [ngModel]="record().wageTypeId"
                                    (ngModelChange)="updateField('wageTypeId', $event)"
                                    required>
                                    <option [ngValue]="undefined"></option>
                                    @for (type of wageTypes(); track type.id) {
                                        <option [ngValue]="type.id">{{ type.nameEn }}</option>
                                    }
                                </select>
                                <validation-messages [formCtrl]="wageTypeIdInput" />
                            </div>
                            <div class="col-md-6 mb-5">
                                <label class="form-label required" for="EmployeeNonPayrollTran_PaymentDate">{{ 'PaymentDate' | localize }}</label>
                                <input
                                    id="EmployeeNonPayrollTran_PaymentDate"
                                    #paymentDateInput="ngModel"
                                    type="date"
                                    class="form-control"
                                    name="PaymentDate"
                                    [ngModel]="record().paymentDate?.toISODate()"
                                    (ngModelChange)="updateDateField('paymentDate', $event)"
                                    required />
                                <validation-messages [formCtrl]="paymentDateInput" />
                            </div>
                        </div>
                        <div class="row">
                            <div class="col-md-6 mb-5">
                                <label class="form-label required" for="EmployeeNonPayrollTran_Amount">{{ 'Amount' | localize }}</label>
                                <input
                                    id="EmployeeNonPayrollTran_Amount"
                                    #amountInput="ngModel"
                                    class="form-control"
                                    type="number"
                                    step="0.01"
                                    name="Amount"
                                    [ngModel]="record().amount"
                                    (ngModelChange)="updateNumberField('amount', $event)"
                                    required />
                                <validation-messages [formCtrl]="amountInput" />
                            </div>
                            <div class="col-md-6 mb-5">
                                <label class="form-label" for="EmployeeNonPayrollTran_CurrencyId">{{ 'CurrencyId' | localize }}</label>
                                <select
                                    id="EmployeeNonPayrollTran_CurrencyId"
                                    class="form-select"
                                    name="CurrencyId"
                                    [ngModel]="record().currencyId"
                                    (ngModelChange)="updateField('currencyId', $event)">
                                    <option [ngValue]="undefined"></option>
                                    @for (currency of currencies(); track currency.id) {
                                        <option [ngValue]="currency.id">{{ currency.nameEn }}</option>
                                    }
                                </select>
                            </div>
                        </div>
                        <div class="row">
                            <div class="col-md-6 mb-5">
                                <label class="form-label" for="EmployeeNonPayrollTran_PayableBy">{{ 'PayableBy' | localize }}</label>
                                <input
                                    id="EmployeeNonPayrollTran_PayableBy"
                                    type="text"
                                    class="form-control"
                                    name="PayableBy"
                                    [ngModel]="record().payableBy"
                                    (ngModelChange)="updateField('payableBy', $event)" />
                            </div>
                            <div class="col-md-6 mb-5">
                                <label class="form-label" for="EmployeeNonPayrollTran_PaymentMethod">{{ 'PaymentMethod' | localize }}</label>
                                <input
                                    id="EmployeeNonPayrollTran_PaymentMethod"
                                    type="text"
                                    class="form-control"
                                    name="PaymentMethod"
                                    [ngModel]="record().paymentMethod"
                                    (ngModelChange)="updateField('paymentMethod', $event)" />
                            </div>
                        </div>
                        <div class="row">
                            <div class="col-md-6 mb-5 form-check form-switch">
                                <input
                                    id="EmployeeNonPayrollTran_IsLocked"
                                    class="form-check-input"
                                    type="checkbox"
                                    name="IsLocked"
                                    [ngModel]="record().isLocked"
                                    (ngModelChange)="updateField('isLocked', $event)" />
                                <label class="form-check-label" for="EmployeeNonPayrollTran_IsLocked">{{ 'IsLocked' | localize }}</label>
                            </div>
                            <div class="col-md-6 mb-5 form-check form-switch">
                                <input
                                    id="EmployeeNonPayrollTran_NotificationSent"
                                    class="form-check-input"
                                    type="checkbox"
                                    name="NotificationSent"
                                    [ngModel]="record().notificationSent"
                                    (ngModelChange)="updateField('notificationSent', $event)" />
                                <label class="form-check-label" for="EmployeeNonPayrollTran_NotificationSent">{{ 'NotificationSent' | localize }}</label>
                            </div>
                        </div>
                        <div class="mb-5">
                            <label class="form-label" for="EmployeeNonPayrollTran_Comments">{{ 'Comments' | localize }}</label>
                            <textarea
                                id="EmployeeNonPayrollTran_Comments"
                                class="form-control"
                                rows="3"
                                name="Comments"
                                [ngModel]="record().comments"
                                (ngModelChange)="updateField('comments', $event)"></textarea>
                        </div>
                    </div>
                    <div class="modal-footer">
                        <button [disabled]="saving()" type="button" class="btn btn-light-primary fw-bold" (click)="close()">
                            {{ 'Cancel' | localize }}
                        </button>
                        <button
                            type="submit"
                            class="btn btn-primary fw-bold"
                            [disabled]="!recordForm.form.valid"
                            [buttonBusy]="saving()"
                            [busyText]="l('SavingWithThreeDot')">
                            <i class="fa fa-save"></i>
                            <span>{{ 'Save' | localize }}</span>
                        </button>
                    </div>
                </form>
            }
        </div>
    </div>
</div>
