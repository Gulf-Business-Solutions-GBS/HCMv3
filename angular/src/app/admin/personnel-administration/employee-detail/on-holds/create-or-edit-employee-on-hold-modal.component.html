<div
    appBsModal
    #createOrEditModal="bs-modal"
    (onShown)="onShown()"
    class="modal fade"
    tabindex="-1"
    role="dialog"
    aria-labelledby="createOrEditModal"
    aria-hidden="true"
    [config]="{ backdrop: 'static', keyboard: !saving() }">
    <div class="modal-dialog modal-xl">
        <div class="modal-content">
            @if (active()) {
                <form #recordForm="ngForm" novalidate (ngSubmit)="save()" autocomplete="off">
                    <div class="modal-header">
                        <h4 class="modal-title">
                            @if (record().id) {
                                <span>{{ 'Edit' | localize }}</span>
                            } @else {
                                <span>{{ 'CreateNew' | localize }}</span>
                            }
                        </h4>
                        <button type="button" class="btn-close" (click)="close()" [disabled]="saving()"></button>
                    </div>
                    <div class="modal-body">
                        <div class="row">
                            <div class="col-md-3 mb-5">
                                <label class="form-label required" for="EmployeeOnHold_StartDate">{{ 'StartDate' | localize }}</label>
                                <input
                                    id="EmployeeOnHold_StartDate"
                                    #startDateInput="ngModel"
                                    type="date"
                                    class="form-control"
                                    name="StartDate"
                                    [ngModel]="record().startDate?.toISODate()"
                                    (ngModelChange)="updateDateField('startDate', $event)"
                                    required />
                                <validation-messages [formCtrl]="startDateInput" />
                            </div>
                            <div class="col-md-3 mb-5">
                                <label class="form-label required" for="EmployeeOnHold_EndDate">{{ 'EndDate' | localize }}</label>
                                <input
                                    id="EmployeeOnHold_EndDate"
                                    #endDateInput="ngModel"
                                    type="date"
                                    class="form-control"
                                    name="EndDate"
                                    [ngModel]="record().endDate?.toISODate()"
                                    (ngModelChange)="updateDateField('endDate', $event)"
                                    required />
                                <validation-messages [formCtrl]="endDateInput" />
                            </div>
                            <div class="col-md-3 mb-5">
                                <label class="form-label" for="EmployeeOnHold_BankTransfer">{{ 'BankTransfer' | localize }}</label>
                                <select
                                    id="EmployeeOnHold_BankTransfer"
                                    class="form-select"
                                    name="BankTransfer"
                                    [ngModel]="record().bankTransfer"
                                    (ngModelChange)="updateField('bankTransfer', $event)">
                                    @for (option of bankTransferOptions; track option.value) {
                                        <option [ngValue]="option.value">{{ option.name | localize }}</option>
                                    }
                                </select>
                            </div>
                            <div class="col-md-3 mb-5">
                                <label class="form-label" for="EmployeeOnHold_EmployeeActionId">{{ 'EmployeeActionId' | localize }}</label>
                                <select
                                    id="EmployeeOnHold_EmployeeActionId"
                                    class="form-select"
                                    name="EmployeeActionId"
                                    [ngModel]="record().employeeActionId"
                                    (ngModelChange)="updateField('employeeActionId', $event)">
                                    <option [ngValue]="undefined"></option>
                                    @for (action of employeeActions(); track action.id) {
                                        <option [ngValue]="action.id">{{ action.personalActionName }} - {{ action.startDate | luxonFormat: 'yyyy-MM-dd' }}</option>
                                    }
                                </select>
                            </div>
                        </div>
                        <div class="row">
                            <div class="col-md-3 mb-5 d-flex align-items-end">
                                <div class="form-check">
                                    <input
                                        id="EmployeeOnHold_OnHold"
                                        class="form-check-input"
                                        type="checkbox"
                                        name="OnHold"
                                        [ngModel]="record().onHold"
                                        (ngModelChange)="updateField('onHold', $event)" />
                                    <label class="form-check-label" for="EmployeeOnHold_OnHold">{{ 'OnHold' | localize }}</label>
                                </div>
                            </div>
                            <div class="col-md-3 mb-5 d-flex align-items-end">
                                <div class="form-check">
                                    <input
                                        id="EmployeeOnHold_OnHoldBasicPay"
                                        class="form-check-input"
                                        type="checkbox"
                                        name="OnHoldBasicPay"
                                        [ngModel]="record().onHoldBasicPay"
                                        (ngModelChange)="updateField('onHoldBasicPay', $event)" />
                                    <label class="form-check-label" for="EmployeeOnHold_OnHoldBasicPay">{{ 'OnHoldBasicPay' | localize }}</label>
                                </div>
                            </div>
                            <div class="col-md-3 mb-5 d-flex align-items-end">
                                <div class="form-check">
                                    <input
                                        id="EmployeeOnHold_OnHoldLeavePay"
                                        class="form-check-input"
                                        type="checkbox"
                                        name="OnHoldLeavePay"
                                        [ngModel]="record().onHoldLeavePay"
                                        (ngModelChange)="updateField('onHoldLeavePay', $event)" />
                                    <label class="form-check-label" for="EmployeeOnHold_OnHoldLeavePay">{{ 'OnHoldLeavePay' | localize }}</label>
                                </div>
                            </div>
                            <div class="col-md-3 mb-5 d-flex align-items-end">
                                <div class="form-check">
                                    <input
                                        id="EmployeeOnHold_OnHoldIndemnityPay"
                                        class="form-check-input"
                                        type="checkbox"
                                        name="OnHoldIndemnityPay"
                                        [ngModel]="record().onHoldIndemnityPay"
                                        (ngModelChange)="updateField('onHoldIndemnityPay', $event)" />
                                    <label class="form-check-label" for="EmployeeOnHold_OnHoldIndemnityPay">{{ 'OnHoldIndemnityPay' | localize }}</label>
                                </div>
                            </div>
                        </div>
                        <div class="row">
                            <div class="col-md-3 mb-5 d-flex align-items-end">
                                <div class="form-check">
                                    <input
                                        id="EmployeeOnHold_OnHoldAirTicketPay"
                                        class="form-check-input"
                                        type="checkbox"
                                        name="OnHoldAirTicketPay"
                                        [ngModel]="record().onHoldAirTicketPay"
                                        (ngModelChange)="updateField('onHoldAirTicketPay', $event)" />
                                    <label class="form-check-label" for="EmployeeOnHold_OnHoldAirTicketPay">{{ 'OnHoldAirTicketPay' | localize }}</label>
                                </div>
                            </div>
                            <div class="col-md-3 mb-5 d-flex align-items-end">
                                <div class="form-check">
                                    <input
                                        id="EmployeeOnHold_OnHoldLoanDeduction"
                                        class="form-check-input"
                                        type="checkbox"
                                        name="OnHoldLoanDeduction"
                                        [ngModel]="record().onHoldLoanDeduction"
                                        (ngModelChange)="updateField('onHoldLoanDeduction', $event)" />
                                    <label class="form-check-label" for="EmployeeOnHold_OnHoldLoanDeduction">{{ 'OnHoldLoanDeduction' | localize }}</label>
                                </div>
                            </div>
                            <div class="col-md-3 mb-5 d-flex align-items-end">
                                <div class="form-check">
                                    <input
                                        id="EmployeeOnHold_OnHoldAllEarnings"
                                        class="form-check-input"
                                        type="checkbox"
                                        name="OnHoldAllEarnings"
                                        [ngModel]="record().onHoldAllEarnings"
                                        (ngModelChange)="updateField('onHoldAllEarnings', $event)" />
                                    <label class="form-check-label" for="EmployeeOnHold_OnHoldAllEarnings">{{ 'OnHoldAllEarnings' | localize }}</label>
                                </div>
                            </div>
                            <div class="col-md-3 mb-5 d-flex align-items-end">
                                <div class="form-check">
                                    <input
                                        id="EmployeeOnHold_OnHoldAllDeductions"
                                        class="form-check-input"
                                        type="checkbox"
                                        name="OnHoldAllDeductions"
                                        [ngModel]="record().onHoldAllDeductions"
                                        (ngModelChange)="updateField('onHoldAllDeductions', $event)" />
                                    <label class="form-check-label" for="EmployeeOnHold_OnHoldAllDeductions">{{ 'OnHoldAllDeductions' | localize }}</label>
                                </div>
                            </div>
                        </div>
                        <div class="mb-5">
                            <label class="form-label" for="EmployeeOnHold_Comments">{{ 'Comments' | localize }}</label>
                            <textarea
                                id="EmployeeOnHold_Comments"
                                class="form-control"
                                rows="3"
                                name="Comments"
                                [ngModel]="record().comments"
                                (ngModelChange)="updateField('comments', $event)"></textarea>
                        </div>
                    </div>
                    <div class="modal-footer">
                        <button [disabled]="saving()" type="button" class="btn btn-light-primary fw-bold" (click)="close()">
                            {{ 'Cancel' | localize }}
                        </button>
                        <button
                            type="submit"
                            class="btn btn-primary fw-bold"
                            [disabled]="!recordForm.form.valid"
                            [buttonBusy]="saving()"
                            [busyText]="l('SavingWithThreeDot')">
                            <i class="fa fa-save"></i>
                            <span>{{ 'Save' | localize }}</span>
                        </button>
                    </div>
                </form>
            }
        </div>
    </div>
</div>
