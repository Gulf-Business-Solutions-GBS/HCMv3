<fieldset class="employee-basic-pay-form" [disabled]="readOnly()">
    <div class="row">
        <div class="col-md-6 mb-5">
            <label class="form-label required" for="EmployeeBasicPay_StartDate">{{ 'StartDate' | localize }}</label>
            <input
                id="EmployeeBasicPay_StartDate"
                #startDateInput="ngModel"
                type="date"
                class="form-control"
                name="StartDate"
                [ngModel]="record().startDate?.toISODate()"
                (ngModelChange)="updateDateField('startDate', $event)"
                required />
            <validation-messages [formCtrl]="startDateInput" />
        </div>
        <div class="col-md-6 mb-5">
            <label class="form-label required" for="EmployeeBasicPay_EndDate">{{ 'EndDate' | localize }}</label>
            <input
                id="EmployeeBasicPay_EndDate"
                #endDateInput="ngModel"
                type="date"
                class="form-control"
                name="EndDate"
                [ngModel]="record().endDate?.toISODate()"
                (ngModelChange)="updateDateField('endDate', $event)"
                required />
            <validation-messages [formCtrl]="endDateInput" />
        </div>
    </div>
    <div class="row">
        <div class="col-md-4 mb-5">
            <label class="form-label" for="EmployeeBasicPay_PayType">{{ 'PayType' | localize }}</label>
            <select
                id="EmployeeBasicPay_PayType"
                class="form-select"
                name="PayType"
                [ngModel]="record().payType"
                (ngModelChange)="updateField('payType', $event)">
                @for (option of payTypes; track option.value) {
                    <option [ngValue]="option.value">{{ option.name | localize }}</option>
                }
            </select>
        </div>
        <div class="col-md-4 mb-5">
            <label class="form-label" for="EmployeeBasicPay_PayInterval">{{ 'PayInterval' | localize }}</label>
            <select
                id="EmployeeBasicPay_PayInterval"
                class="form-select"
                name="PayInterval"
                [ngModel]="record().payInterval"
                (ngModelChange)="updateField('payInterval', $event)">
                @for (option of payIntervals; track option.value) {
                    <option [ngValue]="option.value">{{ option.name | localize }}</option>
                }
            </select>
        </div>
        <div class="col-md-4 mb-5">
            <label class="form-label" for="EmployeeBasicPay_EmployeeActionId">{{ 'EmployeeActionId' | localize }}</label>
            <select
                id="EmployeeBasicPay_EmployeeActionId"
                class="form-select"
                name="EmployeeActionId"
                [ngModel]="record().employeeActionId"
                (ngModelChange)="updateField('employeeActionId', $event)">
                <option [ngValue]="undefined"></option>
                @for (action of employeeActions(); track action.id) {
                    <option [ngValue]="action.id">{{ action.personalActionName }} - {{ action.startDate | luxonFormat: 'yyyy-MM-dd' }}</option>
                }
            </select>
        </div>
    </div>
</fieldset>
