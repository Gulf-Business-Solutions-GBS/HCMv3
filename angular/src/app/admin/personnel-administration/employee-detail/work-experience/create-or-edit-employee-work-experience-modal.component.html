<div
    appBsModal
    #createOrEditModal="bs-modal"
    (onShown)="onShown()"
    class="modal fade"
    tabindex="-1"
    role="dialog"
    aria-hidden="true"
    [config]="{ backdrop: 'static', keyboard: !saving() }">
    <div class="modal-dialog modal-lg">
        <div class="modal-content">
            @if (active()) {
                <form #recordForm="ngForm" novalidate (ngSubmit)="save()" autocomplete="off">
                    <div class="modal-header">
                        <h4 class="modal-title">
                            @if (record().id) {
                                <span>{{ 'Edit' | localize }}</span>
                            } @else {
                                <span>{{ 'CreateNew' | localize }}</span>
                            }
                        </h4>
                        <button type="button" class="btn-close" (click)="close()" [disabled]="saving()"></button>
                    </div>
                    <div class="modal-body">
                        <div class="mb-5">
                            <label class="form-label required" for="EmployeeWorkExperience_Company">{{ 'Company' | localize }}</label>
                            <input
                                id="EmployeeWorkExperience_Company"
                                #companyInput="ngModel"
                                class="form-control"
                                type="text"
                                name="Company"
                                [ngModel]="record().company"
                                (ngModelChange)="updateField('company', $event)"
                                required />
                            <validation-messages [formCtrl]="companyInput" />
                        </div>
                        <div class="mb-5">
                            <label class="form-label" for="EmployeeWorkExperience_Position">{{ 'Position' | localize }}</label>
                            <input
                                id="EmployeeWorkExperience_Position"
                                class="form-control"
                                type="text"
                                name="Position"
                                [ngModel]="record().position"
                                (ngModelChange)="updateField('position', $event)" />
                        </div>
                        <div class="mb-5">
                            <label class="form-label" for="EmployeeWorkExperience_Location">{{ 'Location' | localize }}</label>
                            <input
                                id="EmployeeWorkExperience_Location"
                                class="form-control"
                                type="text"
                                name="Location"
                                [ngModel]="record().location"
                                (ngModelChange)="updateField('location', $event)" />
                        </div>
                        <div class="mb-5">
                            <label class="form-label" for="EmployeeWorkExperience_ReasonForLeaving">{{ 'ReasonForLeaving' | localize }}</label>
                            <textarea
                                id="EmployeeWorkExperience_ReasonForLeaving"
                                class="form-control"
                                name="ReasonForLeaving"
                                rows="2"
                                [ngModel]="record().reasonForLeaving"
                                (ngModelChange)="updateField('reasonForLeaving', $event)"></textarea>
                        </div>
                        <div class="mb-5">
                            <label class="form-label required" for="EmployeeWorkExperience_StartDate">{{ 'StartDate' | localize }}</label>
                            <input
                                id="EmployeeWorkExperience_StartDate"
                                #startDateInput="ngModel"
                                class="form-control"
                                type="date"
                                name="StartDate"
                                [ngModel]="record().startDate?.toISODate()"
                                (ngModelChange)="updateDateField('startDate', $event)"
                                required />
                            <validation-messages [formCtrl]="startDateInput" />
                        </div>
                        <div class="mb-5">
                            <label class="form-label required" for="EmployeeWorkExperience_EndDate">{{ 'EndDate' | localize }}</label>
                            <input
                                id="EmployeeWorkExperience_EndDate"
                                #endDateInput="ngModel"
                                class="form-control"
                                type="date"
                                name="EndDate"
                                [ngModel]="record().endDate?.toISODate()"
                                (ngModelChange)="updateDateField('endDate', $event)"
                                required />
                            <validation-messages [formCtrl]="endDateInput" />
                        </div>
                    </div>
                    <div class="modal-footer">
                        <button [disabled]="saving()" type="button" class="btn btn-light-primary fw-bold" (click)="close()">
                            {{ 'Cancel' | localize }}
                        </button>
                        <button
                            type="submit"
                            class="btn btn-primary fw-bold"
                            [disabled]="!recordForm.form.valid"
                            [buttonBusy]="saving()"
                            [busyText]="l('SavingWithThreeDot')">
                            <i class="fa fa-save"></i>
                            <span>{{ 'Save' | localize }}</span>
                        </button>
                    </div>
                </form>
            }
        </div>
    </div>
</div>
