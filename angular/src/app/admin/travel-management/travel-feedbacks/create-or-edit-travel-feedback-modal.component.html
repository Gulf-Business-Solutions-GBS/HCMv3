<div
    appBsModal
    #createOrEditModal="bs-modal"
    (onShown)="onShown()"
    class="modal fade"
    tabindex="-1"
    role="dialog"
    aria-hidden="true"
    [config]="{ backdrop: 'static', keyboard: !saving() }">
    <div class="modal-dialog modal-lg">
        <div class="modal-content">
            @if (active()) {
                <form #recordForm="ngForm" novalidate (ngSubmit)="save()" autocomplete="off">
                    <div class="modal-header">
                        <h4 class="modal-title">
                            @if (record().id) {
                                <span>{{ 'EditItem' | localize }}: {{ 'TravelFeedbacks' | localize }}</span>
                            } @else {
                                <span>{{ 'CreateNewItem' | localize }}: {{ 'TravelFeedbacks' | localize }}</span>
                            }
                        </h4>
                        <button type="button" class="btn-close" (click)="close()" [disabled]="saving()"></button>
                    </div>
                    <div class="modal-body">
                        <div class="row">
                            <div class="col-md-6 mb-5">
                                <label class="form-label required" for="TravelFeedback_EmployeeId">{{ 'Employee' | localize }}</label>
                                <select
                                    id="TravelFeedback_EmployeeId"
                                    #employeeIdInput="ngModel"
                                    class="form-select"
                                    name="EmployeeId"
                                    [ngModel]="record().employeeId"
                                    (ngModelChange)="updateField('employeeId', $event)"
                                    required>
                                    <option [ngValue]="undefined"></option>
                                    @for (employee of employees(); track employee.id) {
                                        <option [ngValue]="employee.id">{{ employeeLabel(employee) }}</option>
                                    }
                                </select>
                                <validation-messages [formCtrl]="employeeIdInput" />
                            </div>
                            <div class="col-md-6 mb-5">
                                <label class="form-label" for="TravelFeedback_TravelId">{{ 'Travel' | localize }}</label>
                                <select
                                    id="TravelFeedback_TravelId"
                                    class="form-select"
                                    name="TravelId"
                                    [ngModel]="record().travelId"
                                    (ngModelChange)="updateField('travelId', $event)">
                                    <option [ngValue]="undefined"></option>
                                    @for (item of travels(); track item.id) {
                                        <option [ngValue]="item.id">{{ item.code }} - {{ item.employeeFullNameEn }}</option>
                                    }
                                </select>
                            </div>
                        </div>
                        <div class="row">
                            <div class="col-md-6 mb-5">
                                <label class="form-label required" for="TravelFeedback_ClaimDate">{{ 'ClaimDate' | localize }}</label>
                                <input
                                    id="TravelFeedback_ClaimDate"
                                    #claimDateInput="ngModel"
                                    type="date"
                                    class="form-control"
                                    name="ClaimDate"
                                    [ngModel]="record().claimDate?.toISODate()"
                                    (ngModelChange)="updateDateField('claimDate', $event)"
                                    required />
                                <validation-messages [formCtrl]="claimDateInput" />
                            </div>
                            <div class="col-md-6 mb-5">
                                <label class="form-label required" for="TravelFeedback_ClaimAmount">{{ 'ClaimAmount' | localize }}</label>
                                <input
                                    id="TravelFeedback_ClaimAmount"
                                    #claimAmountInput="ngModel"
                                    class="form-control"
                                    type="number"
                                    step="0.01"
                                    min="0"
                                    name="ClaimAmount"
                                    [ngModel]="record().claimAmount"
                                    (ngModelChange)="updateField('claimAmount', $event)"
                                    required />
                                <validation-messages [formCtrl]="claimAmountInput" />
                            </div>
                        </div>
                        <div class="row">
                            <div class="col-md-12 mb-5">
                                <label class="form-label" for="TravelFeedback_Comments">{{ 'Comments' | localize }}</label>
                                <textarea
                                    id="TravelFeedback_Comments"
                                    class="form-control"
                                    rows="3"
                                    name="Comments"
                                    maxlength="1000"
                                    [ngModel]="record().comments"
                                    (ngModelChange)="updateField('comments', $event)"></textarea>
                            </div>
                        </div>
                        <!-- Shows itself only if this user may bypass approval AND the catalog allows it for
                             this type; otherwise the form is exactly as it was. -->
                        <record-directly-check
                            requestType="TravelFeedback"
                            [value]="record().recordDirectly"
                            (valueChange)="updateField('recordDirectly', $event)" />
                    </div>
                    <div class="modal-footer">
                        <button [disabled]="saving()" type="button" class="btn btn-light-primary fw-bold" (click)="close()">
                            {{ 'Cancel' | localize }}
                        </button>
                        <button
                            type="submit"
                            class="btn btn-primary fw-bold"
                            [disabled]="!recordForm.form.valid"
                            [buttonBusy]="saving()"
                            [busyText]="l('SavingWithThreeDot')">
                            <i class="fa fa-save"></i>
                            <span>{{ 'Save' | localize }}</span>
                        </button>
                    </div>
                </form>
            }
        </div>
    </div>
</div>
