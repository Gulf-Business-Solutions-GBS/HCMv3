<div
    appBsModal
    #createOrEditModal="bs-modal"
    (onShown)="onShown()"
    class="modal fade"
    tabindex="-1"
    role="dialog"
    aria-hidden="true"
    [config]="{ backdrop: 'static', keyboard: !saving() }">
    <div class="modal-dialog modal-lg">
        <div class="modal-content">
            @if (active()) {
                <form #recordForm="ngForm" novalidate (ngSubmit)="save()" autocomplete="off">
                    <div class="modal-header">
                        <h4 class="modal-title">
                            @if (record().id) {
                                <span>{{ 'EditItem' | localize }}: {{ 'Travels' | localize }}</span>
                            } @else {
                                <span>{{ 'CreateNewItem' | localize }}: {{ 'Travels' | localize }}</span>
                            }
                        </h4>
                        <button type="button" class="btn-close" (click)="close()" [disabled]="saving()"></button>
                    </div>
                    <div class="modal-body">
                        <div class="row">
                            <div class="col-md-6 mb-5">
                                <label class="form-label required" for="Travel_EmployeeId">{{ 'Employee' | localize }}</label>
                                <select
                                    id="Travel_EmployeeId"
                                    #employeeIdInput="ngModel"
                                    class="form-select"
                                    name="EmployeeId"
                                    [ngModel]="record().employeeId"
                                    (ngModelChange)="updateField('employeeId', $event)"
                                    required>
                                    <option [ngValue]="undefined"></option>
                                    @for (employee of employees(); track employee.id) {
                                        <option [ngValue]="employee.id">{{ employeeLabel(employee) }}</option>
                                    }
                                </select>
                                <validation-messages [formCtrl]="employeeIdInput" />
                            </div>
                            <div class="col-md-6 mb-5">
                                <label class="form-label required" for="Travel_TravelTypeId">{{ 'TravelType' | localize }}</label>
                                <select
                                    id="Travel_TravelTypeId"
                                    #travelTypeIdInput="ngModel"
                                    class="form-select"
                                    name="TravelTypeId"
                                    [ngModel]="record().travelTypeId"
                                    (ngModelChange)="updateField('travelTypeId', $event)"
                                    required>
                                    <option [ngValue]="undefined"></option>
                                    @for (item of travelTypes(); track item.id) {
                                        <option [ngValue]="item.id">{{ item.nameEn }}</option>
                                    }
                                </select>
                                <validation-messages [formCtrl]="travelTypeIdInput" />
                            </div>
                        </div>
                        <div class="row">
                            <div class="col-md-6 mb-5">
                                <label class="form-label required" for="Travel_StartDate">{{ 'StartDate' | localize }}</label>
                                <input
                                    id="Travel_StartDate"
                                    #startDateInput="ngModel"
                                    type="date"
                                    class="form-control"
                                    name="StartDate"
                                    [ngModel]="record().startDate?.toISODate()"
                                    (ngModelChange)="updateDateField('startDate', $event)"
                                    required />
                                <validation-messages [formCtrl]="startDateInput" />
                            </div>
                            <div class="col-md-6 mb-5">
                                <label class="form-label required" for="Travel_EndDate">{{ 'EndDate' | localize }}</label>
                                <input
                                    id="Travel_EndDate"
                                    #endDateInput="ngModel"
                                    type="date"
                                    class="form-control"
                                    name="EndDate"
                                    [ngModel]="record().endDate?.toISODate()"
                                    (ngModelChange)="updateDateField('endDate', $event)"
                                    required />
                                <validation-messages [formCtrl]="endDateInput" />
                            </div>
                        </div>
                        @if (record().id) {
                            <!-- Read-only: the server totals it from the legs and their costs, never posted back. -->
                            <div class="row">
                                <div class="col-md-6 mb-5">
                                    <label class="form-label" for="Travel_TotalTravelCost">{{ 'TotalTravelCost' | localize }}</label>
                                    <input
                                        id="Travel_TotalTravelCost"
                                        class="form-control"
                                        type="text"
                                        name="TotalTravelCost"
                                        [value]="totalTravelCost() | number: '1.3-3'"
                                        readonly
                                        disabled />
                                </div>
                            </div>
                        }
                        <div class="row">
                            <div class="col-md-12 mb-5">
                                <label class="form-label" for="Travel_Comments">{{ 'Comments' | localize }}</label>
                                <textarea
                                    id="Travel_Comments"
                                    #commentsInput="ngModel"
                                    class="form-control"
                                    rows="3"
                                    name="Comments"
                                    maxlength="1000"
                                    [ngModel]="record().comments"
                                    (ngModelChange)="updateField('comments', $event)"></textarea>
                                <validation-messages [formCtrl]="commentsInput" />
                            </div>
                        </div>
                    </div>
                    <div class="modal-footer">
                        <button [disabled]="saving()" type="button" class="btn btn-light-primary fw-bold" (click)="close()">
                            {{ 'Cancel' | localize }}
                        </button>
                        <button
                            type="submit"
                            class="btn btn-primary fw-bold"
                            [disabled]="!recordForm.form.valid"
                            [buttonBusy]="saving()"
                            [busyText]="l('SavingWithThreeDot')">
                            <i class="fa fa-save"></i>
                            <span>{{ 'Save' | localize }}</span>
                        </button>
                    </div>
                </form>
            }
        </div>
    </div>
</div>
