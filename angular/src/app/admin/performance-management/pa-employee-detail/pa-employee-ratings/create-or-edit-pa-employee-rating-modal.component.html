<div
    appBsModal
    #createOrEditModal="bs-modal"
    (onShown)="onShown()"
    class="modal fade"
    tabindex="-1"
    [config]="{ backdrop: 'static', keyboard: !saving() }">
    <div class="modal-dialog modal-lg">
        <div class="modal-content">
            @if (active()) {
                <form #recordForm="ngForm" (ngSubmit)="save()">
                    <div class="modal-header">
                        <h4 class="modal-title">
                            {{ (record().id ? 'EditItem' : 'CreateNewItem') | localize }}: {{ 'PAEmployeeRatings' | localize }}
                        </h4>
                        <button type="button" class="btn-close" (click)="close()" [disabled]="saving()"></button>
                    </div>

                    <div class="modal-body">
                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label for="PAEmployeeRating_PAEmployeeReviewerId">{{ 'PAEmployeeReviewer' | localize }}</label>
                                <select
                                    id="PAEmployeeRating_PAEmployeeReviewerId"
                                    class="form-select"
                                    name="PAEmployeeReviewerId"
                                    required
                                    [ngModel]="record().paEmployeeReviewerId"
                                    (ngModelChange)="updateField('paEmployeeReviewerId', $event)">
                                    <option [ngValue]="undefined"></option>
                                    @for (reviewer of paEmployeeReviewers(); track reviewer.id) {
                                        <option [ngValue]="reviewer.id">{{ reviewer.employeeFullNameEn }}</option>
                                    }
                                </select>
                            </div>
                            <div class="col-md-6 mb-3">
                                <label for="PAEmployeeRating_PAEmployeeDetailId">{{ 'PAEmployeeDetail' | localize }}</label>
                                <select
                                    id="PAEmployeeRating_PAEmployeeDetailId"
                                    class="form-select"
                                    name="PAEmployeeDetailId"
                                    required
                                    [ngModel]="record().paEmployeeDetailId"
                                    (ngModelChange)="updateField('paEmployeeDetailId', $event)">
                                    <option [ngValue]="undefined"></option>
                                    @for (detail of paEmployeeDetails(); track detail.id) {
                                        <option [ngValue]="detail.id">{{ detail.kpiInfoName }}</option>
                                    }
                                </select>
                            </div>
                        </div>
                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label for="PAEmployeeRating_Marks">{{ 'Marks' | localize }}</label>
                                <input
                                    id="PAEmployeeRating_Marks"
                                    type="number"
                                    class="form-control"
                                    name="Marks"
                                    required
                                    [ngModel]="record().marks"
                                    (ngModelChange)="updateField('marks', $event)" />
                            </div>
                            <div class="col-md-6 mb-3">
                                <label for="PAEmployeeRating_RatingId">{{ 'Rating' | localize }}</label>
                                <select
                                    id="PAEmployeeRating_RatingId"
                                    class="form-select"
                                    name="RatingId"
                                    [ngModel]="record().ratingId"
                                    (ngModelChange)="updateField('ratingId', $event)">
                                    <option [ngValue]="undefined"></option>
                                    @for (rating of paRatings(); track rating.id) {
                                        <option [ngValue]="rating.id">{{ rating.nameEn }}</option>
                                    }
                                </select>
                            </div>
                        </div>
                        <div class="row">
                            <div class="col-md-12 mb-3">
                                <label for="PAEmployeeRating_Comments">{{ 'Comments' | localize }}</label>
                                <textarea
                                    id="PAEmployeeRating_Comments"
                                    class="form-control"
                                    name="Comments"
                                    rows="3"
                                    [ngModel]="record().comments"
                                    (ngModelChange)="updateField('comments', $event)"></textarea>
                            </div>
                        </div>
                    </div>

                    <div class="modal-footer">
                        <button type="button" class="btn btn-secondary" (click)="close()" [disabled]="saving()">
                            {{ 'Cancel' | localize }}
                        </button>
                        <button type="submit" class="btn btn-primary" [buttonBusy]="saving()" [disabled]="!recordForm.form.valid || saving()">
                            <i class="fa fa-save"></i>
                            {{ 'Save' | localize }}
                        </button>
                    </div>
                </form>
            }
        </div>
    </div>
</div>
