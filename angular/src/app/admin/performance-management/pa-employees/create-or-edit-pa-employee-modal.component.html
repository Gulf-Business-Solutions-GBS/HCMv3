<div
    appBsModal
    #createOrEditModal="bs-modal"
    (onShown)="onShown()"
    class="modal fade"
    tabindex="-1"
    role="dialog"
    aria-labelledby="createOrEditModal"
    aria-hidden="true"
    [config]="{ backdrop: 'static', keyboard: !saving() }">
    <div class="modal-dialog modal-xl">
        <div class="modal-content">
            @if (active()) {
                <form #paEmployeeForm="ngForm" novalidate (ngSubmit)="save()" autocomplete="off">
                    <div class="modal-header">
                        <h4 class="modal-title">
                            @if (paEmployee().id) {
                                <span>{{ 'EditItem' | localize }}: {{ 'PAEmployees' | localize }}</span>
                            } @else {
                                <span>{{ 'CreateNewItem' | localize }}: {{ 'PAEmployees' | localize }}</span>
                            }
                        </h4>
                        <button
                            type="button"
                            class="btn-close"
                            (click)="close()"
                            [attr.aria-label]="l('Close')"
                            [disabled]="saving()"></button>
                    </div>
                    <div class="modal-body">
                        <div class="row">
                            <div class="col-md-4 mb-5">
                                <label class="form-label required" for="PAEmployee_EmployeeId">{{ 'Employee' | localize }}</label>
                                <select
                                    id="PAEmployee_EmployeeId"
                                    #employeeIdInput="ngModel"
                                    class="form-select"
                                    name="EmployeeId"
                                    [ngModel]="paEmployee().employeeId"
                                    (ngModelChange)="updateField('employeeId', $event)"
                                    required>
                                    <option [ngValue]="undefined"></option>
                                    @for (employee of employees(); track employee.id) {
                                        <option [ngValue]="employee.id">{{ employeeLabel(employee) }}</option>
                                    }
                                </select>
                                <validation-messages [formCtrl]="employeeIdInput" />
                            </div>
                            <div class="col-md-4 mb-5">
                                <label class="form-label required" for="PAEmployee_PACycleId">{{ 'PACycle' | localize }}</label>
                                <select
                                    id="PAEmployee_PACycleId"
                                    #paCycleIdInput="ngModel"
                                    class="form-select"
                                    name="PACycleId"
                                    [ngModel]="paEmployee().paCycleId"
                                    (ngModelChange)="updateField('paCycleId', $event)"
                                    required>
                                    <option [ngValue]="undefined"></option>
                                    @for (cycle of paCycles(); track cycle.id) {
                                        <option [ngValue]="cycle.id">{{ cycle.nameEn }}</option>
                                    }
                                </select>
                                <validation-messages [formCtrl]="paCycleIdInput" />
                            </div>
                            <div class="col-md-4 mb-5">
                                <label class="form-label required" for="PAEmployee_FormTypeId">{{ 'FormType' | localize }}</label>
                                <select
                                    id="PAEmployee_FormTypeId"
                                    #formTypeIdInput="ngModel"
                                    class="form-select"
                                    name="FormTypeId"
                                    [ngModel]="paEmployee().formTypeId"
                                    (ngModelChange)="updateField('formTypeId', $event)"
                                    required>
                                    <option [ngValue]="undefined"></option>
                                    @for (formType of formTypes(); track formType.id) {
                                        <option [ngValue]="formType.id">{{ formType.nameEn }}</option>
                                    }
                                </select>
                                <validation-messages [formCtrl]="formTypeIdInput" />
                            </div>
                        </div>
                        <div class="row">
                            <div class="col-md-4 mb-5">
                                <label class="form-label" for="PAEmployee_ProposedIncrement">{{ 'ProposedIncrement' | localize }}</label>
                                <input
                                    id="PAEmployee_ProposedIncrement"
                                    type="text"
                                    class="form-control"
                                    name="ProposedIncrement"
                                    [ngModel]="paEmployee().proposedIncrement"
                                    (ngModelChange)="updateField('proposedIncrement', $event)" />
                            </div>
                            <div class="col-md-4 mb-5">
                                <label class="form-label" for="PAEmployee_ProposedJobTitle">{{ 'ProposedJobTitle' | localize }}</label>
                                <input
                                    id="PAEmployee_ProposedJobTitle"
                                    type="text"
                                    class="form-control"
                                    name="ProposedJobTitle"
                                    [ngModel]="paEmployee().proposedJobTitle"
                                    (ngModelChange)="updateField('proposedJobTitle', $event)" />
                            </div>
                            <div class="col-md-4 mb-5">
                                <label class="form-label" for="PAEmployee_AreaOfImprovement">{{ 'AreaOfImprovement' | localize }}</label>
                                <input
                                    id="PAEmployee_AreaOfImprovement"
                                    type="text"
                                    class="form-control"
                                    name="AreaOfImprovement"
                                    [ngModel]="paEmployee().areaOfImprovement"
                                    (ngModelChange)="updateField('areaOfImprovement', $event)" />
                            </div>
                        </div>
                        <div class="row">
                            <div class="col-md-6 mb-5">
                                <label class="form-label" for="PAEmployee_RequestComments">{{ 'RequestComments' | localize }}</label>
                                <textarea
                                    id="PAEmployee_RequestComments"
                                    class="form-control"
                                    name="RequestComments"
                                    rows="2"
                                    [ngModel]="paEmployee().requestComments"
                                    (ngModelChange)="updateField('requestComments', $event)"></textarea>
                            </div>
                            <div class="col-md-6 mb-5">
                                <label class="form-label" for="PAEmployee_WorkflowComments">{{ 'WorkflowComments' | localize }}</label>
                                <textarea
                                    id="PAEmployee_WorkflowComments"
                                    class="form-control"
                                    name="WorkflowComments"
                                    rows="2"
                                    [ngModel]="paEmployee().workflowComments"
                                    (ngModelChange)="updateField('workflowComments', $event)"></textarea>
                            </div>
                        </div>
                    </div>
                    <div class="modal-footer">
                        <button [disabled]="saving()" type="button" class="btn btn-light-primary fw-bold" (click)="close()">
                            {{ 'Cancel' | localize }}
                        </button>
                        <button
                            type="submit"
                            class="btn btn-primary fw-bold"
                            [disabled]="!paEmployeeForm.form.valid"
                            [buttonBusy]="saving()"
                            [busyText]="l('SavingWithThreeDot')">
                            <i class="fa fa-save"></i>
                            <span>{{ 'Save' | localize }}</span>
                        </button>
                    </div>
                </form>
            }
        </div>
    </div>
</div>
