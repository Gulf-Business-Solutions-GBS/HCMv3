<div
    appBsModal
    #createOrEditModal="bs-modal"
    (onShown)="onShown()"
    class="modal fade"
    tabindex="-1"
    role="dialog"
    aria-labelledby="createOrEditModal"
    aria-hidden="true"
    [config]="{ backdrop: 'static', keyboard: !saving() }">
    <div class="modal-dialog modal-lg">
        <div class="modal-content">
            @if (active()) {
                <form #formTypeForm="ngForm" novalidate (ngSubmit)="save()" autocomplete="off">
                    <div class="modal-header">
                        <h4 class="modal-title">
                            @if (formType().id) {
                                <span>{{ 'EditItem' | localize }}: {{ 'FormTypes' | localize }}</span>
                            } @else {
                                <span>{{ 'CreateNewItem' | localize }}: {{ 'FormTypes' | localize }}</span>
                            }
                        </h4>
                        <button
                            type="button"
                            class="btn-close"
                            (click)="close()"
                            [attr.aria-label]="l('Close')"
                            [disabled]="saving()"></button>
                    </div>
                    <div class="modal-body">
                        <div class="row">
                            <div class="col-md-4 mb-5">
                                <label class="form-label" for="FormType_Code">{{ 'Code' | localize }}</label>
                                <input
                                    id="FormType_Code"
                                    type="text"
                                    class="form-control"
                                    name="Code"
                                    maxlength="64"
                                    [ngModel]="formType().code"
                                    (ngModelChange)="updateField('code', $event)" />
                            </div>
                            <div class="col-md-4 mb-5">
                                <label class="form-label required" for="FormType_NameEn">{{ 'NameEn' | localize }}</label>
                                <input
                                    id="FormType_NameEn"
                                    #nameEnInput="ngModel"
                                    type="text"
                                    class="form-control"
                                    name="NameEn"
                                    maxlength="256"
                                    [ngModel]="formType().nameEn"
                                    (ngModelChange)="updateField('nameEn', $event)"
                                    required />
                                <validation-messages [formCtrl]="nameEnInput" />
                            </div>
                            <div class="col-md-4 mb-5">
                                <label class="form-label required" for="FormType_NameAr">{{ 'NameAr' | localize }}</label>
                                <input
                                    id="FormType_NameAr"
                                    #nameArInput="ngModel"
                                    type="text"
                                    class="form-control"
                                    name="NameAr"
                                    maxlength="256"
                                    [ngModel]="formType().nameAr"
                                    (ngModelChange)="updateField('nameAr', $event)"
                                    required />
                                <validation-messages [formCtrl]="nameArInput" />
                            </div>
                        </div>
                        <div class="row">
                            <div class="col-md-6 mb-5">
                                <label class="form-label required" for="FormType_MinReviewerLimit">{{ 'MinReviewerLimit' | localize }}</label>
                                <input
                                    id="FormType_MinReviewerLimit"
                                    #minReviewerLimitInput="ngModel"
                                    type="number"
                                    class="form-control"
                                    name="MinReviewerLimit"
                                    [ngModel]="formType().minReviewerLimit"
                                    (ngModelChange)="updateField('minReviewerLimit', $event)"
                                    required />
                                <validation-messages [formCtrl]="minReviewerLimitInput" />
                            </div>
                            <div class="col-md-6 mb-5">
                                <label class="form-label required" for="FormType_MaxReviewerLimit">{{ 'MaxReviewerLimit' | localize }}</label>
                                <input
                                    id="FormType_MaxReviewerLimit"
                                    #maxReviewerLimitInput="ngModel"
                                    type="number"
                                    class="form-control"
                                    name="MaxReviewerLimit"
                                    [ngModel]="formType().maxReviewerLimit"
                                    (ngModelChange)="updateField('maxReviewerLimit', $event)"
                                    required />
                                <validation-messages [formCtrl]="maxReviewerLimitInput" />
                            </div>
                        </div>
                    </div>
                    <div class="modal-footer">
                        <button [disabled]="saving()" type="button" class="btn btn-light-primary fw-bold" (click)="close()">
                            {{ 'Cancel' | localize }}
                        </button>
                        <button
                            type="submit"
                            class="btn btn-primary fw-bold"
                            [disabled]="!formTypeForm.form.valid"
                            [buttonBusy]="saving()"
                            [busyText]="l('SavingWithThreeDot')">
                            <i class="fa fa-save"></i>
                            <span>{{ 'Save' | localize }}</span>
                        </button>
                    </div>
                </form>
            }
        </div>
    </div>
</div>
