<div
    appBsModal
    #createOrEditModal="bs-modal"
    (onShown)="onShown()"
    class="modal fade"
    tabindex="-1"
    role="dialog"
    aria-labelledby="createOrEditModal"
    aria-hidden="true"
    [config]="{ backdrop: 'static', keyboard: !saving() }">
    <div class="modal-dialog modal-lg">
        <div class="modal-content">
            @if (active()) {
                <form #paPeerNomineeForm="ngForm" novalidate (ngSubmit)="save()" autocomplete="off">
                    <div class="modal-header">
                        <h4 class="modal-title">
                            @if (paPeerNominee().id) {
                                <span>{{ 'EditItem' | localize }}: {{ 'PAPeerNominees' | localize }}</span>
                            } @else {
                                <span>{{ 'CreateNewItem' | localize }}: {{ 'PAPeerNominees' | localize }}</span>
                            }
                        </h4>
                        <button
                            type="button"
                            class="btn-close"
                            (click)="close()"
                            [attr.aria-label]="l('Close')"
                            [disabled]="saving()"></button>
                    </div>
                    <div class="modal-body">
                        <div class="row">
                            <div class="col-md-4 mb-5">
                                <label class="form-label required" for="PAPeerNominee_PAPeriodId">{{ 'PAPeriod' | localize }}</label>
                                <select
                                    id="PAPeerNominee_PAPeriodId"
                                    #paPeriodIdInput="ngModel"
                                    class="form-select"
                                    name="PAPeriodId"
                                    [ngModel]="paPeerNominee().paPeriodId"
                                    (ngModelChange)="updateField('paPeriodId', $event)"
                                    required>
                                    <option [ngValue]="undefined"></option>
                                    @for (period of paPeriods(); track period.id) {
                                        <option [ngValue]="period.id">{{ period.name }}</option>
                                    }
                                </select>
                                <validation-messages [formCtrl]="paPeriodIdInput" />
                            </div>
                            <div class="col-md-4 mb-5">
                                <label class="form-label required" for="PAPeerNominee_EmployeeId">{{ 'Employee' | localize }}</label>
                                <select
                                    id="PAPeerNominee_EmployeeId"
                                    #employeeIdInput="ngModel"
                                    class="form-select"
                                    name="EmployeeId"
                                    [ngModel]="paPeerNominee().employeeId"
                                    (ngModelChange)="updateField('employeeId', $event)"
                                    required>
                                    <option [ngValue]="undefined"></option>
                                    @for (employee of employees(); track employee.id) {
                                        <option [ngValue]="employee.id">{{ employeeLabel(employee) }}</option>
                                    }
                                </select>
                                <validation-messages [formCtrl]="employeeIdInput" />
                            </div>
                            <div class="col-md-4 mb-5">
                                <label class="form-label required" for="PAPeerNominee_PeerId">{{ 'Peer' | localize }}</label>
                                <select
                                    id="PAPeerNominee_PeerId"
                                    #peerIdInput="ngModel"
                                    class="form-select"
                                    name="PeerId"
                                    [ngModel]="paPeerNominee().peerId"
                                    (ngModelChange)="updateField('peerId', $event)"
                                    required>
                                    <option [ngValue]="undefined"></option>
                                    @for (employee of employees(); track employee.id) {
                                        <option [ngValue]="employee.id">{{ employeeLabel(employee) }}</option>
                                    }
                                </select>
                                <validation-messages [formCtrl]="peerIdInput" />
                            </div>
                        </div>
                        <div class="row">
                            <div class="col-md-6 mb-5">
                                <div class="form-check">
                                    <input
                                        id="PAPeerNominee_Submitted"
                                        type="checkbox"
                                        class="form-check-input"
                                        name="Submitted"
                                        [ngModel]="paPeerNominee().submitted"
                                        (ngModelChange)="updateField('submitted', $event)" />
                                    <label class="form-check-label" for="PAPeerNominee_Submitted">{{ 'Submitted' | localize }}</label>
                                </div>
                            </div>
                        </div>
                    </div>
                    <div class="modal-footer">
                        <button [disabled]="saving()" type="button" class="btn btn-light-primary fw-bold" (click)="close()">
                            {{ 'Cancel' | localize }}
                        </button>
                        <button
                            type="submit"
                            class="btn btn-primary fw-bold"
                            [disabled]="!paPeerNomineeForm.form.valid"
                            [buttonBusy]="saving()"
                            [busyText]="l('SavingWithThreeDot')">
                            <i class="fa fa-save"></i>
                            <span>{{ 'Save' | localize }}</span>
                        </button>
                    </div>
                </form>
            }
        </div>
    </div>
</div>
