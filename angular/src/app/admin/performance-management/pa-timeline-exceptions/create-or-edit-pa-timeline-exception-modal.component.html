<div
    appBsModal
    #createOrEditModal="bs-modal"
    (onShown)="onShown()"
    class="modal fade"
    tabindex="-1"
    role="dialog"
    aria-labelledby="createOrEditModal"
    aria-hidden="true"
    [config]="{ backdrop: 'static', keyboard: !saving() }">
    <div class="modal-dialog modal-lg">
        <div class="modal-content">
            @if (active()) {
                <form #paTimelineExceptionForm="ngForm" novalidate (ngSubmit)="save()" autocomplete="off">
                    <div class="modal-header">
                        <h4 class="modal-title">
                            @if (paTimelineException().id) {
                                <span>{{ 'EditItem' | localize }}: {{ 'PATimelineExceptions' | localize }}</span>
                            } @else {
                                <span>{{ 'CreateNewItem' | localize }}: {{ 'PATimelineExceptions' | localize }}</span>
                            }
                        </h4>
                        <button
                            type="button"
                            class="btn-close"
                            (click)="close()"
                            [attr.aria-label]="l('Close')"
                            [disabled]="saving()"></button>
                    </div>
                    <div class="modal-body">
                        <div class="row">
                            <div class="col-md-6 mb-5">
                                <label class="form-label required" for="PATimelineException_PAPeriodId">{{ 'PAPeriod' | localize }}</label>
                                <select
                                    id="PATimelineException_PAPeriodId"
                                    #paPeriodIdInput="ngModel"
                                    class="form-select"
                                    name="PAPeriodId"
                                    [ngModel]="paTimelineException().paPeriodId"
                                    (ngModelChange)="updateField('paPeriodId', $event)"
                                    required>
                                    <option [ngValue]="undefined"></option>
                                    @for (period of paPeriods(); track period.id) {
                                        <option [ngValue]="period.id">{{ period.name }}</option>
                                    }
                                </select>
                                <validation-messages [formCtrl]="paPeriodIdInput" />
                            </div>
                            <div class="col-md-6 mb-5">
                                <label class="form-label required" for="PATimelineException_EmployeeId">{{ 'Employee' | localize }}</label>
                                <select
                                    id="PATimelineException_EmployeeId"
                                    #employeeIdInput="ngModel"
                                    class="form-select"
                                    name="EmployeeId"
                                    [ngModel]="paTimelineException().employeeId"
                                    (ngModelChange)="updateField('employeeId', $event)"
                                    required>
                                    <option [ngValue]="undefined"></option>
                                    @for (employee of employees(); track employee.id) {
                                        <option [ngValue]="employee.id">{{ employeeLabel(employee) }}</option>
                                    }
                                </select>
                                <validation-messages [formCtrl]="employeeIdInput" />
                            </div>
                        </div>
                        <div class="row">
                            <div class="col-md-6 mb-5">
                                <label class="form-label required" for="PATimelineException_ActivityType">{{ 'ActivityType' | localize }}</label>
                                <select
                                    id="PATimelineException_ActivityType"
                                    #activityTypeInput="ngModel"
                                    class="form-select"
                                    name="ActivityType"
                                    [ngModel]="paTimelineException().activityType"
                                    (ngModelChange)="updateField('activityType', $event)"
                                    required>
                                    @for (item of activityTypes; track item.value) {
                                        <option [ngValue]="item.value">{{ item.key | localize }}</option>
                                    }
                                </select>
                                <validation-messages [formCtrl]="activityTypeInput" />
                            </div>
                            <div class="col-md-6 mb-5">
                                <label class="form-label required" for="PATimelineException_ExtensionDate">{{ 'ExtensionDate' | localize }}</label>
                                <input
                                    id="PATimelineException_ExtensionDate"
                                    #extensionDateInput="ngModel"
                                    type="date"
                                    class="form-control"
                                    name="ExtensionDate"
                                    [ngModel]="paTimelineException().extensionDate?.toISODate()"
                                    (ngModelChange)="updateExtensionDate($event)"
                                    required />
                                <validation-messages [formCtrl]="extensionDateInput" />
                            </div>
                        </div>
                    </div>
                    <div class="modal-footer">
                        <button [disabled]="saving()" type="button" class="btn btn-light-primary fw-bold" (click)="close()">
                            {{ 'Cancel' | localize }}
                        </button>
                        <button
                            type="submit"
                            class="btn btn-primary fw-bold"
                            [disabled]="!paTimelineExceptionForm.form.valid"
                            [buttonBusy]="saving()"
                            [busyText]="l('SavingWithThreeDot')">
                            <i class="fa fa-save"></i>
                            <span>{{ 'Save' | localize }}</span>
                        </button>
                    </div>
                </form>
            }
        </div>
    </div>
</div>
