<div
    appBsModal
    #createOrEditModal="bs-modal"
    (onShown)="onShown()"
    class="modal fade"
    tabindex="-1"
    role="dialog"
    aria-hidden="true"
    [config]="{ backdrop: 'static', keyboard: !saving() }">
    <div class="modal-dialog modal-lg">
        <div class="modal-content">
            @if (active()) {
                <form #recordForm="ngForm" novalidate (ngSubmit)="save()" autocomplete="off">
                    <div class="modal-header">
                        <h4 class="modal-title">
                            @if (record().id) {
                                <span>{{ 'EditItem' | localize }}: {{ 'GovtJobTitles' | localize }}</span>
                            } @else {
                                <span>{{ 'CreateNewItem' | localize }}: {{ 'GovtJobTitles' | localize }}</span>
                            }
                        </h4>
                        <button type="button" class="btn-close" (click)="close()" [disabled]="saving()"></button>
                    </div>
                    <div class="modal-body">
                        <div class="row">
                            <div class="col-md-6 mb-5">
                                <label class="form-label" for="GovtJobTitle_Code">{{ 'Code' | localize }}</label>
                                <input
                                    id="GovtJobTitle_Code"
                                    class="form-control"
                                    type="text"
                                    name="Code"
                                    [ngModel]="record().code"
                                    (ngModelChange)="updateField('code', $event)"
                                    maxlength="50"
                                    [placeholder]="l('AutoGeneratedIfEmpty')" />
                            </div>
                            <div class="col-md-6 mb-5">
                                <label class="form-label required" for="GovtJobTitle_GovtJobCategoryId">{{ 'GovtJobCategory' | localize }}</label>
                                <select
                                    id="GovtJobTitle_GovtJobCategoryId"
                                    #govtJobCategoryInput="ngModel"
                                    class="form-select"
                                    name="GovtJobCategoryId"
                                    [ngModel]="record().govtJobCategoryId"
                                    (ngModelChange)="updateField('govtJobCategoryId', $event)"
                                    required>
                                    <option [ngValue]="undefined"></option>
                                    @for (item of govtJobCategories(); track item.id) {
                                        <option [ngValue]="item.id">{{ item.nameEn }}</option>
                                    }
                                </select>
                                <validation-messages [formCtrl]="govtJobCategoryInput" />
                            </div>
                        </div>
                        <div class="row">
                            <div class="col-md-6 mb-5">
                                <label class="form-label required" for="GovtJobTitle_NameEn">{{ 'NameEn' | localize }}</label>
                                <input
                                    id="GovtJobTitle_NameEn"
                                    #nameEnInput="ngModel"
                                    class="form-control"
                                    type="text"
                                    name="NameEn"
                                    [ngModel]="record().nameEn"
                                    (ngModelChange)="updateField('nameEn', $event)"
                                    required
                                    maxlength="200" />
                                <validation-messages [formCtrl]="nameEnInput" />
                            </div>
                            <div class="col-md-6 mb-5">
                                <label class="form-label required" for="GovtJobTitle_NameAr">{{ 'NameAr' | localize }}</label>
                                <input
                                    id="GovtJobTitle_NameAr"
                                    #nameArInput="ngModel"
                                    class="form-control"
                                    type="text"
                                    name="NameAr"
                                    dir="rtl"
                                    [ngModel]="record().nameAr"
                                    (ngModelChange)="updateField('nameAr', $event)"
                                    required
                                    maxlength="200" />
                                <validation-messages [formCtrl]="nameArInput" />
                            </div>
                        </div>
                    </div>
                    <div class="modal-footer">
                        <button [disabled]="saving()" type="button" class="btn btn-light-primary fw-bold" (click)="close()">
                            {{ 'Cancel' | localize }}
                        </button>
                        <button
                            type="submit"
                            class="btn btn-primary fw-bold"
                            [disabled]="!recordForm.form.valid"
                            [buttonBusy]="saving()"
                            [busyText]="l('SavingWithThreeDot')">
                            <i class="fa fa-save"></i>
                            <span>{{ 'Save' | localize }}</span>
                        </button>
                    </div>
                </form>
            }
        </div>
    </div>
</div>
