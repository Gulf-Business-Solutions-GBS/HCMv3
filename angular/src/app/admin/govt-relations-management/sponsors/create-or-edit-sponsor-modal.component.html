<div
    appBsModal
    #createOrEditModal="bs-modal"
    (onShown)="onShown()"
    class="modal fade"
    tabindex="-1"
    role="dialog"
    aria-hidden="true"
    [config]="{ backdrop: 'static', keyboard: !saving() }">
    <div class="modal-dialog modal-xl">
        <div class="modal-content">
            @if (active()) {
                <form #recordForm="ngForm" novalidate (ngSubmit)="save()" autocomplete="off">
                    <div class="modal-header">
                        <h4 class="modal-title">
                            @if (record().id) {
                                <span>{{ 'EditItem' | localize }}: {{ 'Sponsors' | localize }}</span>
                            } @else {
                                <span>{{ 'CreateNewItem' | localize }}: {{ 'Sponsors' | localize }}</span>
                            }
                        </h4>
                        <button type="button" class="btn-close" (click)="close()" [disabled]="saving()"></button>
                    </div>
                    <div class="modal-body">
                        <!-- Field order follows legacy Sponsor_DetailView: identity, classification, registration, then Contact Information. -->
                        <div class="row">
                            <div class="col-md-4 mb-5">
                                <label class="form-label" for="Sponsor_Code">{{ 'Code' | localize }}</label>
                                <input
                                    id="Sponsor_Code"
                                    class="form-control"
                                    type="text"
                                    name="Code"
                                    [ngModel]="record().code"
                                    (ngModelChange)="updateField('code', $event)"
                                    maxlength="50"
                                    [placeholder]="l('AutoGeneratedIfEmpty')" />
                            </div>
                            <div class="col-md-4 mb-5">
                                <label class="form-label required" for="Sponsor_NameEn">{{ 'NameEn' | localize }}</label>
                                <input
                                    id="Sponsor_NameEn"
                                    #nameEnInput="ngModel"
                                    class="form-control"
                                    type="text"
                                    name="NameEn"
                                    [ngModel]="record().nameEn"
                                    (ngModelChange)="updateField('nameEn', $event)"
                                    required
                                    maxlength="200" />
                                <validation-messages [formCtrl]="nameEnInput" />
                            </div>
                            <div class="col-md-4 mb-5">
                                <label class="form-label required" for="Sponsor_NameAr">{{ 'NameAr' | localize }}</label>
                                <input
                                    id="Sponsor_NameAr"
                                    #nameArInput="ngModel"
                                    class="form-control"
                                    type="text"
                                    name="NameAr"
                                    dir="rtl"
                                    [ngModel]="record().nameAr"
                                    (ngModelChange)="updateField('nameAr', $event)"
                                    required
                                    maxlength="200" />
                                <validation-messages [formCtrl]="nameArInput" />
                            </div>
                        </div>
                        <div class="row">
                            <div class="col-md-6 mb-5">
                                <label class="form-label" for="Sponsor_BusinessOwnerNameEn">{{ 'BusinessOwnerNameEn' | localize }}</label>
                                <input
                                    id="Sponsor_BusinessOwnerNameEn"
                                    class="form-control"
                                    type="text"
                                    name="BusinessOwnerNameEn"
                                    [ngModel]="record().businessOwnerNameEn"
                                    (ngModelChange)="updateField('businessOwnerNameEn', $event)"
                                    maxlength="200" />
                            </div>
                            <div class="col-md-6 mb-5">
                                <label class="form-label" for="Sponsor_BusinessOwnerNameAr">{{ 'BusinessOwnerNameAr' | localize }}</label>
                                <input
                                    id="Sponsor_BusinessOwnerNameAr"
                                    class="form-control"
                                    type="text"
                                    dir="rtl"
                                    name="BusinessOwnerNameAr"
                                    [ngModel]="record().businessOwnerNameAr"
                                    (ngModelChange)="updateField('businessOwnerNameAr', $event)"
                                    maxlength="200" />
                            </div>
                        </div>
                        <div class="row">
                            <div class="col-md-2 mb-5">
                                <label class="form-label required" for="Sponsor_Gender">{{ 'Gender' | localize }}</label>
                                <select
                                    id="Sponsor_Gender"
                                    class="form-select"
                                    name="Gender"
                                    [ngModel]="record().gender"
                                    (ngModelChange)="updateField('gender', $event)"
                                    required>
                                    @for (g of genders; track g.value) {
                                        <option [ngValue]="g.value">{{ g.name | localize }}</option>
                                    }
                                </select>
                            </div>
                            <div class="col-md-3 mb-5">
                                <label class="form-label required" for="Sponsor_NationalityId">{{ 'Nationality' | localize }}</label>
                                <select
                                    id="Sponsor_NationalityId"
                                    #nationalityInput="ngModel"
                                    class="form-select"
                                    name="NationalityId"
                                    [ngModel]="record().nationalityId"
                                    (ngModelChange)="updateField('nationalityId', $event)"
                                    required>
                                    <option [ngValue]="undefined"></option>
                                    @for (item of nationalities(); track item.id) {
                                        <option [ngValue]="item.id">{{ item.nameEn }}</option>
                                    }
                                </select>
                                <validation-messages [formCtrl]="nationalityInput" />
                            </div>
                            <div class="col-md-3 mb-5">
                                <label class="form-label required" for="Sponsor_BusinessTypeId">{{ 'BusinessType' | localize }}</label>
                                <select
                                    id="Sponsor_BusinessTypeId"
                                    #businessTypeInput="ngModel"
                                    class="form-select"
                                    name="BusinessTypeId"
                                    [ngModel]="record().businessTypeId"
                                    (ngModelChange)="updateField('businessTypeId', $event)"
                                    required>
                                    <option [ngValue]="undefined"></option>
                                    @for (item of businessTypes(); track item.id) {
                                        <option [ngValue]="item.id">{{ item.nameEn }}</option>
                                    }
                                </select>
                                <validation-messages [formCtrl]="businessTypeInput" />
                            </div>
                            <div class="col-md-2 mb-5">
                                <label class="form-label required" for="Sponsor_GovernorateId">{{ 'Governorate' | localize }}</label>
                                <select
                                    id="Sponsor_GovernorateId"
                                    #governorateInput="ngModel"
                                    class="form-select"
                                    name="GovernorateId"
                                    [ngModel]="record().governorateId"
                                    (ngModelChange)="updateField('governorateId', $event)"
                                    required>
                                    <option [ngValue]="undefined"></option>
                                    @for (item of governorates(); track item.id) {
                                        <option [ngValue]="item.id">{{ item.nameEn }}</option>
                                    }
                                </select>
                                <validation-messages [formCtrl]="governorateInput" />
                            </div>
                            <div class="col-md-2 mb-5">
                                <label class="form-label" for="Sponsor_Profession">{{ 'Profession' | localize }}</label>
                                <input
                                    id="Sponsor_Profession"
                                    class="form-control"
                                    type="text"
                                    name="Profession"
                                    [ngModel]="record().profession"
                                    (ngModelChange)="updateField('profession', $event)"
                                    maxlength="200" />
                            </div>
                        </div>
                        <div class="row">
                            <div class="col-md-4 mb-5">
                                <label class="form-label required" for="Sponsor_MOSALID">{{ 'MOSALID' | localize }}</label>
                                <input
                                    id="Sponsor_MOSALID"
                                    #mosalidInput="ngModel"
                                    class="form-control"
                                    type="number"
                                    name="MOSALID"
                                    [ngModel]="record().mosalid"
                                    (ngModelChange)="updateField('mosalid', $event)"
                                    required />
                                <validation-messages [formCtrl]="mosalidInput" />
                            </div>
                            <div class="col-md-4 mb-5">
                                <label class="form-label required" for="Sponsor_UnifiedNum">{{ 'UnifiedNum' | localize }}</label>
                                <input
                                    id="Sponsor_UnifiedNum"
                                    #unifiedNumInput="ngModel"
                                    class="form-control"
                                    type="number"
                                    name="UnifiedNum"
                                    [ngModel]="record().unifiedNum"
                                    (ngModelChange)="updateField('unifiedNum', $event)"
                                    required />
                                <validation-messages [formCtrl]="unifiedNumInput" />
                            </div>
                            <div class="col-md-4 mb-5">
                                <label class="form-label required" for="Sponsor_OrganizationUnitId">{{ 'OrganizationUnit' | localize }}</label>
                                <select
                                    id="Sponsor_OrganizationUnitId"
                                    #organizationUnitInput="ngModel"
                                    class="form-select"
                                    name="OrganizationUnitId"
                                    [ngModel]="record().organizationUnitId"
                                    (ngModelChange)="updateField('organizationUnitId', $event)"
                                    required>
                                    <option [ngValue]="undefined"></option>
                                    @for (item of organizationUnits(); track item.id) {
                                        <option [ngValue]="item.id">{{ item.displayName }}</option>
                                    }
                                </select>
                                <validation-messages [formCtrl]="organizationUnitInput" />
                            </div>
                        </div>

                        <h6>{{ 'ContactInformation' | localize }}</h6>
                        <hr />
                        <div class="row">
                            <div class="col-md-4 mb-5">
                                <label class="form-label" for="Sponsor_Building">{{ 'Building' | localize }}</label>
                                <input
                                    id="Sponsor_Building"
                                    class="form-control"
                                    type="text"
                                    name="Building"
                                    [ngModel]="record().building"
                                    (ngModelChange)="updateField('building', $event)"
                                    maxlength="100" />
                            </div>
                            <div class="col-md-4 mb-5">
                                <label class="form-label" for="Sponsor_Street">{{ 'Street' | localize }}</label>
                                <input
                                    id="Sponsor_Street"
                                    class="form-control"
                                    type="text"
                                    name="Street"
                                    [ngModel]="record().street"
                                    (ngModelChange)="updateField('street', $event)"
                                    maxlength="100" />
                            </div>
                            <div class="col-md-4 mb-5">
                                <label class="form-label" for="Sponsor_Area">{{ 'Area' | localize }}</label>
                                <input
                                    id="Sponsor_Area"
                                    class="form-control"
                                    type="text"
                                    name="Area"
                                    [ngModel]="record().area"
                                    (ngModelChange)="updateField('area', $event)"
                                    maxlength="100" />
                            </div>
                        </div>
                        <div class="row">
                            <div class="col-md-4 mb-5">
                                <label class="form-label" for="Sponsor_Email">{{ 'Email' | localize }}</label>
                                <input
                                    id="Sponsor_Email"
                                    class="form-control"
                                    type="email"
                                    name="Email"
                                    [ngModel]="record().email"
                                    (ngModelChange)="updateField('email', $event)"
                                    maxlength="200" />
                            </div>
                            <div class="col-md-4 mb-5">
                                <label class="form-label required" for="Sponsor_Telephone">{{ 'Telephone' | localize }}</label>
                                <input
                                    id="Sponsor_Telephone"
                                    #telephoneInput="ngModel"
                                    class="form-control"
                                    type="number"
                                    name="Telephone"
                                    [ngModel]="record().telephone"
                                    (ngModelChange)="updateField('telephone', $event)"
                                    required />
                                <validation-messages [formCtrl]="telephoneInput" />
                            </div>
                            <div class="col-md-4 mb-5">
                                <label class="form-label" for="Sponsor_Block">{{ 'Block' | localize }}</label>
                                <input
                                    id="Sponsor_Block"
                                    class="form-control"
                                    type="text"
                                    name="Block"
                                    [ngModel]="record().block"
                                    (ngModelChange)="updateField('block', $event)"
                                    maxlength="100" />
                            </div>
                        </div>
                        <div class="row">
                            <div class="col-md-4 mb-5">
                                <label class="form-label required" for="Sponsor_SocialSecurityNum">{{ 'SocialSecurityNum' | localize }}</label>
                                <input
                                    id="Sponsor_SocialSecurityNum"
                                    #socialSecurityNumInput="ngModel"
                                    class="form-control"
                                    type="number"
                                    name="SocialSecurityNum"
                                    [ngModel]="record().socialSecurityNum"
                                    (ngModelChange)="updateField('socialSecurityNum', $event)"
                                    required />
                                <validation-messages [formCtrl]="socialSecurityNumInput" />
                            </div>
                            <div class="col-md-4 mb-5">
                                <label class="form-label" for="Sponsor_Fax">{{ 'Fax' | localize }}</label>
                                <input
                                    id="Sponsor_Fax"
                                    class="form-control"
                                    type="text"
                                    name="Fax"
                                    [ngModel]="record().fax"
                                    (ngModelChange)="updateField('fax', $event)"
                                    maxlength="50" />
                            </div>
                            <div class="col-md-4 mb-5">
                                <label class="form-label" for="Sponsor_POBox">{{ 'POBox' | localize }}</label>
                                <input
                                    id="Sponsor_POBox"
                                    class="form-control"
                                    type="text"
                                    name="POBox"
                                    [ngModel]="record().poBox"
                                    (ngModelChange)="updateField('poBox', $event)"
                                    maxlength="50" />
                            </div>
                        </div>
                    </div>
                    <div class="modal-footer">
                        <button [disabled]="saving()" type="button" class="btn btn-light-primary fw-bold" (click)="close()">
                            {{ 'Cancel' | localize }}
                        </button>
                        <button
                            type="submit"
                            class="btn btn-primary fw-bold"
                            [disabled]="!recordForm.form.valid"
                            [buttonBusy]="saving()"
                            [busyText]="l('SavingWithThreeDot')">
                            <i class="fa fa-save"></i>
                            <span>{{ 'Save' | localize }}</span>
                        </button>
                    </div>
                </form>
            }
        </div>
    </div>
</div>
