<div
    appBsModal
    #createOrEditModal="bs-modal"
    (onShown)="onShown()"
    class="modal fade"
    tabindex="-1"
    role="dialog"
    aria-hidden="true"
    [config]="{ backdrop: 'static', keyboard: !saving() }">
    <div class="modal-dialog modal-lg">
        <div class="modal-content">
            @if (active()) {
                <form #recordForm="ngForm" novalidate (ngSubmit)="save()" autocomplete="off">
                    <div class="modal-header">
                        <h4 class="modal-title">
                            {{ (record().id ? 'EditItem' : 'CreateNewItem') | localize }}: {{ 'SponsorJobTitles' | localize }}
                        </h4>
                        <button type="button" class="btn-close" (click)="close()" [disabled]="saving()"></button>
                    </div>
                    <div class="modal-body">
                        <div class="row">
                            <div class="col-md-12 mb-5">
                                <label class="form-label required" for="SponsorJobTitle_GovtJobTitleId">{{ 'GovtJobTitle' | localize }}</label>
                                <select
                                    id="SponsorJobTitle_GovtJobTitleId"
                                    #govtJobTitleInput="ngModel"
                                    class="form-select"
                                    name="GovtJobTitleId"
                                    [ngModel]="record().govtJobTitleId"
                                    (ngModelChange)="updateField('govtJobTitleId', $event)"
                                    required>
                                    <option [ngValue]="undefined"></option>
                                    @for (item of govtJobTitles(); track item.id) {
                                        <option [ngValue]="item.id">{{ item.nameEn }}</option>
                                    }
                                </select>
                                <validation-messages [formCtrl]="govtJobTitleInput" />
                            </div>
                        </div>
                        <div class="row">
                            <div class="col-md-6 mb-5">
                                <label class="form-label required" for="SponsorJobTitle_StartDate">{{ 'StartDate' | localize }}</label>
                                <input
                                    id="SponsorJobTitle_StartDate"
                                    #startDateInput="ngModel"
                                    class="form-control"
                                    type="date"
                                    name="StartDate"
                                    [ngModel]="record().startDate?.toISODate()"
                                    (ngModelChange)="updateDateField('startDate', $event)"
                                    required />
                                <validation-messages [formCtrl]="startDateInput" />
                            </div>
                            <div class="col-md-6 mb-5">
                                <label class="form-label required" for="SponsorJobTitle_EndDate">{{ 'EndDate' | localize }}</label>
                                <input
                                    id="SponsorJobTitle_EndDate"
                                    #endDateInput="ngModel"
                                    class="form-control"
                                    type="date"
                                    name="EndDate"
                                    [ngModel]="record().endDate?.toISODate()"
                                    (ngModelChange)="updateDateField('endDate', $event)"
                                    required />
                                <validation-messages [formCtrl]="endDateInput" />
                            </div>
                        </div>
                        <div class="row">
                            <div class="col-md-4 mb-5">
                                <label class="form-label required" for="SponsorJobTitle_NoofPosition">{{ 'NoofPosition' | localize }}</label>
                                <input
                                    id="SponsorJobTitle_NoofPosition"
                                    #noofPositionInput="ngModel"
                                    class="form-control"
                                    type="number"
                                    name="NoofPosition"
                                    [ngModel]="record().noofPosition"
                                    (ngModelChange)="updateField('noofPosition', $event)"
                                    required />
                                <validation-messages [formCtrl]="noofPositionInput" />
                            </div>
                            <div class="col-md-4 mb-5">
                                <label class="form-label required" for="SponsorJobTitle_CitizenPercent">{{ 'CitizenPercent' | localize }}</label>
                                <input
                                    id="SponsorJobTitle_CitizenPercent"
                                    #citizenPercentInput="ngModel"
                                    class="form-control"
                                    type="number"
                                    name="CitizenPercent"
                                    [ngModel]="record().citizenPercent"
                                    (ngModelChange)="updateField('citizenPercent', $event)"
                                    required />
                                <validation-messages [formCtrl]="citizenPercentInput" />
                            </div>
                            <div class="col-md-4 mb-5">
                                <label class="form-label required" for="SponsorJobTitle_CitizenQuotaUsed">{{ 'CitizenQuotaUsed' | localize }}</label>
                                <input
                                    id="SponsorJobTitle_CitizenQuotaUsed"
                                    #citizenQuotaUsedInput="ngModel"
                                    class="form-control"
                                    type="number"
                                    name="CitizenQuotaUsed"
                                    [ngModel]="record().citizenQuotaUsed"
                                    (ngModelChange)="updateField('citizenQuotaUsed', $event)"
                                    required />
                                <validation-messages [formCtrl]="citizenQuotaUsedInput" />
                            </div>
                        </div>
                        <div class="row">
                            <div class="col-md-6 mb-5">
                                <label class="form-label required" for="SponsorJobTitle_NonCitizenPercent">{{ 'NonCitizenPercent' | localize }}</label>
                                <input
                                    id="SponsorJobTitle_NonCitizenPercent"
                                    #nonCitizenPercentInput="ngModel"
                                    class="form-control"
                                    type="number"
                                    name="NonCitizenPercent"
                                    [ngModel]="record().nonCitizenPercent"
                                    (ngModelChange)="updateField('nonCitizenPercent', $event)"
                                    required />
                                <validation-messages [formCtrl]="nonCitizenPercentInput" />
                            </div>
                            <div class="col-md-6 mb-5">
                                <label class="form-label required" for="SponsorJobTitle_NonCitizenQuotaUsed">{{ 'NonCitizenQuotaUsed' | localize }}</label>
                                <input
                                    id="SponsorJobTitle_NonCitizenQuotaUsed"
                                    #nonCitizenQuotaUsedInput="ngModel"
                                    class="form-control"
                                    type="number"
                                    name="NonCitizenQuotaUsed"
                                    [ngModel]="record().nonCitizenQuotaUsed"
                                    (ngModelChange)="updateField('nonCitizenQuotaUsed', $event)"
                                    required />
                                <validation-messages [formCtrl]="nonCitizenQuotaUsedInput" />
                            </div>
                        </div>
                    </div>
                    <div class="modal-footer">
                        <button type="button" class="btn btn-secondary" (click)="close()" [disabled]="saving()">
                            {{ 'Cancel' | localize }}
                        </button>
                        <button type="submit" class="btn btn-primary" [buttonBusy]="saving()" [disabled]="!recordForm.form.valid || saving()">
                            <i class="fa fa-save"></i>
                            {{ 'Save' | localize }}
                        </button>
                    </div>
                </form>
            }
        </div>
    </div>
</div>
