<careers-auth-shell [heading]="title" [subheading]="subtitle">
    @if (sent()) {
        <div class="alert alert--success">{{ 'CareersResetLinkSent' | localize }}</div>
        <a class="btn btn--secondary btn--block" routerLink="/account/login">
            {{ 'CareersSignIn' | localize }}
        </a>
    } @else {
        <form #forgotForm="ngForm" (ngSubmit)="submit(forgotForm)" novalidate>
            <div class="field">
                <label class="field__label" for="forgotEmail">{{ 'EmailAddress' | localize }}</label>
                <input
                    id="forgotEmail"
                    name="forgotEmail"
                    type="email"
                    class="input"
                    autocomplete="username"
                    required
                    email
                    [ngModel]="emailAddress()"
                    (ngModelChange)="emailAddress.set($event)"
                />
            </div>

            <button
                type="submit"
                class="btn btn--primary btn--lg btn--block"
                [disabled]="forgotForm.invalid || submitting()"
            >
                @if (submitting()) {
                    <span class="spinner"></span>
                }
                {{ 'CareersSendResetLink' | localize }}
            </button>
        </form>

        <hr class="divider" />

        <p class="text-center small muted">
            <a routerLink="/account/login">{{ 'CareersSignIn' | localize }}</a>
        </p>
    }
</careers-auth-shell>
