<careers-auth-shell [heading]="title">
    @if (!linkIsValid()) {
        <div class="alert alert--error">{{ 'CareersInvalidResetLink' | localize }}</div>
        <a class="btn btn--secondary btn--block" routerLink="/account/forgot-password">
            {{ 'CareersSendResetLink' | localize }}
        </a>
    } @else if (succeeded()) {
        <div class="alert alert--success">{{ 'CareersPasswordResetSucceeded' | localize }}</div>
        <button type="button" class="btn btn--primary btn--block" (click)="goToLogin()">
            {{ 'CareersSignIn' | localize }}
        </button>
    } @else {
        <form #resetForm="ngForm" (ngSubmit)="submit(resetForm)" novalidate>
            <div class="field">
                <label class="field__label" for="newPassword">{{ 'NewPassword' | localize }}</label>
                <input
                    id="newPassword"
                    name="newPassword"
                    type="password"
                    class="input"
                    autocomplete="new-password"
                    required
                    maxlength="128"
                    [ngModel]="password()"
                    (ngModelChange)="password.set($event)"
                />
            </div>

            <div class="field">
                <label class="field__label" for="confirmNewPassword">
                    {{ 'CareersConfirmPassword' | localize }}
                </label>
                <input
                    id="confirmNewPassword"
                    name="confirmNewPassword"
                    type="password"
                    class="input"
                    autocomplete="new-password"
                    required
                    maxlength="128"
                    [ngModel]="confirmPassword()"
                    (ngModelChange)="confirmPassword.set($event)"
                />
                @if (!passwordsMatch()) {
                    <span class="field__error">{{ 'CareersPasswordsDoNotMatch' | localize }}</span>
                }
            </div>

            <button
                type="submit"
                class="btn btn--primary btn--lg btn--block"
                [disabled]="resetForm.invalid || !passwordsMatch() || submitting()"
            >
                @if (submitting()) {
                    <span class="spinner"></span>
                }
                {{ 'ResetPassword' | localize }}
            </button>
        </form>
    }
</careers-auth-shell>
